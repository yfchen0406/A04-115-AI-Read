<!doctype html>
<html lang="zh-Hant">
<head>

<body data-page="reader">
<main class="reader" id="reader">
  <header class="reader-head">
    <a class="back" href="./index.html">← 首頁</a>

  <section class="stage" aria-label="分鏡、字幕與播放控制">
    <div class="stage-topbar" id="stage-chapter">01｜人口轉折與轉型契機</div>
    <div class="stage-visual">

        <span id="elapsed">00:00.000</span>

        <div class="control-buttons">

        <span id="timeline-status">時間軸依 Excel 表格時間</span>
      </div>

  </section>

  <section class="chapter-section" aria-label="章節索引">
