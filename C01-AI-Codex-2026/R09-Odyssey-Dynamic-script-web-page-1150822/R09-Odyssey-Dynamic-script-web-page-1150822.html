const caps=[
  {
    "start": 0.0,
    "end": 6.243,
    "text": "奧德修斯失蹤二十年，雅典娜提醒特勒馬卡斯停止等待，開始尋找父親。",
    "chapter": 1
  },
  {
    "start": 6.243,
    "end": 11.12,
    "text": "我請繆斯幫助講的故事，其主人公是那位富於機智的人。",
    "chapter": 1
  },
  {
    "start": 11.12,
    "end": 20.875,
    "text": "宙斯就是心裡想著他，向眾神說道： 「人們總是責備神，說他們的麻煩都是從我們這裡去的，這是多麼可悲喲！",
    "chapter": 1
  },
  {
    "start": 20.875,
    "end": 26.922,
    "text": "他不僅是活著的最聰明的人，而且也是最慷慨地向天上眾神奉獻的人。",
    "chapter": 1
  },
  {
    "start": 26.922,
    "end": 39.408,
    "text": "特勒馬卡斯鬱鬱不樂，坐在求婚者中間，夢想著他的高貴父親會怎樣突然回來，把這班求婚者一股腦兒趕出去，重振皇室的聲威，再建他的統治。",
    "chapter": 1
  },
  {
    "start": 39.408,
    "end": 42.92,
    "text": "「先生，我希望說直爽話不致令你困惱。",
    "chapter": 1
  },
  {
    "start": 42.92,
    "end": 50.138,
    "text": "至於說我如何來到伊薩卡，我是乘自己的船，帶著水手渡過醲酒般陰暗的海水來的。",
    "chapter": 1
  },
  {
    "start": 50.138,
    "end": 53.065,
    "text": "他們去後，我就沒再和他見面了。",
    "chapter": 1
  },
  {
    "start": 53.065,
    "end": 60.283,
    "text": "倘使他跟他的人死在特洛伊，或在戰後死在朋友的懷抱裡，我還不像現在這樣難過。",
    "chapter": 1
  },
  {
    "start": 60.283,
    "end": 67.892,
    "text": "小心聽我的建議：明天早晨，召集亞該亞貴胄們來開會，當眾宣佈，請眾神做你的見證。",
    "chapter": 1
  },
  {
    "start": 67.892,
    "end": 73.354,
    "text": "我知道你急著趕路，但求多盤桓些時光，沐浴淨身，進些飲食。",
    "chapter": 1
  },
  {
    "start": 73.354,
    "end": 77.256,
    "text": "」 可是特勒馬卡斯不讓皮奈洛普如願以償。",
    "chapter": 1
  },
  {
    "start": 77.256,
    "end": 85.84,
    "text": "後來歐培西斯的兒子安蒂諾斯說道：「好像眾神在幫助你，特勒馬卡斯，叫你這樣大膽高傲地講話。",
    "chapter": 1
  },
  {
    "start": 85.84,
    "end": 87.596,
    "text": "還是來辦自己的事？",
    "chapter": 1
  },
  {
    "start": 87.596,
    "end": 92.863,
    "text": "特勒馬卡斯徹夜躺在毛毯下，心裡計畫著雅典娜指示的旅程。",
    "chapter": 1
  },
  {
    "start": 92.863,
    "end": 101.642,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 1
  },
  {
    "start": 101.642,
    "end": 109.056,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 1
  },
  {
    "start": 109.056,
    "end": 114.078,
    "text": "特勒馬卡斯在集會控訴求婚者，並在夜色中踏上尋父之旅。",
    "chapter": 2
  },
  {
    "start": 114.078,
    "end": 127.215,
    "text": "一旦黎明以玫瑰色的手染亮東方，奧德修斯的兒子便穿衣起床，把一把鋒利的寶劍掛在肩上，一雙結實的帶履綁在漂亮的腳上，步出臥室，看著像一尊神。",
    "chapter": 2
  },
  {
    "start": 127.215,
    "end": 130.113,
    "text": "無論如何，我要說『他是個好人！",
    "chapter": 2
  },
  {
    "start": 130.113,
    "end": 133.396,
    "text": "你們不怕這些罪孽報應在你們頭上嗎？",
    "chapter": 2
  },
  {
    "start": 133.396,
    "end": 141.123,
    "text": "』這是她所說的，我們像君子一般，就信了她；結果白天她織那大幅布，晚上掌燈拆掉它。",
    "chapter": 2
  },
  {
    "start": 141.123,
    "end": 143.635,
    "text": "最後我的國人亦將不齒於我。",
    "chapter": 2
  },
  {
    "start": 143.635,
    "end": 145.567,
    "text": "他們會不會自動停止？",
    "chapter": 2
  },
  {
    "start": 145.567,
    "end": 149.044,
    "text": "還有，老漢，我們絲毫不在意你的預言。",
    "chapter": 2
  },
  {
    "start": 149.044,
    "end": 155.226,
    "text": "諸位要知道，我不是在抱怨那些無法無天的求婚者昧著良心，造下罪孽。",
    "chapter": 2
  },
  {
    "start": 155.226,
    "end": 174.736,
    "text": "她幻化成曼託的模樣，音容笑貌跟他完全相同，來到特勒馬卡斯跟前向他說出鼓舞人心的話： 「特勒馬卡斯，今天證明你既非懦夫，也不是傻瓜；命運註定你將來也不會如此，倘使我們可以認為你父親的丈夫氣概已經傳給你了。",
    "chapter": 2
  },
  {
    "start": 174.736,
    "end": 177.634,
    "text": "來跟我們一起飲食，像往常一樣。",
    "chapter": 2
  },
  {
    "start": 177.634,
    "end": 182.27,
    "text": "我們得分掉他的產業，把房子給他母親跟她的新夫婿！",
    "chapter": 2
  },
  {
    "start": 182.27,
    "end": 185.168,
    "text": "好好坐在家裡看守自己的財產吧。",
    "chapter": 2
  },
  {
    "start": 185.168,
    "end": 191.736,
    "text": "「特勒馬卡斯，」她說，「你的勇敢的水手們都已坐在槳邊，等你下令開船。",
    "chapter": 2
  },
  {
    "start": 191.736,
    "end": 195.406,
    "text": "01 曼託叢書本譯為「說有敵軍進犯」。",
    "chapter": 2
  },
  {
    "start": 195.406,
    "end": 204.099,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 2
  },
  {
    "start": 204.099,
    "end": 211.44,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 2
  },
  {
    "start": 211.44,
    "end": 216.869,
    "text": "派洛斯的長者沒有答案，卻替特勒馬卡斯指出下一個可靠的方向。",
    "chapter": 3
  },
  {
    "start": 216.869,
    "end": 223.983,
    "text": "太陽離開輝煌東方的水域，躍入太空，將光明帶給永生的神和在地上耕耘並死滅的人。",
    "chapter": 3
  },
  {
    "start": 223.983,
    "end": 235.215,
    "text": "奈斯特的兒子佩西斯拉塔斯首先走到他們跟前，拉住他們的手，讓他們在他哥哥斯拉塞麥德斯和他父親身邊入席，坐在沙上鋪的皮墊上。",
    "chapter": 3
  },
  {
    "start": 235.215,
    "end": 236.9,
    "text": "你們是做生意的呢？",
    "chapter": 3
  },
  {
    "start": 236.9,
    "end": 241.019,
    "text": "亞該亞的武士在特洛伊所忍受的，還不止此而已。",
    "chapter": 3
  },
  {
    "start": 241.019,
    "end": 249.256,
    "text": "他們兩個站在那兒頂嘴爭吵，部隊們自己的意見也不一致，最後在不可形容的吵鬧喧嚷中紛紛散去。",
    "chapter": 3
  },
  {
    "start": 249.256,
    "end": 256.37,
    "text": "因此，親愛的孩子，我回到家來，未知後面的人情形如何，不知誰脫了險，誰喪了命。",
    "chapter": 3
  },
  {
    "start": 256.37,
    "end": 264.419,
    "text": "我只希望明眸的雅典娜能夠愛護你，像我們在艱苦的特洛伊戰爭期間她愛護你那著名的父親那樣。",
    "chapter": 3
  },
  {
    "start": 264.419,
    "end": 270.223,
    "text": "」接著特勒馬卡斯轉面向他的東主說：「可否請陛下再給我說明一事？",
    "chapter": 3
  },
  {
    "start": 270.223,
    "end": 281.643,
    "text": "這個人，昂內託的兒子弗朗蒂斯，是世上航行大風裡最好的舵手，米奈勞斯雖急欲趕路，不得不在蘇尼姆停下來，遵禮如儀埋葬他的戰友。",
    "chapter": 3
  },
  {
    "start": 281.643,
    "end": 291.003,
    "text": "你必須親自去見他，假如你想得到他親口說的實話；像米奈勞斯這樣聰明的人，我想他跟你說的，不會不是實話。",
    "chapter": 3
  },
  {
    "start": 291.003,
    "end": 298.678,
    "text": "今晚我睡在黑船上，明早要去拜訪那些有膽識的高康尼亞人，跟他們有一筆重要債務要清理。",
    "chapter": 3
  },
  {
    "start": 298.678,
    "end": 311.595,
    "text": "他的兒子們都從他們房裡走來圍繞住他，艾契弗朗和斯綽霞斯，柏修斯和阿瑞塔斯，以及高貴的斯拉塞麥德斯，第六位是最後來到的青年皇子佩西斯拉塔斯。",
    "chapter": 3
  },
  {
    "start": 311.595,
    "end": 320.956,
    "text": "殷血湧出、生命離開骨頭後，他們迅速把牠肢解開來，從牛腿上割下成片的祭肉，用肥肉捲起來，上面鋪著生肉。",
    "chapter": 3
  },
  {
    "start": 320.956,
    "end": 324.326,
    "text": "不久太陽又落了，黑暗吞噬了所有路徑。",
    "chapter": 3
  },
  {
    "start": 324.326,
    "end": 332.75,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 3
  },
  {
    "start": 332.75,
    "end": 339.864,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 3
  },
  {
    "start": 339.864,
    "end": 345.503,
    "text": "米奈勞斯與海倫證實奧德修斯仍活著，特勒馬卡斯重新得到希望。",
    "chapter": 4
  },
  {
    "start": 345.503,
    "end": 351.92,
    "text": "他們來到深山內拉塞德芒的丘陵地帶，驅車直到傑出的米奈勞斯的宮殿前。",
    "chapter": 4
  },
  {
    "start": 351.92,
    "end": 354.448,
    "text": "看著這光景，使我不勝驚訝。",
    "chapter": 4
  },
  {
    "start": 354.448,
    "end": 361.253,
    "text": "奧德修斯的腳跟他的一模一樣，還有他的手，眼睛的轉動，頭和頭髮也是如此。",
    "chapter": 4
  },
  {
    "start": 361.253,
    "end": 365.143,
    "text": "同時海倫，宙斯的孩子，有一個快樂的想法。",
    "chapter": 4
  },
  {
    "start": 365.143,
    "end": 367.281,
    "text": "該是上床安眠的時候了。",
    "chapter": 4
  },
  {
    "start": 367.281,
    "end": 372.726,
    "text": "來救我於危難的是艾多塞亞，海的老人強大的普羅圖斯的女兒。",
    "chapter": 4
  },
  {
    "start": 372.726,
    "end": 380.116,
    "text": "可是那位女神想出了一個很好的補救辦法，她拿了些神喝的飲料，搽在每人的鼻孔裡。",
    "chapter": 4
  },
  {
    "start": 380.116,
    "end": 384.004,
    "text": "我不必說死於戰爭的，因為你自己也在那兒。",
    "chapter": 4
  },
  {
    "start": 384.004,
    "end": 388.866,
    "text": "你說他仍然活著，只是被囚禁在無垠的海洋的某個地方。",
    "chapter": 4
  },
  {
    "start": 388.866,
    "end": 394.7,
    "text": "」 他們這樣談話的時候，客人們開始來到這位偉大國王的宮殿裡。",
    "chapter": 4
  },
  {
    "start": 394.7,
    "end": 398.394,
    "text": "他的心燃燒著黑的熱情，兩眼像兩點火焰。",
    "chapter": 4
  },
  {
    "start": 398.394,
    "end": 412.006,
    "text": "」 聰明的麥當答道：「我不知道是某位神叫他去派洛斯的，還是他自己要去的，不過，他的目的是要打聽他父親能不能回來，倘使不能回來，他是怎樣死的。",
    "chapter": 4
  },
  {
    "start": 412.006,
    "end": 416.673,
    "text": "你們知道我們一致商定的計畫，讓我們把它實行出來。",
    "chapter": 4
  },
  {
    "start": 416.673,
    "end": 420.756,
    "text": "亞該亞的王孫們就埋伏在這裡等待特勒馬卡斯。",
    "chapter": 4
  },
  {
    "start": 420.756,
    "end": 429.506,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 4
  },
  {
    "start": 429.506,
    "end": 436.896,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 4
  },
  {
    "start": 436.896,
    "end": 442.176,
    "text": "眾神命令卡呂普索放走奧德修斯，但海神風暴仍阻擋他的航程。",
    "chapter": 5
  },
  {
    "start": 442.176,
    "end": 452.55,
    "text": "黎明起床離開和她同睡的泰梭諾斯公，把陽光帶給神和人的時候，眾神坐下開會，他們中間最偉大的雷神宙斯，跟他們一起。",
    "chapter": 5
  },
  {
    "start": 452.55,
    "end": 455.756,
    "text": "他們將熱誠款待他，像待一位神一樣。",
    "chapter": 5
  },
  {
    "start": 455.756,
    "end": 464.998,
    "text": "克律普梭自己是女神，抬頭看見他的臉便認識他，因為所有的神都是互相認識的，縱然他們的家相離得很遙遠。",
    "chapter": 5
  },
  {
    "start": 464.998,
    "end": 469.336,
    "text": "命運註定他不該死在這島上，離他的朋友們遠遠的。",
    "chapter": 5
  },
  {
    "start": 469.336,
    "end": 474.617,
    "text": "這位仙女立時去找她的高貴客人，因為宙斯的話是不能不聽的。",
    "chapter": 5
  },
  {
    "start": 474.617,
    "end": 480.087,
    "text": "女神，妳能不能向我鄭重發誓，說妳不是在計畫給我以新的苦難？",
    "chapter": 5
  },
  {
    "start": 480.087,
    "end": 486.688,
    "text": "雖然如此，我仍然盼望到家，看見歸去的快樂日子，這是我的絕不消衰的願望。",
    "chapter": 5
  },
  {
    "start": 486.688,
    "end": 499.325,
    "text": "他給船造一桅杆，給桅杆造一桅座；還造一方向舵，使船循直線前進，他把柳條和許多灌木細枝編織起來，從船首到船尾裝在兩側作為舷牆，以防海水。",
    "chapter": 5
  },
  {
    "start": 499.325,
    "end": 509.698,
    "text": "」 說時他糾合雲團，手執三股叉攪動海水；興起各種各樣的風暴，使陸海上空雲霧靄靄，遮天蔽日，黑暗從天空直撲下來。",
    "chapter": 5
  },
  {
    "start": 509.698,
    "end": 515.922,
    "text": "女神克律普梭給他的衣服墜住他，他發現不容易勝過那大浪的壓力往上浮。",
    "chapter": 5
  },
  {
    "start": 515.922,
    "end": 529.125,
    "text": "剩下偉岸的奧德修斯在迷惘和苦痛中，再度請教他那不屈不撓的靈魂；他呻吟著自問，這位女神叫他棄船而去，不知道這是不是某位神為了捉他而新設的圈套。",
    "chapter": 5
  },
  {
    "start": 529.125,
    "end": 531.954,
    "text": "他迅速向前遊，急於要腳踏乾地。",
    "chapter": 5
  },
  {
    "start": 531.954,
    "end": 540.252,
    "text": "不久他游到一個急流的河川口外，他想這是他能找到的最好地點，這裡不僅沒有岩石，而且也避風。",
    "chapter": 5
  },
  {
    "start": 540.252,
    "end": 547.985,
    "text": "這時雅典娜把奧德修斯眼裡裝滿睡意，闔上他的眼皮 —— 這是解除長時疲勞最好的方法。",
    "chapter": 5
  },
  {
    "start": 547.985,
    "end": 556.473,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 5
  },
  {
    "start": 556.473,
    "end": 563.639,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 5
  },
  {
    "start": 563.64,
    "end": 568.878,
    "text": "諾西加在河邊發現海難者，給他一條通往腓埃基人城市的路。",
    "chapter": 6
  },
  {
    "start": 568.878,
    "end": 577.803,
    "text": "高貴多災的奧德修斯心力交瘁躺在那裡睡眠休息的時候，雅典娜來到腓埃基人的國度，進入他們的城市。",
    "chapter": 6
  },
  {
    "start": 577.803,
    "end": 584.593,
    "text": "我情願同妳去幫忙，使妳可以從速準備停當，因為妳獨身的日子絕不會太久了。",
    "chapter": 6
  },
  {
    "start": 584.593,
    "end": 589.831,
    "text": "實在說，你同重要人物商議國家大事，自己也該穿乾淨衣服。",
    "chapter": 6
  },
  {
    "start": 589.831,
    "end": 597.785,
    "text": "過些時她們到了那高貴的河岸邊，那裡總是有一泓清水，沸沸騰騰，足夠洗乾淨最髒的衣服。",
    "chapter": 6
  },
  {
    "start": 597.785,
    "end": 600.502,
    "text": "」他嘆道，「這裡是什麼地方？",
    "chapter": 6
  },
  {
    "start": 600.502,
    "end": 604.188,
    "text": "阿爾西諾斯的女兒是唯一站在那兒不動的。",
    "chapter": 6
  },
  {
    "start": 604.188,
    "end": 606.322,
    "text": "我一面望著，一面崇拜。",
    "chapter": 6
  },
  {
    "start": 606.322,
    "end": 610.396,
    "text": "在這個城裡和這塊土地上，我一個人也不認得。",
    "chapter": 6
  },
  {
    "start": 610.396,
    "end": 618.738,
    "text": "別跟我說妳們當他是仇敵，因為世上沒有人，將來也不會有，膽敢懷著敵意足踏腓埃基人的土地。",
    "chapter": 6
  },
  {
    "start": 618.738,
    "end": 623.782,
    "text": "」 侍女們聽了就退下去，把這事告訴她們的青年女主人。",
    "chapter": 6
  },
  {
    "start": 623.782,
    "end": 629.409,
    "text": "她摺好衣服，放在美好的車裡，套上健壯的騾子，自己爬到車上。",
    "chapter": 6
  },
  {
    "start": 629.409,
    "end": 631.543,
    "text": "她是在哪裡碰見他的呢？",
    "chapter": 6
  },
  {
    "start": 631.543,
    "end": 635.229,
    "text": "它是很容易認出的，任何小孩都可告訴你。",
    "chapter": 6
  },
  {
    "start": 635.229,
    "end": 649.586,
    "text": "」 帕拉斯雅典娜聽見他的禱告，但仍然忍住不顯現於他的面前，那是由於對她父親的兄弟的尊敬，他堅持不忘對高貴的奧德修斯的仇恨，直到他到達自己國土的時候。",
    "chapter": 6
  },
  {
    "start": 649.586,
    "end": 658.316,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 6
  },
  {
    "start": 658.316,
    "end": 665.688,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 6
  },
  {
    "start": 665.688,
    "end": 671.043,
    "text": "奧德修斯在阿爾西諾斯王宮得到接待，第一次看見回家的可能。",
    "chapter": 7
  },
  {
    "start": 671.043,
    "end": 677.546,
    "text": "多災難的奧德修斯在雅典娜的聖林禱告的時候，那兩匹健騾把公主拉進城去。",
    "chapter": 7
  },
  {
    "start": 677.546,
    "end": 681.944,
    "text": "這裡的人對陌生人沒有好感，不張開雙臂歡迎客人。",
    "chapter": 7
  },
  {
    "start": 681.944,
    "end": 689.403,
    "text": "這家的始祖諾西索斯，是震地神波塞冬和佩瑞博亞的兒子，佩瑞博亞是當時最美的女人。",
    "chapter": 7
  },
  {
    "start": 689.403,
    "end": 695.905,
    "text": "因為這位偉大國王的高頂廳堂，有一種光芒向四面放射，像日月的光輝一樣。",
    "chapter": 7
  },
  {
    "start": 695.905,
    "end": 698.582,
    "text": "不分冬夏，樹上永遠不缺果實。",
    "chapter": 7
  },
  {
    "start": 698.582,
    "end": 706.423,
    "text": "至於我自己，我求妳安排盡早送我返回故土，因為從離家以來我經歷了許多艱難困苦的日子。",
    "chapter": 7
  },
  {
    "start": 706.423,
    "end": 716.368,
    "text": "諸位現已飲食完畢，我建議可各自回家過夜，明天早晨來開全體長老會議，以款待這位客人，並向眾位神祇獻上犧牲。",
    "chapter": 7
  },
  {
    "start": 716.368,
    "end": 720.958,
    "text": "因為世上沒有任何事情像一人的飢腸那樣不能等待了。",
    "chapter": 7
  },
  {
    "start": 720.958,
    "end": 724.018,
    "text": "你剛才不是說你是從海裡漂來的嗎？",
    "chapter": 7
  },
  {
    "start": 724.018,
    "end": 731.668,
    "text": "到了第八個年頭，她促我離開那裡，不知是由於服從宙斯的命令，還是她自己的感情變了。",
    "chapter": 7
  },
  {
    "start": 731.668,
    "end": 736.067,
    "text": "我掙扎出來，躺在倒下去的地方，直到恢復了力量。",
    "chapter": 7
  },
  {
    "start": 736.067,
    "end": 741.804,
    "text": "她應當把你同她的婢女們直接帶回家來，究竟你是首先向她求助的。",
    "chapter": 7
  },
  {
    "start": 741.804,
    "end": 751.557,
    "text": "據我們的水手說歐博艾在世界盡頭，他們到過那個地方，那次他們渡紅髮的拉達曼薩斯去拜訪大地的兒子泰突阿斯。",
    "chapter": 7
  },
  {
    "start": 751.557,
    "end": 759.207,
    "text": "02 布織成後上油的理由是為了讓織物更加平滑、耐用，並達到防水與防蟲的保養效果。",
    "chapter": 7
  },
  {
    "start": 759.207,
    "end": 767.813,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 7
  },
  {
    "start": 767.813,
    "end": 775.08,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 7
  },
  {
    "start": 775.08,
    "end": 780.224,
    "text": "競技與歌聲喚起特洛伊記憶，國王終於要求陌生人說出身分。",
    "chapter": 8
  },
  {
    "start": 780.224,
    "end": 794.513,
    "text": "當黎明給她自己塗上緋紅時，神聖的阿爾西諾斯王立即把同時起床的奧德修斯王，城池的劫掠者，引到船塢旁腓埃基人集會的地方；在那兒他們並坐在光亮的大理石椅上。",
    "chapter": 8
  },
  {
    "start": 794.513,
    "end": 799.085,
    "text": "他們剝去這些畜牲的皮，把肉搬上桌，準備一餐盛筵。",
    "chapter": 8
  },
  {
    "start": 799.085,
    "end": 803.467,
    "text": "他們都從起跑線開始，並排向前飛奔蹴起一溜塵煙。",
    "chapter": 8
  },
  {
    "start": 803.467,
    "end": 806.897,
    "text": "」 這時歐瑞亞拉斯插進來當面侮辱他。",
    "chapter": 8
  },
  {
    "start": 806.897,
    "end": 810.517,
    "text": "腓埃基人沒人能趕上你，不用說超過你了。",
    "chapter": 8
  },
  {
    "start": 810.517,
    "end": 815.47,
    "text": "凡是通情理的人，不會藐視你的本領，不過現在請聽我說。",
    "chapter": 8
  },
  {
    "start": 815.47,
    "end": 822.71,
    "text": "她剛從她的偉大父王宙斯那裡回來，一坐下阿瑞斯便走進門，掿住手親密地向她致意。",
    "chapter": 8
  },
  {
    "start": 822.71,
    "end": 831.664,
    "text": "這些永生神祇，我們的一切福祉的來源，都站在門外；他們看見赫斐斯塔司的巧妙手法，都不禁哈哈大笑。",
    "chapter": 8
  },
  {
    "start": 831.664,
    "end": 836.808,
    "text": "她們給她穿上漂亮衣服打扮起來後，她看起來是令人驚奇的。",
    "chapter": 8
  },
  {
    "start": 836.808,
    "end": 842.143,
    "text": "我只希望你現在客客氣氣送給我的劍，將來不要有一天會想它。",
    "chapter": 8
  },
  {
    "start": 842.143,
    "end": 848.24,
    "text": "倘使我能回去，一輩子不會有停止崇拜妳的時候，妳就是我的重生恩人。",
    "chapter": 8
  },
  {
    "start": 848.24,
    "end": 855.289,
    "text": "這位著名的吟遊詩人唱述這個故事時，奧德修斯情不自禁哭了起來，滿面都是淚痕。",
    "chapter": 8
  },
  {
    "start": 855.289,
    "end": 864.815,
    "text": "它們知道每一座城池、每一片肥沃的土地；它們隱身在雲霧裡迅速駛行於廣大無垠的海面，不憂傷害和失事遭難。",
    "chapter": 8
  },
  {
    "start": 864.815,
    "end": 873.579,
    "text": "04 拉考尼亞附近一座小島，相傳阿芙羅狄蒂生自海水泡沫後在此登陸，因此這個島名成了她的綽號。",
    "chapter": 8
  },
  {
    "start": 873.579,
    "end": 882.152,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 8
  },
  {
    "start": 882.152,
    "end": 889.392,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 8
  },
  {
    "start": 889.392,
    "end": 894.508,
    "text": "奧德修斯以機智逃離獨眼巨人，卻因說出真名招來海神怒火。",
    "chapter": 9
  },
  {
    "start": 894.508,
    "end": 907.583,
    "text": "足智多謀的奧德修斯回答王的話，開始講述他的故事道： 「我主阿爾西諾斯，最堪崇拜的王子，聽你的唱詩人歌詠，確實是可愛的，他的歌喉像神的一樣。",
    "chapter": 9
  },
  {
    "start": 907.583,
    "end": 913.077,
    "text": "那裡有的是很多酒和很多牲畜；他們繼續在海濱飲宴，宰殺牛羊。",
    "chapter": 9
  },
  {
    "start": 913.077,
    "end": 920.088,
    "text": "略進飲食後我派人到內地看看那裡住的是什麼人，先派兩人去，另派一人報告信息。",
    "chapter": 9
  },
  {
    "start": 920.088,
    "end": 925.394,
    "text": "一定有某位神指引我們駛行於黑夜，因為前面看不見任何東西。",
    "chapter": 9
  },
  {
    "start": 925.394,
    "end": 927.857,
    "text": "他是一個多麼可怕的怪物啊！",
    "chapter": 9
  },
  {
    "start": 927.857,
    "end": 934.489,
    "text": "「我們生了一堆火，殺了一隻羊祭神，吃了些乳酪；吃畢後坐在洞裡等他回來。",
    "chapter": 9
  },
  {
    "start": 934.489,
    "end": 941.69,
    "text": "我們沒有他那樣幸運，現在來到你這裡求乞，希望你能善待我們，甚至更慷慨仗義些。",
    "chapter": 9
  },
  {
    "start": 941.69,
    "end": 946.427,
    "text": "擠完奶做畢早晨的家事後，他又抓了我兩個人準備早餐。",
    "chapter": 9
  },
  {
    "start": 946.427,
    "end": 952.68,
    "text": "』 「巨人接過酒一飲而盡，那香馥的醇醪給他以極度愉快；他還要一碗。",
    "chapter": 9
  },
  {
    "start": 952.68,
    "end": 958.175,
    "text": "接著他瘋狂地把木槓扔開，高聲喊叫其他住在鄰近巖洞裡的巨人。",
    "chapter": 9
  },
  {
    "start": 958.175,
    "end": 962.722,
    "text": "我為自己選了一隻很成熟的公羊，牠是整群中的頂尖。",
    "chapter": 9
  },
  {
    "start": 962.722,
    "end": 969.733,
    "text": "『巨人，』我叫道，『你要在你那小洞裡吃掉我的朋友們，可是我畢竟不是低能者！",
    "chapter": 9
  },
  {
    "start": 969.733,
    "end": 975.797,
    "text": "誰知竟是一個微不足道的、毫無用處的小矮子用酒灌醉我，弄瞎我眼睛！",
    "chapter": 9
  },
  {
    "start": 975.797,
    "end": 983.945,
    "text": "就那樣我們離開了那島，懷著沉重的心情航行，因為自己生還的喜悅，雜有對於親密亡友的悲慼。",
    "chapter": 9
  },
  {
    "start": 983.945,
    "end": 992.471,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 9
  },
  {
    "start": 992.471,
    "end": 999.672,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 9
  },
  {
    "start": 999.672,
    "end": 1004.831,
    "text": "風袋、巨人與塞西讓返鄉一再延遲，魔法也改變了同伴的外貌。",
    "chapter": 10
  },
  {
    "start": 1004.831,
    "end": 1012.755,
    "text": "「我們下一個著陸的地方是艾奧利亞浮島，那兒是希波塔斯的兒子艾奧拉斯的家，他是神的寵兒。",
    "chapter": 10
  },
  {
    "start": 1012.755,
    "end": 1019.757,
    "text": "他們解開那革囊，各種風一擁而出，霎時間狂風疾飆颳了起來，把我們颳回到海裡去。",
    "chapter": 10
  },
  {
    "start": 1019.757,
    "end": 1024.916,
    "text": "』 「就這樣他把我逐出他的宮殿，我的一切辯解都沒有用處。",
    "chapter": 10
  },
  {
    "start": 1024.916,
    "end": 1030.445,
    "text": "他們站在峭壁頂上，開始用平常人幾乎舉不起的石頭投擊我的艦隊。",
    "chapter": 10
  },
  {
    "start": 1030.445,
    "end": 1038.552,
    "text": "牠太大了，我不能用一手扶住把牠扛在肩上，所以把這頭大獸揹在脖子上，用手拄著槍向船邊走去。",
    "chapter": 10
  },
  {
    "start": 1038.552,
    "end": 1056.426,
    "text": "那兒有些狼和獅在徘徊行走，事實上都是塞西的魔性毒藥把牠們變成那樣的，牠們不唯不攻擊我的人，反而豎起後腿來擁抱他們，搖動長尾巴，像狗討好主人，當主人離開飯桌的時候，牠知道他總是給牠一些好吃的東西。",
    "chapter": 10
  },
  {
    "start": 1056.426,
    "end": 1063.428,
    "text": "有人在室內操作一架大織機，並以清脆的歌喉歌唱，她如不是一位女神，便是個女人。",
    "chapter": 10
  },
  {
    "start": 1063.428,
    "end": 1066.93,
    "text": "她將先給你調製一碗湯，把毒藥放在湯裡。",
    "chapter": 10
  },
  {
    "start": 1066.93,
    "end": 1070.062,
    "text": "你一定有一顆可以抵拒一切魅力的心。",
    "chapter": 10
  },
  {
    "start": 1070.062,
    "end": 1079.644,
    "text": "』 「『塞西，』我答道，『任何像我這樣處境的誠實人，若不先解救他的隨從，親眼看見他們，怎能吃喝下東西呢？",
    "chapter": 10
  },
  {
    "start": 1079.644,
    "end": 1089.963,
    "text": "』他喊道，『你們這樣不怕災禍，竟要自己去到那巫婆的老巢，讓她把你們變成豬仔、狼或獅子，被迫給她那座大房子守門嗎？",
    "chapter": 10
  },
  {
    "start": 1089.963,
    "end": 1093.464,
    "text": "現在我急於要去了，我的夥伴們也是如此。",
    "chapter": 10
  },
  {
    "start": 1093.464,
    "end": 1101.756,
    "text": "同時你手持寶劍，坐在那兒不動，不要讓任何無助的亡魂到血跟前，直到你跟泰瑞西阿斯說過話以後。",
    "chapter": 10
  },
  {
    "start": 1101.756,
    "end": 1105.626,
    "text": "」 05 這大約是傳說中的半夜日出的地方。",
    "chapter": 10
  },
  {
    "start": 1105.626,
    "end": 1113.918,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 10
  },
  {
    "start": 1113.918,
    "end": 1120.919,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 10
  },
  {
    "start": 1120.92,
    "end": 1126.051,
    "text": "奧德修斯進入陰間，從先知、母親與亡魂口中理解返鄉的代價。",
    "chapter": 11
  },
  {
    "start": 1126.051,
    "end": 1134.48,
    "text": "「走到海濱船前時，我們的第一項任務就是跑進海水，豎起桅杆；解開拴在那兒的公羊母羊，牽到船上。",
    "chapter": 11
  },
  {
    "start": 1134.48,
    "end": 1136.679,
    "text": "你步行比我乘黑船還快些！",
    "chapter": 11
  },
  {
    "start": 1136.679,
    "end": 1147.306,
    "text": "不錯，到家後你將懲處這些惡人，可是不論你怎樣殺掉他們，用計謀或以刀劍相向，等在王宮裡把求婚者殺光後，你又得重上徵塵。",
    "chapter": 11
  },
  {
    "start": 1147.306,
    "end": 1159.034,
    "text": "』 「『母親呀，』我答道，『我沒有辦法，非來到冥府請教塞貝斯的泰瑞西阿斯不可啊，我還沒有行近亞該亞，也沒有回到我們自己的土地上。",
    "chapter": 11
  },
  {
    "start": 1159.034,
    "end": 1166.18,
    "text": "』 「我母說著話時，我那混亂的心裡起了一個要擁抱她的亡魂的念頭，雖然她已死了。",
    "chapter": 11
  },
  {
    "start": 1166.18,
    "end": 1172.41,
    "text": "泰魯受孕了，生下佩裡亞斯和奈柳斯，二者都成為強大宙斯的有勢力的僕從。",
    "chapter": 11
  },
  {
    "start": 1172.41,
    "end": 1182.672,
    "text": "這樣日復一日，月復一月，一年四季周而復始，強大的艾菲克雷斯在取得他所有的預言後才釋放了他，因而實行了宙斯的意志。",
    "chapter": 11
  },
  {
    "start": 1182.672,
    "end": 1198.247,
    "text": "」 可敬的艾契紐斯公，他們中間最年長的，接著說道：「朋友們，我們聰明皇后的話非常中肯，正是她應該說的，我想大家應當聽她的忠告，可是自然應由阿爾西諾斯下命令，採取適當行動。",
    "chapter": 11
  },
  {
    "start": 1198.247,
    "end": 1209.241,
    "text": "』 「『拉厄特斯的皇子，才思敏捷的奧德修斯，』他立即答我道，『波塞冬沒有破壞我的船，我也沒有為陸地上的任何敵對部族所殺。",
    "chapter": 11
  },
  {
    "start": 1209.241,
    "end": 1212.723,
    "text": "現在讓我給你一個忠告，希望你牢記在心。",
    "chapter": 11
  },
  {
    "start": 1212.723,
    "end": 1223.717,
    "text": "我情願跟一個沒有田地並衣食不足的人做奴隸，也不願做這些死人的王子，可是這個不要多說了，告訴我關於我那個好兒子有什麼消息。",
    "chapter": 11
  },
  {
    "start": 1223.717,
    "end": 1235.811,
    "text": "真願那時我沒有得到這個獎品，這副甲冑，它竟致埃傑克斯於死，英勇的埃傑克斯，他的容貌和行為的高尚，在達南人中僅亞於佩柳斯的無匹的兒子。",
    "chapter": 11
  },
  {
    "start": 1235.811,
    "end": 1241.491,
    "text": "每次快要到山頂時，石頭自己的重量使它滾下來，一直又滾到平地上。",
    "chapter": 11
  },
  {
    "start": 1241.491,
    "end": 1244.24,
    "text": "08 一路得相當四分之一英畝。",
    "chapter": 11
  },
  {
    "start": 1244.24,
    "end": 1252.485,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 11
  },
  {
    "start": 1252.485,
    "end": 1259.448,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 11
  },
  {
    "start": 1259.448,
    "end": 1264.021,
    "text": "海怪與漩渦奪走同伴，太陽神的牛又帶來最後的船難。",
    "chapter": 12
  },
  {
    "start": 1264.021,
    "end": 1272.595,
    "text": "「我的船從洋川的湍流進入開闊的海面，一直到達旭日島艾艾伊，那裡有溫柔黎明的家和跳舞的場所。",
    "chapter": 12
  },
  {
    "start": 1272.595,
    "end": 1283.074,
    "text": "一個人如冷不防地接近她們，並聽見她們的歌聲，便不能回家，沒有妻子來歡迎他，沒有小孩子看見父親回來樂得眉開眼笑。",
    "chapter": 12
  },
  {
    "start": 1283.074,
    "end": 1291.648,
    "text": "可是在這絕壁的半腰有一雲霧朦朧的洞，洞口向西並下通暗界，我主奧德修斯，你的船必須駛經此處。",
    "chapter": 12
  },
  {
    "start": 1291.648,
    "end": 1296.03,
    "text": "告訴你，西拉生來是不會死的；那惡魔將永生不滅。",
    "chapter": 12
  },
  {
    "start": 1296.03,
    "end": 1302.127,
    "text": "這位通情達理的女神離開我向內陸走去，我回到船上，命人們解纜登船。",
    "chapter": 12
  },
  {
    "start": 1302.127,
    "end": 1304.413,
    "text": "我用蠟塞住個個人的耳朵。",
    "chapter": 12
  },
  {
    "start": 1304.413,
    "end": 1312.605,
    "text": "可是我的勇氣和機智想出了脫過那次危險的辦法；相信將來有一天，這次危險也只是記憶中的事。",
    "chapter": 12
  },
  {
    "start": 1312.605,
    "end": 1324.228,
    "text": "「這時我們已經逃過岩礁、西拉的危險和克瑞比迪的恐怖，不久便到了日神所喜愛的島，海佩朗的輝煌的寬額牛和茁壯的綿羊就養在那裡。",
    "chapter": 12
  },
  {
    "start": 1324.228,
    "end": 1328.61,
    "text": "我們不離船他去，明朝又回到船上駛入開闊的海面。",
    "chapter": 12
  },
  {
    "start": 1328.61,
    "end": 1332.801,
    "text": "』 「我的夥伴們接受這警告，沒有反抗的跡象。",
    "chapter": 12
  },
  {
    "start": 1332.801,
    "end": 1340.804,
    "text": "禱告畢他們割斷牛的喉管，剝了皮，從大腿上割下一片一片的肉，用肥捲起來，上面貼以生肉。",
    "chapter": 12
  },
  {
    "start": 1340.804,
    "end": 1344.423,
    "text": "可是我們想不出挽救的辦法：牛已經死了。",
    "chapter": 12
  },
  {
    "start": 1344.423,
    "end": 1355.855,
    "text": "波浪甚至摧折了近龍骨的桅杆，可是以皮繩做的後牽索掉在桅杆上，我用它把桅杆與龍骨捆起來，跨在這兩塊木頭上，一任狂風的吹打。",
    "chapter": 12
  },
  {
    "start": 1355.855,
    "end": 1358.523,
    "text": "」 09 一里格約等於三哩。",
    "chapter": 12
  },
  {
    "start": 1358.523,
    "end": 1367.096,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 12
  },
  {
    "start": 1367.096,
    "end": 1374.336,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 12
  },
  {
    "start": 1374.336,
    "end": 1379.625,
    "text": "回到伊薩卡的奧德修斯不能立刻現身，只能先以乞丐身分觀察。",
    "chapter": 13
  },
  {
    "start": 1379.625,
    "end": 1391.335,
    "text": "奧德修斯講完他的故事，眾人聽得出神，整個幽暗的殿廳沒有一點聲息，最後阿爾西諾斯向他的客人說道：「奧德修斯，你已經受了許多罪。",
    "chapter": 13
  },
  {
    "start": 1391.335,
    "end": 1393.602,
    "text": "願你吉祥多福，事事如意！",
    "chapter": 13
  },
  {
    "start": 1393.602,
    "end": 1400.59,
    "text": "一旦他們身向後挺，搖槳撥水，奧德修斯便合起眼睛進入甜蜜的沉睡，像死去一般。",
    "chapter": 13
  },
  {
    "start": 1400.59,
    "end": 1402.856,
    "text": "事畢後他們便開船回家去。",
    "chapter": 13
  },
  {
    "start": 1402.856,
    "end": 1404.934,
    "text": "接著再用高山圍繞住城。",
    "chapter": 13
  },
  {
    "start": 1404.934,
    "end": 1424.577,
    "text": "在久離國土以後，他已經不認得它了；因為宙斯的女兒帕拉斯雅典娜把這個地方置於一團雲霧中，好使她自己有時間跟奧德修斯做出計畫，並改裝他，俾在眾求婚客為他們的過惡付出代價以前，他的妻子、朋友和城裡的人們都不認識他。",
    "chapter": 13
  },
  {
    "start": 1424.577,
    "end": 1430.621,
    "text": "」 他進而點查他的三腳鼎、大鍋、金和華美的織品，發現一樣也不少。",
    "chapter": 13
  },
  {
    "start": 1430.621,
    "end": 1438.743,
    "text": "事實上，成千上萬的人，所有那些住在日出的東方的人，和那些住在陰暗的西方的人，都知道它。",
    "chapter": 13
  },
  {
    "start": 1438.743,
    "end": 1453.852,
    "text": "在我手上的血液還未乾的時候，我急忙找到一艘腓埃基船，哀求那班誠實的船員憐憫我，並把我的戰利品給了他們很多，他們才答應帶我到派洛斯，或埃利斯人所統治的埃利斯地面。",
    "chapter": 13
  },
  {
    "start": 1453.852,
    "end": 1462.541,
    "text": "「可是你竟然不認識我，宙斯的女兒帕拉斯雅典娜，我總是站在你身旁，在你所有的冒險行動中保護你。",
    "chapter": 13
  },
  {
    "start": 1462.541,
    "end": 1465.373,
    "text": "你要親眼看見你妻子的情況如何。",
    "chapter": 13
  },
  {
    "start": 1465.373,
    "end": 1468.396,
    "text": "然後我們必須決定將來最好的途徑。",
    "chapter": 13
  },
  {
    "start": 1468.396,
    "end": 1473.684,
    "text": "現在說到你：你必須去見的第一個人，是掌管你的豬群的豬倌。",
    "chapter": 13
  },
  {
    "start": 1473.684,
    "end": 1480.484,
    "text": "計畫好了，二者便分手，雅典娜去到拉塞德芒的神聖地面找奧德修斯的兒子去了。",
    "chapter": 13
  },
  {
    "start": 1480.484,
    "end": 1488.983,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 13
  },
  {
    "start": 1488.983,
    "end": 1496.16,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 13
  },
  {
    "start": 1496.16,
    "end": 1501.478,
    "text": "忠僕歐梅阿斯不知客人真身，仍用有限的食物守住對主人的忠誠。",
    "chapter": 14
  },
  {
    "start": 1501.478,
    "end": 1513.397,
    "text": "奧德修斯離開了海港，順著通往樹林的崎嶇道路，穿山越岡，往雅典娜所說的地點去找那高尚的豬倌；在所有皇室侍役中，豬倌是他最忠實的臣僕。",
    "chapter": 14
  },
  {
    "start": 1513.397,
    "end": 1521.1,
    "text": "「好東主，」他說道，「你這樣誠懇接待我，希望宙斯和其他諸位神祇酬報你，使你事事如意。",
    "chapter": 14
  },
  {
    "start": 1521.1,
    "end": 1541.271,
    "text": "因此我不禁在想，這些求婚者也許是由於天上來的某種謠傳，已經發現了我的主人業已遭遇不幸 —— 這正說明何以他們不循正常途徑去向他的寡妻求愛，也不回家去管自己的事，而優哉遊哉坐在那裡專橫地吃掉他的產業，一點也沒有節省的念頭。",
    "chapter": 14
  },
  {
    "start": 1541.271,
    "end": 1551.907,
    "text": "因為我再也找不到這樣一位仁慈的主人了，無論我走到哪裡，甚至回到我父母的家裡，我生在那裡，他們在那裡親自把我撫養成人。",
    "chapter": 14
  },
  {
    "start": 1551.907,
    "end": 1568.411,
    "text": "神們使他出落得像一株幼苗，我原希望他為人處世不亞於他的父親，具有典型的男子美，誰知突然間有某位神弄昏了他的頭腦，也許是他上了某人的當，他竟離家到神聖的派洛斯，打聽他父親的消息去了。",
    "chapter": 14
  },
  {
    "start": 1568.411,
    "end": 1575.929,
    "text": "我一向所愛的是船和槳、戰鬥、光亮的標槍和弓箭，這些可怕的東西，會使別人不寒而慄的。",
    "chapter": 14
  },
  {
    "start": 1575.929,
    "end": 1579.964,
    "text": "「喊殺聲不久傳到城裡，城裡人聞驚，凌晨湧出。",
    "chapter": 14
  },
  {
    "start": 1579.964,
    "end": 1583.631,
    "text": "他們沒有回家的日子了，神們會保證如此的。",
    "chapter": 14
  },
  {
    "start": 1583.631,
    "end": 1588.766,
    "text": "我向內陸走，遇見一個枝葉繁密的灌木叢，便蹲下去藏在那裡。",
    "chapter": 14
  },
  {
    "start": 1588.766,
    "end": 1596.101,
    "text": "能夠贏得我的關切和愛護的，不是那種話，而是我對於待客律例的尊重，和我對你的慈悲。",
    "chapter": 14
  },
  {
    "start": 1596.101,
    "end": 1601.602,
    "text": "豬倌把四肢的頭刀肉貼在肥上，一併投在火焰裡，上面撒些大麥片。",
    "chapter": 14
  },
  {
    "start": 1601.602,
    "end": 1611.688,
    "text": "它使最聰明的人唱唱笑笑像個女孩；它引他蹦蹦跳跳，使他順口說出不該說的話，可是我既然開始在饒舌，那麼就說下去吧。",
    "chapter": 14
  },
  {
    "start": 1611.688,
    "end": 1614.256,
    "text": "他可以從基地派人來增援我們。",
    "chapter": 14
  },
  {
    "start": 1614.256,
    "end": 1617.74,
    "text": "現在我這一身破爛衣服，他們都瞧不起我。",
    "chapter": 14
  },
  {
    "start": 1617.74,
    "end": 1625.992,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 14
  },
  {
    "start": 1625.992,
    "end": 1632.96,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 14
  },
  {
    "start": 1632.96,
    "end": 1637.435,
    "text": "特勒馬卡斯平安歸來，父子相認並開始策畫奪回王宮。",
    "chapter": 15
  },
  {
    "start": 1637.435,
    "end": 1645.64,
    "text": "帕拉斯雅典娜去到拉塞德芒的寬廣谷地，提醒奧德修斯的高貴兒子已是返家的時候了，並促他登程。",
    "chapter": 15
  },
  {
    "start": 1645.64,
    "end": 1655.896,
    "text": "特勒馬卡斯用腳碰一下奈斯特的兒子，把他從甜夢中喚醒，並說道：「醒一醒，佩西斯拉塔斯，把馬套在車上，我們好上路。",
    "chapter": 15
  },
  {
    "start": 1655.896,
    "end": 1661.304,
    "text": "這時博修斯的兒子埃條紐斯來了，他就住在附近，是剛剛起床的。",
    "chapter": 15
  },
  {
    "start": 1661.304,
    "end": 1669.881,
    "text": "紅髮的米奈勞斯右手持一金盃，內盛老酒，跟在他們背後走，要在他的兩位客人離開前向他們祝福一番。",
    "chapter": 15
  },
  {
    "start": 1669.881,
    "end": 1675.475,
    "text": "可以說，我們父親間的友誼，使我們二人之間也有一種長久的情分。",
    "chapter": 15
  },
  {
    "start": 1675.475,
    "end": 1686.291,
    "text": "同時麥蘭帕斯是弗拉卡斯城堡的一個可憐的囚犯，為了奈柳斯的女兒的緣故受著說不盡的苦楚，不可抗拒的復仇女神使他迷戀著她。",
    "chapter": 15
  },
  {
    "start": 1686.291,
    "end": 1690.393,
    "text": "」 「假如你想利用我的船，我自然不能說不準。",
    "chapter": 15
  },
  {
    "start": 1690.393,
    "end": 1703.445,
    "text": "那班人的放蕩恣肆，已經上幹天怒，你要是堅持跟隨他們，那只是自取驟死而已，他們的僕從跟你大不相同，他們是衣裳楚楚的年輕小夥子，個個油頭滑臉的。",
    "chapter": 15
  },
  {
    "start": 1703.445,
    "end": 1709.972,
    "text": "等我們二人到了情竇初開的年齡，他們把她嫁到薩麥，那人付了多大的代價啊！",
    "chapter": 15
  },
  {
    "start": 1709.972,
    "end": 1716.871,
    "text": "可是我們二人在這棚屋裡，有吃有喝，讓我們互相講述些不愉快的往事以消遣自己。",
    "chapter": 15
  },
  {
    "start": 1716.871,
    "end": 1726.755,
    "text": "『不要作聲，』她說，『你們中間如有人在街上或井邊遇見我，可不要跟我說話，也許會有人去到老頭子家裡向他饒舌。",
    "chapter": 15
  },
  {
    "start": 1726.755,
    "end": 1729.551,
    "text": "先生，那便是我初來此地的經過。",
    "chapter": 15
  },
  {
    "start": 1729.551,
    "end": 1735.332,
    "text": "他比那夥人都強得多，也最有希望得到我母親的青睞和我父親的權利。",
    "chapter": 15
  },
  {
    "start": 1735.332,
    "end": 1743.723,
    "text": "13 有人以一條項鍊賄賂他的妻子伊瑞菲利，使她勸她丈夫參加塞貝斯之役，他明知那是要失敗的。",
    "chapter": 15
  },
  {
    "start": 1743.723,
    "end": 1752.114,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 15
  },
  {
    "start": 1752.114,
    "end": 1759.2,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 15
  },
  {
    "start": 1759.2,
    "end": 1763.944,
    "text": "父子商議搬走武器、關閉出口，讓恐懼轉成可執行的計畫。",
    "chapter": 16
  },
  {
    "start": 1763.944,
    "end": 1774.709,
    "text": "特勒馬卡斯到的時候，奧德修斯跟高尚的豬倌已經生起火來並打發牧倌們趕豬群到牧場去了；他們自己正在棚屋裡趁著晨曦準備早飯。",
    "chapter": 16
  },
  {
    "start": 1774.709,
    "end": 1783.467,
    "text": "我要親自來看看你，打聽我母親是否仍在宮裡，還是她已經改嫁，撇下奧德修斯的床因無人使用而布滿蛛網。",
    "chapter": 16
  },
  {
    "start": 1783.467,
    "end": 1788.212,
    "text": "只是最近他逃脫了一艘塞斯普羅俠人的船，來到我的門口。",
    "chapter": 16
  },
  {
    "start": 1788.212,
    "end": 1796.604,
    "text": "—— 那樣我若不一直去到拉厄特斯子嗣的宮殿裡降禍於其中個個人，就在此時此地讓人砍下我的腦袋。",
    "chapter": 16
  },
  {
    "start": 1796.604,
    "end": 1803.903,
    "text": "並不是我不同情；因為假如人想要什麼，就有什麼，那麼我的第一選擇就是要我父親回來。",
    "chapter": 16
  },
  {
    "start": 1803.903,
    "end": 1810.654,
    "text": "」他說，「你不是奧德修斯；只是有某種力量在戲弄我，使我的痛苦更加辛酸罷了。",
    "chapter": 16
  },
  {
    "start": 1810.654,
    "end": 1817.405,
    "text": "他們還給我輝煌的禮物，許多銅金器皿和織品，謝謝天，這些我都藏在一個巖洞裡。",
    "chapter": 16
  },
  {
    "start": 1817.405,
    "end": 1822.514,
    "text": "可是我要你在天色微明時回家去，讓那些無賴的求婚者看見你。",
    "chapter": 16
  },
  {
    "start": 1822.514,
    "end": 1826.163,
    "text": "」 可是他的高貴兒子提出了一項反對意見。",
    "chapter": 16
  },
  {
    "start": 1826.163,
    "end": 1844.227,
    "text": "「朋友們，」他說，「冒昧的特勒馬卡斯竟然順利地完成了他這次旅程，我們原發誓要叫他失敗的，我現在所能建議的是，召集一班能幹的水手，駕一艘最好的船，快些送個信兒給我們的等在那兒的朋友們，叫他們立即回來。",
    "chapter": 16
  },
  {
    "start": 1844.227,
    "end": 1849.154,
    "text": "眾人聽了他縷述我們的一連串不端行為，當然不會鼓掌稱善。",
    "chapter": 16
  },
  {
    "start": 1849.154,
    "end": 1854.445,
    "text": "你證明他們錯了；我認為你是一個人面獸心的惡棍，你是個瘋子！",
    "chapter": 16
  },
  {
    "start": 1854.445,
    "end": 1863.386,
    "text": "皮奈洛普回到樓上她那輝煌的房裡，哭她親愛的丈夫奧德修斯，直到明眸的雅典娜合起她的眼，使她安然入睡。",
    "chapter": 16
  },
  {
    "start": 1863.386,
    "end": 1871.231,
    "text": "遂一起坐下用餐，吃得津津有味，吃飽喝夠了，他們便想著要上床睡覺，不久便進入愉快的睡鄉。",
    "chapter": 16
  },
  {
    "start": 1871.231,
    "end": 1879.442,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 16
  },
  {
    "start": 1879.442,
    "end": 1886.376,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 16
  },
  {
    "start": 1886.376,
    "end": 1891.455,
    "text": "奧德修斯走進自己的城市，只有老犬阿爾戈斯在門邊認出主人。",
    "chapter": 17
  },
  {
    "start": 1891.455,
    "end": 1911.046,
    "text": "溫柔的黎明使東方現出紅色斑點，奧德修斯王的兒子急著出發回城，他把一雙結實的帶履綁在腳上，揀起一桿大而平衡的長槍，跟他的豬倌說道： 「叔叔，你可以看見，我現在要進城去看我母親；無疑地，不親眼看見我，她是不會停止哭泣的。",
    "chapter": 17
  },
  {
    "start": 1911.046,
    "end": 1922.474,
    "text": "帶領侍女們回到妳樓上的房裡，洗浴一下換身乾淨衣服，向眾神禱告，應許他們假如宙斯給我們清算的一天，我們將向他們獻上最完美的犧牲。",
    "chapter": 17
  },
  {
    "start": 1922.474,
    "end": 1930.455,
    "text": "他可以算得我的親父，我是他的長久失蹤遠遊歸來的兒子，他和他的兒子們就是這樣仁愛地照顧我。",
    "chapter": 17
  },
  {
    "start": 1930.455,
    "end": 1934.99,
    "text": "」 「先生，」聰明的王后說道，「但願你說的能實現！",
    "chapter": 17
  },
  {
    "start": 1934.99,
    "end": 1940.069,
    "text": "」那傢伙叫道，「一個飯桶帶領另一個飯桶，真是物以類聚啊！",
    "chapter": 17
  },
  {
    "start": 1940.069,
    "end": 1943.879,
    "text": "無論在多少座房子中間，只要一看就可以看出。",
    "chapter": 17
  },
  {
    "start": 1943.879,
    "end": 1956.395,
    "text": "奧德修斯從眼角斜看牠，暗自抹掉一顆淚珠，未向豬倌顯出絲毫動感情的模樣，這時他跟豬倌說： 「歐梅阿斯，看見這樣一條獵狗躺在糞堆上，可真奇怪。",
    "chapter": 17
  },
  {
    "start": 1956.395,
    "end": 1973.083,
    "text": "一旦那位傑出的詩人停止歌唱，他也用畢了晚膳，這時全廳的人鬧哄哄的，雅典娜出現在奧德修斯面前，促他去向眾求婚者乞討些剩殘東西，並分別認出誰好誰壞，不過這並不是說到頭來她要救任何人於不死。",
    "chapter": 17
  },
  {
    "start": 1973.083,
    "end": 1979.976,
    "text": "也不要怕你的施捨會冒犯我母親或任何一位皇家僕役，只是你的腦海中毫無慈悲之念。",
    "chapter": 17
  },
  {
    "start": 1979.976,
    "end": 1983.604,
    "text": "沒有一個敢挺身應戰，我們被四面包圍起來。",
    "chapter": 17
  },
  {
    "start": 1983.604,
    "end": 1991.767,
    "text": "否則你的說話自由就要終止了，我們的年輕人將抓住你的腿或臂，拉你出去，從頭到腳剝下你的皮來。",
    "chapter": 17
  },
  {
    "start": 1991.767,
    "end": 2001.925,
    "text": "他確實聽見過關於奧德修斯的消息，他說他仍然活著，已經離家不遠，此刻在富庶的塞斯普羅俠人的國度，將帶回來大批財貨。",
    "chapter": 17
  },
  {
    "start": 2001.925,
    "end": 2006.642,
    "text": "我這一身襤褸衣服，你是知道的，你是我第一個求救的人。",
    "chapter": 17
  },
  {
    "start": 2006.642,
    "end": 2010.088,
    "text": "16 不是那種臨別時以大鍋相贈的客人。",
    "chapter": 17
  },
  {
    "start": 2010.088,
    "end": 2018.251,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 17
  },
  {
    "start": 2018.251,
    "end": 2025.144,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 17
  },
  {
    "start": 2025.144,
    "end": 2030.555,
    "text": "乞丐在王宮遭受羞辱，皮奈洛普暫時重新掌握宴席中的話語權。",
    "chapter": 18
  },
  {
    "start": 2030.555,
    "end": 2037.705,
    "text": "這時有一普通乞丐出現，他通常在伊薩卡街頭乞討為生，以能吃能喝貪饞無饜出名。",
    "chapter": 18
  },
  {
    "start": 2037.705,
    "end": 2045.047,
    "text": "拽起衣服來，讓他們諸位先生看看我們怎樣打法 —— 倘使你敢跟一個年輕人較量。",
    "chapter": 18
  },
  {
    "start": 2045.047,
    "end": 2055.482,
    "text": "任何人打你，其餘的人都出來對付他，我是這裡的主人，安蒂諾斯皇子和歐呂邁卡斯站在我身邊，他們兩位都是好裁判員。",
    "chapter": 18
  },
  {
    "start": 2055.482,
    "end": 2058.767,
    "text": "他們把他拖到圈子裡，兩人舉起手來。",
    "chapter": 18
  },
  {
    "start": 2058.767,
    "end": 2062.825,
    "text": "」他說：「目前你雖時運不濟，願你將來快樂！",
    "chapter": 18
  },
  {
    "start": 2062.825,
    "end": 2068.815,
    "text": "安菲諾馬斯回到殿廳裡，心情沉重並搖著頭，因為他覺得有禍事將臨。",
    "chapter": 18
  },
  {
    "start": 2068.815,
    "end": 2072.68,
    "text": "我不要單獨去見那夥男人：那有違莊重之道。",
    "chapter": 18
  },
  {
    "start": 2072.68,
    "end": 2079.25,
    "text": "一個客人安然坐在我們殿廳裡，要是有人動粗，傷害了他，那可如何是好呢？",
    "chapter": 18
  },
  {
    "start": 2079.25,
    "end": 2086.4,
    "text": "當妳看見我們的兒子頦下生出髭鬚的時候，妳可離家改嫁，嫁給任何妳所喜歡的人。",
    "chapter": 18
  },
  {
    "start": 2086.4,
    "end": 2094.129,
    "text": "他們在殿廳裡弄三堆火照明，把新劈的全乾木柴堆起來，扔幾個著火的樹枝在每堆木柴上。",
    "chapter": 18
  },
  {
    "start": 2094.129,
    "end": 2097.22,
    "text": "「我去告訴特勒馬卡斯妳所說的話。",
    "chapter": 18
  },
  {
    "start": 2097.22,
    "end": 2100.505,
    "text": "那時你可看見我能否犁出一條直溝來！",
    "chapter": 18
  },
  {
    "start": 2100.505,
    "end": 2107.849,
    "text": "「看我們為一個乞丐打起來，」他們說，「這樁愚蠢的事將損害我們今日歡樂的晚會。",
    "chapter": 18
  },
  {
    "start": 2107.849,
    "end": 2110.554,
    "text": "17 過路客人通常去的地方。",
    "chapter": 18
  },
  {
    "start": 2110.554,
    "end": 2119.249,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 18
  },
  {
    "start": 2119.249,
    "end": 2126.592,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 18
  },
  {
    "start": 2126.592,
    "end": 2131.055,
    "text": "老乳母從疤痕認出主人，皮奈洛普同時宣布弓箭比試。",
    "chapter": 19
  },
  {
    "start": 2131.055,
    "end": 2137.564,
    "text": "現在只剩奧德修斯王一人在殿廳裡，雅典娜在幫助他計畫如何誅滅那些求婚者。",
    "chapter": 19
  },
  {
    "start": 2137.564,
    "end": 2140.354,
    "text": "」謹慎的奧德修斯說，「別作聲。",
    "chapter": 19
  },
  {
    "start": 2140.354,
    "end": 2147.234,
    "text": "所以妳得自己當心點，孩子，否則有一天妳可能失去妳在這裡的良好職位 18 。",
    "chapter": 19
  },
  {
    "start": 2147.234,
    "end": 2151.697,
    "text": "可是我現在生活在愁苦中；天上的神祇給我重重困難。",
    "chapter": 19
  },
  {
    "start": 2151.697,
    "end": 2159.694,
    "text": "「在深藍的海中有一片地叫克里特，一片富饒美好的土地，四面環水，人口稠密，有九十個城池。",
    "chapter": 19
  },
  {
    "start": 2159.694,
    "end": 2165.83,
    "text": "告訴我，那時他穿的什麼衣服，相貌如何；也請描述一下跟他一起的人們。",
    "chapter": 19
  },
  {
    "start": 2165.83,
    "end": 2168.62,
    "text": "可是請妳現在擦乾眼淚，聽我說。",
    "chapter": 19
  },
  {
    "start": 2168.62,
    "end": 2176.244,
    "text": "如真的實現，你將從我的慷慨賜予中得知我的友誼有什麼意義，那時世人將羨慕你的好運氣。",
    "chapter": 19
  },
  {
    "start": 2176.244,
    "end": 2180.707,
    "text": "來，歐呂克雷亞，來服侍這位跟妳主人同樣年紀的人。",
    "chapter": 19
  },
  {
    "start": 2180.707,
    "end": 2198.188,
    "text": "有一次他去到富裕的伊薩卡島上，那時他的女兒剛生下一個兒子，當他用畢了晚飯，歐呂克雷亞把嬰兒放在他外祖父的膝上，說道：「奧託律卡斯，也許你能給你的外孫取個名字，我們很久以來就盼望有這個孩子。",
    "chapter": 19
  },
  {
    "start": 2198.188,
    "end": 2208.23,
    "text": "在奧託律卡斯及其兒子們的護理下，奧德修斯的傷痊癒了，後來他們給他許多禮物，快快樂樂打發他回伊薩卡自己家裡去。",
    "chapter": 19
  },
  {
    "start": 2208.23,
    "end": 2214.552,
    "text": "」 聽了這樣告誡後，那老嫗離開殿廳去端洗腳水，因為那整盆水都灑光了。",
    "chapter": 19
  },
  {
    "start": 2214.552,
    "end": 2224.037,
    "text": "」 「夫人，」敏銳的奧德修斯答道，「誰也不能對這個夢強加其他解釋；妳已聽見奧德修斯說他將如何實現此事。",
    "chapter": 19
  },
  {
    "start": 2224.037,
    "end": 2230.174,
    "text": "」 19 G. H. Palmer譯為：「……從九歲起就統治那裡。",
    "chapter": 19
  },
  {
    "start": 2230.174,
    "end": 2238.542,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 19
  },
  {
    "start": 2238.542,
    "end": 2245.608,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 19
  },
  {
    "start": 2245.608,
    "end": 2250.357,
    "text": "夜裡的雷聲與預言讓王宮感到不祥，復國的時機終於接近。",
    "chapter": 20
  },
  {
    "start": 2250.357,
    "end": 2252.914,
    "text": "這時奧德修斯準備在門廊睡覺。",
    "chapter": 20
  },
  {
    "start": 2252.914,
    "end": 2257.845,
    "text": "她彎身在他上面跟他說道：「又是睡不著覺嗎，可憐的人兒？",
    "chapter": 20
  },
  {
    "start": 2257.845,
    "end": 2263.325,
    "text": "躺在那裡瞪住眼一夜不睡，是一種苦惱；不久你就可克服你的困難。",
    "chapter": 20
  },
  {
    "start": 2263.325,
    "end": 2273.37,
    "text": "皮奈洛普的悲訴擾亂了奧德修斯的心意，他認識她的聲音，在一陣白日夢中他彷彿看見她在他身邊，眼睛射出認識他的光芒。",
    "chapter": 20
  },
  {
    "start": 2273.37,
    "end": 2279.58,
    "text": "這時宮中的女僕們已集合起來從事工作，並在生火，爐裡的火並未真的熄滅。",
    "chapter": 20
  },
  {
    "start": 2279.58,
    "end": 2283.963,
    "text": "還有妳們，用海綿抹桌子，洗濯酒碗和最好的雙耳杯。",
    "chapter": 20
  },
  {
    "start": 2283.963,
    "end": 2289.808,
    "text": "因為我不喜歡你的乞討方法，無論如何，這家不是唯一有人吃飯的地方。",
    "chapter": 20
  },
  {
    "start": 2289.808,
    "end": 2292.0,
    "text": "沒有比你的心腸再硬的了。",
    "chapter": 20
  },
  {
    "start": 2292.0,
    "end": 2315.378,
    "text": "我已有我自己的看法，也相信你的慎重決定，現在我告訴你一樁消息，我可鄭重起誓，保證它是正確的，我指著眾神之主宙斯、這宴客的餐桌，以及我已來到的奧德修斯的家室起誓，不等你離開伊薩卡，奧德修斯就會回來，倘使你願意，你可以親眼看見他屠殺那些在這裡強充主人的求愛者。",
    "chapter": 20
  },
  {
    "start": 2315.378,
    "end": 2330.172,
    "text": "各人都咬住嘴唇，只有歐培西斯的兒子安蒂諾斯表示意見，他說：「好了，諸位先生，這話聽起來不大受用，可是我想我們得忍受特勒馬卡斯的這種話頭，雖然他是以威脅的語氣說的。",
    "chapter": 20
  },
  {
    "start": 2330.172,
    "end": 2337.478,
    "text": "因為倘使你擊中了的話，我將一槍刺透你的身體，那時你父親將舉行葬儀，而非舉行婚禮。",
    "chapter": 20
  },
  {
    "start": 2337.478,
    "end": 2357.021,
    "text": "」 「我可向你起誓，阿吉勞斯，」那聰明的青年答道，「我指著宙斯和我父親的痛苦起誓，他也許已經死在距伊薩卡很遠的地方，也許仍在到處飄泊，我絕無意延緩我母親的婚期，事實上我曾催她選擇一人改嫁，我還答應給她最優厚的授予。",
    "chapter": 20
  },
  {
    "start": 2357.021,
    "end": 2365.24,
    "text": "我自己有眼有耳和兩隻腳，肩膀上還有一個相當健全的腦袋，很足以使我走出門去，現在我就要走了。",
    "chapter": 20
  },
  {
    "start": 2365.24,
    "end": 2373.824,
    "text": "至於一位女神和一位英雄不久就要擺在他們面前的那頓晚飯，那是最難吃不過的，因為是他們首先作惡的。",
    "chapter": 20
  },
  {
    "start": 2373.824,
    "end": 2382.043,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 20
  },
  {
    "start": 2382.043,
    "end": 2388.984,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 20
  },
  {
    "start": 2388.984,
    "end": 2394.142,
    "text": "皮奈洛普以古弓設下考驗，偽裝的乞丐拉開弓弦並穿過斧孔。",
    "chapter": 21
  },
  {
    "start": 2394.142,
    "end": 2405.415,
    "text": "明眸女神雅典娜這時促使聰明的王后皮奈洛普在宮裡把一張弓和十二柄大鐵斧遞給眾求婚者，以考驗他們的技能，並導致他們的毀滅。",
    "chapter": 21
  },
  {
    "start": 2405.415,
    "end": 2416.877,
    "text": "門哼的一聲，像一頭公牛在草地上吽鳴，在她面前敞開，她進去踏上一個高起的平臺，臺上放了些箱櫃，裡面收藏著為香草薰過的衣服。",
    "chapter": 21
  },
  {
    "start": 2416.877,
    "end": 2422.036,
    "text": "坐在那兒默默地吃你們的東西吧，否則滾出去，到外面哭去！",
    "chapter": 21
  },
  {
    "start": 2422.036,
    "end": 2431.589,
    "text": "倘使我能拉上弦，射一箭穿過斧孔，我就不在乎我母親跟別人去，那時我將因力能使用我父的可怕玩具而滿足了。",
    "chapter": 21
  },
  {
    "start": 2431.589,
    "end": 2433.499,
    "text": "他轉面對著眾求婚者。",
    "chapter": 21
  },
  {
    "start": 2433.499,
    "end": 2437.13,
    "text": "那班青年用熱油搽弓，各自盡了最大努力。",
    "chapter": 21
  },
  {
    "start": 2437.13,
    "end": 2452.031,
    "text": "天上的神祇如讓我誅滅這群惡霸，我將給你們每人娶一房媳婦，給你們一筆財產，在我家附近給你們每人蓋一座房子；從那天起我把你們二人當作特勒馬卡斯的朋友和兄弟看待。",
    "chapter": 21
  },
  {
    "start": 2452.031,
    "end": 2454.897,
    "text": "那兩位皇家僕從跟著也走了進去。",
    "chapter": 21
  },
  {
    "start": 2454.897,
    "end": 2457.19,
    "text": "」 他們都喜歡這個意見。",
    "chapter": 21
  },
  {
    "start": 2457.19,
    "end": 2464.45,
    "text": "那狂怒的畜牲走開了，念念不忘他的苦痛；馬人和人中間的仇恨，就是那樣結起來的。",
    "chapter": 21
  },
  {
    "start": 2464.45,
    "end": 2467.889,
    "text": "可是為什麼認為這事會反映你們自己呢？",
    "chapter": 21
  },
  {
    "start": 2467.889,
    "end": 2470.946,
    "text": "也許我還年輕，但我比你結實強壯。",
    "chapter": 21
  },
  {
    "start": 2470.946,
    "end": 2478.015,
    "text": "」另一個小夥子說：「那也不能從其中得到什麼好處，像他沒有希望彎弓上弦一樣！",
    "chapter": 21
  },
  {
    "start": 2478.015,
    "end": 2479.734,
    "text": "（曼託叢書本註）。",
    "chapter": 21
  },
  {
    "start": 2479.734,
    "end": 2488.332,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 21
  },
  {
    "start": 2488.332,
    "end": 2495.592,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 21
  },
  {
    "start": 2495.592,
    "end": 2500.281,
    "text": "奧德修斯公開身分，父子與忠僕在殿廳中對抗求婚者。",
    "chapter": 22
  },
  {
    "start": 2500.281,
    "end": 2507.51,
    "text": "不屈不撓的奧德修斯脫掉破衣，手持弓箭跳在寬大的門檻上，把滿壺飛箭倒在腳前。",
    "chapter": 22
  },
  {
    "start": 2507.51,
    "end": 2510.441,
    "text": "不可征服的奧德修斯怒視著他們。",
    "chapter": 22
  },
  {
    "start": 2510.441,
    "end": 2516.302,
    "text": "但是歐呂邁卡斯又向他們說道：「朋友們，這人是不會手下留情的。",
    "chapter": 22
  },
  {
    "start": 2516.302,
    "end": 2522.554,
    "text": "等我回來的時候，我自己亦將披掛起來，我還給豬倌、牛倌也拿來配備。",
    "chapter": 22
  },
  {
    "start": 2522.554,
    "end": 2525.485,
    "text": "不久他把這些東西遞給眾求婚者。",
    "chapter": 22
  },
  {
    "start": 2525.485,
    "end": 2539.942,
    "text": "後來羊倌邁出門檻，一手拿一頂精美的頭盔，另一手拿一面發黴的古舊盾牌，從前拉厄特斯公是青年兵士時曾用過它，但後來放在那裡許久不用，盾帶上縫的線已朽了。",
    "chapter": 22
  },
  {
    "start": 2539.942,
    "end": 2545.999,
    "text": "你的兒子和女兒都不得住在你家裡，你的妻子不敢在伊薩卡街上露面。",
    "chapter": 22
  },
  {
    "start": 2545.999,
    "end": 2553.814,
    "text": "一人擊中殿廳的結實的門，另一人擊中門框，第三人的六尺梣木槍桿和沉重銅矛撞在牆上。",
    "chapter": 22
  },
  {
    "start": 2553.814,
    "end": 2566.513,
    "text": "四人也一齊向他們撲來，像從山上飛來的曲爪鉤嘴的禿鷲追撲小鳥，小鳥不論高飛低飛，總不能逃脫，禿鷲抓住撕吃牠們，同時人們看著喝采嬉樂。",
    "chapter": 22
  },
  {
    "start": 2566.513,
    "end": 2570.421,
    "text": "他權衡了這兩個途徑，決定直接向國王求饒。",
    "chapter": 22
  },
  {
    "start": 2570.421,
    "end": 2579.408,
    "text": "」 兩人立即走出殿廳，進入露天的庭院，坐在宙斯的祭壇旁，四下望望，仍然害怕有驟然被殺的危險。",
    "chapter": 22
  },
  {
    "start": 2579.408,
    "end": 2582.534,
    "text": "告訴我誰是不忠貞的，誰是誠實的。",
    "chapter": 22
  },
  {
    "start": 2582.534,
    "end": 2590.349,
    "text": "這時像灌木叢中一群鵓鴿或長翅畫眉被捕在網裡，牠們原是回來睡覺的，沒想到卻遇到死。",
    "chapter": 22
  },
  {
    "start": 2590.349,
    "end": 2593.28,
    "text": "22 此句曾參考雄雞叢書譯本。",
    "chapter": 22
  },
  {
    "start": 2593.28,
    "end": 2602.072,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 22
  },
  {
    "start": 2602.072,
    "end": 2609.496,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 22
  },
  {
    "start": 2609.496,
    "end": 2614.346,
    "text": "婚床的秘密使夫妻確認彼此，二十年的等待終於得到回應。",
    "chapter": 23
  },
  {
    "start": 2614.346,
    "end": 2619.757,
    "text": "那老嫗暗自笑著奔上樓梯，去告訴女主人她親愛的丈夫已在家裡。",
    "chapter": 23
  },
  {
    "start": 2619.757,
    "end": 2623.115,
    "text": "」 可是這並沒有使那老乳母不再說話。",
    "chapter": 23
  },
  {
    "start": 2623.115,
    "end": 2629.458,
    "text": "這時所有的屍首都被移到庭院的門口，他命我弄一大堆火，正在燻蒸殿廳哩。",
    "chapter": 23
  },
  {
    "start": 2629.458,
    "end": 2634.868,
    "text": "讓我來告訴妳另一件事 —— 一項事實可證明我說的都是真的。",
    "chapter": 23
  },
  {
    "start": 2634.868,
    "end": 2641.584,
    "text": "「母親，」他說，「妳真是我的奇怪和硬心腸的母親，為什麼離我父親這樣遠呢？",
    "chapter": 23
  },
  {
    "start": 2641.584,
    "end": 2651.845,
    "text": "」 「這問題你得自己解決，親愛的父親，」特勒馬卡斯機靈地答道，「因為你是世上最善於擺脫困難的人，誰也比不了你。",
    "chapter": 23
  },
  {
    "start": 2651.845,
    "end": 2655.204,
    "text": "」這表示人們不知道真的發生了什麼事。",
    "chapter": 23
  },
  {
    "start": 2655.204,
    "end": 2659.494,
    "text": "把那張大床放在那裡，上面鋪羊毛氈毯和乾淨被單。",
    "chapter": 23
  },
  {
    "start": 2659.494,
    "end": 2663.971,
    "text": "流著淚搶到奧德修斯跟前，雙臂抱住脖子，親他的頭。",
    "chapter": 23
  },
  {
    "start": 2663.971,
    "end": 2673.859,
    "text": "對於她這也是一個甜蜜的時刻，甜蜜得像海神用狂風巨浪把一艘堂皇的船沉沒後，在海中掙扎的水手們看見陸地時那樣。",
    "chapter": 23
  },
  {
    "start": 2673.859,
    "end": 2676.471,
    "text": "」 「為什麼逼我現在就說呢？",
    "chapter": 23
  },
  {
    "start": 2676.471,
    "end": 2681.508,
    "text": "這時特勒馬卡斯、牛倌和豬倌都停止跳舞，並叫女人們離去。",
    "chapter": 23
  },
  {
    "start": 2681.508,
    "end": 2696.806,
    "text": "最後他講到去希瑞亞的多難航程，在那裡，好心腸的腓埃基人待他像神明一般，派船送他回家，並慷慨贈以銅金器皿和織品，剛講完這個故事，他突然睡著了，鬆開了四肢，忘掉了憂慮。",
    "chapter": 23
  },
  {
    "start": 2696.806,
    "end": 2701.843,
    "text": "23 這一段的後半段曾參考雄雞叢書和曼託叢書兩個譯本。",
    "chapter": 23
  },
  {
    "start": 2701.843,
    "end": 2710.238,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 23
  },
  {
    "start": 2710.238,
    "end": 2717.328,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 23
  },
  {
    "start": 2717.328,
    "end": 2732.633,
    "text": "雅典娜停止復仇，讓奧德修斯的回家成為伊薩卡重新恢復和平的起點.這時塞林山的赫耳墨斯正在集合眾求婚者的亡魂；他那輝煌的金棒，可用以隨意催人入眠，或把人從熟睡中點醒。",
    "chapter": 24
  },
  {
    "start": 2732.633,
    "end": 2739.624,
    "text": "你母親聽見消息後，同永生的海居仙女們都從海裡出來，水裡發出一種神秘的哭聲。",
    "chapter": 24
  },
  {
    "start": 2739.624,
    "end": 2745.293,
    "text": "因此甚至死，阿基里斯，也沒有損傷你的榮耀，世人將永遠尊崇你。",
    "chapter": 24
  },
  {
    "start": 2745.293,
    "end": 2747.56,
    "text": "這是拉厄特斯主公的壽罩。",
    "chapter": 24
  },
  {
    "start": 2747.56,
    "end": 2754.362,
    "text": "因此那位偉大的和魯莽的人拿到了弓，他不費力地彎弓上弦，一箭射穿那些鐵孔。",
    "chapter": 24
  },
  {
    "start": 2754.362,
    "end": 2761.164,
    "text": "我要去試一下我父親，看他見我時是否認得我是誰，也許多年不見，他不認識了。",
    "chapter": 24
  },
  {
    "start": 2761.164,
    "end": 2772.312,
    "text": "可是那人不大聰明，因為我提起一個朋友的名字，問他這人現在還活著呢，或是已經死了，而他既不屑於正經答我，也不屑於聽我說。",
    "chapter": 24
  },
  {
    "start": 2772.312,
    "end": 2777.98,
    "text": "我家就在那兒的王宮裡，因為我父親是波律普蒙的兒子阿費達斯王。",
    "chapter": 24
  },
  {
    "start": 2777.98,
    "end": 2786.106,
    "text": "你給我十三棵梨樹、十棵蘋果樹、四十棵無花果樹，同時指給我看將來為我所有的那五十隴葡萄。",
    "chapter": 24
  },
  {
    "start": 2786.106,
    "end": 2789.696,
    "text": "你們其餘的，別光站在那兒張著嘴凝視啊！",
    "chapter": 24
  },
  {
    "start": 2789.696,
    "end": 2799.143,
    "text": "快快起來，我說，別等他逃到埃利斯人統治的派洛斯或埃利斯，讓我們採取行動，否則我們永遠不能再抬起頭來。",
    "chapter": 24
  },
  {
    "start": 2799.143,
    "end": 2803.489,
    "text": "老人的坦白話不合他們的胃口，他們聽從歐培西斯。",
    "chapter": 24
  },
  {
    "start": 2803.489,
    "end": 2806.323,
    "text": "偉岸的奧德修斯看見她非常高興。",
    "chapter": 24
  },
  {
    "start": 2806.323,
    "end": 2814.637,
    "text": "不久披乙己斯的宙斯的女兒帕拉斯雅典娜，仍然借用曼託的形貌和聲音，在相爭雙方間奠定了和平。",
    "chapter": 24
  },
  {
    "start": 2814.637,
    "end": 2823.14,
    "text": "本章的事件不只是冒險插曲，也推動奧德修斯、佩涅洛佩、忒勒馬科斯與雅典娜之間的關係逐步改變。",
    "chapter": 24
  },
  {
    "start": 2823.14,
    "end": 2830.32,
    "text": "當我們把視線放回本章，可以看見人物如何在神意、海洋、家庭與選擇之間承受後果。",
    "chapter": 24
  }
