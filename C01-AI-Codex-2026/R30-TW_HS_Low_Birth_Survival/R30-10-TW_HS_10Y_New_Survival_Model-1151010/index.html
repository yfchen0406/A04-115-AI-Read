,"id":"S025-01","cueId":"S025","sequence":25,"segmentIndex":1,"startFrame":4945,"endFrame":5130,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"偏遠地區是否連得上、教師有沒有共同備課時間、設備之後誰維護，","startSeconds":171.012,"endSeconds":177.417,"id":"S025-02","cueId":"S025","sequence":25,"segmentIndex":2,"startFrame":5130,"endFrame":5323,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"以及補助結束後課程能不能繼續。","startSeconds":177.417,"endSeconds":180.62,"id":"S025-03","cueId":"S025","sequence":25,"segmentIndex":3,"startFrame":5323,"endFrame":5419,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"先從最貼近教室的第10名開始。","startSeconds":180.8,"endSeconds":184.548,"id":"S026-01","cueId":"S026","sequence":26,"segmentIndex":1,"startFrame":5424,"endFrame":5536,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"02｜第10名：小班教學與特色課程學生少一點，","startSeconds":184.548,"endSeconds":190.296,"id":"S027-01","cueId":"S027","sequence":27,"segmentIndex":1,"startFrame":5536,"endFrame":5709,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"老師是不是就能看見每一個人？","startSeconds":190.296,"endSeconds":193.795,"id":"S027-02","cueId":"S027","sequence":27,"segmentIndex":2,"startFrame":5709,"endFrame":5814,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"小班確實可能增加提問、討論和個別回饋的機會，學校也可能把地方文化、","startSeconds":193.795,"endSeconds":202.042,"id":"S028-01","cueId":"S028","sequence":28,"segmentIndex":1,"startFrame":5814,"endFrame":6061,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"專業實作或跨領域主題做得更深入。","startSeconds":202.042,"endSeconds":206.04,"id":"S028-02","cueId":"S028","sequence":28,"segmentIndex":2,"startFrame":6061,"endFrame":6181,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"但班級人數小，不會自動變成好課程。","startSeconds":206.22,"endSeconds":209.785,"id":"S029-01","cueId":"S029","sequence":29,"segmentIndex":1,"startFrame":6187,"endFrame":6294,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若開課需要的教師專長不存在，或實驗設備不足，學生反而可能少了選擇。","startSeconds":209.785,"endSeconds":216.706,"id":"S030-01","cueId":"S030","sequence":30,"segmentIndex":1,"startFrame":6294,"endFrame":6501,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"所以小班特色不應只用每班幾個人來宣傳，而要看學生實際參與了什麼、","startSeconds":216.706,"endSeconds":223.417,"id":"S031-01","cueId":"S031","sequence":31,"segmentIndex":1,"startFrame":6501,"endFrame":6703,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"能不能修到完整課程、教師是否有足夠備課與協作時間。","startSeconds":223.417,"endSeconds":228.66,"id":"S031-02","cueId":"S031","sequence":31,"segmentIndex":2,"startFrame":6703,"endFrame":6860,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它的成本包括師資、教材、設備和課程設計；","startSeconds":228.84,"endSeconds":233.051,"id":"S032-01","cueId":"S032","sequence":32,"segmentIndex":1,"startFrame":6865,"endFrame":6992,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"適用性則取決於學校特色是否和學生需求相連。","startSeconds":233.051,"endSeconds":237.473,"id":"S033-01","cueId":"S033","sequence":33,"segmentIndex":1,"startFrame":6992,"endFrame":7124,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"小規模可以帶來更密切的互動，但也需要清楚的課程目標和穩定人力。","startSeconds":237.473,"endSeconds":244.0,"id":"S034-01","cueId":"S034","sequence":34,"segmentIndex":1,"startFrame":7124,"endFrame":7320,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"目前公開資料較常呈現班級或校務規模，","startSeconds":244.18,"endSeconds":248.52,"id":"S035-01","cueId":"S035","sequence":35,"segmentIndex":1,"startFrame":7325,"endFrame":7456,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"較少以相同方法長期比較小班對高中學習成果的因果效果。","startSeconds":248.52,"endSeconds":254.789,"id":"S035-02","cueId":"S035","sequence":35,"segmentIndex":2,"startFrame":7456,"endFrame":7644,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"因此，這是一種值得設計和追蹤的方向，不是保證成效的公式。","startSeconds":254.789,"endSeconds":261.54,"id":"S036-01","cueId":"S036","sequence":36,"segmentIndex":1,"startFrame":7644,"endFrame":7846,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若一所學校單靠縮小班級，卻沒有補上課程與師資，","startSeconds":261.72,"endSeconds":266.704,"id":"S037-01","cueId":"S037","sequence":37,"segmentIndex":1,"startFrame":7852,"endFrame":8001,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"學生感受到的可能只是課變少了。","startSeconds":266.704,"endSeconds":269.955,"id":"S037-02","cueId":"S037","sequence":37,"segmentIndex":2,"startFrame":8001,"endFrame":8099,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"當校內開不出所有課，下一個可能是把校門打開，讓學習跨出去。","startSeconds":269.955,"endSeconds":276.24,"id":"S038-01","cueId":"S038","sequence":38,"segmentIndex":1,"startFrame":8099,"endFrame":8287,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"03｜第9名：","startSeconds":276.42,"endSeconds":278.093,"id":"S039-01","cueId":"S039","sequence":39,"segmentIndex":1,"startFrame":8293,"endFrame":8343,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"跨校選課與區域課程聯盟一所學校不一定要獨自提供所有課程。","startSeconds":278.093,"endSeconds":284.786,"id":"S039-02","cueId":"S039","sequence":39,"segmentIndex":2,"startFrame":8343,"endFrame":8544,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"教育部曾介紹國立羅東高商跨越技術型與綜合型高中學制規劃選修，","startSeconds":284.786,"endSeconds":291.957,"id":"S040-01","cueId":"S040","sequence":40,"segmentIndex":1,"startFrame":8544,"endFrame":8759,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"並和羅東高中、羅東高工合作跨校選修；","startSeconds":291.957,"endSeconds":296.26,"id":"S040-02","cueId":"S040","sequence":40,"segmentIndex":2,"startFrame":8759,"endFrame":8888,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"課程包括民宿實務和微型創業。","startSeconds":296.44,"endSeconds":299.746,"id":"S041-01","cueId":"S041","sequence":41,"segmentIndex":1,"startFrame":8893,"endFrame":8992,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"這個案例說明，跨校合作可以讓學生接觸不同群科與主題，","startSeconds":299.746,"endSeconds":305.885,"id":"S042-01","cueId":"S042","sequence":42,"segmentIndex":1,"startFrame":8992,"endFrame":9177,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"也讓同一區域的學校形成互補。","startSeconds":305.885,"endSeconds":309.19,"id":"S042-02","cueId":"S042","sequence":42,"segmentIndex":2,"startFrame":9177,"endFrame":9276,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"跨校選課的關鍵不只是課表上多一門課。","startSeconds":309.19,"endSeconds":313.44,"id":"S043-01","cueId":"S043","sequence":43,"segmentIndex":1,"startFrame":9276,"endFrame":9403,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"學生怎麼移動、交通時間如何安排、課程如何認列學分、設備由誰開放、","startSeconds":313.62,"endSeconds":320.101,"id":"S044-01","cueId":"S044","sequence":44,"segmentIndex":1,"startFrame":9409,"endFrame":9603,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"教師怎麼協同備課，都會影響學生能不能真的修到。","startSeconds":320.101,"endSeconds":324.759,"id":"S044-02","cueId":"S044","sequence":44,"segmentIndex":2,"startFrame":9603,"endFrame":9743,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"線上同步上課可以減少部分移動，卻仍需要教室端的學習支持、","startSeconds":324.759,"endSeconds":330.43,"id":"S045-01","cueId":"S045","sequence":45,"segmentIndex":1,"startFrame":9743,"endFrame":9913,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"網路穩定與課程互動設計。","startSeconds":330.43,"endSeconds":332.86,"id":"S045-02","cueId":"S045","sequence":45,"segmentIndex":2,"startFrame":9913,"endFrame":9986,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"羅東高商的做法是官方介紹的個案，不代表每個地區都具備相同條件，","startSeconds":333.04,"endSeconds":340.264,"id":"S046-01","cueId":"S046","sequence":46,"segmentIndex":1,"startFrame":9991,"endFrame":10208,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"也不能單憑案例證明長期成效。","startSeconds":340.264,"endSeconds":343.527,"id":"S046-02","cueId":"S046","sequence":46,"segmentIndex":2,"startFrame":10208,"endFrame":10306,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"較適合先從少數稀有選修或特色課開始，觀察選課人數、完成率、","startSeconds":343.527,"endSeconds":350.285,"id":"S047-01","cueId":"S047","sequence":47,"segmentIndex":1,"startFrame":10306,"endFrame":10509,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"學生回饋和交通負擔，再決定是否擴大。","startSeconds":350.285,"endSeconds":354.48,"id":"S047-02","cueId":"S047","sequence":47,"segmentIndex":2,"startFrame":10509,"endFrame":10634,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"合作的另一個核心資源不是課表，而是教師專長；","startSeconds":354.66,"endSeconds":359.901,"id":"S048-01","cueId":"S048","sequence":48,"segmentIndex":1,"startFrame":10640,"endFrame":10797,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"因此第8名談共享師資。","startSeconds":359.901,"endSeconds":362.521,"id":"S049-01","cueId":"S049","sequence":49,"segmentIndex":1,"startFrame":10797,"endFrame":10876,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"04｜第8名：區域共享師資與專業支持偏遠地區或小型學校，","startSeconds":362.521,"endSeconds":369.191,"id":"S050-01","cueId":"S050","sequence":50,"segmentIndex":1,"startFrame":10876,"endFrame":11076,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"可能很難為每一門少數學生需要的課程，長期配置一位專任教師。","startSeconds":369.191,"endSeconds":376.1,"id":"S050-02","cueId":"S050","sequence":50,"segmentIndex":2,"startFrame":11076,"endFrame":11283,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"區域共享師資可以讓專業教師在數校之間授課，或共同提供輔導、特殊教育、","startSeconds":376.28,"endSeconds":384.165,"id":"S051-01","cueId":"S051","sequence":51,"segmentIndex":1,"startFrame":11288,"endFrame":11525,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"實驗課程及數位教學支持。","startSeconds":384.165,"endSeconds":386.948,"id":"S051-02","cueId":"S051","sequence":51,"segmentIndex":2,"startFrame":11525,"endFrame":11608,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它的目的不是把教師當成可以任意調度的資源，","startSeconds":386.948,"endSeconds":391.818,"id":"S052-01","cueId":"S052","sequence":52,"segmentIndex":1,"startFrame":11608,"endFrame":11755,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"而是讓稀有專長有機會服務更多學生。","startSeconds":391.818,"endSeconds":395.76,"id":"S052-02","cueId":"S052","sequence":52,"segmentIndex":2,"startFrame":11755,"endFrame":11873,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"真正的難題在制度與工作條件。","startSeconds":395.94,"endSeconds":399.117,"id":"S053-01","cueId":"S053","sequence":53,"segmentIndex":1,"startFrame":11878,"endFrame":11974,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"跨校教師的聘任、授課時數、交通、備課、行政分工和學生評量，","startSeconds":399.117,"endSeconds":405.698,"id":"S054-01","cueId":"S054","sequence":54,"segmentIndex":1,"startFrame":11974,"endFrame":12171,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"都要明確安排。","startSeconds":405.698,"endSeconds":407.287,"id":"S054-02","cueId":"S054","sequence":54,"segmentIndex":2,"startFrame":12171,"endFrame":12219,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若教師一天在不同校區趕場，省下的可能是學校各自聘人的成本，","startSeconds":407.287,"endSeconds":413.869,"id":"S055-01","cueId":"S055","sequence":55,"segmentIndex":1,"startFrame":12219,"endFrame":12416,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"增加的卻是教師的移動和協調負擔。","startSeconds":413.869,"endSeconds":417.5,"id":"S055-02","cueId":"S055","sequence":55,"segmentIndex":2,"startFrame":12416,"endFrame":12525,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"共享師資也不能只靠個別教師熱心，必須有穩定經費、","startSeconds":417.68,"endSeconds":423.747,"id":"S056-01","cueId":"S056","sequence":56,"segmentIndex":1,"startFrame":12530,"endFrame":12712,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"主管機關支持與共同課程規劃。","startSeconds":423.747,"endSeconds":427.286,"id":"S056-02","cueId":"S056","sequence":56,"segmentIndex":2,"startFrame":12712,"endFrame":12819,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"目前各地制度和公開資料口徑不一，不能據此算出全台共享師資的成本效益。","startSeconds":427.286,"endSeconds":435.88,"id":"S057-01","cueId":"S057","sequence":57,"segmentIndex":1,"startFrame":12819,"endFrame":13076,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"本集把它視為需因地制宜的模式，未來可以用課程可開設率、師資穩定度、","startSeconds":436.06,"endSeconds":443.672,"id":"S058-01","cueId":"S058","sequence":58,"segmentIndex":1,"startFrame":13082,"endFrame":13310,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"學生可近性和教師工作量一起追蹤。","startSeconds":443.672,"endSeconds":447.363,"id":"S058-02","cueId":"S058","sequence":58,"segmentIndex":2,"startFrame":13310,"endFrame":13421,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"師資到位之後，下一個問題是學生能不能跨越地理距離取得課程，","startSeconds":447.363,"endSeconds":454.052,"id":"S059-01","cueId":"S059","sequence":59,"segmentIndex":1,"startFrame":13421,"endFrame":13622,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"數位教學因此成為第7名。","startSeconds":454.052,"endSeconds":456.82,"id":"S059-02","cueId":"S059 id":"S099-01","cueId":"S099","sequence":99,"segmentIndex":1,"startFrame":24160,"endFrame":24326,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"是建立區域協作網絡。","startSeconds":810.871,"endSeconds":813.0,"id":"S099-02","cueId":"S099","sequence":99,"segmentIndex":2,"startFrame":24326,"endFrame":24390,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"09｜第3名：小校與地方社區共同設計課程學校可以把地方當成教室，","startSeconds":813.18,"endSeconds":821.126,"id":"S100-01","cueId":"S100","sequence":100,"segmentIndex":1,"startFrame":24395,"endFrame":24634,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"讓學生在地方文化、環境、產業或公共議題中學習。","startSeconds":821.126,"endSeconds":826.837,"id":"S100-02","cueId":"S100","sequence":100,"segmentIndex":2,"startFrame":24634,"endFrame":24805,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"這種課程不必然需要大型設備，卻需要穩定的社區夥伴、教師共同備課、","startSeconds":826.837,"endSeconds":834.783,"id":"S101-01","cueId":"S101","sequence":101,"segmentIndex":1,"startFrame":24805,"endFrame":25043,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"交通安排和對學生安全的照顧。","startSeconds":834.783,"endSeconds":838.26,"id":"S101-02","cueId":"S101","sequence":101,"segmentIndex":2,"startFrame":25043,"endFrame":25148,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它的價值不是把地方故事包裝成觀光，而是讓學生能提出問題、蒐集資料、","startSeconds":838.44,"endSeconds":845.571,"id":"S102-01","cueId":"S102","sequence":102,"segmentIndex":1,"startFrame":25153,"endFrame":25367,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"實作並回到課堂反思。","startSeconds":845.571,"endSeconds": ":true},{"text":"卻可能讓單校難以負擔的選修與專業支持留在區域內。","startSeconds":960.77,"endSeconds":966.96,"id":"S115-02","cueId":"S115","sequence":115,"segmentIndex":2,"startFrame":28823,"endFrame":29009,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"評估時要看學生實際可修課程是否增加、不同學校的學生是否平等參與，","startSeconds":967.14,"endSeconds":974.648,"id":"S116-01","cueId":"S116","sequence":116,"segmentIndex":1,"startFrame":29014,"endFrame":29239,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"以及長期財源是否穩定。","startSeconds":974.648,"endSeconds":977.229,"id":"S116-02","cueId":"S116","sequence":116,"segmentIndex":2,"startFrame":29239,"endFrame":29317,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"最終問題不是每所學校都要變成同一種學校，","startSeconds":977.229,"endSeconds":981.922,"id":"S117-01","cueId":"S117","sequence":117,"segmentIndex":1,"startFrame":29317,"endFrame":29458,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"而是如何讓不同學校在同一區域互相支撐。","startSeconds":981.922,"endSeconds":986.38,"id":"S117-02","cueId":"S117","sequence":117,"segmentIndex":2,"startFrame":29458,"endFrame":29591,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"因此第1名，是把不同模式組合起來的學生導向轉型。","startSeconds":986.56,"endSeconds":991.811,"id":"S118-01","cueId":"S118","sequence":118,"segmentIndex":1,"startFrame":29597,"endFrame":29754,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"11｜第1名：","startSeconds":991.811,"endSeconds":993.342,"id":"S119-01","cueId":"S119","sequence":119,"segmentIndex":1,"startFrame":29754,"endFrame":29800,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"以學生選擇為核心的彈性學習共同體第1名不是一套固定校型，","startSeconds":993.342,"endSeconds":999.468,"id":"S119-02","cueId":"S119","sequence":119,"segmentIndex":2,"startFrame":29800,"endFrame":29984,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"而是一個整合方向：先確認學生需要什麼，再決定由單校提供、跨校共享、","startSeconds":999.468,"endSeconds":1006.688,"id":"S119-03","cueId":"S119","sequence":119,"segmentIndex":3,"startFrame":29984,"endFrame":30201,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"數位補足、社區協作，或與產業建立有保障的課程。","startSeconds":1006.688,"endSeconds":1011.72,"id":"S119-04","cueId":"S119","sequence":119,"segmentIndex":4,"startFrame":30201,"endFrame":30352,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它把前面九種做法放進同一個問題裡：學生能否在住得起、到得了、","startSeconds":1011.9,"endSeconds":1019.065,"id":"S120-01","cueId":"S120","sequence":120,"segmentIndex":1,"startFrame":30357,"endFrame":30572,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"修得完的條件下，取得有品質的學習？","startSeconds":1019.065,"endSeconds":1023.125,"id":"S120-02","cueId":"S120","sequence":120,"segmentIndex":2,"startFrame":30572,"endFrame":30694,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"這個方向需要學校和地方政府共同盤點生源、課程、師資、設備、","startSeconds":1023.125,"endSeconds":1030.051,"id":"S121-01","cueId":"S121","sequence":121,"segmentIndex":1,"startFrame":30694,"endFrame":30902,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"交通和學生支持，再由學生與家庭實際需求決定合作方式。","startSeconds":1030.051,"endSeconds":1036.26,"id":"S121-02","cueId":"S121","sequence":121,"segmentIndex":2,"startFrame":30902,"endFrame":31088,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它也需要設定可追蹤的指標，例如課程可選擇性、實際修課與完成情形、","startSeconds":1036.44,"endSeconds":1043.608,"id":"S122-01","cueId":"S122","sequence":122,"segmentIndex":1,"startFrame":31093,"endFrame":31308,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"師資穩定、學生參與、交通時間、設備維護和跨年度經費。","startSeconds":1043.608,"endSeconds":1049.432,"id":"S122-02","cueId":"S122","sequence":122,"segmentIndex":2,"startFrame":31308,"endFrame":31483,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"指標要能揭露差異，不能只公布一個平均數掩蓋偏鄉、","startSeconds":1049.432,"endSeconds":1054.808,"id":"S123-01","cueId":"S123","sequence":123,"segmentIndex":1,"startFrame":31483,"endFrame":31644,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"特教或不同學程學生的處境。","startSeconds":1054.808,"endSeconds":1057.72,"id":"S123-02","cueId":"S123","sequence":123,"segmentIndex":2,"startFrame":31644,"endFrame":31732,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"把九種模式組成一個共同體，是本集的政策建議和未來情境，","startSeconds":1057.9,"endSeconds":1064.024,"id":"S124-01","cueId":"S124","sequence":124,"segmentIndex":1,"startFrame":31737,"endFrame":31921,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"不是已經在全台完成的改革。","startSeconds":1064.024,"endSeconds":1066.973,"id":"S124-02","cueId":"S124","sequence":124,"segmentIndex":2,"startFrame":31921,"endFrame":32009,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"它也不保證每個地方都應採取相同方案。","startSeconds":1066.973,"endSeconds":1071.056,"id":"S125-01","cueId":"S125","sequence":125,"segmentIndex":1,"startFrame":32009,"endFrame":32132,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"有些地區適合跨校選課，有些需要先穩定教師；","startSeconds":1071.056,"endSeconds":1075.82,"id":"S126-01","cueId":"S126","sequence":126,"segmentIndex":1,"startFrame":32132,"endFrame":32275,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"有些校園可以共享，有些應優先保留教學和安全空間。","startSeconds":1076.0,"endSeconds":1081.296,"id":"S127-01","cueId":"S127","sequence":127,"segmentIndex":1,"startFrame":32280,"endFrame":32439,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"最後，我們用台灣現有案例回頭檢查，哪些方向已經看得到，","startSeconds":1081.296,"endSeconds":1087.254,"id":"S128-01","cueId":"S128","sequence":128,"segmentIndex":1,"startFrame":32439,"endFrame":32618,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"哪些仍要累積證據。","startSeconds":1087.254,"endSeconds":1089.24,"id":"S128-02","cueId":"S128","sequence":128,"segmentIndex":2,"startFrame":32618,"endFrame":32677,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"12｜已有的台灣案例，能告訴我們什麼？","startSeconds":1089.42,"endSeconds":1093.793,"id":"S129-01","cueId":"S129","sequence":129,"segmentIndex":1,"startFrame":32683,"endFrame":32814,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"從目前可回查的資料，至少能看到幾條已經開始的路。","startSeconds":1093.793,"endSeconds":1099.316,"id":"S130-01","cueId":"S130","sequence":130,"segmentIndex":1,"startFrame":32814,"endFrame":32979,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"羅東高商與鄰近高中職合作跨校選修，說明課程可以越過單一校界；","startSeconds":1099.316,"endSeconds":1106.22,"id":"S131-01","cueId":"S131","sequence":131,"segmentIndex":1,"startFrame":32979,"endFrame":33187,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"斗六高中串連雲林與嘉義六所國立學校，形成數位教師社群，","startSeconds":1106.4,"endSeconds":1113.707,"id":"S132-01","cueId":"S132","sequence":132,"segmentIndex":1,"startFrame":33192,"endFrame":33411,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"說明科技可以搭配教師共備；","startSeconds":1113.707,"endSeconds":1117.225,"id":"S132-02","cueId":"S132","sequence":132,"segmentIndex":2,"startFrame":33411,"endFrame":33517,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"大甲高中活化專科教室，說明空間用途能依課程調整；","startSeconds":1117.225,"endSeconds":1123.72,"id":"S133-01","cueId":"S133","sequence":133,"segmentIndex":1,"startFrame":33517,"endFrame":33712,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"產學攜手合作計畫則提供技高與企業共育的正式制度和年度申辦案例。","startSeconds":1123.9,"endSeconds":1131.747,"id":"S134-01","cueId":"S134","sequence":134,"segmentIndex":1,"startFrame":33717,"endFrame":33952,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"這些案例橫跨不同學校類型和年度，不能排成誰最好，","startSeconds":1131.747,"endSeconds":1137.823,"id":"S135-01","cueId":"S135","sequence":135,"segmentIndex":1,"startFrame":33952,"endFrame":34135,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"也不能相加成一個全台轉型成效。","startSeconds":1137.823,"endSeconds":1141.62,"id":"S135-02","cueId":"S135","sequence":135,"segmentIndex":2,"startFrame":34135,"endFrame":34249,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"官方公告證明了方案存在、合作如何安排，或某個空間如何改造；","startSeconds":1141.8,"endSeconds":1148.535,"id":"S136-01","cueId":"S136","sequence":136,"segmentIndex":1,"startFrame":34254,"endFrame":34456,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若沒有獨立、長期、同口徑的評估，","startSeconds":1148.535,"endSeconds":1152.251,"id":"S137-01","cueId":"S137","sequence":137,"segmentIndex":1,"startFrame":34456,"endFrame":34568,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"就不能宣稱它們已普遍提升學習成果或財務永續。","startSeconds":1152.251,"endSeconds":1157.36,"id":"S137-02","cueId":"S137","sequence":137,"segmentIndex":2,"startFrame":34568,"endFrame":34721,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"未來10年的下一步，應該是把「做過」和「有效」分開記錄。","startSeconds":1157.54,"endSeconds":1163.021,"id":"S138-01","cueId":"S138","sequence":138,"segmentIndex":1,"startFrame":34726,"endFrame":34891,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"也要把失敗或中斷的訊號納入檢討：課程是否因教師調動而停止，","startSeconds":1163.021,"endSeconds":1168.698,"id":"S139-01","cueId":"S139","sequence":139,"segmentIndex":1,"startFrame":34891,"endFrame":35061,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"數位設備是否能持續維護，產學合作是否保障學生，","startSeconds":1168.698,"endSeconds":1173.2,"id":"S139-02","cueId":"S139","sequence":139,"segmentIndex":2,"startFrame":35061,"endFrame":35196,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"社區共享是否有足夠管理人力。","startSeconds":1173.2,"endSeconds":1175.94,"id":"S139-03","cueId":"S139","sequence":139,"segmentIndex":3,"startFrame":35196,"endFrame":35278,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"沒有這些追蹤，轉型容易只留下活動照片和計畫名稱。","startSeconds":1176.12,"endSeconds":1182.6,"id":"S140-01","cueId":"S140","sequence":140,"segmentIndex":1,"startFrame":35284,"endFrame":35478,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"案例提供起點，仍需要更完整的資料來回答成效。","startSeconds":1182.6,"endSeconds":1188.54,"id":"S141-01","cueId":"S141","sequence":141,"segmentIndex":1,"startFrame":35478,"endFrame":35656,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"13｜回到開場：沒有單一答案，必須讓學習持續","startSeconds":1188.54,"endSeconds":1194.48,"id":"S142-01","cueId":"S142","sequence":142,"segmentIndex":1,"startFrame":35656,"endFrame":35834,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"未來10年，台灣高中要縮小、合作，還是改變一所學校能提供的服務？","startSeconds":1194.66,"endSeconds":1200.993,"id":"S143-01","cueId":"S143","sequence":143,"segmentIndex":1,"startFrame":35840,"endFrame":36030,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"根據目前查到的資料，沒有一種模式能適用所有學校，","startSeconds":1200.993,"endSeconds":1205.742,"id":"S144-01","cueId":"S144","sequence":144,"segmentIndex":1,"startFrame":36030,"endFrame":36172,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"也沒有足夠證據可以保證某種做法一定成功。","startSeconds":1205.742,"endSeconds":1209.7,"id":"S144-02","cueId":"S144","sequence":144,"segmentIndex":2,"startFrame":36172,"endFrame":36291,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"人口推估提醒我們，學齡人口結構會改變；","startSeconds":1209.88,"endSeconds":1214.357,"id":"S145-01","cueId":"S145","sequence":145,"segmentIndex":1,"startFrame":36296,"endFrame":36431,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"跨校課程、數位社群、空間活化和產學合作則顯示，","startSeconds":1214.357,"endSeconds":1219.777,"id":"S146-01","cueId":"S146","sequence":146,"segmentIndex":1,"startFrame":36431,"endFrame":36593,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"部分地方已在嘗試新的組合。","startSeconds":1219.777,"endSeconds":1222.84,"id":"S146-02","cueId":"S146","sequence":146,"segmentIndex":2,"startFrame":36593,"endFrame":36685,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"真正值得追問的是，學生是否因此多了一門原本修不到的課，","startSeconds":1223.02,"endSeconds":1228.974,"id":"S147-01","cueId":"S147","sequence":147,"segmentIndex":1,"startFrame":36691,"endFrame":36869,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"偏遠地區是否仍能取得穩定師資，教師是否有足夠時間備課，","startSeconds":1228.974,"endSeconds":1234.927,"id":"S147-02","cueId":"S147","sequence":147,"segmentIndex":2,"startFrame":36869,"endFrame":37048,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"合作是否有長期財源，家庭是否承擔得起交通和時間成本。","startSeconds":1234.927,"endSeconds":1240.66,"id":"S147-03","cueId":"S147","sequence":147,"segmentIndex":3,"startFrame":37048,"endFrame":37220,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若答案都沒有被追蹤，再新穎的方案也可能只是短期計畫。","startSeconds":1240.84,"endSeconds":1246.948,"id":"S148-01","cueId":"S148","sequence":148,"segmentIndex":1,"startFrame":37225,"endFrame":37408,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"若資料顯示學生受益、教師能持續投入，且地方條件支持，","startSeconds":1246.948,"endSeconds":1253.056,"id":"S149-01","cueId":"S149","sequence":149,"segmentIndex":1,"startFrame":37408,"endFrame":37592,"timingMethod":"within-cue proportional display split; requires listening review","needsManualAudioReview":true},{"text":"模式才有理由繼續擴大。","startSeconds":1253.056,"endSeconds":1255   }
