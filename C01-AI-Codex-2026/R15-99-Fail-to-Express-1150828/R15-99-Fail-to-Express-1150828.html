<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R15.《99%的人輸在不會表達》｜三版本動態閱讀</title>
  <style>
    :root {
      font-family: system-ui, "Noto Sans TC", sans-serif;
      color: #17120f;
      background: #f7edda
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #f7edda
    }

    .wrap {
      width: min(1220px, 94vw);
      margin: 34px auto 68px
    }

    .hero {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #fffaf0;
      border: 3px solid #2d251f;
      border-radius: 22px;
      box-shadow: 12px 16px 0 #2d251f
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero-copy {
      position: absolute;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      width: min(44%, 620px);
      padding: 30px 34px;
      background: #fffaf0e8;
      border: 2px solid #2d251f;
      border-radius: 16px;
      box-shadow: 7px 8px 0 #2d251f
    }

    .hero-copy h1 {
      margin: 0;
      font-family: DFKai-SB, kaiu, serif;
      font-size: clamp(2.1rem, 5vw, 5.4rem);
      line-height: 1.16;
      font-weight: 900;
      color: #111
    }

    .hero-copy p {
      margin: 18px 0 0;
      font-family: DFKai-SB, kaiu, serif;
      font-size: clamp(1rem, 2vw, 1.7rem);
      line-height: 1.55;
      font-weight: 900;
      color: #b32129
    }

    .intro {
      text-align: center;
      margin: 42px auto 24px;
      font-family: DFKai-SB, kaiu, serif;
      font-size: 1.35rem;
      font-weight: 900
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px
    }

    .card {
      display: block;
      color: #111;
      text-decoration: none;
      background: #fff;
      padding: 14px;
      border: 2px solid #111;
      box-shadow: 8px 8px 0 #111;
      transition: transform .2s
    }

    .card:hover {
      transform: translate(-3px, -3px)
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border: 1px solid #222
    }

    .card strong {
      display: block;
      margin: 15px 4px 0;
      font-family: DFKai-SB, kaiu, serif;
      font-size: 1.4rem
    }

    .card span {
      display: block;
      margin: 7px 4px 2px;
      line-height: 1.55
    }

    @media(max-width:760px) {
      .wrap {
        margin-top: 16px
      }

      .hero {
        aspect-ratio: 4/5
      }

      .hero-copy {
        left: 5%;
        top: auto;
        bottom: 5%;
        transform: none;
        width: 90%;
        padding: 18px 20px
      }

      .hero-copy h1 {
        font-size: 2.2rem
      }

      .hero-copy p {
        font-size: 1.05rem;
        margin-top: 9px
      }

      .cards {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero"><img class="hero-image" src="assets/home-hero-v3.webp" alt="三個版本角色合併封面">
      <div class="hero-copy">
        <h1>99%的人輸在不會表達</h1>
        <p>話說對了，事就成了，公司裡該怎麼說話麻煩就沒了</p>
      </div>
    </section>
    <p class="intro">請選擇要檢查的動態閱讀版本</p>
    <nav class="cards">
      <a class="card" href="v2/index.html"><img src="v2/assets/covers/cover.webp"
          alt="V2 手繪插畫男聲封面"><strong>V2｜手繪插畫男聲</strong>
        <span>B01 主角・YunJhe 男聲</span> </a>
      <a class="card" href="v3/index.html">
        <img src="v3/assets/covers/cover.webp" alt="V3 吉卜力 Q 版女聲封面"><strong>V3｜吉卜力 Q
          版女聲</strong><span>B02 主角・HsiaoYu 女聲</span></a>
      <a class="card" href="v4/index.html">
        <img src="v4/assets/covers/cover-v4.webp" alt="V4 日本動漫男聲封面"><strong>V4｜日本動漫男聲</strong><span>B03 主角・YunJhe
          男聲</span></a>
    </nav>
  </main>
</body>

</html>
