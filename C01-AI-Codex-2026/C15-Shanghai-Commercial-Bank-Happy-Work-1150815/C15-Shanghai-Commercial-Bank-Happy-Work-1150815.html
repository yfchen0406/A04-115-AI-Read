<!doctype html>
<!-- THESIS: 用九幅工作插圖引導讀者翻閱授信中心的日常，讓嚴謹專業與同事情誼同時被看見。 OWN-WORLD: 延續參考網站的閱讀書房結構，但以沉穩墨綠、晨光金與暖白紙頁呈現金融工作現場。 STORY: 讀者從團隊封面走進八段故事，依主題或逐段閱讀，在完整文字與插圖間理解溫暖如何成為專業的一部分。 FIRST VIEWPORT: 左側是標題與閱讀入口，右側以封面插圖占據大面積視覺，向下連接一句團隊信念。 FORM: 可翻閱的工作日常；封面、主題分頁、故事卡片與詳細閱讀窗維持明確的一條閱讀路徑。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>認真工作快樂上班：授信審查的溫暖日常</title>
  <style>
    :root{--ink:#173c3a;--deep:#0d2d2c;--paper:#fffdf7;--mist:#edf0e8;--line:#cbd0c2;--gold:#d2982f;--red:#a84c3d;--muted:#536462;--sans:"Microsoft JhengHei","Noto Sans TC",sans-serif;--pen:"DFKai-SB","BiauKai","KaiTi",cursive}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#dbe4df;color:var(--ink);font-family:var(--pen)}button,input{font:inherit}.book{max-width:1500px;min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 18px 64px #173c3a2b}.top{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{letter-spacing:.08em}.mark{display:inline-grid;place-items:center;width:31px;height:31px;margin-right:9px;border:1px solid var(--ink);border-radius:50%}.random,.topic,.page button{border:1px solid currentColor;background:transparent;padding:8px 12px;cursor:pointer;color:inherit}.random:hover,.random:focus-visible,.topic:hover,.topic.active,.page button:hover,.page button.active{background:var(--ink);color:#fff}.hero{display:grid;grid-template-columns:.94fr 1.06fr;min-height:520px}.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(42px,5.5vw,78px);border-right:1px solid var(--line)}.kicker{margin:0;font-family:var(--sans);font-size:.86rem;letter-spacing:.14em;color:var(--red)}h1{max-width:10ch;margin:.25em 0;font-size:clamp(2.55rem,5vw,4.8rem);line-height:1.1}.intro{max-width:37em;font-family:var(--sans);font-size:1rem;line-height:2;color:#3e5150}.start{align-self:flex-start;margin-top:12px;padding:13px 20px;color:#fff;text-decoration:none;background:var(--red);box-shadow:5px 6px 0 #e7cd9d}.hero-art{display:grid;align-content:center;gap:15px;padding:27px clamp(26px,3vw,40px);background:var(--deep)}.figure{margin:0;overflow:hidden;background:#e7e5dc;aspect-ratio:16/9;border:1px solid #d5c9ae}.figure img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.figure:hover img{transform:scale(1.025)}.art-note{margin:0;color:#f8edcf;text-align:center;font-family:var(--sans);font-size:.86rem;letter-spacing:.08em}.quote-band{padding:31px clamp(22px,8vw,110px);background:var(--ink);color:#fff;text-align:center;font-size:clamp(1.22rem,2.35vw,2rem);line-height:1.65}.quote-band strong{color:#f0c666;font-weight:400}.topic-bar{padding:24px clamp(20px,5vw,72px) 10px;background:var(--mist);border-bottom:1px solid var(--line)}.topics{display:flex;gap:9px;overflow-x:auto;padding-bottom:12px}.topic{flex:0 0 auto;background:var(--paper);border-color:var(--line)}main{padding:40px clamp(20px,5vw,72px) 72px}.tools{display:flex;align-items:end;justify-content:space-between;gap:20px}.tools h2{margin:0;font-size:clamp(1.7rem,3vw,2.4rem)}.tools p,.story p,.detail p{font-family:var(--sans);line-height:1.95;color:#3b4e4c}.search{width:min(340px,48%);padding:11px 13px;border:1px solid var(--line);background:#fff}.page{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0}.page button{min-width:36px;height:36px;padding:0;border-color:var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}.story{padding:19px;background:#fffefa;border:1px solid var(--line);box-shadow:6px 7px 0 #dce4da}.story:nth-child(3n+2){background:#f7f3e8}.story .figure{margin-bottom:16px;cursor:pointer}.part-tag{font-family:var(--sans);font-size:.78rem;color:var(--red)}.story h3{margin:8px 0;font-size:clamp(1.32rem,2.25vw,1.65rem);line-height:1.4}.story p{display:-webkit-box;overflow:hidden;margin:0;-webkit-box-orient:vertical;-webkit-line-clamp:3}.read-hint{margin:12px 0 0;color:var(--ink);font-family:var(--sans);font-size:.84rem}.footer{padding:22px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:.78rem;text-align:center}dialog{width:min(1160px,calc(100% - 20px));max-height:92vh;padding:0;border:0;background:var(--paper);box-shadow:0 24px 90px #0009}dialog::backdrop{background:#102d2cbb}.detail{max-height:92vh;padding:clamp(20px,3.2vw,44px);overflow:auto}.close{float:right;border:0;background:transparent;font-size:1.65rem;cursor:pointer}.detail h2{margin:12px 44px 22px 0;font-size:clamp(1.7rem,3.5vw,2.55rem);line-height:1.35}.detail h3{margin:22px 0 6px;color:var(--red)}.detail .figure{margin-bottom:18px}.detail .full-text{font-size:1.05rem;white-space:normal}.detail .full-text::first-letter{font-size:1.55em;color:var(--red)}.detail-note{padding:16px 18px;background:#f7f0df;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);font-family:var(--pen)!important;font-size:1.15rem!important;color:#503c30!important}@media(max-width:760px){body{background:var(--paper)}.book{box-shadow:none}.top{padding:15px 18px}.brand{font-size:.9rem}.hero{grid-template-columns:1fr}.hero-copy{padding:43px 22px;border-right:0}.hero-art{padding:22px}.topic-bar,main{padding-right:18px;padding-left:18px}.tools{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.story{box-shadow:4px 5px 0 #dce4da}.detail{padding:24px 20px}.detail .full-text{font-size:1rem}}
  </style>
</head>
<body>
  <div class="book">
    <header class="top"><div class="brand"><span class="mark">信</span>授信中心・工作日常</div><button class="random" id="random">今日讀一段</button></header>
    <section class="hero">
      <div class="hero-copy"><p class="kicker">九段故事・九張插圖・一份團隊信念</p><h1>認真工作<br>快樂上班</h1><p class="intro">在講求精準與效率的授信審查工作中，一群夥伴用認真、互助與笑聲，讓每個平凡的工作日都有溫度。</p><a class="start" href="#stories">開始翻閱　↓</a></div>
      <div class="hero-art"><figure class="figure"><img src="webp_images/S09.webp" alt="認真工作快樂上班：授信審查的溫暖日常全文總結插圖"></figure><p class="art-note">認真工作快樂上班：授信審查的溫暖日常</p></div>
    </section>
    <div class="quote-band">真正卓越的團隊，不只是把事情做對，<strong>更是用心把人帶好。</strong></div>
    <section id="stories"><div class="topic-bar"><div class="topics" id="topics" aria-label="故事主題"></div></div><main><div class="tools"><div><h2 id="heading">全部故事</h2><p>點擊插圖，閱讀每一段完整的授信審查工作日常。</p></div><input class="search" id="search" type="search" placeholder="搜尋主題或內容……" aria-label="搜尋故事"></div><nav class="page" id="page" aria-label="故事頁碼"></nav><div class="grid" id="grid"></div></main></section>
    <footer class="footer">認真工作快樂上班：授信審查的溫暖日常｜九段故事閱讀網頁</footer>
  </div>
  <dialog id="dialog"><article class="detail"><button class="close" aria-label="關閉閱讀視窗">×</button><div id="detail"></div></article></dialog>
  <script src="認真工作快樂上班-內容資料.js"></script>
  <script>
    const stories=window.workdayStories||[], $=s=>document.querySelector(s); let topic='全部故事', page=1, query='', size=6;
    const image=n=>`webp_images/S${String(n).padStart(2,'0')}.webp`;
    const match=()=>stories.filter(s=>(topic==='全部故事'||s.part===topic)&&(`${s.title}${s.text}`).includes(query));
    function openStory(story){
      $('#detail').innerHTML=`<figure class="figure"><img src="${image(story.number)}" alt="${story.title} 插圖"></figure><p class="part-tag">${story.part}</p><h2>${story.title}</h2><h3>故事全文</h3><p class="full-text">${story.text}</p><p class="detail-note">認真工作，快樂上班；把每一份專業都做成值得彼此信任的日常。</p>`;
      $('#dialog').showModal();
    }
    function render(){
      const current=match(), total=Math.max(1,Math.ceil(current.length/size)); page=Math.min(page,total); $('#heading').textContent=topic;
      $('#grid').innerHTML=current.slice((page-1)*size,page*size).map(s=>`<article class="story"><p class="part-tag">${s.part}</p><figure class="figure" data-id="${s.number}" tabindex="0" role="button" aria-label="閱讀：${s.title}"><img src="${image(s.number)}" alt="${s.title} 插圖"></figure><h3>${s.title}</h3><p>${s.text}</p><div class="read-hint">點擊圖片閱讀全文　↗</div></article>`).join('')||'<p>找不到相符內容，換一個關鍵字試試。</p>';
      $('#page').innerHTML=Array.from({length:total},(_,i)=>`<button class="${i+1===page?'active':''}" aria-label="第 ${i+1} 頁">${i+1}</button>`).join('');
      $('#page').querySelectorAll('button').forEach((button,index)=>button.onclick=()=>{page=index+1;render();$('#stories').scrollIntoView({block:'start'})});
      document.querySelectorAll('.figure[data-id]').forEach(figure=>{const story=stories.find(s=>s.number===Number(figure.dataset.id));figure.onclick=()=>openStory(story);figure.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory(story)}}});
      document.querySelectorAll('.topic').forEach(button=>button.classList.toggle('active',button.textContent===topic));
    }
    ['全部故事',...new Set(stories.map(s=>s.part))].forEach(name=>{const button=document.createElement('button');button.className='topic';button.textContent=name;button.onclick=()=>{topic=name;page=1;render()};$('#topics').appendChild(button)});
    $('#search').oninput=e=>{query=e.target.value.trim();page=1;render()};
    $('.close').onclick=()=>$('#dialog').close();
    $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});
    $('#random').onclick=()=>openStory(stories[Math.floor(Math.random()*stories.length)]);
    render();
  </script>
</body>
</html>
