<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工件放置圓形籃中每日工作需多少籃子</title><style>
:root{--ink:#243746;--paper:#f6f0e4;--cream:#fffaf0;--line:#d4bd91;--blue:#0d526e;--green:#426c5a;--gold:#b99a68}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.hero{padding:56px max(7vw,24px);background:linear-gradient(125deg,#0d455f 0 62%,#e4c18c 62%);color:#fff}.hero h1{font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif;font-size:clamp(2rem,5vw,4rem);line-height:1.2;margin:0}.hero p{max-width:720px}.wrap{max-width:1220px;margin:auto;padding:0 22px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0}.tab{border:2px solid #765a46;background:var(--cream);color:#3d5544;border-radius:18px 14px 20px 15px;padding:12px 17px;font:800 1rem "DFKai-SB","BiauKai","KaiTi","標楷體",serif;cursor:pointer;box-shadow:2px 3px 0 var(--gold)}.tab[aria-selected=true]{background:var(--green);color:#fff;border-color:#355847;box-shadow:none;transform:translate(2px,3px)}.panel{display:none;margin:24px 0 60px}.panel.active{display:block}.panel h2{font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif;color:var(--blue)}.report-frame{width:100%;height:calc(100vh - 170px);min-height:780px;border:2px solid #c4ab7c;border-radius:20px;background:#fffaf0;box-shadow:4px 5px 0 var(--gold)}.top{position:fixed;right:24px;bottom:24px;z-index:20;border:2px solid #355847;border-radius:18px 14px 20px 15px;background:var(--green);color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:3px 4px 0 var(--gold)}footer{text-align:center;padding:30px;color:#68757a;font-size:.85rem}@media(max-width:600px){.tab{width:100%;text-align:left}.report-frame{height:calc(100vh - 280px);min-height:700px}.top{right:14px;bottom:14px}}
+</style></head><body id="top"><header class="hero"><div class="wrap"><h1>工件放置圓形籃中每日工作需多少籃子</h1><p>只整理圓形籃內容：每日工作需求、計算表、圖形化擺放、獨立報告，以及不分工件種類的混裝滿籃圖解。</p></div></header><main class="wrap"><nav class="tabs" role="tablist" aria-label="圓形籃內容分頁"><button class="tab" role="tab" aria-selected="true" aria-controls="panel-detail" data-panel="panel-detail">04 ・ 圓形籃詳細報告｜計算表與圖形化擺放</button><button class="tab" role="tab" aria-selected="false" aria-controls="panel-report" data-panel="panel-report">05 ・ 圓形籃獨立報告</button><button class="tab" role="tab" aria-selected="false" aria-controls="panel-mixed" data-panel="panel-mixed">番外篇 ・ 圓形籃混裝滿籃</button></nav><section id="panel-detail" class="panel active" role="tabpanel"><h2>04 ・ 圓形籃詳細報告｜計算表與圖形化擺放</h2><iframe class="report-frame" src="圓形籃裝載計算結果.html" title="圓形籃計算表與圖形化擺放"></iframe></section><section id="panel-report" class="panel" role="tabpanel"><h2>05 ・ 圓形籃獨立報告</h2><iframe class="report-frame" src="圓形籃裝載計算結果.html" title="圓形籃獨立報告"></iframe></section><section id="panel-mixed" class="panel" role="tabpanel"><h2>番外篇 ・ 圓形籃混裝滿籃</h2><iframe class="report-frame" src="圓形籃混裝滿籃.html" title="圓形籃混裝滿籃圖解"></iframe></section></main><button class="top" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到頂端</button><footer>工件放置圓形籃中每日工作需多少籃子 ・ 圓形籃專用版</footer><script>const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.panel');tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(item=>item.setAttribute('aria-selected','false'));panels.forEach(panel=>panel.classList.remove('active'));tab.setAttribute('aria-selected','true');document.getElementById(tab.dataset.panel).classList.add('active');window.scrollTo({top:document.querySelector('.tabs').offsetTop-20,behavior:'smooth'});}));</script></body></html>
