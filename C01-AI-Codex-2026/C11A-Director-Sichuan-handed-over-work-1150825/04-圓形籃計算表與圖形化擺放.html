<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04・三份詳細報告｜計算表與圖形化擺放</title><style>
    :root{--ink:#172033;--muted:#64748b;--paper:#f6f1e8;--line:#d9d1c3;--blue:#0f5675;--orange:#df7547;--cream:#fffdf8}body{font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif!important}.hero h1,.hero h1 em{font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",cursive!important;font-style:normal!important;font-weight:900!important;text-shadow:2px 2px 0 #08384f,4px 4px 10px #001a}.hero-character{bottom:70px!important}@media(max-width:860px){.hero-character{bottom:25px!important}}.care-message{max-width:680px;margin:25px 0 0;padding:15px 18px;border-left:3px solid #f5bc64;background:#ffffff18;font-size:1rem;line-height:1.8}.hero{position:relative}.hero-character{position:absolute;right:4vw;bottom:0;width:min(36vw,470px);z-index:2;margin:0;text-align:center}.hero-character img{display:block;width:100%;border-radius:28px 28px 0 0;filter:drop-shadow(0 14px 18px #001a)}.hero-character p{position:absolute;bottom:18px;left:16px;right:16px;margin:0;padding:10px;border-radius:12px;background:#0d455fe8;color:#fff;font-weight:800;font-size:.94rem;line-height:1.5}.hero>*:not(.hero-character){position:relative;z-index:2}@media(max-width:860px){.hero-character{opacity:.34;right:-6vw;width:55vw}.hero h1,.hero .lead,.hero .care-message{max-width:70vw}}@media(max-width:560px){.hero-character{display:none}.hero h1,.hero .lead,.hero .care-message{max-width:100%}}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;line-height:1.65}
    .hero{padding:72px max(7vw,28px);background:linear-gradient(125deg,#0d455f 0 56%,#e4c18c 56%);color:#fff}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;color:var(--orange);margin:0 0 12px}.hero .eyebrow{color:#ffd5bd}
    h1{font-size:clamp(2.2rem,5vw,4.7rem);line-height:1.11;letter-spacing:-.05em;margin:0}h1 em{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:#ffe0b1}.lead{font-size:1.1rem;max-width:680px;margin:24px 0 0}.metrics{display:flex;gap:36px;margin-top:40px}.metrics b{display:block;font-size:2rem}.metrics span{font-size:.85rem;color:#dbeafe}
    nav{display:flex;gap:22px;padding:15px max(7vw,28px);background:#fffdf8;border-bottom:1px solid var(--line);overflow:auto}nav a{white-space:nowrap;color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none}.section{max-width:1180px;margin:auto;padding:68px max(4vw,25px)}h2{font-size:clamp(1.8rem,3.5vw,3rem);line-height:1.2;letter-spacing:-.04em;margin:0 0 28px}
    .need-grid,.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.need-grid article,.result-card{background:var(--cream);border:1px solid var(--line);padding:25px;border-radius:14px}.need-grid b{font:2.6rem Georgia,serif;color:var(--orange)}.need-grid h3{font-size:1.25rem;margin:6px 0}.need-grid p,.section-lead{color:var(--muted);margin:0}.rules{background:#e7eef0;max-width:none;padding-left:max(7vw,28px);padding-right:max(7vw,28px)}.rules li{margin:11px 0}.result-card{min-height:190px}.result-card p{margin:0;color:var(--muted);font-weight:800}.result-card b{display:block;font:4.7rem Georgia,serif;line-height:1;color:var(--blue);margin-top:18px}.result-card span{font-weight:800}.result-card small{display:block;margin-top:12px;color:var(--muted)}.result-card.accent{background:var(--blue);border-color:var(--blue);color:#fff}.result-card.accent p,.result-card.accent b,.result-card.accent small{color:#fff}
    .basket-report{background:var(--cream);border:1px solid var(--line);border-radius:14px;margin:20px 0;overflow:hidden}.report-head{padding:20px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.report-head h3{margin:0;font-size:1.4rem}.report-head p{margin:3px 0 0;color:var(--muted);font-size:.9rem}.report-total{font-weight:800;color:var(--blue);white-space:nowrap}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;min-width:860px;border-collapse:collapse;font-size:.86rem}th{background:#e7eef0;color:#24445a}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #e6ded1}.layout-grid{padding:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.layout-card{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:1fr 155px;gap:12px;align-items:center}.layout-card p{margin:0;color:var(--orange);font-weight:800}.layout-card h4{margin:3px 0;font-size:1.12rem}.layout-card span{font-size:.8rem;color:var(--muted)}
    .shape{margin:auto;width:138px;height:88px;border:3px solid var(--blue);display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;align-content:center;justify-content:center;position:relative}.shape.round{height:122px;width:122px;border-radius:50%;grid-template-columns:repeat(5,1fr);padding:18px}.dot{background:#f5bc64;border-radius:3px;font-size:.52rem;display:grid;place-items:center;color:#53330b}.post{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27px;height:27px;border-radius:50%;background:#344c59;color:#fff;font-size:.6rem;display:grid;place-items:center}.diagram-note{text-align:center;font-size:.7rem;color:var(--muted);margin-top:5px}.conclusion{background:#243f50;color:#fff;max-width:none;padding-left:max(7vw,28px);padding-right:max(7vw,28px)}.conclusion .eyebrow{color:#f5bc64}.conclusion p{max-width:850px;font-size:1.08rem;color:#e7eef0}footer{text-align:center;padding:28px;color:var(--muted);font-size:.82rem}
    @media(max-width:760px){.hero{padding-top:55px}.metrics{gap:20px}.need-grid,.comparison,.layout-grid{grid-template-columns:1fr}.layout-card{grid-template-columns:1fr 142px}.report-head{align-items:flex-start;flex-direction:column}.section{padding-top:52px;padding-bottom:52px}}
    @media print{body{background:#fff}.hero{padding:32px;background:#0d455f}.section{padding:32px 22px}.basket-report{break-inside:avoid}.layout-grid{grid-template-columns:repeat(2,1fr)}nav{display:none}}
    .hero-character p{bottom:16px!important;padding:14px 16px!important;font-size:1.22rem!important;line-height:1.6!important;letter-spacing:.04em!important}.report-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.report-tab{appearance:none;border:2px solid #765a46;background:#fffaf0;color:#3d5544;border-radius:18px 14px 20px 15px;padding:10px 16px;font:800 1rem "DFKai-SB","BiauKai","KaiTi","標楷體",serif;cursor:pointer;box-shadow:2px 3px 0 #b99a68}.report-tab[aria-selected="true"]{background:#426c5a;color:#fff;border-color:#355847;box-shadow:none;transform:translate(2px,3px)}.report-frame{width:100%;min-height:760px;border:2px solid #c4ab7c;border-radius:20px 16px 22px 18px;background:#fffaf0;box-shadow:4px 5px 0 #b99a68}.report-help{margin:0;color:var(--muted)}@media(max-width:760px){.report-frame{min-height:620px}.report-tab{font-size:.94rem}}
    /* 溫暖手繪動畫風 */
    :root{--paper:#f5efdf;--cream:#fffaf0;--line:#cfb98d;--ink:#3d3628;--muted:#6f6756;--blue:#345d5a;--orange:#c96d3c}body{background-color:#f5efdf;background-image:radial-gradient(#d9c69d70 .7px,transparent .7px);background-size:12px 12px}.hero{background:radial-gradient(circle at 83% 19%,#f7d4a3 0 8%,transparent 8.4%),radial-gradient(circle at 85% 24%,#4d7267 0 16%,transparent 16.4%),linear-gradient(125deg,#345d5a 0 56%,#e9c98e 56%)}.hero h1,.hero h1 em{font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif!important;text-shadow:2px 2px 0 #27413e,4px 4px 10px #19302b80}.hero-character img{border:4px solid #f9e4b5;box-shadow:7px 9px 0 #5c4333;filter:drop-shadow(0 10px 12px #3c291955)}.hero-character p{background:#355b52ed;border:2px solid #f5d19a}.need-grid article,.result-card,.basket-report,.layout-card{border:2px solid #c4ab7c;border-radius:20px 16px 22px 18px;box-shadow:4px 5px 0 #b99a68;background:#fffaf0}.rules{background:#e5edd8}.shape{border-color:#57755b}.dot{background:#eab86a;border:1px solid #936a35}.post{background:#765a46}.result-card.accent,.conclusion{background:#426c5a;border-color:#355847}
      .back-to-top{position:fixed;right:24px;bottom:24px;z-index:1000;display:grid;place-items:center;gap:2px;padding:11px 15px;border:2px solid #355847;border-radius:18px 14px 20px 15px;background:#426c5a;color:#fff;font:800 .95rem "Microsoft JhengHei","Noto Sans TC",sans-serif;cursor:pointer;box-shadow:3px 4px 0 #b99a68;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease,visibility .2s}.back-to-top.is-visible{opacity:1;visibility:visible;transform:translateY(0)}.back-to-top:hover{background:#2f5847}.back-to-top:focus-visible{outline:3px solid #f5bc64;outline-offset:3px}@media(max-width:560px){.back-to-top{right:14px;bottom:14px;padding:9px 12px;font-size:.84rem}}</style></head><body><section class="section" id="reports"><p class="eyebrow">04 ・ 三份詳細報告</p><h2>計算表與圖形化擺放</h2><p class="section-lead">下圖為單層擺放示意；可依表內層數向上堆疊。</p><div id="report-root"></div></section><script>
const parts=[['1','243.2 × 90 × 90',50],['2','243.2 × 90 × 90',50],['3','101.8 × 104 × 124.2',200],['4','54.6 × 54.6 × 46.48',200],['5','94 × 91 × 107',100],['6','51.7 × 51.7 × 45',100],['7','66.8 × 64.5 × 80.2',100],['8','35.75 × 35.75 × 34.5',100]];
const report={name:'圓形籃',info:'內側直徑 900 mm・高 300 mm・中央柱直徑 100 mm',total:10,round:true,rows:[['90 × 90 × 243.2','51 件',1,51,1],['90 × 90 × 243.2','51 件',1,51,1],['101.8 × 104 × 124.2','40 件',2,80,3],['54.6 × 54.6 × 46.48','146 件',5,730,1],['94 × 107 × 91','42 件',3,126,1],['45 × 51.7 × 51.7','186 件',5,930,1],['64.5 × 80.2 × 66.8','84 件',4,336,1],['34.5 × 35.75 × 35.75','342 件',7,2394,1]]};
const dots=(count,round)=>Array.from({length:Math.min(count,round?14:24)},(_,i)=>`<i class="dot">${i+1}</i>`).join('');
const diagram=(row)=>`<div><div class="shape round">${dots(parseInt(row[1]),true)}<i class="post">柱</i></div><div class="diagram-note">單層 ${row[1]}・共 ${row[2]} 層</div></div>`;
document.getElementById('report-root').innerHTML=`<article class="basket-report"><div class="report-head"><div><h3>${report.name}</h3><p>${report.info}</p></div><div class="report-total">每日 ${report.total} 籃</div></div><div class="table-wrap"><table><thead><tr><th>工件</th><th>原始尺寸（mm）</th><th>每日需求</th><th>建議方向（mm）</th><th>每層配置</th><th>層數</th><th>單籃容量</th><th>每日籃數</th></tr></thead><tbody>${parts.map((p,i)=>{const r=report.rows[i];return `<tr><td>工件 ${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td><td><b>${r[4]}</b></td></tr>`}).join('')}</tbody></table></div><div class="layout-grid">${parts.map((p,i)=>{const r=report.rows[i];return `<article class="layout-card"><div><p>工件 ${p[0]}</p><h4>單籃 ${r[3]} 件</h4><span>${r[0]} mm</span></div>${diagram(r)}</article>`}).join('')}</div></article>`;
</script></body></html>
