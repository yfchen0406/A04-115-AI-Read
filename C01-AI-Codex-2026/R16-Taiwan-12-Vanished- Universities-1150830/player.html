<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動態閱讀播放器</title><style>body{margin:0;background:#090f1b;color:#f7f9ff;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:20px}main{max-width:1220px;margin:auto}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#152139}.stage img{width:100%;height:100%;object-fit:cover;display:block;animation:ken 8s ease-in-out infinite alternate;transition:opacity .42s}.stage.changing img{opacity:.14}.section-title{position:absolute;top:16px;left:16px;margin:0;color:#fff;font-size:clamp(16px,1.55vw,24px);line-height:1.25;text-shadow:0 2px 5px #000}.subtitle{position:absolute;bottom:0;left:0;right:0;min-height:72px;padding:42px 22px 16px;box-sizing:border-box;text-align:center;font-size:clamp(20px,2.35vw,34px);font-weight:800;line-height:1.35;text-shadow:0 2px 5px #000;background:linear-gradient(transparent,rgba(0,0,0,.84))}.time{display:flex;justify-content:space-between;margin-top:12px;color:#b9c5d8}input{width:100%}.controls,.index{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.index{margin-top:14px;padding:13px;border:1px solid #364b6a;border-radius:14px;background:#111d31}button{border:0;border-radius:22px;background:#243a5c;color:#fff;padding:10px 17px;font-size:15px;cursor:pointer}.primary{background:#1489ee}.error{min-height:1.4em;color:#ffb3b3}@keyframes ken{from{transform:scale(1.02) translate3d(-.55%,.25%,0)}to{transform:scale(1.105) translate3d(.85%,-.75%,0)}}@media(max-width:700px){body{padding:12px}.section-title{top:10px;left:10px;font-size:16px}.subtitle{min-height:56px;padding:30px 14px 10px;font-size:18px}}@media(prefers-reduced-motion:reduce){.stage img{animation:none}}</style></head><body><main><div id="stage" class="stage"><img id="image" alt="分鏡圖片"><h1 id="sectionTitle" class="section-title"></h1><div id="subtitle" class="subtitle"></div></div><div class="time"><span id="now">00:00</span><span id="duration">30:00</span></div><input id="seek" type="range" min="0" max="1800" step=".01" value="0"><div class="controls"><button class="primary" id="play">播放</button><button id="previous">上一段</button><button id="next">下一段</button></div><section id="index" class="index"></section><p id="error" class="error"></p><audio id="audio" preload="metadata"></audio></main><script>const version=new URLSearchParams(location.search).get('version')==='v2'?'V2-storybook':'V1-handdrawn',female=version==='V2-storybook',audio=document.querySelector('#audio'),stage=document.querySelector('#stage'),image=document.querySelector('#image'),subtitle=document.querySelector('#subtitle'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),error=document.querySelector('#error'),sections=[['第一段｜序章：校門關上的那一天',0,450],['第二段｜少子化與校園危機',450,900],['第三段｜十所大學的消失',900,1500],['第四段｜留下的記憶與提醒',1500,1800]];let data,last='',paths=[],n=0;const fmt=t=>String(Math.max(0,t|0)/60|0).padStart(2,'0')+':'+String(Math.max(0,t|0)%60).padStart(2,'0'),at=(xs,t)=>xs.find(x=>t>=+x.start&&t<+x.end);function setImage(p){if(!p||p===last)return;last=p;stage.classList.add('changing');setTimeout(()=>{image.src=version+'/'+p;stage.classList.remove('changing')},160)}function render(){if(!data)return;let t=audio.currentTime||0,c=at(data.events||[],t),v=at(data.visuals||[],t),s=sections.find(x=>t>=x[1]&&t<x[2])||sections[0];subtitle.textContent=c?c.text:'';document.querySelector('#sectionTitle').textContent=s[0];if(v)setImage(v.image);document.querySelector('#now').textContent=fmt(t);document.querySelector('#duration').textContent=fmt(audio.duration||1800);seek.value=t}function nextVoice(){if(n<paths.length){audio.src=paths[n++];audio.load()}else error.textContent='旁白音檔載入失敗。'}function init(d){data=d;paths=[version+'/'+d.audio,'V1-handdrawn/audio_male.mp3','V2-storybook/audio_female.mp3'];audio.onerror=nextVoice;nextVoice();sections.forEach(s=>{let b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{audio.currentTime=s[1];render()};document.querySelector('#index').appendChild(b)});render()}let script=document.createElement('script');script.src=version+'/app-data.js';script.onload=()=>{if(typeof APP_DATA==='undefined'){error.textContent='找不到 APP_DATA。';return}init(APP_DATA)};script.onerror=()=>error.textContent='分鏡資料檔載入失敗。';document.head.appendChild(script);play.onclick=async()=>{error.textContent='';try{if(audio.paused){await audio.play();play.textContent='暫停'}else{audio.pause();play.textContent='播放'}}catch(e){error.textContent='播放失敗：'+e.message}};audio.onplay=()=>play.textContent='暫停';audio.onpause=()=>play.textContent='播放';audio.ontimeupdate=render;audio.onloadedmetadata=()=>{seek.max=audio.duration;render()};seek.oninput=()=>{audio.currentTime=+seek.value;render()};document.querySelector('#previous').onclick=()=>{let i=sections.findIndex(s=>audio.currentTime>=s[1]&&audio.currentTime<s[2]);audio.currentTime=sections[Math.max(0,i-1)][1];render()};document.querySelector('#next').onclick=()=>{let i=sections.findIndex(s=>audio.currentTime>=s[1]&&audio.currentTime<s[2]);audio.currentTime=sections[Math.min(sections.length-1,i+1)][1];render()};</script></body></html>
