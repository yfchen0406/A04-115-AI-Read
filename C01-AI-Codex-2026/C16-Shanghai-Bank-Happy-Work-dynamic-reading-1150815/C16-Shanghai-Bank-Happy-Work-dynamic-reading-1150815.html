<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>認真工作快樂上班｜動態閱讀</title>
<style>
:root{--ink:#1d2630;--muted:#66717c;--paper:#f4efe7;--accent:#b5533b;--gold:#d59b46}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{display:flex;justify-content:center;padding:22px 14px 34px}.app{width:min(1120px,100%)}
.masthead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 2px 14px}.eyebrow{font-size:.78rem;letter-spacing:.18em;color:var(--accent);font-weight:800}.title{margin:4px 0 0;font-size:clamp(1.5rem,3vw,2.35rem);letter-spacing:.04em}.meta{color:var(--muted);font-size:.9rem;white-space:nowrap}
.stage{position:relative;overflow:hidden;aspect-ratio:16/9;background:#25303a;border-radius:18px;box-shadow:0 18px 45px #35414b28}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;transform:scale(1.02)}.layer.active{opacity:1}.layer.motion-push{animation:push 7s ease-in-out both}.layer.motion-pull{animation:pull 7s ease-in-out both}.layer.motion-left{animation:panleft 7s ease-in-out both}.layer.motion-right{animation:panright 7s ease-in-out both}.layer.motion-diagonal{animation:diagonal 7s ease-in-out both}
@keyframes push{from{transform:scale(1.02)}to{transform:scale(1.11)}}@keyframes pull{from{transform:scale(1.11)}to{transform:scale(1.02)}}@keyframes panleft{from{transform:scale(1.08) translateX(2%)}to{transform:scale(1.08) translateX(-2%)}}@keyframes panright{from{transform:scale(1.08) translateX(-2%)}to{transform:scale(1.08) translateX(2%)}}@keyframes diagonal{from{transform:scale(1.05) translate(-1%,-1%)}to{transform:scale(1.1) translate(1%,1%)}}
.scene-label{position:absolute;left:18px;top:16px;padding:7px 12px;border-radius:999px;background:#13202acc;color:#fff;font-size:.85rem;letter-spacing:.05em;backdrop-filter:blur(5px);z-index:3}.caption{position:absolute;z-index:4;left:5%;right:5%;bottom:4.5%;padding:11px 18px;text-align:center;color:#fff;font-weight:800;font-size:clamp(1rem,2.2vw,1.55rem);line-height:1.55;text-shadow:2px 2px 0 #111, -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111;filter:drop-shadow(0 3px 6px #0008);pointer-events:none}
.panel{margin-top:14px;padding:15px 17px 13px;background:#fffaf4;border:1px solid #e6d8c6;border-radius:15px;box-shadow:0 8px 24px #5b493016}.buttons{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;background:#263541;color:#fff;font:inherit;cursor:pointer}button:hover{background:var(--accent)}button.secondary{background:#e8ddd0;color:var(--ink)}.time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}.progress{width:100%;accent-color:var(--accent);cursor:pointer}.hint{margin:10px 0 0;color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:10px}.chapter{margin-top:13px;display:flex;gap:6px;flex-wrap:wrap}.chapter button{padding:7px 10px;font-size:.78rem;background:#eee4d8;color:var(--ink)}.chapter button.current{background:var(--gold);color:#fff}
@media(max-width:620px){body{padding:10px 8px 20px}.masthead{display:block}.meta{margin-top:5px}.stage{border-radius:12px}.caption{left:3%;right:3%;bottom:3%;padding:7px 9px;font-size:.92rem;line-height:1.4}.scene-label{left:9px;top:9px;font-size:.72rem;padding:5px 8px}.panel{padding:11px}.buttons{gap:6px}button{padding:9px 10px;font-size:.88rem}.time{margin-left:0;width:100%}.hint{font-size:.74rem}}
/* Full-viewport reading mode: the artwork fills the window and controls float above it. */
html,body{width:100%;height:100%;overflow:hidden}
body{display:block;padding:0}
.app{width:100vw;height:100dvh;position:relative;overflow:hidden}
.masthead{position:absolute;z-index:6;left:clamp(16px,3vw,44px);right:clamp(16px,3vw,44px);top:clamp(14px,3vh,34px);margin:0;color:#fff;text-shadow:0 2px 10px #000b}
.masthead .eyebrow{color:#ffd58a}.masthead .meta{color:#fff}
.stage{position:absolute;z-index:1;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
.panel{position:absolute;z-index:7;left:clamp(12px,3vw,44px);right:clamp(12px,3vw,44px);bottom:clamp(10px,2.2vh,28px);margin:0;padding:12px 15px 10px;background:#101b25b8;border:1px solid #ffffff45;border-radius:14px;box-shadow:0 10px 30px #0005;backdrop-filter:blur(10px);color:#fff;transition:opacity .35s ease,transform .35s ease}
.panel .time,.panel .status{color:#fff}.status{font-size:.82rem;opacity:.85}
.caption{bottom:clamp(112px,15vh,165px);padding:12px 20px;background:#10182070;border-radius:12px;backdrop-filter:blur(3px)}
.app.is-playing:not(.controls-visible) .panel{opacity:0;transform:translateY(14px);pointer-events:none}
.fullscreen{margin-left:auto;background:#ffffff30;border:1px solid #ffffff38}
@media(max-width:620px){body{padding:0}.masthead{left:10px;right:10px;top:10px}.masthead .title{font-size:1.35rem}.caption{bottom:clamp(100px,16vh,135px);left:4%;right:4%;padding:8px 10px;font-size:.92rem}.panel{left:8px;right:8px;bottom:8px;padding:9px 10px}.buttons{gap:5px}.buttons button{padding:8px 9px}.time{width:auto;margin-left:auto}.fullscreen{margin-left:0}}
</style>
</head>
<body>
<main class="app">
  <header class="masthead"><div><h1 class="title">認真工作快樂上班</h1></div></header>
  <section class="stage" aria-label="動態閱讀畫面">
    <img id="imageA" class="layer active" alt="目前場景插畫">
    <img id="imageB" class="layer" alt="下一個場景插畫">
    <div class="scene-label" id="sceneLabel">場景 01</div><div class="caption" id="caption">準備播放</div>
  </section>
  <section class="panel">
    <div class="buttons"><button id="play">播放</button><button id="prev" class="secondary">上一段</button><button id="next" class="secondary">下一段</button><button id="fullscreen" class="fullscreen" title="切換全螢幕">全螢幕</button><span class="status" id="status">已暫停</span><span class="time" id="time">00:00 / 04:16</span></div>
    <input id="progress" class="progress" type="range" min="0" max="256.416" step="0.01" value="0" aria-label="播放進度">
  </section>
  <audio id="audio" preload="metadata" src="audio/narration-zhTW.mp3"></audio>
</main>
<script>
const timeline = [{"id":1,"start":0.0,"end":3.831522,"heading":"開場","text":"認真工作，也可以快樂上班嗎？","image":"assets/images/scene-001.webp","motion":"push"},{"id":2,"start":3.831522,"end":7.894022,"heading":"開場","text":"在這間授信中心，答案是肯定的。","image":"assets/images/scene-002.webp","motion":"right"},{"id":3,"start":7.894022,"end":12.282608,"heading":"開場","text":"不到八點，空氣裡已有問候與笑聲。","image":"assets/images/scene-003.webp","motion":"pull"},{"id":4,"start":12.282608,"end":16.73913,"heading":"開場","text":"這裡處理的是數字，也是客戶的期待。","image":"assets/images/scene-004.webp","motion":"left"},{"id":5,"start":16.73913,"end":20.991847,"heading":"開場","text":"專業不必冷冰冰，嚴謹也能帶著溫度。","image":"assets/images/scene-005.webp","motion":"diagonal"},{"id":6,"start":20.991847,"end":25.380434,"heading":"開場","text":"今天，就從這對好搭檔的日常開始。","image":"assets/images/scene-006.webp","motion":"push"},{"id":7,"start":25.380434,"end":29.836956,"heading":"文專員","text":"文專員，是團隊裡讓人安心的存在。","image":"assets/images/scene-007.webp","motion":"right"},{"id":8,"start":29.836956,"end":34.266304,"heading":"文專員","text":"她總能用一句早安，拉近彼此距離。","image":"assets/images/scene-008.webp","motion":"pull"},{"id":9,"start":34.266304,"end":38.410325,"heading":"文專員","text":"整理案件時，她輕輕哼著旋律。","image":"assets/images/scene-009.webp","motion":"left"},{"id":10,"start":38.410325,"end":42.595108,"heading":"文專員","text":"但一進入審查，她的目光立刻專注。","image":"assets/images/scene-010.webp","motion":"diagonal"},{"id":11,"start":42.595108,"end":47.296195,"heading":"文專員","text":"每個數字、每份文件，她都反覆確認。","image":"assets/images/scene-011.webp","motion":"push"},{"id":12,"start":47.296195,"end":50.937499,"heading":"文專員","text":"細節再小，她也不願意遺漏。","image":"assets/images/scene-012.webp","motion":"right"},{"id":13,"start":50.937499,"end":54.171195,"heading":"文專員","text":"同事因此叫她笑臉判官。","image":"assets/images/scene-013.webp","motion":"pull"},{"id":14,"start":54.171195,"end":58.355977,"heading":"文專員","text":"標準像法官，待人卻像鄰家姐姐。","image":"assets/images/scene-014.webp","motion":"left"},{"id":15,"start":58.355977,"end":62.71739,"heading":"文專員","text":"她說，每份案件都連著一個人的夢想。","image":"assets/images/scene-015.webp","motion":"diagonal"},{"id":16,"start":62.71739,"end":67.649455,"heading":"文專員","text":"把事情做好，心裡自然會有甜甜的成就感。","image":"assets/images/scene-016.webp","motion":"push"},{"id":17,"start":67.649455,"end":71.739129,"heading":"文專員","text":"認真，是她給團隊最穩定的承諾。","image":"assets/images/scene-017.webp","motion":"right"},{"id":18,"start":71.739129,"end":76.345107,"heading":"花專員","text":"而花專員，則像團隊裡的活力小馬達。","image":"assets/images/scene-018.webp","motion":"pull"},{"id":19,"start":76.345107,"end":80.978259,"heading":"花專員","text":"面對堆積的案件，她總先說：來吧。","image":"assets/images/scene-019.webp","motion":"left"},{"id":20,"start":80.978259,"end":84.076085,"heading":"花專員","text":"今天，要挑戰幾件呢？","image":"assets/images/scene-020.webp","motion":"diagonal"},{"id":21,"start":84.076085,"end":88.437498,"heading":"花專員","text":"她把每份案件，都當成一關新的任務。","image":"assets/images/scene-021.webp","motion":"push"},{"id":22,"start":88.437498,"end":92.785324,"heading":"花專員","text":"完成一件，就收下一份踏實的成就感。","image":"assets/images/scene-022.webp","motion":"right"},{"id":23,"start":92.785324,"end":96.942933,"heading":"花專員","text":"這份樂觀，讓繁瑣流程變得有趣。","image":"assets/images/scene-023.webp","motion":"pull"},{"id":24,"start":96.942933,"end":100.828802,"heading":"花專員","text":"不過，她從不拿品質交換速度。","image":"assets/images/scene-024.webp","motion":"left"},{"id":25,"start":100.828802,"end":105.434781,"heading":"花專員","text":"下班前，她總會再看一次今天的案件。","image":"assets/images/scene-025.webp","motion":"diagonal"},{"id":26,"start":105.434781,"end":109.402172,"heading":"花專員","text":"這是她說的，自己給自己打勾勾。","image":"assets/images/scene-026.webp","motion":"push"},{"id":27,"start":109.402172,"end":113.410324,"heading":"花專員","text":"每個環節到位，她才能安心收工。","image":"assets/images/scene-027.webp","motion":"right"},{"id":28,"start":113.410324,"end":117.58152,"heading":"花專員","text":"效率和仔細，其實可以一起前進。","image":"assets/images/scene-028.webp","motion":"pull"},{"id":29,"start":117.58152,"end":121.779889,"heading":"搭檔合作","text":"一個穩，一個快，正好彼此補位。","image":"assets/images/scene-029.webp","motion":"left"},{"id":30,"start":121.779889,"end":125.733693,"heading":"搭檔合作","text":"文專員守住品質最後的一道防線。","image":"assets/images/scene-030.webp","motion":"diagonal"},{"id":31,"start":125.733693,"end":129.483693,"heading":"搭檔合作","text":"花專員則推進每一道作業節奏。","image":"assets/images/scene-031.webp","motion":"push"},{"id":32,"start":129.483693,"end":133.437498,"heading":"搭檔合作","text":"不同的步伐，卻走成同一個方向。","image":"assets/images/scene-032.webp","motion":"right"},{"id":33,"start":133.437498,"end":137.771737,"heading":"搭檔合作","text":"遇到複雜案件，她們先坐下來一起想。","image":"assets/images/scene-033.webp","motion":"pull"},{"id":34,"start":137.771737,"end":141.50815,"heading":"搭檔合作","text":"你補一個細節，我接一個下一步。","image":"assets/images/scene-034.webp","motion":"left"},{"id":35,"start":141.50815,"end":146.046193,"heading":"搭檔合作","text":"困難沒有消失，卻在對話中慢慢清楚。","image":"assets/images/scene-035.webp","motion":"diagonal"},{"id":36,"start":146.046193,"end":150.271736,"heading":"搭檔合作","text":"這份默契，讓覆核少了等待與重工。","image":"assets/images/scene-036.webp","motion":"push"},{"id":37,"start":150.271736,"end":154.945649,"heading":"搭檔合作","text":"主管看見的，不只是成果，還有信任。","image":"assets/images/scene-037.webp","motion":"right"},{"id":38,"start":154.945649,"end":159.470106,"heading":"搭檔合作","text":"她們卻總說，沒有彼此就做不到這麼好。","image":"assets/images/scene-038.webp","motion":"pull"},{"id":39,"start":159.470106,"end":163.55978,"heading":"搭檔合作","text":"一句謝謝，讓合作變得更有力量。","image":"assets/images/scene-039.webp","motion":"left"},{"id":40,"start":163.55978,"end":168.124997,"heading":"團隊漣漪","text":"她們的正向，不只停在兩張辦公桌之間。","image":"assets/images/scene-040.webp","motion":"diagonal"},{"id":41,"start":168.124997,"end":172.499997,"heading":"團隊漣漪","text":"只要她們在，空氣似乎就輕快一些。","image":"assets/images/scene-041.webp","motion":"push"},{"id":42,"start":172.499997,"end":176.820649,"heading":"團隊漣漪","text":"原本緊繃的審案時刻，也多了從容。","image":"assets/images/scene-042.webp","motion":"right"},{"id":43,"start":176.820649,"end":181.141301,"heading":"團隊漣漪","text":"有人卡住時，她們願意停下來聽一聽。","image":"assets/images/scene-043.webp","motion":"pull"},{"id":44,"start":181.141301,"end":185.557062,"heading":"團隊漣漪","text":"有人需要幫忙時，她們總會主動補位。","image":"assets/images/scene-044.webp","motion":"left"},{"id":45,"start":185.557062,"end":190.040757,"heading":"團隊漣漪","text":"笑聲不是分心，而是重新整理呼吸。","image":"assets/images/scene-045.webp","motion":"diagonal"},{"id":46,"start":190.040757,"end":194.347822,"heading":"團隊漣漪","text":"被支持的人，也更願意支持下一個人。","image":"assets/images/scene-046.webp","motion":"push"},{"id":47,"start":194.347822,"end":198.519018,"heading":"團隊漣漪","text":"於是，工作不再只是沉重的負擔。","image":"assets/images/scene-047.webp","motion":"right"},{"id":48,"start":198.519018,"end":202.785322,"heading":"團隊漣漪","text":"它成了彼此支持、一起解題的過程。","image":"assets/images/scene-048.webp","motion":"pull"},{"id":49,"start":202.785322,"end":207.133148,"heading":"工作信念","text":"授信審查嚴謹，卻不必失去人味。","image":"assets/images/scene-049.webp","motion":"left"},{"id":50,"start":207.133148,"end":211.467387,"heading":"工作信念","text":"真正的專業，是精準，也是體貼。","image":"assets/images/scene-050.webp","motion":"diagonal"},{"id":51,"start":211.467387,"end":215.937496,"heading":"工作信念","text":"是對風險保持敏銳，對人保有真誠。","image":"assets/images/scene-051.webp","motion":"push"},{"id":52,"start":215.937496,"end":220.8288,"heading":"工作信念","text":"當你喜歡自己做的事，熱情自然會被看見。","image":"assets/images/scene-052.webp","motion":"right"},{"id":53,"start":220.8288,"end":225.584235,"heading":"工作信念","text":"當你真心對待夥伴，力量就會回到團隊。","image":"assets/images/scene-053.webp","motion":"pull"},{"id":54,"start":225.584235,"end":230.108691,"heading":"結語","text":"認真工作與快樂上班，從來不是對立。","image":"assets/images/scene-054.webp","motion":"left"},{"id":55,"start":230.108691,"end":234.374996,"heading":"結語","text":"它們可以互相成就，也可以一起長大。","image":"assets/images/scene-055.webp","motion":"diagonal"},{"id":56,"start":234.374996,"end":239.008148,"heading":"結語","text":"一個微笑，一句鼓勵，一次耐心說明。","image":"assets/images/scene-056.webp","motion":"push"},{"id":57,"start":239.008148,"end":242.961952,"heading":"結語","text":"都能讓平凡的一天，多一點光亮。","image":"assets/images/scene-057.webp","motion":"right"},{"id":58,"start":242.961952,"end":247.296191,"heading":"結語","text":"把事情做對，也把身邊的人照顧好。","image":"assets/images/scene-058.webp","motion":"pull"},{"id":59,"start":247.296191,"end":251.983691,"heading":"結語","text":"這就是認真工作、快樂上班最好的樣子。","image":"assets/images/scene-059.webp","motion":"left"},{"id":60,"start":251.983691,"end":256.416,"heading":"結語","text":"帶著這份光，明天也值得再次出發。","image":"assets/images/scene-060.webp","motion":"diagonal"}];
const duration = 256.416;
const audio = document.querySelector('#audio'), progress = document.querySelector('#progress');
const app = document.querySelector('.app'), caption = document.querySelector('#caption'), label = document.querySelector('#sceneLabel'), time = document.querySelector('#time'), status = document.querySelector('#status');
const play = document.querySelector('#play'), prev = document.querySelector('#prev'), next = document.querySelector('#next'), fullscreen = document.querySelector('#fullscreen');
let current=-1, showing=0, lastT=0;
const fmt=s=>{s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
function activeAt(t){for(let i=0;i<timeline.length;i++){if(t>=timeline[i].start && t<timeline[i].end)return i}return timeline.length-1}
function setScene(i,force=false){if(i<0||i>=timeline.length)return;const item=timeline[i];if(!force&&i===current)return;current=i;const incoming=showing?document.querySelector('#imageA'):document.querySelector('#imageB');const outgoing=showing?document.querySelector('#imageB'):document.querySelector('#imageA');incoming.src=item.image;incoming.className='layer active motion-'+item.motion;outgoing.className='layer';showing=showing?0:1;caption.textContent=item.text;label.textContent=item.heading}
function update(){const t=audio.currentTime||0;progress.value=t;time.textContent=fmt(t)+' / '+fmt(duration);setScene(activeAt(t));status.textContent=audio.paused?'已暫停':'播放中'}
let controlsTimer;
function revealControls(){app.classList.add('controls-visible');clearTimeout(controlsTimer);if(!audio.paused)controlsTimer=setTimeout(()=>app.classList.remove('controls-visible'),1800)}
play.addEventListener('click',()=>audio.paused?audio.play():audio.pause());audio.addEventListener('play',()=>{play.textContent='暫停';status.textContent='播放中';app.classList.add('is-playing');app.classList.remove('controls-visible')});audio.addEventListener('pause',()=>{play.textContent='播放';status.textContent='已暫停';app.classList.remove('is-playing');app.classList.add('controls-visible')});audio.addEventListener('ended',()=>{play.textContent='播放';status.textContent='播放完成';app.classList.remove('is-playing');app.classList.add('controls-visible')});audio.addEventListener('timeupdate',update);audio.addEventListener('loadedmetadata',update);audio.addEventListener('seeked',update);window.addEventListener('pointermove',event=>{if(event.clientY>window.innerHeight-220)revealControls()});
progress.addEventListener('input',()=>{audio.currentTime=Number(progress.value);update()});prev.addEventListener('click',()=>{const i=activeAt(audio.currentTime);audio.currentTime=timeline[Math.max(0,i-(audio.currentTime-timeline[i].start>.8?0:1))].start;update()});next.addEventListener('click',()=>{const i=activeAt(audio.currentTime);audio.currentTime=timeline[Math.min(timeline.length-1,i+1)].start;update()});
fullscreen.addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(error){status.textContent='瀏覽器未允許全螢幕'}});document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'退出全螢幕':'全螢幕'});
setScene(0,true);update();
</script>
</body></html>
