<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《隨他們去》三個動態閱讀版本選擇首頁">
  <title>隨他們去｜三版本動態閱讀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing-shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <p class="eyebrow">三版本動態閱讀入口</p>
        <h1 id="pageTitle">隨他們去</h1>
        <p class="hero-lead">同一份劇本、旁白與字幕，搭配三種不同的主角視覺，陪你用自己的節奏閱讀。</p>
        <p class="hero-note">每個版本都保留封面、旁白播放、字幕同步、段落標題、章節導覽與圖片動畫。</p>
      </div>
      <figure class="hero-visual">
        <img class="cover-art" src="assets/cover-4x3.png" alt="《隨他們去》三版本動態閱讀封面：V2、V3 多啦A夢、V4 Totoro">
        <figcaption>V2 原始架構版｜V3 多啦A夢｜V4 Totoro</figcaption>
      </figure>
      <div class="hero-mark" aria-hidden="true">讓我來</div>
    </section>

    <section class="versions" aria-labelledby="versionsTitle">
      <div class="section-heading">
        <p class="eyebrow">CHOOSE YOUR READING VERSION</p>
        <h2 id="versionsTitle">選擇一個版本開始閱讀</h2>
      </div>
      <div class="version-grid" id="versionGrid"></div>
    </section>

    <footer class="site-footer">《隨他們去》動態閱讀｜三個版本共用同一份內容與旁白</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
