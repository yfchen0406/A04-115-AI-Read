<style>
:root{--ink:#142b43;--paper:#fffdf5;--mist:#edf1eb;--line:#cbd1c8;--gold:#c38a24;--red:#a74b3e;--muted:#536474;--sans:"Microsoft JhengHei","Noto Sans TC",sans-serif;--pen:"DFKai-SB","BiauKai","KaiTi",cursive}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#dde5e5;color:var(--ink);font-family:var(--pen)}button,input{font:inherit}.book{max-width:1500px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 18px 60px #142b4328}.top{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{letter-spacing:.08em}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;margin-right:8px}.top button,.chapter,.switch button,.page button,.detail-controls button{border:1px solid currentColor;background:transparent;padding:8px 12px;cursor:pointer;color:inherit}.top button:hover,.chapter.active,.chapter:hover,.switch button.active,.switch button:hover,.page button.active,.page button:hover{background:var(--ink);color:#fff}.hero{display:grid;grid-template-columns:1fr 1.08fr;align-items:stretch}.hero-copy{padding:clamp(26px,2.4vw,36px);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start}.kicker{font-family:var(--sans);color:var(--red);letter-spacing:.14em;font-size:.85rem}.hero h1{font-family:var(--pen);font-weight:700;font-size:clamp(2.35rem,4.2vw,4rem);line-height:1.12;letter-spacing:.01em;margin:.2em 0;max-width:none}.intro{font-family:var(--sans);line-height:1.78;font-size:1rem;max-width:42em;color:#3b4b5d}.hero-art{background:var(--ink);padding:clamp(32px,3.2vw,48px) clamp(26px,3vw,40px) 26px;display:grid;align-content:start;gap:14px}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#e9e2d3;border:1px solid #d5c5a7}.stage img{width:100%;height:100%;object-fit:cover;display:block}.stage button{position:absolute;inset:0;border:0;background:transparent;cursor:zoom-in}.stage.empty img{opacity:0}.switch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.switch button{color:#fff}.switch button.active,.switch button:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}.style-note{font-family:var(--sans);color:#fff;text-align:center;font-size:.82rem}.quote-band{padding:30px clamp(22px,8vw,110px);background:var(--ink);color:#fff;text-align:center;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.65}.quote-band strong{color:#f3c768;font-weight:400}.chapter-bar{background:var(--mist);padding:20px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;overflow:visible}.chapter{min-height:48px;background:var(--paper);border-color:var(--line);line-height:1.35}.tools{display:flex;align-items:end;justify-content:space-between;gap:18px}.tools h2{font-size:clamp(1.75rem,3vw,2.45rem);margin:0}.tools p,.section p,.front p{font-family:var(--sans);line-height:1.9;color:#394958}.search{width:min(360px,48%);padding:11px 13px;border:1px solid var(--line);background:#fff}.page{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.page button{min-width:35px;height:35px;padding:0;border-color:var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.front-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.front-group + .front-group{margin-top:34px}.front-links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}.front-links a{border:1px solid var(--line);padding:8px 14px;background:#fffefa;color:var(--ink);text-decoration:none}.front-links a:hover{background:var(--ink);color:#fff}.section{padding:19px;background:#fffefa;border:1px solid var(--line);box-shadow:6px 7px 0 #dde2da}.section:nth-child(3n+2){background:#f8f3e8}.section h3{font-size:1.35rem;line-height:1.4;margin:8px 0}.section p,.detail p{display:list-item;list-style:disc;margin:10px 0 10px 1.4em}.section .stage{cursor:pointer;margin-bottom:16px}.front{margin:0 0 38px}.front h2{font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 18px}.front p{white-space:pre-wrap}.footer{padding:22px;text-align:center;border-top:1px solid var(--line);font-family:var(--sans);font-size:.78rem;color:var(--muted)}.back-top{display:inline-block;margin-left:18px;color:var(--red);font-weight:700;text-decoration:none}.back-top:hover{text-decoration:underline}.back-top-float{position:fixed;right:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,30px);z-index:20;display:grid;place-items:center;width:48px;height:48px;border:1px solid #fff;background:var(--ink);color:#fff;text-decoration:none;font-family:var(--sans);font-size:1.35rem;box-shadow:0 5px 16px #142b4366;transition:transform .2s,background .2s}.back-top-float:hover{background:var(--gold);color:var(--ink);transform:translateY(-3px)}dialog{width:min(1180px,calc(100% - 20px));max-height:92vh;border:0;padding:0;background:var(--paper);box-shadow:0 24px 90px #0008}dialog::backdrop{background:#142b43b8}.detail{max-height:92vh;overflow:auto;padding:clamp(20px,3.2vw,42px)}.close{float:right;border:0;background:transparent;font-size:1.6rem;cursor:pointer}.detail h2{font-size:clamp(1.7rem,3.5vw,2.5rem);margin:12px 40px 22px 0}.detail h3{color:var(--red);margin:22px 0 6px}.detail p{font-family:var(--sans);line-height:1.95;color:#394958;white-space:pre-wrap}.gallery{display:grid;grid-template-columns:1fr;gap:10px}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs img{width:88px;height:58px;object-fit:cover;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:var(--gold)}.detail-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}@media(max-width:760px){body{background:var(--paper)}.book{box-shadow:none}.top{padding:15px 18px}.hero{grid-template-columns:1fr}.hero-copy{border-right:0;padding:34px 22px 28px}.hero-art{padding:24px 22px 28px}.chapter-bar,main{padding-left:18px;padding-right:18px}.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter{min-height:58px;padding:7px 8px}.tools{align-items:stretch;flex-direction:column}.search{width:100%}.grid,.front-grid{grid-template-columns:1fr}.section{box-shadow:4px 5px 0 #dde2da}.detail{padding:24px 20px}}

<body><a class="back-top-float" href="#top" aria-label="回到頂端">↑</a><div class="book"><header class="top" id="top"><div class="brand"><span class="mark">開</span>開車心理學・閱讀筆記</div><button id="random">隨機閱讀</button></header><section class="hero"><div class="hero-copy" id="heroCopy"></div><div class="hero-art"><div class="stage" id="heroStage"></div><div class="switch" id="styleSwitch"></div><div class="style-note">圖片分類可切換；點擊章節圖片可開啟完整閱讀窗</div></div></section><div class="quote-band">道路不只是移動的空間，<strong>也是觀察人性、注意力與社會的窗口。</strong></div><section id="reading"><div class="chapter-bar"><div class="chapters" id="chapters"></div></div><main><div id="front" class="front"></div><div class="tools"><div><h2 id="heading">全部內容</h2><p>保留 A259-開車心理學.docx 原段落，依章節與小節閱讀。</p></div><input class="search" id="search" type="search" placeholder="搜尋原文段落……"></div><div class="grid" id="grid"></div></main></section><footer class="footer">《開車心理學》：道路上的行為真相｜A259-開車心理學 <a class="back-top" href="#top">回到頂端 ↑</a></footer></div><dialog id="dialog"><article class="detail"><button class="close" aria-label="關閉">×</button><div id="detail"></div></article></dialog><script src="開車心理學-內容資料.js"></script><script>
const data=window.drivingPsychologyData;let selectedStyle=Math.max(0,data.images.findIndex(s=>s.scenes['1']&&s.scenes['9'])),selectedChapter='全部內容',query='',page=1;const size=9999,$=s=>document.querySelector(s);const roman=['','一','二','三','四','五','六','七','八','九'];function currentStyle(){return data.images[selectedStyle]}function imageFiles(key){return (currentStyle().scenes[key]||[]).map(f=>'images/'+encodeURIComponent(currentStyle().id)+'/'+f)}function setStage(stage,key,open){const files=imageFiles(key);stage.className='stage'+(files.length?'':' empty');stage.innerHTML=files.length?'<img src="images/A01-yfchen-Q/N141-F-0A-0.webp" alt=""><button aria-label="開啟圖片閱讀窗"></button>':'<div class="style-note">此圖片分類沒有對應檔案</div>';if(files.length){const img=stage.querySelector('img');img.src=encodeURI(files[0]);img.alt=currentStyle().label+'圖片';if(open)stage.querySelector('button').onclick=()=>openGallery(key,files)}}function renderSwitch(){let box=$('#styleSwitch');box.innerHTML='';data.images.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.label;b.className=i===selectedStyle?'active':'';b.onclick=()=>{selectedStyle=i;render()};box.appendChild(b)})}function renderHero(){let p=data.paragraphs;let copy=$('#heroCopy');copy.innerHTML='';let kicker=document.createElement('p');kicker.className='kicker';kicker.textContent='A259・原文閱讀・10 種圖片分類';copy.appendChild(kicker);let h=document.createElement('h1');h.textContent=p[0]||'';copy.appendChild(h);let intro=document.createElement('div');intro.className='intro';p.slice(1,4).forEach(t=>{let x=document.createElement('p');x.textContent=t;intro.appendChild(x)});copy.appendChild(intro);let stage=$('#heroStage');setStage(stage,'0A',false)}function renderFront(){let p=data.paragraphs;let first=data.chapters.length?data.paragraphs.indexOf(data.chapters[0].heading):p.length;let authorIndex=p.findIndex(t=>t.startsWith('作者~'));let box=$('#front');box.innerHTML='';let h=document.createElement('h2');h.textContent='前言和作者';box.appendChild(h);p.slice(1,first).forEach(t=>{let x=document.createElement('p');x.textContent=t;box.appendChild(x)})}function matches(section,chapter){let hay=[chapter.heading,section.heading,...section.paragraphs].join('');return !query||hay.includes(query)}function allSections(){return data.chapters.flatMap(ch=>ch.sections.map(s=>({chapter:ch,section:s})))}function filtered(){return allSections().filter(x=>(selectedChapter==='全部內容'||x.chapter.key===selectedChapter)&&matches(x.section,x.chapter))}function makeCard(item){let article=document.createElement('article');article.className='section';let tag=document.createElement('div');tag.className='kicker';tag.textContent=item.chapter.heading;article.appendChild(tag);let stage=document.createElement('div');setStage(stage,item.chapter.key,true);article.appendChild(stage);let h=document.createElement('h3');h.textContent=item.section.heading;article.appendChild(h);item.section.paragraphs.forEach(t=>{let p=document.createElement('p');p.textContent=t;article.appendChild(p)});return article}function render(){renderSwitch();renderHero();renderFront();let items=filtered(),pages=Math.max(1,Math.ceil(items.length/size));page=Math.min(page,pages);$('#heading').textContent=selectedChapter==='全部內容'?'全部內容':data.chapters.find(c=>c.key===selectedChapter).heading;let grid=$('#grid');grid.innerHTML='';items.slice((page-1)*size,page*size).forEach(x=>grid.appendChild(makeCard(x)));let nav=$('#page');if(!nav)return;nav.innerHTML='';for(let i=1;i<=pages;i++){let b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.onclick=()=>{page=i;render();$('#reading').scrollIntoView()};nav.appendChild(b)}}function openGallery(key,files){let box=$('#detail');box.innerHTML='';let gallery=document.createElement('div');gallery.className='gallery';let main=document.createElement('div');main.className='stage';let mainImg=document.createElement('img');main.appendChild(mainImg);gallery.appendChild(main);let thumbs=document.createElement('div');thumbs.className='thumbs';files.forEach((f,i)=>{let img=document.createElement('img');img.src=encodeURI(f);img.alt='圖片 '+(i+1);img.className=i===0?'active':'';img.onclick=()=>{mainImg.src=encodeURI(f);thumbs.querySelectorAll('img').forEach(x=>x.classList.remove('active'));img.classList.add('active')};thumbs.appendChild(img)});gallery.appendChild(thumbs);box.appendChild(gallery);mainImg.src=encodeURI(files[0]);let title=document.createElement('h2');title.textContent='圖片閱讀窗';box.appendChild(title);data.chapters.find(c=>c.key===key)?.sections.forEach(s=>{let h=document.createElement('h3');h.textContent=s.heading;box.appendChild(h);s.paragraphs.forEach(t=>{let p=document.createElement('p');p.textContent=t;box.appendChild(p)})});$('#dialog').showModal()}data.chapters.forEach(ch=>{let b=document.createElement('button');b.className='chapter';b.textContent=ch.heading;b.onclick=()=>{selectedChapter=ch.key;page=1;render();$('#reading').scrollIntoView()};$('#chapters').appendChild(b)});let all=document.createElement('button');all.className='chapter active';all.textContent='前言和作者';all.onclick=()=>{selectedChapter='全部內容';page=1;render()};$('#chapters').prepend(all);$('#search').oninput=e=>{query=e.target.value.trim();page=1;render()};$('.close').onclick=()=>$('#dialog').close();$('#random').onclick=()=>{let items=allSections();let x=items[Math.floor(Math.random()*items.length)];openGallery(x.chapter.key,imageFiles(x.chapter.key))};render();
</script><script>
function renderFrontCards(){const box=document.querySelector('#front');if(!box||!data.frontBlocks)return;box.innerHTML='';const title=document.createElement('h2');title.textContent='前言和作者';box.appendChild(title);const grid=document.createElement('div');grid.className='front-grid';data.frontBlocks.forEach(block=>{const article=document.createElement('article');article.className='section';const stage=document.createElement('div');setStage(stage,block.key,true);article.appendChild(stage);const heading=document.createElement('h3');heading.textContent=block.heading;article.appendChild(heading);block.sections.forEach(section=>{const sub=document.createElement('h3');sub.textContent=section.heading;article.appendChild(sub);section.paragraphs.forEach(text=>{const p=document.createElement('p');p.textContent=text;article.appendChild(p)})});grid.appendChild(article)});box.appendChild(grid)}function bindChapterLinks(){document.querySelectorAll('#chapters .chapter').forEach((button,index)=>{button.onclick=()=>{selectedChapter=index===0?'全部內容':data.chapters[index-1].key;page=1;render();setTimeout(()=>document.querySelector('#heading').scrollIntoView({block:'start'}),180)}})}renderFrontCards();bindChapterLinks();new MutationObserver(()=>{renderFrontCards();bindChapterLinks()}).observe(document.querySelector('#styleSwitch'),{childList:true});
</script><script>
function renderFrontGroups(){const box=document.querySelector("#front");if(!box||!data.frontBlocks)return;box.innerHTML="";const title=document.createElement("h2");title.textContent="前言與作者";box.appendChild(title);const links=document.createElement("nav");links.className="front-links";data.frontBlocks.forEach((block,index)=>{const link=document.createElement("a");link.href="#front-group-"+index;link.textContent=index===0?"前言":"作者";links.appendChild(link)});box.appendChild(links);data.frontBlocks.forEach((block,index)=>{const group=document.createElement("section");group.className="front-group";group.id="front-group-"+index;const heading=document.createElement("h3");heading.textContent=block.heading;group.appendChild(heading);const grid=document.createElement("div");grid.className="front-grid";block.sections.forEach((section,sectionIndex)=>{const article=document.createElement("article");article.className="section";const stage=document.createElement("div");setStage(stage,["0A","0B","0C"][sectionIndex],true);article.appendChild(stage);const sub=document.createElement("h3");sub.textContent=section.heading;article.appendChild(sub);section.paragraphs.forEach(text=>{const p=document.createElement("p");p.textContent=text;article.appendChild(p)});grid.appendChild(article)});group.appendChild(grid);box.appendChild(group)})}
function enhanceChapterImages(){document.querySelectorAll("#grid .section").forEach(card=>{const chapter=data.chapters.find(item=>item.heading===card.querySelector(".kicker")?.textContent);const heading=card.querySelector("h3")?.textContent;if(!chapter||!heading)return;const index=chapter.sections.findIndex(item=>item.heading===heading);const files=imageFiles(chapter.key);const image=card.querySelector("img");if(image&&files[index])image.src=encodeURI(files[index])})}
renderFrontGroups();enhanceChapterImages();new MutationObserver(renderFrontGroups).observe(document.querySelector("#styleSwitch"),{childList:true});new MutationObserver(enhanceChapterImages).observe(document.querySelector("#grid"),{childList:true});
</script></body></html>
