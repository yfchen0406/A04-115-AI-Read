<!doctype html>
<!-- THESIS: 把金錢選擇轉成可翻閱、可實作的退休生活閱讀筆記，拒絕只展示章節的靜態長文。 OWN-WORLD: 沿用參考網站的書房紙頁、墨藍、金色與手寫感，加入金錢地圖的溫和路徑。 STORY: 讀者從封面心得進入五大類，搜尋或翻閱一章，再帶走一項生活準則。 FIRST VIEWPORT: 左側為書名、閱讀心得與開始按鈕，右側是可切換的封面插圖預留區。 FORM: 閱讀書房，參考網站既有的章節列、搜尋、卡片與閱讀窗形式。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花錢的藝術｜21章閱讀筆記</title><style>
:root{--ink:#142b43;--paper:#fffdf5;--mist:#edf1eb;--line:#cbd1c8;--gold:#c38a24;--red:#a74b3e;--muted:#536474;--sans:"Microsoft JhengHei","Noto Sans TC",sans-serif;--pen:"DFKai-SB","BiauKai","KaiTi",cursive}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#dde5e5;color:var(--ink);font-family:var(--pen)}button,input{font:inherit}.book{max-width:1500px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 18px 60px #142b4328}.top{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{letter-spacing:.08em}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;margin-right:8px}.random,.page button,.chapter,.switch button,.detail-controls button{border:1px solid currentColor;background:transparent;padding:8px 12px;cursor:pointer;color:inherit}.random:hover,.random:focus-visible,.chapter.active,.chapter:hover,.page button.active,.page button:hover,.switch button.active,.switch button:hover{background:var(--ink);color:#fff}.hero{display:grid;grid-template-columns:1fr 1.08fr;min-height:510px}.hero-copy{padding:clamp(42px,5.5vw,76px);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.kicker{font-family:var(--sans);color:var(--red);letter-spacing:.14em;font-size:.85rem}.hero h1{font-size:clamp(2.7rem,5vw,4.6rem);line-height:1.08;margin:.2em 0;max-width:10ch}.intro{font-family:var(--sans);line-height:2;font-size:1rem;max-width:38em;color:#3b4b5d}.start{align-self:flex-start;background:var(--red);color:#fff;text-decoration:none;padding:13px 20px;box-shadow:5px 6px 0 #e4c891}.hero-art{background:var(--ink);padding:25px clamp(26px,3vw,40px);display:grid;align-content:center;gap:14px}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#e9e2d3;border:1px solid #d5c5a7}.stage img{width:100%;height:100%;object-fit:cover;display:block}.slot{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--sans);font-size:.85rem;line-height:1.7;color:#607080;background:linear-gradient(145deg,#fffaf0,#e6eded)}.slot span{display:block;color:var(--red);font-weight:700}.stage.ready .slot{display:none}.switch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.switch button{color:#fff}.switch button.active,.switch button:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}.autoplay{font-family:var(--sans);color:#fff;font-size:.8rem;text-align:center}.quote-band{padding:30px clamp(22px,8vw,110px);background:var(--ink);color:#fff;text-align:center;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.65}.quote-band strong{color:#f3c768;font-weight:400}.chapter-bar{background:var(--mist);padding:24px clamp(20px,5vw,72px) 10px;border-bottom:1px solid var(--line)}.chapters{display:flex;gap:9px;overflow-x:auto;padding-bottom:12px}.chapter{flex:0 0 auto;background:var(--paper);border-color:var(--line)}main{padding:38px clamp(20px,5vw,72px) 70px}.tools{display:flex;align-items:end;justify-content:space-between;gap:18px}.tools h2{font-size:clamp(1.75rem,3vw,2.45rem);margin:0}.tools p,.law p,.detail p{font-family:var(--sans);line-height:1.85;color:#394958}.search{width:min(330px,48%);padding:11px 13px;border:1px solid var(--line);background:#fff}.page{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.page button{min-width:35px;height:35px;padding:0;border-color:var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.law{padding:19px;background:#fffefa;border:1px solid var(--line);box-shadow:6px 7px 0 #dde2da}.law:nth-child(3n+2){background:#f8f3e8}.law .stage{cursor:pointer;margin-bottom:16px}.part-tag{font-family:var(--sans);font-size:.76rem;color:var(--red)}.law h3{font-size:1.35rem;line-height:1.4;margin:8px 0}.footer{padding:22px;text-align:center;border-top:1px solid var(--line);font-family:var(--sans);font-size:.78rem;color:var(--muted)}dialog{width:min(1180px,calc(100% - 20px));max-height:92vh;border:0;padding:0;background:var(--paper);box-shadow:0 24px 90px #0008}dialog::backdrop{background:#142b43b8}.detail{max-height:92vh;overflow:auto;padding:clamp(20px,3.2vw,42px)}.close{float:right;border:0;background:transparent;font-size:1.6rem;cursor:pointer}.detail h2{font-size:clamp(1.7rem,3.5vw,2.5rem);margin:12px 40px 22px 0}.detail h3{color:var(--red);margin:22px 0 6px}.gold-quote{font-family:var(--pen)!important;font-size:1.18rem!important;color:#513637!important;padding-top:20px}.retirement{margin-top:18px;padding:16px 18px;background:#f7f0df;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}.retirement p{margin:0}.detail-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}@media(max-width:760px){body{background:var(--paper)}.book{box-shadow:none}.top{padding:15px 18px}.hero{grid-template-columns:1fr}.hero-copy{border-right:0;padding:44px 22px}.hero-art{padding:22px}.chapter-bar,main{padding-left:18px;padding-right:18px}.tools{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.law{box-shadow:4px 5px 0 #dde2da}.detail{padding:24px 20px}}
</style></head><body><div class="book"><header class="top"><div class="brand"><span class="mark">花</span>花錢的藝術・閱讀筆記</div><button class="random" id="random">今日選一章</button></header><section class="hero"><div class="hero-copy"><p class="kicker">五大類・21 章・退休生活準則</p><h1>把錢花在更接近自己的人生上</h1><p class="intro">這本書確實可列入我 2026 年個人閱讀喜愛度前三名。它和人生後半場的退休規畫高度契合，不只帶來觀念上的深刻啟發，也為接下來的生活提供實際而重要的指引。</p><a class="start" href="#chapters">開始翻閱　↓</a></div><div class="hero-art"><div class="stage" data-number="0"><img src="images/placeholder.svg" alt="花錢的藝術封面插圖"><div class="slot"><div><span>封面插圖預留位置</span><b data-path></b></div></div></div><div class="switch" data-switch></div><label class="autoplay"><input type="checkbox" id="auto"> 自動輪播三套插圖</label></div></section><div class="quote-band">錢不只是用來買東西，<strong>也能買回時間、選擇與安心。</strong></div><section id="chapters"><div class="chapter-bar"><div class="chapters" id="parts" aria-label="五大類"></div></div><main><div class="tools"><div><h2 id="heading">全部章節</h2><p>點擊插圖，閱讀作者看法、生活應用、退休生活準則與金句。</p></div><input class="search" id="search" type="search" placeholder="搜尋章節或關鍵字……"></div><nav class="page" id="page"></nav><div class="grid" id="grid"></div></main></section><footer class="footer">《花錢的藝術》21 章閱讀筆記｜插圖完成前會顯示存放位置</footer></div><dialog id="dialog"><article class="detail"><button class="close" aria-label="關閉">×</button><div id="detail"></div></article></dialog><script src="花錢的藝術-內容資料.js"></script><script>
const styles=[['q-style','Q版資訊圖表','A'],['doraemon','多啦A夢動漫風','B'],['totoro','吉卜力動畫電影感','C']];let style='q-style',part='全部章節',page=1,q='',timer;const laws=window.artOfSpendingLaws||[],size=6,$=s=>document.querySelector(s),path=n=>{let s=styles.find(x=>x[0]===style);return `images/${style}/${s[2]}${String(n).padStart(2,'0')}.webp`};function hydrate(stage){let n=stage.dataset.number,img=stage.querySelector('img'),label=stage.querySelector('[data-path]'),p=path(n);stage.classList.remove('ready');label.textContent=p;img.onload=()=>stage.classList.add('ready');img.onerror=()=>stage.classList.remove('ready');img.src=p}function switches(){document.querySelectorAll('[data-switch]').forEach(box=>{box.innerHTML=styles.map(s=>`<button class="${s[0]===style?'active':''}" data-s="${s[0]}">${s[1]}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{style=b.dataset.s;render();document.querySelectorAll('.stage').forEach(hydrate)})})}function data(){return laws.filter(l=>(part==='全部章節'||l.part===part)&&(`${l.title}${l.description}${l.application}${l.retirement}`).includes(q))}function render(){let d=data(),count=Math.max(1,Math.ceil(d.length/size));page=Math.min(page,count);$('#heading').textContent=part;$('#grid').innerHTML=d.slice((page-1)*size,page*size).map(l=>`<article class="law"><div class="part-tag">${l.part}</div><div class="stage" data-number="${l.number}" tabindex="0" role="button"><img src="images/placeholder.svg" alt="第 ${l.number} 章插圖"><div class="slot"><div><span>插圖預留位置</span><b data-path></b></div></div></div><p>${l.description}</p></article>`).join('')||'<p>找不到相符章節，換一個關鍵字試試。</p>';$('#page').innerHTML=Array.from({length:count},(_,i)=>`<button class="${i+1===page?'active':''}">${i+1}</button>`).join('');$('#page').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{page=i+1;render();$('#chapters').scrollIntoView()});document.querySelectorAll('.stage').forEach(s=>{hydrate(s);s.onclick=()=>open(laws.find(l=>l.number==s.dataset.number));s.onkeydown=e=>{if(e.key==='Enter')open(laws.find(l=>l.number==s.dataset.number))}});document.querySelectorAll('.chapter').forEach(b=>b.classList.toggle('active',b.textContent===part));switches()}function open(l){$('#detail').innerHTML=`<div class="stage" data-number="${l.number}"><img src="images/placeholder.svg" alt="第 ${l.number} 章插圖"><div class="slot"><div><span>插圖預留位置</span><b data-path></b></div></div></div><div class="detail-controls" data-switch></div><h3>作者核心看法</h3><p>${l.description}</p><h3>工作與生活應用</h3><p>${l.application}</p><div class="retirement"><h3>退休生活準則</h3><p>${l.retirement}</p></div><p class="gold-quote">${l.quote}</p>`;hydrate($('#detail .stage'));switches();$('#dialog').showModal()}['全部章節',...new Set(laws.map(l=>l.part))].forEach(x=>{let b=document.createElement('button');b.className='chapter';b.textContent=x;b.onclick=()=>{part=x;page=1;render()};$('#parts').appendChild(b)});$('#search').oninput=e=>{q=e.target.value.trim();page=1;render()};$('.close').onclick=()=>$('#dialog').close();$('#random').onclick=()=>open(laws[Math.floor(Math.random()*laws.length)]);$('#auto').onchange=e=>{clearInterval(timer);if(e.target.checked)timer=setInterval(()=>{style=styles[(styles.findIndex(s=>s[0]===style)+1)%3][0];render()},4200)};render();
</script></body></html>
