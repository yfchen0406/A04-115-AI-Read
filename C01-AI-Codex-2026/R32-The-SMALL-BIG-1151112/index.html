<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以手帳式閱讀介面瀏覽《The SMALL BIG》的 52 個影響力原則，提供分類、搜尋、分頁與逐則細讀。">
  <title>The SMALL BIG｜52 個原則手帳</title>
  <style>
    :root{--ink:#192a42;--blue:#1e90ff;--blue-deep:#075eae;--blue-pale:#e8f3ff;--paper:#fffdf7;--paper-shadow:#f4eddd;--line:#d6c9ac;--muted:#625b50;--red:#a94348;--gold:#e6bf68;--body:"Microsoft JhengHei","Segoe UI",sans-serif;--pen:"DFKai-SB","BiauKai","KaiTi",serif;--space:clamp(16px,3vw,40px)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}html,body{overflow-x:clip}body{margin:0;color:var(--ink);background:#e4edf7;font-family:var(--body);font-size:17px;line-height:1.8}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue-deep);outline-offset:3px}
    .page{max-width:1500px;min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 20px 65px #26364a22}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px var(--space);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:1.08rem;font-weight:650}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--blue-deep);color:var(--blue-deep);font-family:var(--pen);font-size:1.2rem}.quiet-button{border:1px solid var(--blue-deep);background:transparent;padding:9px 15px;cursor:pointer;color:var(--blue-deep)}.quiet-button:hover{background:var(--blue-deep);color:white}
    .hero{display:grid;grid-template-columns:1fr 1.08fr;min-height:540px}.hero-copy{padding:clamp(42px,7vw,92px) clamp(24px,6vw,84px);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.hero h1{max-width:12ch;margin:0;color:var(--blue-deep);font-family:var(--pen);font-size:clamp(2.6rem,5.5vw,4.6rem);font-weight:700;line-height:1.22;letter-spacing:.02em;overflow-wrap:break-word;text-wrap:balance}.intro{max-width:38em;margin:24px 0 30px;color:#38475a;font-size:1.08rem;line-height:1.95}.start{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:12px 19px;border:1px solid var(--blue-deep);background:var(--blue-deep);color:white;text-decoration:none}.start:hover{background:var(--ink)}.hero-art{position:relative;width:100%;aspect-ratio:16/9;min-height:0;align-self:center;display:grid;place-items:center;padding:28px;background:var(--blue-pale);overflow:hidden}.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art-placeholder{width:100%;height:100%;min-height:350px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;border:1px dashed #83acd4;color:var(--blue-deep);text-align:center;background:linear-gradient(135deg,#f4f9ff,#e5f1ff)}.art-placeholder strong{font-family:var(--pen);font-size:1.8rem}.art-placeholder span{font-size:.95rem}.has-art .art-placeholder{display:none}
    .quote-band{padding:27px clamp(24px,8vw,110px);background:var(--ink);color:var(--paper);text-align:center;font-family:var(--pen);font-size:clamp(1.35rem,2.5vw,2rem);line-height:1.6}.quote-band span{color:#9dccff}
    .chapter-top{padding:24px var(--space) 12px;background:#f7f4ec;border-bottom:1px solid var(--line)}.chapter-list{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px;scrollbar-color:#8daac5 transparent}.chapter{flex:0 0 auto;min-height:48px;padding:9px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;line-height:1.35}.chapter:hover,.chapter.active{border-color:var(--blue-deep);background:var(--blue-deep);color:white}.chapter .num{margin-left:8px;color:inherit;font-size:.88rem;font-variant-numeric:tabular-nums}
    main{padding:30px var(--space) 64px}.tools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.tools h2{margin:0;color:var(--ink);font-family:var(--pen);font-size:clamp(1.7rem,3vw,2.3rem);font-weight:700}.search-wrap{display:flex;width:min(420px,55%)}.search{width:100%;min-width:0;min-height:50px;padding:10px 14px;border:1px solid var(--line);background:#fffefa;color:var(--ink)}.clear-search{min-height:50px;padding:8px 13px;border:1px solid var(--line);border-left:0;background:#fffefa;color:var(--blue-deep);cursor:pointer}.clear-search[hidden]{display:none}.pagination{display:flex;gap:7px;margin:0 0 20px;flex-wrap:wrap}.pagination button{min-width:42px;height:42px;padding:0 8px;border:1px solid var(--line);background:transparent;cursor:pointer}.pagination button.active,.pagination button:hover{border-color:var(--blue-deep);background:var(--blue-deep);color:#fff}.status{margin:0 0 16px;color:var(--muted);font-size:.98rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.law{min-width:0;display:flex;flex-direction:column;padding:18px;border:1px solid var(--line);background:#fffefa;box-shadow:5px 6px 0 var(--paper-shadow)}.law:nth-child(3n+2){background:#f7f5ee}.law-art{position:relative;width:100%;aspect-ratio:16/9;margin-bottom:14px;overflow:hidden;border:1px solid #c5d5e4;background:var(--blue-pale)}.law-art img{width:100%;height:100%;object-fit:cover}.law-art .art-placeholder{min-height:0;height:100%;padding:12px}.law-art .art-placeholder strong{font-size:1.25rem}.law-number{color:var(--blue-deep);font-size:.96rem}.law h3{margin:6px 0 7px;font-family:var(--pen);font-size:1.35rem;font-weight:700;line-height:1.5;overflow-wrap:break-word}.law .principle{margin:0 0 8px;color:var(--blue-deep);font-size:1.06rem;font-weight:700}.law p{margin:0;color:#38475a;font-size:1rem;line-height:1.85}.law footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:17px}.tag{color:var(--muted);font-size:.9rem}.read{border:0;border-bottom:1px solid var(--blue-deep);background:transparent;padding:5px 0;color:var(--blue-deep);cursor:pointer}.read:hover{color:var(--red);border-color:var(--red)}.empty{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
    dialog{width:min(980px,calc(100% - 28px));max-height:92vh;border:1px solid var(--line);padding:0;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px #0006}dialog::backdrop{background:#142039a8;backdrop-filter:blur(2px)}.detail{padding:clamp(20px,4vw,48px);overflow:auto;max-height:92vh}.close{float:right;min-width:44px;min-height:44px;border:1px solid var(--line);background:transparent;font-size:1rem;cursor:pointer}.detail h2{margin:12px 54px 20px 0;font-family:var(--pen);font-size:clamp(1.65rem,3.3vw,2.3rem);line-height:1.45}.detail h3{margin:20px 0 5px;color:var(--blue-deep);font-size:1.02rem}.detail p{margin:0;color:#38475a;font-size:1.05rem;line-height:1.9}.detail .memory{margin-top:22px;padding:16px 18px;border-left:4px solid var(--blue);background:var(--blue-pale);font-family:var(--pen);font-size:1.18rem}.detail-art{width:100%;aspect-ratio:16/9;margin:18px 0;border:1px solid var(--line);background:var(--blue-pale)}.detail-art img{width:100%;height:100%;object-fit:contain}.site-footer{padding:22px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    @media(max-width:900px){.hero{grid-template-columns:1fr 1fr;min-height:460px}.hero-copy{padding:36px 28px}.hero-art{min-height:0}.grid{gap:14px}.law{padding:14px}}
    @media(max-width:680px){body{font-size:16px;background:var(--paper)}.page{box-shadow:none}.top{padding:12px 16px}.brand{font-size:.95rem}.hero{grid-template-columns:1fr}.hero-copy{padding:38px 22px 30px;border-right:0}.hero h1{font-size:clamp(2.4rem,11vw,3.4rem)}.hero-art{min-height:0;padding:16px}.quote-band{padding:22px 18px}.chapter-top{padding:18px 16px 8px}main{padding:24px 16px 48px}.tools{align-items:stretch;flex-direction:column}.search-wrap{width:100%}.grid{grid-template-columns:1fr}.law{padding:15px}.law h3{font-size:1.25rem}.pagination button{min-width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><div class="brand"><span class="brand-mark">大</span><span>The SMALL BIG｜原則閱讀手帳</span></div><button id="randomLaw" class="quiet-button" type="button">隨機讀一則</button></header>
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy"><h1 id="pageTitle">The SMALL BIG<br>52 個原則十記卡</h1><p class="intro">從職場、談判、客戶服務、公共政策與個人生活的細節，閱讀每個小原則如何改變選擇與行動。</p><a href="#laws" class="start">開始翻閱 <span aria-hidden="true">↓</span></a></div>
      <div class="hero-art" id="coverArt"><img src="images/P00.webp" alt="The SMALL BIG 手帳封面手繪插畫" onload="this.parentElement.classList.add('has-art')" onerror="this.hidden=true"></div>
    </section>
    <div class="quote-band">從一個微小的選擇開始，<span>看見影響力如何展開。</span></div>
    <section class="workspace" id="laws" aria-label="原則閱讀區">
      <div class="chapter-top"><nav class="chapter-list" id="chapters" aria-label="原則分類"></nav></div>
      <main><div class="tools"><h2 id="sectionTitle">全部原則</h2><label class="search-wrap"><span class="sr-only">搜尋 52 個原則</span><input id="search" class="search" type="search" placeholder="搜尋章節、原則或關鍵字"><button id="clearSearch" class="clear-search" type="button" hidden>清除</button></label></div><p id="resultStatus" class="status" role="status" aria-live="polite"></p><nav class="pagination" id="pagination" aria-label="原則分頁"></nav><div id="lawGrid" class="grid"></div></main>
    </section>
    <footer class="site-footer">《The SMALL BIG》52 個原則十記卡｜依原始網頁資料整理</footer>
  </div>
  <dialog id="dialog"><article class="detail"><button class="close" id="closeDialog" type="button" aria-label="關閉細讀視窗">關閉</button><div id="detailBody"></div></article></dialog>
  <script src="data.js"></script>
  <script>
    const cards=window.CARDS, chapterBox=document.getElementById('chapters'), grid=document.getElementById('lawGrid'), pages=document.getElementById('pagination'), title=document.getElementById('sectionTitle'), search=document.getElementById('search'), clearSearch=document.getElementById('clearSearch'), status=document.getElementById('resultStatus'), dialog=document.getElementById('dialog');
    const cats=['全部',...Object.keys(window.CATEGORY_TOTALS)];let selected='全部',page=1;const pageSize=8;
    const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const art=(n,alt,cls='law-art')=>`<div class="${cls}"><img src="images/P${String(n).padStart(2,'0')}.webp" alt="${esc(alt)}" loading="lazy" onload="this.parentElement.classList.add('has-art')" onerror="this.hidden=true"></div>`;
    function filtered(){const q=search.value.trim().toLocaleLowerCase();return cards.filter(c=>(selected==='全部'||c.cat===selected)&&(!q||[c.ch,c.title,c.name,c.cat,c.def,c.evidence,c.mech,c.action,c.risk,c.ethic,c.memory].join(' ').toLocaleLowerCase().includes(q)))}
    function openCard(c){const n=Number(c.ch.replace(/\D/g,''));document.getElementById('detailBody').innerHTML=`<span class="law-number">${esc(c.ch)}｜${esc(c.cat)}</span><h2>${esc(c.title)}</h2>${art(n,`${c.ch} ${c.title}`,'detail-art')}<h3>原則名稱</h3><p>${esc(c.name)}</p><h3>一句話定義</h3><p>${esc(c.def)}</p><h3>書中證據</h3><p>${esc(c.evidence)}</p><h3>心理機制</h3><p>${esc(c.mech)}</p><h3>關鍵動作</h3><p>${esc(c.action)}</p><h3>不適用或風險</h3><p>${esc(c.risk)}</p><h3>倫理邊界</h3><p>${esc(c.ethic)}</p><p class="memory">${esc(c.memory)}</p>`;dialog.showModal()}
    function render(){const data=filtered(),totalPages=Math.max(1,Math.ceil(data.length/pageSize));page=Math.min(page,totalPages);title.textContent=selected==='全部'?'全部原則':selected;status.textContent=`目前顯示 ${data.length?((page-1)*pageSize+1):0}–${Math.min(page*pageSize,data.length)} / ${data.length} 則，總計 52 則`;grid.innerHTML='';data.slice((page-1)*pageSize,page*pageSize).forEach(c=>{const n=Number(c.ch.replace(/\D/g,'')),el=document.createElement('article');el.className='law';el.innerHTML=`${art(n,`${c.ch} ${c.title}`)}<span class="law-number">${esc(c.ch)}｜${esc(c.cat)}</span><h3>${esc(c.title)}</h3><p class="principle">${esc(c.name)}</p><p>${esc(c.def)}</p><footer><span class="tag">P${String(n).padStart(2,'0')} · 16:9</span><button class="read" type="button">細讀原則</button></footer>`;el.querySelector('.read').addEventListener('click',()=>openCard(c));grid.appendChild(el)});if(!data.length)grid.innerHTML='<p class="empty">目前沒有符合條件的原則。<button id="resetFilters" class="read" type="button">清除條件並顯示全部</button></p>';pages.innerHTML='';for(let i=1;i<=totalPages;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.className=i===page?'active':'';b.setAttribute('aria-current',i===page?'page':'false');b.addEventListener('click',()=>{page=i;render();document.getElementById('laws').scrollIntoView({behavior:'smooth'})});pages.appendChild(b)};chapterBox.querySelectorAll('.chapter').forEach(b=>{b.classList.toggle('active',b.dataset.cat===selected);b.setAttribute('aria-pressed',String(b.dataset.cat===selected))});clearSearch.hidden=search.value.length===0;const reset=document.getElementById('resetFilters');if(reset)reset.addEventListener('click',()=>{search.value='';selected='全部';page=1;render()})}
    for(const cat of cats){const b=document.createElement('button');b.type='button';b.className='chapter';b.dataset.cat=cat;b.setAttribute('aria-pressed',String(cat==='全部'));b.innerHTML=`${esc(cat)}<span class="num">${cat==='全部'?cards.length:window.CATEGORY_TOTALS[cat]}</span>`;b.addEventListener('click',()=>{selected=cat;page=1;render()});chapterBox.appendChild(b)}
    search.addEventListener('input',()=>{page=1;render()});clearSearch.addEventListener('click',()=>{search.value='';page=1;render();search.focus()});document.getElementById('randomLaw').addEventListener('click',()=>{const data=filtered();if(data.length)openCard(data[Math.floor(Math.random()*data.length)])});document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();
  </script>
</body>
</html>
