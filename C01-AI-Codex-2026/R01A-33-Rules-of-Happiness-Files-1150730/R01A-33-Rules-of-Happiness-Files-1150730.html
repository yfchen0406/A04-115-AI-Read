<!--
THESIS: 一本幸福法則書被做成可翻閱的個人手帳，而非資訊儀表板。
OWN-WORLD: 午夜藍墨水、暖白紙張、深紅書籤；DFKai-SB 鋼筆字感與細線框。
STORY: 讀者選一條法則，理解它，並帶走一個今天能實踐的小行動。
FIRST VIEWPORT: 左側是書名與今日閱讀入口，右側是一張可替換的插圖頁與章節索引。
FORM: 個人閱讀手帳；以章節側籤、翻頁卡與抽屜式細讀維持閱讀節奏。
-->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幸福檔案｜33 個核心法則</title>
  <style>
    :root { --ink:#18253d; --blue:#29466d; --paper:#fffdf7; --warm:#f0e3c6; --line:#cdbf9e; --red:#a42f37; --muted:#725f4a; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:linear-gradient(110deg,#e8ddc4 0 16%,#d4c4a5 16% 17%,#f6eedc 17% 100%); font-family:"DFKai-SB","BiauKai","KaiTi","Microsoft JhengHei",cursive; }
    button,input { font:inherit; }
    .page { max-width:1480px; min-height:100vh; margin:auto; background:var(--paper); box-shadow:0 20px 65px #00000033; }
    .top { display:flex; justify-content:space-between; align-items:center; padding:18px clamp(20px,5vw,72px); border-bottom:1px solid var(--line); }
    .brand { display:flex; gap:12px; align-items:center; font-size:1.13rem; letter-spacing:.08em; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--ink); border-radius:50%; font-size:.9rem; }
    .top button { border:1px solid var(--ink); background:transparent; padding:8px 13px; border-radius:18px; cursor:pointer; color:var(--ink); }
    .top button:hover,.top button:focus-visible { background:var(--ink); color:var(--paper); }
    .hero { display:grid; grid-template-columns:1fr 1.12fr; min-height:590px; }
    .hero-copy { padding:clamp(48px,8vw,104px) clamp(25px,7vw,92px); border-right:1px solid var(--line); }
    .kicker { color:var(--red); margin:0 0 22px; letter-spacing:.16em; font-size:.9rem; }
    h1 { max-width:10ch; font-size:clamp(2.35rem,5vw,4.25rem); line-height:1.12; margin:0; font-weight:700; letter-spacing:.02em; }
    .intro { max-width:31em; margin:28px 0; line-height:2; color:#3b4350; font-family:"Microsoft JhengHei",sans-serif; font-size:.97rem; }
    .start { display:inline-flex; align-items:center; gap:8px; background:var(--red); color:white; padding:13px 20px; text-decoration:none; border-radius:4px; box-shadow:5px 6px 0 #dac6a1; }
    .hero-art { position:relative; overflow:hidden; display:grid; place-items:center; background:var(--blue); color:white; min-height:420px; }
    .hero-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }
    .hero-image { opacity:1; }
    .quote-band { padding:34px clamp(25px,8vw,104px); color:var(--paper); background:var(--ink); font-size:clamp(1.45rem,2.5vw,2.3rem); line-height:1.6; text-align:center; }
    .quote-band span { color:#f0c66c; }
    .workspace { display:block; }
    .chapter-top { padding:28px clamp(22px,5vw,72px) 10px; background:#fbf5e9; border-bottom:1px solid var(--line); }
    .chapter-list { display:flex; gap:10px; overflow-x:auto; padding-bottom:12px; }
    .chapter { flex:0 0 auto; text-align:left; border:1px solid var(--line); background:transparent; padding:10px 15px; color:var(--ink); cursor:pointer; line-height:1.4; transition:transform .18s ease,background .18s ease,color .18s ease; }
    @keyframes tab-pop { 0% { transform:scale(.86) translateY(2px); } 65% { transform:scale(1.06) translateY(-3px); } 100% { transform:scale(1) translateY(-2px); } }
    .chapter:hover,.chapter.active { color:white; background:var(--ink); transform:translateY(-2px); }
    .chapter.active { animation:tab-pop .38s cubic-bezier(.16,1,.3,1); }
    main { padding:40px clamp(25px,5vw,72px) 72px; }
    .tools { display:flex; gap:14px; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .tools h2 { margin:0; font-size:clamp(1.7rem,3vw,2.4rem); font-weight:500; }
    .search { width:min(280px,48%); padding:11px 14px; border:1px solid var(--line); border-radius:4px; background:#fffefa; outline-color:var(--red); }
    .pagination { display:flex; justify-content:flex-start; gap:8px; margin:0 0 23px; flex-wrap:wrap; }
    .pagination button { min-width:35px; height:35px; border:1px solid var(--line); background:transparent; cursor:pointer; transition:transform .18s ease,background .18s ease,color .18s ease; }
    .pagination button:active { transform:scale(.82) rotate(-4deg); }
    .pagination button.active,.pagination button:hover { background:var(--ink); color:white; transform:translateY(-2px); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; }
    .law { position:relative; display:flex; flex-direction:column; min-height:440px; padding:20px 22px 22px; border:1px solid var(--line); background:#fffefa; box-shadow:6px 7px 0 #eadfc9; }
    .law:nth-child(3n+2) { background:#f8efe0; }
    .law-image { width:100%; aspect-ratio:16/9; object-fit:cover; margin-bottom:15px; border:1px solid #d7c8aa; }
    .law h3 { margin:3px 0 15px; font-size:1.38rem; line-height:1.35; font-weight:700; }
    .law p { margin:0; color:#4b4b4b; line-height:1.85; font-family:"Microsoft JhengHei",sans-serif; font-size:.9rem; }
    .law footer { display:flex; align-items:end; justify-content:space-between; gap:10px; margin-top:auto; padding-top:20px; }
    .tag { color:var(--red); font-family:"Microsoft JhengHei",sans-serif; font-size:.72rem; }
    .read { background:transparent; border:0; border-bottom:1px solid var(--ink); padding:3px 0; cursor:pointer; color:var(--ink); }
    .read:hover { color:var(--red); border-color:var(--red); }
    dialog { width:min(960px,calc(100% - 28px)); max-height:92vh; border:0; padding:0; background:var(--paper); box-shadow:0 24px 80px #0007; }
    dialog::backdrop { background:#142039a8; backdrop-filter:blur(3px); }
    .detail { padding:clamp(24px,5vw,56px); overflow:auto; max-height:92vh; }
    .close { float:right; border:0; background:transparent; font-size:1.45rem; cursor:pointer; }
    .detail h2 { font-size:clamp(1.65rem,3.4vw,2.35rem); margin:15px 36px 24px 0; font-weight:700; }
    .detail h3 { color:var(--red); margin:22px 0 8px; font-size:1.12rem; }
    .detail p { font-family:"Microsoft JhengHei",sans-serif; line-height:2; margin:0; font-size:clamp(1rem,1.7vw,1.14rem); }
    .quote { margin-top:26px!important; padding:0; background:transparent; color:#4d2c2f; font-family:"DFKai-SB","BiauKai",cursive!important; font-size:1.2rem; font-weight:700; }
    .detail-image { display:block; width:100%; max-height:58vh; object-fit:contain; margin:24px 0 20px; background:#f0e3c6; }
    .law-video { display:block; width:100%; aspect-ratio:16/9; margin:24px 0 20px; background:#18253d; }
    .animation-button { display:inline-flex; align-items:center; gap:6px; margin:14px 0 8px; padding:7px 11px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; font-size:.82rem; font-weight:700; box-shadow:3px 3px 0 #dfccaa; transition:transform .18s ease,background .18s ease; }
    .animation-button:hover,.animation-button:focus-visible { background:var(--red); transform:translateY(-2px); }
    .image-slot { margin-top:14px; padding:13px; border:1px dashed var(--line); color:var(--muted); text-align:center; font-family:"Microsoft JhengHei",sans-serif; font-size:.8rem; }
    .footer { padding:24px; text-align:center; border-top:1px solid var(--line); color:var(--muted); font-family:"Microsoft JhengHei",sans-serif; font-size:.78rem; }
    @media (max-width:780px) { body { background:var(--paper); } .page { box-shadow:none; } .hero { grid-template-columns:1fr; } .hero-copy { border-right:0; padding:44px 22px 52px; } .hero-art { min-height:390px; } .chapter-top { padding:22px 18px 6px; } main { padding:28px 18px 54px; } .grid { grid-template-columns:1fr; } .law { min-height:410px; } .tools { align-items:flex-start; flex-direction:column; } .search { width:100%; } .pagination { gap:6px; } .pagination button { min-width:32px; height:32px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><div class="brand"><span class="brand-mark">幸</span>幸福檔案・閱讀手帳</div><button id="randomLaw">今日抽一則</button></header>
    <section class="hero">
      <div class="hero-copy"><p class="kicker">33 個核心法則</p><h1>把幸福放回每天的選擇</h1><p class="intro">依《幸福檔案》整理：每一則法則提供一段說明、一個生活應用與一句金句。從今天最有感的一條開始就好。</p><a href="#laws" class="start">開始翻閱　↓</a></div>
      <div class="hero-art"><img class="hero-image" src="images/P00.webp" alt="幸福檔案封面插圖"></div>
    </section>
    <div class="quote-band">幸福不是待完成的清單，而是每天做出<span>較貼近自己價值的選擇</span>。</div>
    <section class="workspace" id="laws"><div class="chapter-top"><div class="chapter-list" id="chapters"></div></div><main><nav class="pagination" id="pagination" aria-label="法則分頁"></nav><div class="tools"><h2 id="sectionTitle">全部法則</h2><input id="search" class="search" type="search" placeholder="搜尋法則、關鍵字……"></div><div id="lawGrid" class="grid"></div></main></section>
    <footer class="footer">《幸福檔案》33 個核心法則｜網頁版型初稿｜插圖檔案請依 IMAGE SLOT 編號置換</footer>
  </div>
  <dialog id="dialog"><article class="detail"><button class="close" aria-label="關閉">×</button><div id="detailBody"></div></article></dialog>
  <script src="幸福檔案-內容資料.js"></script>
  <script>
    const laws = [
      ['管理自我','讓失敗成為資料，而不是標籤','失敗不必等於自己不夠好。把經驗看清楚，才能成為下一次調整方向時最有用的資料。','遇到受挫時，寫下發生了什麼、學到什麼、下次怎麼做；把情緒與可行的改變分開看。','「失敗是推動進步的強大力量。問題不在於你是否會失敗，而是你如何運用這些失敗。」'],
      ['管理自我','把時間當成生命來使用','每一段時間都有代價，因為它換走的是我們有限的生命。','先記錄一週時間去向，減少一件無目的耗時習慣，把時間留給閱讀、散步或重要的人。','「一樣東西的代價……是你用多少的生命去交換。」'],
      ['管理自我','倦怠時先抽離，讓身心恢復','倦怠是長期耗竭的訊號；硬撐通常只會讓人更疲憊。','安排固定休息時段，暫停工作訊息、外出走路，讓恢復成為生活的一部分。','「最明智做法就是暫時抽離，好好讓自己恢復。」'],
      ['管理自我','分清楚該立刻做與該醞釀的事','例行工作拖延會累積壓力；創意工作則常需要留白。','必要訊息立刻完成；寫作或解題時，可在知道下一步時暫停，隔天再接著做。','「創意需要一點時間醞釀。」'],
      ['管理自我','為答應別人設一道門檻','說「不」不是拒絕關係，而是替真正重要的事保留空間。','面對邀請先說「我明天確認」，再用簡短清楚的方式婉拒不願承擔的事。','「你只需要練習說『不』，而不是一味答應。」'],
      ['管理自我','把煩惱寫出來，才看得見能做什麼','憂慮停在腦中會變得模糊又巨大；說清楚才知道哪些能準備。','寫下最壞、最好與最可能的結果，再為最可能的情況想一個下一步。','「我們在想像中受的苦，往往比現實裡還多。」'],
      ['管理自我','克制不是壓抑，而是選擇想成為的人','自制力讓人有機會長成自己認同的樣子。','挑一項想培養的品格，設計一個小行動，例如回話前停三秒。','「當你表現得彷彿自己已經是某種人時，最終你就會成為那種人。」'],
      ['管理自我','金錢是工具，不是自己的價值','金錢能解決需要，不能代替自尊、關係與意義。','檢查最近消費是否符合生活價值，將部分金錢用在照顧他人或買回時間。','「你不等於你的錢；金錢只是工具。」'],
      ['工作、金錢與職涯發展','轉換跑道前，先照顧工作以外的生活'],['工作、金錢與職涯發展','複雜選擇時，聽見自己的直覺訊號'],['工作、金錢與職涯發展','默默付出，讓善意回到自己心裡'],['工作、金錢與職涯發展','用錢買體驗、時間與助人的機會'],['工作、金錢與職涯發展','中年可以是重新整理人生的時期'],['工作、金錢與職涯發展','做大事時，同時看見今天'],
      ['與他人溝通和建立連結','把批評當成可用的情報'],['與他人溝通和建立連結','稱讚要真實、具體，也不求回報'],['與他人溝通和建立連結','少開一場會，還給彼此專注時間'],['與他人溝通和建立連結','視訊很方便，但不能取代真人互動'],['與他人溝通和建立連結','釋放壓力，也要保留對人的尊重'],['與他人溝通和建立連結','說真話，要有勇氣也要有節奏'],
      ['平衡工作、生活與人際關係','幸福是一輩子的練習，也是愛'],['平衡工作、生活與人際關係','別讓立場變成仇恨的理由'],['平衡工作、生活與人際關係','教養的核心，是穩定而無條件的愛'],['平衡工作、生活與人際關係','辨認讓人耗損的關係'],['平衡工作、生活與人際關係','第一印象很快，卻不一定準'],['平衡工作、生活與人際關係','感情受挫，也能留下成熟的理解'],['平衡工作、生活與人際關係','幸福可以主動練習，也可以分享'],
      ['如何定義成功','成功的甜味在進步，不只在抵達'],['如何定義成功','別讓過去的獎盃定義今天'],['如何定義成功','勇氣是帶著害怕仍往前走'],['如何定義成功','才智最好的用途，是愛人與助人'],['如何定義成功','最高職位不一定等於最適合的人生'],['如何定義成功','先把生活過得更快樂，再追求成功']
    ].map((x,i)=>({part:x[0],title:x[1],description:'',application:'',quote:'',number:i+1,slot:String(i+2).padStart(2,'0')}));
    laws.forEach(l=>{const source=window.fullLawContent?.find(item=>item.number===l.number);if(source)Object.assign(l,source,{slot:String(l.number).padStart(2,'0')})});
    const chapters=['全部法則','管理自我','工作、金錢與職涯發展','與他人溝通和建立連結','平衡工作、生活與人際關係','如何定義成功']; let part='全部法則', page=1, query=''; const pageSize=8;
    const chapterBox=document.getElementById('chapters'), grid=document.getElementById('lawGrid'), pages=document.getElementById('pagination'), title=document.getElementById('sectionTitle');
    chapters.forEach(c=>{const b=document.createElement('button'); b.className='chapter'; b.textContent=c; b.onclick=()=>{part=c;page=1;render()}; chapterBox.appendChild(b)});
    function filtered(){return laws.filter(l=>(part==='全部法則'||l.part===part)&&(`${l.title}${l.part}${l.description}`).includes(query));}
    function render(){ const data=filtered(), count=Math.max(1,Math.ceil(data.length/pageSize)); page=Math.min(page,count); title.textContent=part; grid.innerHTML=''; data.slice((page-1)*pageSize,page*pageSize).forEach(l=>{const el=document.createElement('article');el.className='law';const preview=l.description||'此卡保留原始標題與章節，完整內文將直接從原始文件逐字置入。';el.innerHTML=`<img class="law-image" src="images/P${String(l.number).padStart(2,'0')}.webp" alt="第 ${l.number} 則法則插圖：${l.title}" loading="lazy"><h3>${l.title}</h3><p>${preview}</p><footer><span class="tag">P${String(l.number).padStart(2,'0')}／法則插圖</span><button class="read">查看版面 ↗</button></footer>`;el.querySelector('.read').onclick=()=>openDetail(l);grid.appendChild(el)}); if(!data.length)grid.innerHTML='<p>找不到相符的法則，換一個關鍵字試試。</p>'; pages.innerHTML='';for(let i=1;i<=count;i++){const b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.onclick=()=>{page=i;render();document.getElementById('laws').scrollIntoView()};pages.appendChild(b)}; document.querySelectorAll('.chapter').forEach(b=>b.classList.toggle('active',b.textContent===part)); }
    function openDetail(l){const id=String(l.number).padStart(2,'0');const content=l.description?`<h3>法則說明</h3><p>${l.description}</p><h3>生活應用</h3><p>${l.application}</p><p class="quote">${l.quote}</p>`:`<p>這是版型預覽：此處會逐字放入原始文件中的「法則說明、生活應用、金句」，不會自行改寫文章內容。</p>`;document.getElementById('detailBody').innerHTML=`<div id="media-${id}"><img class="detail-image" src="images/P${id}.webp" alt="第 ${l.number} 則法則插圖：${l.title}"></div><button class="animation-button" id="play-${id}">▶ 播放 18 秒動畫</button>${content}`;document.getElementById(`play-${id}`).onclick=()=>{document.getElementById(`media-${id}`).innerHTML=`<video class="law-video" controls autoplay playsinline poster="images/P${id}.webp"><source src="videos/law-${id}.mp4" type="video/mp4">你的瀏覽器無法播放此動畫。</video>`;document.getElementById(`play-${id}`).textContent='↺ 重新播放動畫';};document.getElementById('dialog').showModal();}
    document.querySelector('.close').onclick=()=>document.getElementById('dialog').close(); document.getElementById('search').oninput=e=>{query=e.target.value.trim();page=1;render()}; document.getElementById('randomLaw').onclick=()=>openDetail(laws[Math.floor(Math.random()*laws.length)]); render();
  </script>
</body>
</html>
