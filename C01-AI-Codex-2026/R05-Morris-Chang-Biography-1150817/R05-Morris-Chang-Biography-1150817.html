ng":false},{"id":"15-06","start":1594.56,"end":1609.944,"audio":"audio/voice-096.mp3","heading":"咆哮成長的九○年代","showHeading":false},{"id":"16-01","start":1609.944,"end":1626.216,"audio":"audio/voice-097.mp3","heading":"拒絕誘惑的技術自主","showHeading":true},{"id":"16-02","start":1626.216,"end":1644.7199999999998,"audio":"audio/voice-098.mp3","heading":"拒絕誘惑的技術自主","showHeading":false},{"id":"16-03","start":1644.7199999999998,"end":1659.6,"audio":"audio/voice-099.mp3","heading":"拒絕誘惑的技術自主","showHeading":false},{"id":"16-04","start":1659.6,"end":1676.568,"audio":"audio/voice-100.mp3","heading":"拒絕誘惑的技術自主","showHeading":false},{"id":"16-05","start":1676.568,"end":1693.776,"audio":"audio/voice-101.mp3","heading":"拒絕誘惑的技術自主","showHeading":false},{"id":"16-06","start":1693.776,"end":1707.3600000000001,"audio":"audio/voice-102.mp3","heading":"拒絕誘惑的技術自主","showHeading":false},{"id":"17-01","start":1707.3600000000001,"end":1722.0240000000001,"audio":"audio/voice-103.mp3","heading":"誠信正直的價值回歸","showHeading":true},{"id":"17-02","start":1722.0240000000001,"end":1739.544,"audio":"audio/voice-104.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"17-03","start":1739.544,"end":1755.336,"audio":"audio/voice-105.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"17-04","start":1755.336,"end":1772.952,"audio":"audio/voice-106.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"17-05","start":1772.952,"end":1791.432,"audio":"audio/voice-107.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"17-06","start":1791.432,"end":1806.504,"audio":"audio/voice-108.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"17-07","start":1806.504,"end":1819.6799999999998,"audio":"audio/voice-109.mp3","heading":"誠信正直的價值回歸","showHeading":false},{"id":"18-01","start":1819.6799999999998,"end":1842.3839999999998,"audio":"audio/voice-110.mp3","heading":"蘋果敲門的巔峰之約","showHeading":true},{"id":"18-02","start":1842.3839999999998,"end":1861.0319999999997,"audio":"audio/voice-111.mp3","heading":"蘋果敲門的巔峰之約","showHeading":false},{"id":"18-03","start":1861.0319999999997,"end":1880.2559999999996,"audio":"audio/voice-112.mp3","heading":"蘋果敲門的巔峰之約","showHeading":false},{"id":"18-04","start":1880.2559999999996,"end":1900.8479999999997,"audio":"audio/voice-113.mp3","heading":"蘋果敲門的巔峰之約","showHeading":false},{"id":"18-05","start":1900.8479999999997,"end":1920.1679999999997,"audio":"audio/voice-114.mp3","heading":"蘋果敲門的巔峰之約","showHeading":false},{"id":"18-06","start":1920.1679999999997,"end":1934.8079999999998,"audio":"audio/voice-115.mp3","heading":"蘋果敲門的巔峰之約","showHeading":false},{"id":"19-01","start":1934.8079999999998,"end":1955.0879999999997,"audio":"audio/voice-116.mp3","heading":"執子之手的情感歸宿","showHeading":true},{"id":"19-02","start":1955.0879999999997,"end":1966.3199999999997,"audio":"audio/voice-117.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"19-03","start":1966.3199999999997,"end":1981.7039999999997,"audio":"audio/voice-118.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"19-04","start":1981.7039999999997,"end":1999.9199999999996,"audio":"audio/voice-119.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"19-05","start":1999.9199999999996,"end":2017.2959999999996,"audio":"audio/voice-120.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"19-06","start":2017.2959999999996,"end":2032.1519999999996,"audio":"audio/voice-121.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"19-07","start":2032.1519999999996,"end":2045.2319999999995,"audio":"audio/voice-122.mp3","heading":"執子之手的情感歸宿","showHeading":false},{"id":"20-01","start":2045.2319999999995,"end":2064.6719999999996,"audio":"audio/voice-123.mp3","heading":"命運約會的終極圓滿","showHeading":true},{"id":"20-02","start":2064.6719999999996,"end":2085.24,"audio":"audio/voice-124.mp3","heading":"命運約會的終極圓滿","showHeading":false},{"id":"20-03","start":2085.24,"end":2101.584,"audio":"audio/voice-125.mp3","heading":"命運約會的終極圓滿","showHeading":false},{"id":"20-04","start":2101.584,"end":2117.8559999999998,"audio":"audio/voice-126.mp3","heading":"命運約會的終極圓滿","showHeading":false},{"id":"20-05","start":2117.8559999999998,"end":2136.7679999999996,"audio":"audio/voice-127.mp3","heading":"命運約會的終極圓滿","showHeading":false},{"id":"20-06","start":2136.7679999999996,"end":2152.6799999999994,"audio":"audio/voice-128.mp3","heading":"命運約會的終極圓滿","showHeading":false}],"captions":[{"start":0.0,"end":4.610149253731343,"text":"「我們生長在大時代裡」。這不是一句浪漫的開場","segment":"01-01"},{"start":4.610149253731343,"end":4.819701492537313,"text":"，","segment":"01-01"},{"start":4.819701492537313,"end":9.220298507462687,"text":"而是我幼少年時最常聽到的話。在十八歲以前，","segment":"01-01"},{"start":9.220298507462687,"end":12.573134328358208,"text":"我已經逃了三次難，住過六個城市，","segment":"01-01"},{"start":12.573134328358208,"end":14.04,"text":"換過十個學校。","segment":"01-01"},{"start":14.04,"end":16.682042553191486,"text":"1941年12月8日清晨，","segment":"01-02"},{"start":16.682042553191486,"end":19.52731914893617,"text":"炸彈聲敲碎了香港的世外桃源。","segment":"01-02"},{"start":19.52731914893617,"end":22.37259574468085,"text":"那天我有考試，依然步行上學，","segment":"01-02"},{"start":22.37259574468085,"end":24.811404255319147,"text":"直到看見日本人打進九龍。","segment":"01-02"},{"start":24.811404255319147,"end":28.672851063829786,"text":"全家躲進九龍酒店，吃著漸漸耗盡的罐頭，","segment":"01-02"},{"start":28.672851063829786,"end":33.144,"text":"在驚嚇中度過了太平洋戰爭爆發的第一個聖誕夜。","segment":"01-02"},{"start":33.144,"end":37.53911111111111,"text":"十一歲那年，父母帶著我開始了一場五十多天的冒","segment":"01-03"},{"start":37.53911111111111,"end":37.93866666666667,"text":"險。","segment":"01-03"},{"start":37.93866666666667,"end":41.934222222222225,"text":"我們從淪陷區逃往陪都重慶。最驚心動魄的，","segment":"01-03"},{"start":41.934222222222225,"end":45.53022222222222,"text":"是乘搭夜晚行駛的「闖關車」穿越潼關，","segment":"01-03"},{"start":45.53022222222222,"end":47.92755555555556,"text":"日軍的砲位就在黃河對岸。","segment":"01-03"},{"start":47.92755555555556,"end":52.32266666666667,"text":"當火車在全黑中加速狂飆，耳邊只有瘋狂的卡搭聲","segment":"01-03"},{"start":52.32266666666667,"end":52.522444444444446,"text":"，","segment":"01-03"},{"start":52.522444444444446,"end":54.72,"text":"那是與死神賽跑的節奏。","segment":"01-03"},{"start":54.72,"end":58.66030769230769,"text":"在重慶南開中學，生活是刻苦而有紀律的。","segment":"01-04"},{"start":58.66030769230769,"end":60.319384615384614,"text":"宿舍裡臭蟲猖獗，","segment":"01-04"},{"start":60.319384615384614,"end":63.63753846153846,"text":"我們甚至要把床架搬去蒸汽房殺蟲。","segment":"01-04"},{"start":63.63753846153846,"end":65.504,"text":"但就在這種環境下，","segment":"01-04"},{"start":65.504,"end":70.06646153846154,"text":"我第一次走出父母的庇護，自許為大時代的中國未","segment":"01-04"},{"start":70.06646153846154,"end":70.896,"text":"來主人。","segment":"01-04"},{"start":70.896,"end":74.9456551724138,"text":"勝利來得突然，我們搭乘美軍飛機直飛上海。","segment":"01-05"},{"start":74.9456551724138,"end":78.99531034482759,"text":"四小時的飛行，對比兩年前五十多天的跋涉，","segment":"01-05"},{"start":78.99531034482759,"end":83.24744827586207,"text":"簡直是天壤之別。父親花光積蓄買了一幢房子，","segment":"01-05"},{"start":83.24744827586207,"end":87.70206896551724,"text":"以為終於可以安居樂業，卻沒想到這份安定只維持","segment":"01-05"},{"start":87.70206896551724,"end":88.512,"text":"了兩年。","segment":"01-05"},{"start":88.512,"end":93.00218181818182,"text":"1949年7月，內戰的陰影再次逼使我離家。","segment":"01-06"},{"start":93.00218181818182,"end":97.70618181818182,"text":"在香港啟德機場，我獨自登上飛機。凌空而起時，","segment":"01-06"},{"start":97.70618181818182,"end":102.41018181818181,"text":"我看著香港消失在雲霧中，心中充滿了淒涼與感傷","segment":"01-06"},{"start":102.41018181818181,"end":102.624,"text":"。","segment":"01-06"},{"start":102.624,"end":106.20567272727273,"text":"十八歲這一年，是人生的重要分界。","segment":"01-07"},{"start":106.20567272727273,"end":109.5634909090909,"text":"我的舊世界隨著大陸易色而破滅。","segment":"01-07"},{"start":109.5634909090909,"end":112.92130909090908,"text":"從此，我發現父母已不能幫助我，","segment":"01-07"},{"start":112.92130909090908,"end":114.93599999999999,"text":"我只能倚賴自己了。","segment":"01-07"},{"start":114.93599999999999,"end":119.03519999999999,"text":"1949年的美國，正站在聲望與權威的巔峰。","segment":"02-01"},{"start":119.03519999999999,"end":121.96319999999999,"text":"對於一個剛從亂世倖存的人來說，","segment":"02-01"},{"start":121.96319999999999,"end":125.08639999999998,"text":"這裡像是一個不可思議的法治世界。","segment":"02-01"},{"start":125.08639999999998,"end":129.3808,"text":"我帶著三叔的期許，踏入了我生命中最難忘的一年","segment":"02-01"},{"start":129.3808,"end":129.576,"text":"。","segment":"02-01"},{"start":129.576,"end":133.38208,"text":"那一屆哈佛一年級有1,100多名學生，","segment":"02-02"},{"start":133.38208,"end":135.18496,"text":"我是唯一的中國人。","segment":"02-02"},{"start":135.18496,"end":137.98944,"text":"我曾恐懼種族歧視，但很快地，","segment":"02-02"},{"start":137.98944,"end":142.39648,"text":"這份恐懼消失在哈佛園多元而才華橫溢的氣息中。","segment":"02-02"},{"start":142.39648,"end":144.6,"text":"我開始呼吸自由的空氣。","segment":"02-02"},{"start":144.6,"end":147.456,"text":"宿舍生活開啟了我的智慧生活。","segment":"02-03"},{"start":147.456,"end":150.31199999999998,"text":"我的室友辛克萊想攻讀人類學，","segment":"02-03"},{"start":150.31199999999998,"end":154.59599999999998,"text":"他教我看籃球和冰上曲棍球；而我的知交柏曼，","segment":"02-03"},{"start":154.59599999999998,"end":157.24799999999996,"text":"則是我的文學導師。在哈佛，","segment":"02-03"},{"start":157.24799999999996,"end":159.49199999999996,"text":"沒人因我的膚色而敵視，","segment":"02-03"},{"start":159.49199999999996,"end":161.328,"text":"只有對知識的渴望。","segment":"02-03"},{"start":161.328,"end":165.4776,"text":"最大的挑戰來自那門「人文學」。第一天，","segment":"02-04"},{"start":165.4776,"end":167.6616,"text":"教授就叫我們讀荷馬。","segment":"02-04"},{"start":167.6616,"end":172.4664,"text":"我讀《伊里亞德》的滋味，就像外國人讀《詩經》","segment":"02-04"},{"start":172.4664,"end":173.5584,"text":"一樣苦澀。","segment":"02-04"},{"start":173.5584,"end":176.616,"text":"但我一字一語地讀，幾個月後，","segment":"02-04"},{"start":176.616,"end":180.984,"text":"我竟然開始能領略莎士比亞與蕭伯納的趣味。","segment":"02-04"},{"start":180.984,"end":184.5497142857143,"text":"我像一塊海綿，瘋狂吸收西洋文化。","segment":"02-05"},{"start":184.5497142857143,"end":187.00114285714287,"text":"我去聽海飛茲的小提琴、","segment":"02-05"},{"start":187.00114285714287,"end":190.34400000000002,"text":"看《人與超人》的演劇。這一年，","segment":"02-05"},{"start":190.34400000000002,"end":192.3497142857143,"text":"英文漸漸代替中文，","segment":"02-05"},{"start":192.3497142857143,"end":197.25257142857143,"text":"成了我內在思想的語言。我正參與一場人生中最豐","segment":"02-05"},{"start":197.25257142857143,"end":199.704,"text":"盛的「可帶走的盛宴」。","segment":"02-05"},{"start":199.704,"end":204.11473170731708,"text":"這一年的哈佛經歷，消滅了我與世界之間的距離。","segment":"02-06"},{"start":204.11473170731708,"end":206.92156097560976,"text":"我不再是那個畏怯的外國青年，","segment":"02-06"},{"start":206.92156097560976,"end":208.7259512195122,"text":"我學會了以誠相待。","segment":"02-06"},{"start":208.7259512195122,"end":212.93619512195124,"text":"儘管為了將來謀生，我決定轉入麻省理工學院，","segment":"02-06"},{"start":212.93619512195124,"end":216.144,"text":"但這場盛宴，我將隨身攜帶一輩子。","segment":"02-06"},{"start":216.144,"end":219.3263448275862,"text":"1950年，我轉入麻省理工學院，","segment":"03-01"},{"start":219.3263448275862,"end":221.71310344827586,"text":"在這裡學習我的謀生本領。","segment":"03-01"},{"start":221.71310344827586,"end":225.49213793103448,"text":"比起哈佛的才華橫溢，這裡是一個更用功、","segment":"03-01"},{"start":225.49213793103448,"end":227.0833103448276,"text":"也更乏味的世界。","segment":"03-01"},{"start":227.0833103448276,"end":230.46455172413795,"text":"我立志在工程上用功，那是沒日沒夜、","segment":"03-01"},{"start":230.46455172413795,"end":233.448,"text":"每週超過五十個小時的專業訓練。","segment":"03-01"},{"start":233.448,"end":237.20719266055048,"text":"為了省錢，我搬出宿舍，甚至幾個人輪流燒飯，","segment":"03-02"},{"start":237.20719266055048,"end":239.5343119266055,"text":"但最苦的還是為了補貼生活，","segment":"03-02"},{"start":239.5343119266055,"end":242.75647706422018,"text":"去幫教授敲機械計算機做重複性的計算。","segment":"03-02"},{"start":242.75647706422018,"end":246.69467889908256,"text":"那時一位中國教授對我說：「你沒資格做有思想的","segment":"03-02"},{"start":246.69467889908256,"end":247.23170642201833,"text":"工作，","segment":"03-02"},{"start":247.23170642201833,"end":250.453871559633,"text":"只能做單調的體力勞動。」社會的冷酷，","segment":"03-02"},{"start":250.453871559633,"end":252.96,"text":"第一次對我露出了猙獰的面目。","segment":"03-02"},{"start":252.96,"end":256.7728695652174,"text":"1954年，第一次參加博士資格考試，","segment":"03-03"},{"start":256.7728695652174,"end":257.832,"text":"我落榜了。","segment":"03-03"},{"start":257.832,"end":261.8566956521739,"text":"但我告訴自己沒關係，我還有第二次機會。","segment":"03-03"},{"start":261.8566956521739,"end":263.7631304347826,"text":"我花更多時間溫習，","segment":"03-03"},{"start":263.7631304347826,"end":267.576,"text":"選擇自動控制領域，那是我的興趣所在。","segment":"03-03"},{"start":267.576,"end":272.7562886597938,"text":"1955年2月，第二次放榜。依然榜上無名。","segment":"03-04"},{"start":272.7562886597938,"end":277.1965360824742,"text":"這是我有生以來最大的打擊。站在榜前，","segment":"03-04"},{"start":277.1965360824742,"end":278.92329896907216,"text":"我呆呆地望著。","segment":"03-04"},{"start":278.92329896907216,"end":282.1301443298969,"text":"十幾年的讀書生涯戛然中斷。","segment":"03-04"},{"start":282.1301443298969,"end":284.5969484536082,"text":"我的自尊心、自信心，","segment":"03-04"},{"start":284.5969484536082,"end":289.28387628865977,"text":"在倏忽中消滅。我不知道該如何面對父母，","segment":"03-04"},{"start":289.28387628865977,"end":291.504,"text":"如何面對新婚的妻。","segment":"03-04"},{"start":291.504,"end":296.15257731958764,"text":"那幾天，我不能食、不能寢。但我終究開始思考：","segment":"03-05"},{"start":296.15257731958764,"end":298.8994639175258,"text":"既然我對機械工程興趣平平，","segment":"03-05"},{"start":298.8994639175258,"end":301.0124536082474,"text":"為什麼要堅持讀博士？","segment":"03-05"},{"start":301.0124536082474,"end":305.44973195876287,"text":"我揮別這座我「十分敬、只有五分愛」的學府。","segment":"03-05"},{"start":305.44973195876287,"end":309.25311340206184,"text":"我告訴自己，我有很長的人生路程要走，","segment":"03-05"},{"start":309.25311340206184,"end":310.52090721649483,"text":"我要昂起頭，","segment":"03-05"},{"start":310.52090721649483,"end":312.0,"text":"開始走這條路。","segment":"03-05"},{"start":312.0,"end":316.1304347826087,"text":"許多年後，我才明白，那是我的最大幸運。","segment":"03-06"},{"start":316.1304347826087,"end":317.4347826086956,"text":"假使通過了，","segment":"03-06"},{"start":317.4347826086956,"end":320.4782608695652,"text":"我會成為一名平庸的機械教授，","segment":"03-06"},{"start":320.4782608695652,"end":322.86956521739125,"text":"而絕不會進入半導體界。","segment":"03-06"},{"start":322.86956521739125,"end":327.0,"text":"失敗，帶領我走向了一片前所未有的天地。","segment":"03-06"},{"start":327.0,"end":329.6494382022472,"text":"1955年，我揮別了麻省理工，","segment":"04-01"},{"start":329.6494382022472,"end":331.5923595505618,"text":"走到了人生的十字路口。","segment":"04-01"},{"start":331.5923595505618,"end":334.9483146067416,"text":"當時有四家公司邀聘，而最後的決選名單，","segment":"04-01"},{"start":334.9483146067416,"end":337.06786516853936,"text":"剩下兩個截然不同的未來：","segment":"04-01"},{"start":337.06786516853936,"end":339.36404494382026,"text":"一個是如日中天的福特汽車，","segment":"04-01"},{"start":339.36404494382026,"end":342.72,"text":"另一個是開發神祕「電晶體」的希凡尼亞。","segment":"04-01"},{"start":342.72,"end":346.7776,"text":"論規模，福特是全球前十大的巨頭；論專業，","segment":"04-02"},{"start":346.7776,"end":351.03808,"text":"機械系畢業的我對汽車更有把握。但有趣的是，","segment":"04-02"},{"start":351.03808,"end":354.08128,"text":"希凡尼亞給的月薪是480美元，","segment":"04-02"},{"start":354.08128,"end":357.93600000000004,"text":"偏偏比福特高了那麽**「一美元」**。","segment":"04-02"},{"start":357.93600000000004,"end":361.9884,"text":"就憑著一股年輕人的意氣，我自費打了電話給福特","segment":"04-03"},{"start":361.9884,"end":363.09360000000004,"text":"的人事經理。","segment":"04-03"},{"start":363.09360000000004,"end":366.40920000000006,"text":"我想，如果我告訴他別家公司薪水更高，","segment":"04-03"},{"start":366.40920000000006,"end":368.25120000000004,"text":"像福特這樣的大公司，","segment":"04-03"},{"start":368.25120000000004,"end":371.0142,"text":"應該會為了留住麻省理工的碩士，","segment":"04-03"},{"start":371.0142,"end":372.672,"text":"補齊那一點差額吧。","segment":"04-03"},{"start":372.672,"end":377.47200000000004,"text":"沒想到，那位在面試時談笑風生的人事經理，","segment":"04-04"},{"start":377.47200000000004,"end":382.03200000000004,"text":"此刻卻變得無比冷漠。他在電話裡對我說：","segment":"04-04"},{"start":382.03200000000004,"end":384.19200000000006,"text":"「我們不講價還價。","segment":"04-04"},{"start":384.19200000000006,"end":387.552,"text":"你要來就來。不要，就請便。」","segment":"04-04"},{"start":387.552,"end":391.45353846153847,"text":"這句話讓我惱羞成怒，卻也激發了我的鬥志。","segment":"04-05"},{"start":391.45353846153847,"end":395.7452307692308,"text":"既然你覺得我不重要，那我就去那個我完全沒把握","segment":"04-05"},{"start":395.7452307692308,"end":395.94030769230767,"text":"、","segment":"04-05"},{"start":395.94030769230767,"end":399.8418461538461,"text":"卻更有機會成長的地方。這短短的一通電話，","segment":"04-05"},{"start":399.8418461538461,"end":402.76800000000003,"text":"竟然為我和半導體結了一生的緣。","segment":"04-05"},{"start":402.76800000000003,"end":406.78080000000006,"text":"二十年後，一位曾任職福特的高管在酒酣飯飽之際","segment":"04-06"},{"start":406.78080000000006,"end":407.51040000000006,"text":"對我說：","segment":"04-06"},{"start":407.51040000000006,"end":409.88160000000005,"text":"「Morris，你真幸運。","segment":"04-06"},{"start":409.88160000000005,"end":411.70560000000006,"text":"如果你那時去了福特，","segment":"04-06"},{"start":411.70560000000006,"end":414.624,"text":"恐怕現在還爛在福特的研發部裡。」","segment":"04-06"},{"start":414.624,"end":418.9152,"text":"僅僅因為一美元的賭氣，我避開了傳統工業的僵化","segment":"04-07"},{"start":418.9152,"end":419.11025454545455,"text":"，","segment":"04-07"},{"start":419.11025454545455,"end":423.20640000000003,"text":"一頭栽進了半導體的青春時代。那是我這輩子，","segment":"04-07"},{"start":423.20640000000003,"end":425.35200000000003,"text":"最正確的一次弄巧成拙。","segment":"04-07"},{"start":425.35200000000003,"end":429.8700759493671,"text":"1955年5月，我進入了希凡尼亞半導體實驗室","segment":"05-01"},{"start":429.8700759493671,"end":430.0754430379747,"text":"。","segment":"05-01"},{"start":430.0754430379747,"end":432.950582278481,"text":"那時，電晶體問世才不過七年，","segment":"05-01"},{"start":432.950582278481,"end":436.03108860759494,"text":"半導體還只是個模糊的學術名詞。","segment":"05-01"},{"start":436.03108860759494,"end":440.549164556962,"text":"我像個懵懂的學徒，被派往一條毫無章法的鍺電晶","segment":"05-01"},{"start":440.549164556962,"end":441.576,"text":"體生產線。","segment":"05-01"},{"start":441.576,"end":446.01241379310346,"text":"生產線上，作業員正用高溫銲接器折磨著脆弱的電","segment":"05-02"},{"start":446.01241379310346,"end":446.61737931034486,"text":"晶體。","segment":"05-02"},{"start":446.61737931034486,"end":450.04551724137934,"text":"我看著那些被燒毀的廢品，心裡想著：","segment":"05-02"},{"start":450.04551724137934,"end":452.2637241379311,"text":"難道沒有更好的辦法嗎？","segment":"05-02"},{"start":452.2637241379311,"end":456.296827586207,"text":"我翻開在MIT讀過的《熱之傳導》教科書，","segment":"05-02"},{"start":456.296827586207,"end":459.12,"text":"開始了一場非典型的工作革命。","segment":"05-02"},{"start":459.12,"end":463.0330434782609,"text":"我利用銅絲的高導熱能力，改良了銲接技術。","segment":"05-03"},{"start":463.0330434782609,"end":467.3373913043478,"text":"當良率顯著提升的那一刻，上司和經理都跑過來圍","segment":"05-03"},{"start":467.3373913043478,"end":467.7286956521739,"text":"觀。","segment":"05-03"},{"start":467.7286956521739,"end":471.64173913043476,"text":"這只是個小小的成功，卻給了我莫大的勇氣：","segment":"05-03"},{"start":471.64173913043476,"end":475.16347826086957,"text":"原來，學校外的世界並非那麼充滿荊棘，","segment":"05-03"},{"start":475.16347826086957,"end":477.12,"text":"只要你願意徹底了解。","segment":"05-03"},{"start":477.12,"end":481.4852093023256,"text":"為了搞懂半導體，我開始自修蕭克利的經典著作。","segment":"05-04"},{"start":481.4852093023256,"end":485.45358139534886,"text":"那是一本極其艱深的書，我每晚只能讀兩頁。","segment":"05-04"},{"start":485.45358139534886,"end":488.6282790697675,"text":"在依普維茨那家昏暗的旅館餐廳裡，","segment":"05-04"},{"start":488.6282790697675,"end":490.0172093023256,"text":"我唯一的老師，","segment":"05-04"},{"start":490.0172093023256,"end":494.184,"text":"是一位每晚從六點半喝到十點、醉醺醺的專家。","segment":"05-04"},{"start":494.184,"end":498.69230769230774,"text":"我趁著他喝酒的空檔，拋出那些讀不懂的物理難題","segment":"05-05"},{"start":498.69230769230774,"end":498.8972307692308,"text":"。","segment":"05-05"},{"start":498.8972307692308,"end":503.4055384615385,"text":"他雖然好飲，卻是貨真價實的專家。我吃著晚餐，","segment":"05-05"},{"start":503.4055384615385,"end":507.5040000000001,"text":"他喝著美酒，在一場場酒氣與學術的交鋒中，","segment":"05-05"},{"start":507.5040000000001,"end":510.168,"text":"我慢慢摸清了半導體的奧祕。","segment":"05-05"},{"start":510.168,"end":512.8465531914894,"text":"後來公司搬到了波士頓近郊，","segment":"05-06"},{"start":512.8465531914894,"end":515.3190638297873,"text":"實驗室也變成了半導體部。","segment":"05-06"},{"start":515.3190638297873,"end":519.8520000000001,"text":"但新來的主管多是外行，這成了希凡尼亞日後衰敗","segment":"05-06"},{"start":519.8520000000001,"end":520.676170212766,"text":"的伏筆。","segment":"05-06"},{"start":520.676170212766,"end":525.2091063829788,"text":"我在這裡熱狂地學習，卻也看透了領導者的平庸。","segment":"05-06"},{"start":525.2091063829788,"end":529.5360000000001,"text":"這場預演，即將帶領我走向下一個真正的戰場。","segment":"05-06"},{"start":529.5360000000001,"end":534.3140740740741,"text":"1958年，我來到德州。這是一個與希凡尼亞完","segment":"06-01"},{"start":534.3140740740741,"end":536.0515555555556,"text":"全不同的新世界。","segment":"06-01"},{"start":536.0515555555556,"end":540.1780740740742,"text":"這裡的總經理才三十六歲，人人走路帶風。","segment":"06-01"},{"start":540.1780740740742,"end":542.3499259259261,"text":"這家公司不接受失敗，","segment":"06-01"},{"start":542.3499259259261,"end":547.128,"text":"如果你受挫了，就振奮起來重來，直到成功為止。","segment":"06-01"},{"start":547.128,"end":549.9265714285715,"text":"我一進公司就接下了最難的挑戰：","segment":"06-02"},{"start":549.9265714285715,"end":553.658,"text":"為IBM生產電腦用的NPN擴散型電晶體。","segment":"06-02"},{"start":553.658,"end":557.2028571428572,"text":"當時IBM自己的指標線良率也只有5%，","segment":"06-02"},{"start":557.2028571428572,"end":558.6954285714286,"text":"而我們剛起步時，","segment":"06-02"},{"start":558.6954285714286,"end":562.8000000000001,"text":"兩位工程師告訴我，我們的良率是「零而穩定」。","segment":"06-02"},{"start":562.8000000000001,"end":566.8771764705883,"text":"在德儀的前半年，我變成了「瘋狂工作者」。","segment":"06-03"},{"start":566.8771764705883,"end":571.1582117647059,"text":"每天早上八點到深夜午夜，我就守在生產線上。","segment":"06-03"},{"start":571.1582117647059,"end":575.643105882353,"text":"沒有人強迫我，但在這裡，每個人都是團隊的一分","segment":"06-03"},{"start":575.643105882353,"end":576.0508235294118,"text":"子，","segment":"06-03"},{"start":576.0508235294118,"end":580.128,"text":"我們一起賭，就想贏回那個遙不可及的數字。","segment":"06-03"},{"start":580.128,"end":583.4661818181819,"text":"我開始運用在希凡尼亞學到的理論知識，","segment":"06-04"},{"start":583.4661818181819,"end":586.4334545454547,"text":"不再死守IBM移轉過來的老規格，","segment":"06-04"},{"start":586.4334545454547,"end":590.5134545454547,"text":"而是大膽變動製程。慢慢地，我們「有」良率了，","segment":"06-04"},{"start":590.5134545454547,"end":594.408,"text":"哪怕只是微小的進步，都讓我們看到一絲曙光。","segment":"06-04"},{"start":594.408,"end":598.64832,"text":"1958年9月，這是我人生中最喜悅的一天。","segment":"06-05"},{"start":598.64832,"end":603.09056,"text":"測試員尖叫著站了起來，那一批產品的良率竟然突","segment":"06-05"},{"start":603.09056,"end":604.3020799999999,"text":"破了40%。","segment":"06-05"},{"start":604.3020799999999,"end":607.1289599999999,"text":"我們不僅打破了IBM的紀錄，","segment":"06-05"},{"start":607.1289599999999,"end":609.552,"text":"更創造了德儀獲利的奇蹟。","segment":"06-05"},{"start":609.552,"end":613.0618461538462,"text":"聖誕節前，我收到了一份意外的驚喜：","segment":"06-06"},{"start":613.0618461538462,"end":614.7135384615385,"text":"一千美元的花紅。","segment":"06-06"},{"start":614.7135384615385,"end":619.2556923076924,"text":"這在當時是一筆巨款，但更震撼我的是那份被接受","segment":"06-06"},{"start":619.2556923076924,"end":619.4621538461539,"text":"、","segment":"06-06"},{"start":619.4621538461539,"end":624.0043076923077,"text":"被欣賞的榮譽。我知道，我終於在半導體界初試啼","segment":"06-06"},{"start":624.0043076923077,"end":624.4172307692309,"text":"聲，","segment":"06-06"},{"start":624.4172307692309,"end":625.6560000000001,"text":"站穩了腳步。","segment":"06-06"},{"start":625.6560000000001,"end":629.7796363636364,"text":"若沒有這群同舟共濟的夥伴，這奇蹟不會發生。","segment":"06-07"},{"start":629.7796363636364,"end":633.1178181818183,"text":"德儀給了我希凡尼亞從未給過的機會：","segment":"06-07"},{"start":633.1178181818183,"end":634.6887272727274,"text":"一個能理解問題、","segment":"06-07"},{"start":634.6887272727274,"end":638.6160000000001,"text":"能共同承擔風險、並能誠摯欣賞成就的環境。","segment":"06-07"},{"start":638.6160000000001,"end":642.6011428571429,"text":"1958年的德州儀器，正處於一種狂熱的擴張中","segment":"07-01"},{"start":642.6011428571429,"end":642.7822857142858,"text":"。","segment":"07-01"},{"start":642.7822857142858,"end":646.0428571428572,"text":"當我正為了IBM的生產計畫日以繼夜、","segment":"07-01"},{"start":646.0428571428572,"end":648.2165714285715,"text":"在實驗室與工廠間奔波時，","segment":"07-01"},{"start":648.2165714285715,"end":652.2017142857143,"text":"一件驚天動地的大事，正以一種極其平靜的方式，","segment":"07-01"},{"start":652.2017142857143,"end":653.8320000000001,"text":"在我眼前默默發生。","segment":"07-01"},{"start":653.8320000000001,"end":656.5834666666668,"text":"在那段「瘋狂工作」的日子裡，","segment":"07-02"},{"start":656.5834666666668,"end":660.3176000000002,"text":"下午五、六點的咖啡時光是我唯一的喘息。","segment":"07-02"},{"start":660.3176000000002,"end":664.6413333333335,"text":"在那裡，我結識了一位和我幾乎同時加入公司的同","segment":"07-02"},{"start":664.6413333333335,"end":665.0344000000001,"text":"事。","segment":"07-02"},{"start":665.0344000000001,"end":667.5893333333335,"text":"他有著令人印象深刻的外表，","segment":"07-02"},{"start":667.5893333333335,"end":669.5546666666668,"text":"出奇地高、出奇地瘦，","segment":"07-02"},{"start":669.5546666666668,"end":671.5200000000001,"text":"還有一個巨大的頭顱。","segment":"07-02"},{"start":671.5200000000001,"end":675.2464516129033,"text":"他叫傑克·基比。我們同樣來自美國東部，","segment":"07-03"},{"start":675.2464516129033,"end":676.8154838709679,"text":"同樣是新進員工。","segment":"07-03"},{"start":676.8154838709679,"end":680.7380645161292,"text":"當我正為了提高電晶體的良率而焦頭爛額時，","segment":"07-03"},{"start":680.7380645161292,"end":684.6606451612904,"text":"他卻在思考一個當時聽起來像是幻想的計畫：","segment":"07-03"},{"start":684.6606451612904,"end":687.4064516129033,"text":"他想把電晶體、二極體和電阻，","segment":"07-03"},{"start":687.4064516129033,"end":689.7600000000001,"text":"通通放進同一粒矽晶片裡。","segment":"07-03"},{"start":689.7600000000001,"end":692.7303529411765,"text":"那時的我，剛在半導體界小有名聲。","segment":"07-04"},{"start":692.7303529411765,"end":694.7724705882354,"text":"傑克偶爾會問我的意見，","segment":"07-04"},{"start":694.7724705882354,"end":697.9284705882353,"text":"但我聽完後的反應卻是「匪夷所思」。","segment":"07-04"},{"start":697.9284705882353,"end":701.6414117647059,"text":"在那個連做出一顆好電晶體都有困難的年代，","segment":"07-04"},{"start":701.6414117647059,"end":705.5400000000001,"text":"要把整個線路縮小成一粒晶片，我心裡想的是：","segment":"07-04"},{"start":705.5400000000001,"end":708.6960000000001,"text":"這玩意要能實際應用，恐怕還遠得很。","segment":"07-04"},{"start":708.6960000000001,"end":712.2259764705884,"text":"傑克是那種「一分靈感、九分流汗」的人，","segment":"07-05"},{"start":712.2259764705884,"end":714.0838588235296,"text":"富有毅力且鍥而不捨。","segment":"07-05"},{"start":714.0838588235296,"end":717.985411764706,"text":"就在我為NPN良率突破40%而興奮慶功時，","segment":"07-05"},{"start":717.985411764706,"end":722.0727529411765,"text":"他也在這片靜默中，獨自完成了重寫人類資訊革命","segment":"07-05"},{"start":722.0727529411765,"end":724.4880000000002,"text":"的草圖——積體電路的誕生。","segment":"07-05"},{"start":724.4880000000002,"end":728.0112000000001,"text":"當時我並未意識到，那個在走廊跟我喝咖啡、","segment":"07-06"},{"start":728.0112000000001,"end":731.8867200000002,"text":"談論怪異想法的高個子，正在奠定未來資訊世界的","segment":"07-06"},{"start":731.8867200000002,"end":732.4152000000001,"text":"基礎。","segment":"07-06"},{"start":732.4152000000001,"end":736.2907200000002,"text":"歷史往往就是如此：當大部分人正為了「現在」的","segment":"07-06"},{"start":736.2907200000002,"end":737.5238400000002,"text":"產量而拚命時，","segment":"07-06"},{"start":737.5238400000002,"end":739.9900800000001,"text":"偉大的發明家卻在「默默」中，","segment":"07-06"},{"start":739.9900800000001,"end":742.1040000000002,"text":"創造了全人類的「未來」。","segment":"07-06"},{"start":742.1040000000002,"end":746.0225882352943,"text":"1961年春天，總經理夏伯特召見了我。他說：","segment":"08-01"},{"start":746.0225882352943,"end":749.9411764705884,"text":"「Morris，你有潛力角逐未來的研發副總，","segment":"08-01"},{"start":749.9411764705884,"end":753.6816470588237,"text":"但你沒有博士學位，研發人員會在乎。」接著，","segment":"08-01"},{"start":753.6816470588237,"end":757.6002352941179,"text":"他拋出了一個我無法拒絕的機會：德儀將支全薪、","segment":"08-01"},{"start":757.6002352941179,"end":760.2720000000002,"text":"負擔所有學雜費，送我去讀博士。","segment":"08-01"},{"start":760.2720000000002,"end":762.884530120482,"text":"我毫不猶豫地選擇了史丹佛。","segment":"08-02"},{"start":762.884530120482,"end":764.8941686746989,"text":"這一年我剛滿三十歲，","segment":"08-02"},{"start":764.8941686746989,"end":768.5115180722893,"text":"已做了六年事，這不是一次單純的求學，","segment":"08-02"},{"start":768.5115180722893,"end":770.3201927710844,"text":"而是我重圓博士夢、","segment":"08-02"},{"start":770.3201927710844,"end":774.5404337349398,"text":"洗刷恥辱的戰場。我自我定位為業者甚於學生，","segment":"08-02"},{"start":774.5404337349398,"end":776.9520000000001,"text":"我知道這是我事業的延續。","segment":"08-02"},{"start":776.9520000000001,"end":781.5684324324326,"text":"從九月到二月的五個月內，我過著臥薪嘗膽的日子","segment":"08-03"},{"start":781.5684324324326,"end":781.7782702702705,"text":"。","segment":"08-03"},{"start":781.7782702702705,"end":785.3455135135138,"text":"每天從早上八點讀到半夜，沒有休息，","segment":"08-03"},{"start":785.3455135135138,"end":786.6045405405408,"text":"更沒有週末。","segment":"08-03"},{"start":786.6045405405408,"end":790.3816216216219,"text":"這是我生平最用功的時刻，因為我深知，","segment":"08-03"},{"start":790.3816216216219,"end":792.4800000000001,"text":"這一次我絕不能再輸。","segment":"08-03"},{"start":792.4800000000001,"end":796.0965925925927,"text":"我坐在史蓋倫教授辦公室外的等待室。","segment":"08-04"},{"start":796.0965925925927,"end":799.2877037037039,"text":"牆上的電鐘一秒一分地推向十點。","segment":"08-04"},{"start":799.2877037037039,"end":803.9680000000002,"text":"我告訴自己要鎮定，但我的心仍像水桶般一上一下","segment":"08-04"},{"start":803.9680000000002,"end":804.1807407407409,"text":"、","segment":"08-04"},{"start":804.1807407407409,"end":807.371851851852,"text":"激烈地跳躍。當年的MIT陰影，","segment":"08-04"},{"start":807.371851851852,"end":809.7120000000001,"text":"在那一刻如潮水般湧回。","segment":"08-04"},{"start":809.7120000000001,"end":812.6773333333334,"text":"教授問了我「分子增幅器」的原理。","segment":"08-05"},{"start":812.6773333333334,"end":815.6426666666667,"text":"感謝我過去六年在業界的熱狂自學，","segment":"08-05"},{"start":815.6426666666667,"end":819.72,"text":"這題難不倒我。當他在黑板前試圖挑動我的思維邏","segment":"08-05"},{"start":819.72,"end":820.2760000000001,"text":"輯時，","segment":"08-05"},{"start":820.2760000000001,"end":823.056,"text":"我已不再是當年那個畏怯的考生，","segment":"08-05"},{"start":823.056,"end":826.392,"text":"而是一個擁有實戰經驗的半導體工程師。","segment":"08-05"},{"start":826.392,"end":830.1674366197184,"text":"考試通過了。在麻省理工落第的恥辱，","segment":"08-06"},{"start":830.1674366197184,"end":832.6103661971832,"text":"終於在那一刻徹底洗刷。","segment":"08-06"},{"start":832.6103661971832,"end":835.941633802817,"text":"這是我人生中喜悅的一天！那晚，","segment":"08-06"},{"start":835.941633802817,"end":838.8287323943663,"text":"我在舊金山中國城大吃一頓，","segment":"08-06"},{"start":838.8287323943663,"end":842.1600000000001,"text":"那是半年來，我第一次開懷大笑。","segment":"08-06"},{"start":842.1600000000001,"end":846.5640000000001,"text":"1964年春天，我帶著博士學位回到德儀。","segment":"08-07"},{"start":846.5640000000001,"end":851.4084,"text":"我三十二歲，擁有最高學位，更擁有長官的信任。","segment":"08-07"},{"start":851.4084,"end":854.4912,"text":"未來的天地如同德州的大平原，","segment":"08-07"},{"start":854.4912,"end":856.9134,"text":"無限寬廣。我已準備好，","segment":"08-07"},{"start":856.9134,"end":859.7760000000001,"text":"要在這個大時代裡初試啼聲。","segment":"08-07"},{"start":859.7760000000001,"end":864.3668210526316,"text":"1964年三月，我帶著史丹佛的博士學位回到達","segment":"09-01"},{"start":864.3668210526316,"end":864.9928421052632,"text":"拉斯。","segment":"09-01"},{"start":864.9928421052632,"end":868.3316210526316,"text":"那時我三十二歲，擁有了最高學位，","segment":"09-01"},{"start":868.3316210526316,"end":870.4183578947368,"text":"更擁有了長官的信任。","segment":"09-01"},{"start":870.4183578947368,"end":874.1744842105263,"text":"未來的天地如同德州一望無際的大平原，","segment":"09-01"},{"start":874.1744842105263,"end":875.2178526315789,"text":"無限寬廣。","segment":"09-01"},{"start":875.2178526315789,"end":879.6,"text":"我已準備好，要在這個大時代裡再度證明自己。","segment":"09-01"},{"start":879.6,"end":882.4916129032258,"text":"我恢復了舊職，但挑戰接踵而至。","segment":"09-02"},{"start":882.4916129032258,"end":884.0338064516129,"text":"好友呂斯告訴我，","segment":"09-02"},{"start":884.0338064516129,"end":886.7326451612903,"text":"IBM想要一顆高性能電晶體，","segment":"09-02"},{"start":886.7326451612903,"end":889.8170322580645,"text":"但原本的團隊拖了一年多毫無進展。","segment":"09-02"},{"start":889.8170322580645,"end":894.058064516129,"text":"這是我立功的機會，我親自帶領助手主導「新案」","segment":"09-02"},{"start":894.058064516129,"end":894.2508387096774,"text":"，","segment":"09-02"},{"start":894.2508387096774,"end":897.528,"text":"不到兩個月，我們就攻克了技術難關。","segment":"09-02"},{"start":897.528,"end":900.66912,"text":"奇蹟發生了。重返德儀不到兩個月，","segment":"09-03"},{"start":900.66912,"end":903.4176,"text":"呂斯宣布我為「鍺部」總經理。","segment":"09-03"},{"start":903.4176,"end":907.73664,"text":"這是一個巨大的驚喜，更是一個挑戰——那時鍺部","segment":"09-03"},{"start":907.73664,"end":909.3072,"text":"擁有三千名員工，","segment":"09-03"},{"start":909.3072,"end":912.0556799999999,"text":"是德儀營收與獲利最高的部門。","segment":"09-03"},{"start":912.0556799999999,"end":914.01888,"text":"而台下的美國同事們，","segment":"09-03"},{"start":914.01888,"end":917.16,"text":"正好奇地看著這個「中國人」主管。","segment":"09-03"},{"start":917.16,"end":920.5864077669903,"text":"我對他們說：我是抱著**「又自信、","segment":"09-04"},{"start":920.5864077669903,"end":923.4081553398058,"text":"又謙虛」**的心情接受任務。","segment":"09-04"},{"start":923.4081553398058,"end":926.8345631067962,"text":"自信，是因為我懂技術與生產；謙虛，","segment":"09-04"},{"start":926.8345631067962,"end":929.6563106796117,"text":"是因為我還有許多事情要學習。","segment":"09-04"},{"start":929.6563106796117,"end":932.4780582524272,"text":"這段話成功化解了下屬的驚疑，","segment":"09-04"},{"start":932.4780582524272,"end":934.695145631068,"text":"我必須在第一時間證明，","segment":"09-04"},{"start":934.695145631068,"end":937.92,"text":"我能帶領這支龐大的軍隊贏得勝利。","segment":"09-04"},{"start":937.92,"end":941.7204705882352,"text":"成果很快顯現。我們解決的IBM「新案」，","segment":"09-05"},{"start":941.7204705882352,"end":944.9508705882353,"text":"每月為公司帶來一百萬美元的新營收，","segment":"09-05"},{"start":944.9508705882353,"end":947.8012235294117,"text":"以及四十五萬美元的新營業利益。","segment":"09-05"},{"start":947.8012235294117,"end":951.7917176470587,"text":"這宗生意的成功，讓我贏得了最高階層的激賞，","segment":"09-05"},{"start":951.7917176470587,"end":954.072,"text":"也在半導體界站穩了腳步。","segment":"09-05"},{"start":954.072,"end":958.8775652173913,"text":"這一跳，我從工程師正式變成了世界級的經理人。","segment":"09-06"},{"start":958.8775652173913,"end":962.3725217391304,"text":"這是我「管理初試」的戰場。從此，","segment":"09-06"},{"start":962.3725217391304,"end":964.5568695652174,"text":"我不只是在研究技術，","segment":"09-06"},{"start":964.5568695652174,"end":969.144,"text":"我開始學習如何動員資源，在商戰中開疆闢土。","segment":"09-06"},{"start":969.144,"end":973.5075862068966,"text":"一九七○年代初期，德儀已經是世界最大的半導體","segment":"10-01"},{"start":973.5075862068966,"end":974.1026206896552,"text":"公司。","segment":"10-01"},{"start":974.1026206896552,"end":977.4744827586206,"text":"但我心中始終有個疑問：一個總經理，","segment":"10-01"},{"start":977.4744827586206,"end":979.4579310344827,"text":"除了管好生產與技術，","segment":"10-01"},{"start":979.4579310344827,"end":983.4248275862069,"text":"到底該如何「贏」過所有的競爭對手？答案，","segment":"10-01"},{"start":983.4248275862069,"end":986.4,"text":"隨著兩位不速之客的到訪而揭曉。","segment":"10-01"},{"start":986.4,"end":990.1565714285714,"text":"韓德生帶著這套「學習曲線」理論找上門。","segment":"10-02"},{"start":990.1565714285714,"end":992.5291428571428,"text":"他用傑出的口才對我們說：","segment":"10-02"},{"start":992.5291428571428,"end":996.2857142857142,"text":"半導體的單位成本會隨著累積產量而下降。","segment":"10-02"},{"start":996.2857142857142,"end":998.2628571428571,"text":"如果能「先發制人」，","segment":"10-02"},{"start":998.2628571428571,"end":1001.0308571428571,"text":"利用規模優勢擴大市場占有率，","segment":"10-02"},{"start":1001.0308571428571,"end":1003.0079999999999,"text":"就能把對手甩在身後。","segment":"10-02"},{"start":1003.0079999999999,"end":1005.703724137931,"text":"夏伯特指派我作為德儀的代表，","segment":"10-03"},{"start":1005.703724137931,"end":1008.0143448275861,"text":"與貝因密切合作了一年多。","segment":"10-03"},{"start":1008.0143448275861,"end":1010.7100689655172,"text":"那是我一生中最有用的顧問案。","segment":"10-03"},{"start":1010.7100689655172,"end":1013.790896551724,"text":"我們把冷冰冰的數字轉化成洞察力，","segment":"10-03"},{"start":1013.790896551724,"end":1018.0270344827585,"text":"證實了只要不斷累積經驗，成本的下降是可以預測","segment":"10-03"},{"start":1018.0270344827585,"end":1018.2195862068965,"text":"、","segment":"10-03"},{"start":1018.2195862068965,"end":1019.7599999999999,"text":"甚至是被主導的。","segment":"10-03"},{"start":1019.7599999999999,"end":1023.1996893203882,"text":"就在合作結束、貝因準備離職去創辦他自己的公司","segment":"10-04"},{"start":1023.1996893203882,"end":1023.5123883495144,"text":"時，","segment":"10-04"},{"start":1023.5123883495144,"end":1026.3266796116502,"text":"他對我說了一句改變我一生戰略觀的話：","segment":"10-04"},{"start":1026.3266796116502,"end":1029.7663689320386,"text":"「我們都有成長的必要（GrowthImper","segment":"10-04"},{"start":1029.7663689320386,"end":1030.8608155339805,"text":"ative），","segment":"10-04"},{"start":1030.8608155339805,"end":1034.300504854369,"text":"不是嗎？」這是我第一次聽見成長與「必要」連在","segment":"10-04"},{"start":1034.300504854369,"end":1034.7695533980582,"text":"一起，","segment":"10-04"},{"start":1034.7695533980582,"end":1035.8639999999998,"text":"至今仍感新穎。","segment":"10-04"},{"start":1035.8639999999998,"end":1039.1161481481479,"text":"帶著這套理論，我回到積體電路部。","segment":"10-05"},{"start":1039.1161481481479,"end":1040.5389629629626,"text":"在一九七二年，","segment":"10-05"},{"start":1040.5389629629626,"end":1044.807407407407,"text":"我們決定實施瘋狂的策略：無論市場是否缺貨，","segment":"10-05"},{"start":1044.807407407407,"end":1048.8725925925921,"text":"我們對「雙極積體電路」採取每季定期減價。","segment":"10-05"},{"start":1048.8725925925921,"end":1052.3279999999997,"text":"這對競爭對手來說，簡直是判了死刑。","segment":"10-05"},{"start":1052.3279999999997,"end":1056.189333333333,"text":"競爭者們原本就因成本高於我們而疲於奔命，","segment":"10-06"},{"start":1056.189333333333,"end":1059.4714666666664,"text":"現在連未來的利潤空間也被我們鎖死。","segment":"10-06"},{"start":1059.4714666666664,"end":1061.7882666666665,"text":"德儀成功奪取了龍頭地位。","segment":"10-06"},{"start":1061.7882666666665,"end":1065.2634666666665,"text":"這不僅是數字的勝利，更是策略的勝利：","segment":"10-06"},{"start":1065.2634666666665,"end":1067.0010666666665,"text":"「成長是必要的」，","segment":"10-06"},{"start":1067.0010666666665,"end":1069.7039999999997,"text":"這成了我商戰思維的鋼鐵骨架。","segment":"10-06"},{"start":1069.7039999999997,"end":1074.1139999999998,"text":"多年後，我也將這套對「學習曲線」的洞察帶到了","segment":"10-07"},{"start":1074.1139999999998,"end":1074.7153636363635,"text":"台灣。","segment":"10-07"},{"start":1074.7153636363635,"end":1079.1253636363635,"text":"台積電「為客戶創造價值、賺取合理價差」的底氣","segment":"10-07"},{"start":1079.1253636363635,"end":1079.325818181818,"text":"，","segment":"10-07"},{"start":1079.325818181818,"end":1082.7335454545453,"text":"正是來自這場三十多年前的商戰洗禮。","segment":"10-07"},{"start":1082.7335454545453,"end":1084.3371818181815,"text":"當年的那條曲線，","segment":"10-07"},{"start":1084.3371818181815,"end":1087.3439999999998,"text":"至今仍在改變全球半導體的版圖。","segment":"10-07"},{"start":1087.3439999999998,"end":1089.9554430379744,"text":"一九七二年，德儀正處於巔峰，","segment":"11-01"},{"start":1089.9554430379744,"end":1092.3803544303794,"text":"營收即將跨過十億美元大關。","segment":"11-01"},{"start":1092.3803544303794,"end":1096.484050632911,"text":"然而，在這片光明背後，一個致命的交集正在形成","segment":"11-01"},{"start":1096.484050632911,"end":1096.6705822784807,"text":"：","segment":"11-01"},{"start":1096.6705822784807,"end":1099.4685569620249,"text":"董事長夏伯特「大有為」的野心，","segment":"11-01"},{"start":1099.4685569620249,"end":1102.08,"text":"遇上了「消費者產品」的誘惑。","segment":"11-01"},{"start":1102.08,"end":1104.6418666666666,"text":"看到計算機售價兩百多美元，","segment":"11-02"},{"start":1104.6418666666666,"end":1106.8096,"text":"而裡面的晶片才幾十塊，","segment":"11-02"},{"start":1106.8096,"end":1111.1450666666667,"text":"公司高層心動了。他們想：既然心臟是我們做的，","segment":"11-02"},{"start":1111.1450666666667,"end":1114.1010666666666,"text":"為什麼不乾脆自己把殼也裝上去？","segment":"11-02"},{"start":1114.1010666666666,"end":1116.4658666666667,"text":"德儀宣示進入消費者市場，","segment":"11-02"},{"start":1116.4658666666667,"end":1119.816,"text":"卻沒看到那是個入場障礙極低的泡沫。","segment":"11-02"},{"start":1119.816,"end":1124.1735172413794,"text":"隨著「消費者集團」成立，我的半導體部成了它的","segment":"11-03"},{"start":1124.1735172413794,"end":1125.5600000000002,"text":"「私人庫房」。","segment":"11-03"},{"start":1125.5600000000002,"end":1129.1252413793104,"text":"夏伯特欽定：服務內部客戶是首要任務。","segment":"11-03"},{"start":1129.1252413793104,"end":1132.2943448275862,"text":"這讓原本應該衝刺全球市場的部隊，","segment":"11-03"},{"start":1132.2943448275862,"end":1135.2653793103448,"text":"被迫回過頭來服務一個年年虧損、","segment":"11-03"},{"start":1135.2653793103448,"end":1137.048,"text":"與技術脫節的累贅。","segment":"11-03"},{"start":1137.048,"end":1141.74,"text":"到了七○年代中後期，我們在記憶體和微處理器上","segment":"11-04"},{"start":1141.74,"end":1143.446181818182,"text":"正跟英特爾死戰。","segment":"11-04"},{"start":1143.446181818182,"end":1148.138181818182,"text":"我想將研發經費提高到5.5%，卻屢次被駁回。","segment":"11-04"},{"start":1148.138181818182,"end":1151.977090909091,"text":"公司賺的錢全被拿去填消費者產品的坑。","segment":"11-04"},{"start":1151.977090909091,"end":1155.816,"text":"我眼睜睜看著德儀失去了半導體的靈魂。","segment":"11-04"},{"start":1155.816,"end":1160.200405063291,"text":"這是多麼絕望的五、六年！我的上司彪希在會議上","segment":"11-05"},{"start":1160.200405063291,"end":1162.1933164556963,"text":"公開批評我的領導力，","segment":"11-05"},{"start":1162.1933164556963,"end":1165.3819746835443,"text":"而他的上司夏伯特則在旁頷首同意。","segment":"11-05"},{"start":1165.3819746835443,"end":1166.777012658228,"text":"這是一場歹劇，","segment":"11-05"},{"start":1166.777012658228,"end":1171.161417721519,"text":"他們不再是我的支持者，而是我權力之路上的批判","segment":"11-05"},{"start":1171.161417721519,"end":1171.56,"text":"者。","segment":"11-05"},{"start":1171.56,"end":1175.607,"text":"我在德儀的二十五年，有過黃金般的晨潮，","segment":"11-06"},{"start":1175.607,"end":1177.737,"text":"也有過黃銅般的午潮。","segment":"11-06"},{"start":1177.737,"end":1181.3580000000002,"text":"但現在，迎面而來的是鉛一般的黃昏。","segment":"11-06"},{"start":1181.3580000000002,"end":1183.4880000000003,"text":"德儀不再給我黃金了，","segment":"11-06"},{"start":1183.4880000000003,"end":1188.1740000000002,"text":"我必須去別的地方尋找。哪怕是在我五十四歲的高","segment":"11-06"},{"start":1188.1740000000002,"end":1188.6,"text":"齡。","segment":"11-06"},{"start":1188.6,"end":1192.6846666666665,"text":"一九八二年九月，我依然坐在「品質總監」的辦公","segment":"12-01"},{"start":1192.6846666666665,"end":1193.2416666666666,"text":"室裡，","segment":"12-01"},{"start":1193.2416666666666,"end":1196.7693333333332,"text":"試圖擦亮這段鉛一般的黃昏。就在那一天，","segment":"12-01"},{"start":1196.7693333333332,"end":1198.0689999999997,"text":"一封沒有預警、","segment":"12-01"},{"start":1198.0689999999997,"end":1201.9679999999998,"text":"沒有解釋的人事通知信，掉落在我的辦公桌上。","segment":"12-01"},{"start":1201.9679999999998,"end":1206.6703058823527,"text":"信上寫著：我的薪資不變，但職階從42級降到了","segment":"12-02"},{"start":1206.6703058823527,"end":1207.5252705882351,"text":"38級。","segment":"12-02"},{"start":1207.5252705882351,"end":1211.800094117647,"text":"42級是僅次於公司總裁的地位，而38級，","segment":"12-02"},{"start":1211.800094117647,"end":1215.4336941176468,"text":"是我十五年前剛當上副總裁時的職等。","segment":"12-02"},{"start":1215.4336941176468,"end":1217.1436235294116,"text":"這不僅僅是降級，","segment":"12-02"},{"start":1217.1436235294116,"end":1220.1359999999997,"text":"更是駱駝背上的最後一根稻草。","segment":"12-02"},{"start":1220.1359999999997,"end":1223.8280412371132,"text":"我在德儀二十五年，有過黃金般的晨潮，","segment":"12-03"},{"start":1223.8280412371132,"end":1225.8791752577317,"text":"也有過黃銅般的午潮。","segment":"12-03"},{"start":1225.8791752577317,"end":1229.1609896907214,"text":"但在那一刻，我清楚地看到了未來：","segment":"12-03"},{"start":1229.1609896907214,"end":1232.0325773195873,"text":"獎金和股票承購權將與我絕緣，","segment":"12-03"},{"start":1232.0325773195873,"end":1234.6990515463915,"text":"我隨時可能被要求提早退休。","segment":"12-03"},{"start":1234.6990515463915,"end":1236.75018556701,"text":"這不是我想要的命運。","segment":"12-03"},{"start":1236.75018556701,"end":1240.0319999999997,"text":"我對德儀，已經「債還、緣盡」了。","segment":"12-03"},{"start":1240.0319999999997,"end":1243.9403478260867,"text":"一九八三年十月，等最後一批股票承購權到期後，","segment":"12-04"},{"start":1243.9403478260867,"end":1247.8486956521738,"text":"我走向夏伯特的辦公室。他問我：「你要做什麼？","segment":"12-04"},{"start":1247.8486956521738,"end":1250.8687826086955,"text":"」我直言不諱：「我要經營一個事業，","segment":"12-04"},{"start":1250.8687826086955,"end":1252.467652173913,"text":"而不是做一個幕僚。","segment":"12-04"},{"start":1252.467652173913,"end":1256.1983478260868,"text":"」他遺憾地看著我說：「我們沒有這樣的空缺。","segment":"12-04"},{"start":1256.1983478260868,"end":1256.3759999999997,"text":"」","segment":"12-04"},{"start":1256.3759999999997,"end":1260.5696551724136,"text":"那一天，我以十分感傷、卻也十分真誠的心情與他","segment":"12-05"},{"start":1260.5696551724136,"end":1261.1415172413792,"text":"道別。","segment":"12-05"},{"start":1261.1415172413792,"end":1265.335172413793,"text":"走出大樓時，一位老同事在走廊抱住我的肩膀說：","segment":"12-05"},{"start":1265.335172413793,"end":1268.9569655172413,"text":"「可惜啊，天下無不散的筵席。」我知道，","segment":"12-05"},{"start":1268.9569655172413,"end":1271.6256551724136,"text":"我已變成了一個「過河卒子」，","segment":"12-05"},{"start":1271.6256551724136,"end":1272.9599999999998,"text":"只能拚命向前。","segment":"12-05"},{"start":1272.9599999999998,"end":1277.7119999999998,"text":"五十二歲，我失去了工作，也結束了三十年的婚姻","segment":"12-06"},{"start":1277.7119999999998,"end":1277.9279999999997,"text":"。","segment":"12-06"},{"start":1277.9279999999997,"end":1282.6799999999996,"text":"但電話鈴聲很快又響了。命運正帶著另一場約會，","segment":"12-06"},{"start":1282.6799999999996,"end":1285.2719999999997,"text":"在太平洋的另一頭等著我。","segment":"12-06"},{"start":1285.2719999999997,"end":1289.373333333333,"text":"1985年8月21日，我接任工研院院長的第二","segment":"13-01"},{"start":1289.373333333333,"end":1289.7461818181814,"text":"天，","segment":"13-01"},{"start":1289.7461818181814,"end":1293.8475151515147,"text":"難題就擺在了桌上。三家華裔美商創辦的IC設計","segment":"13-01"},{"start":1293.8475151515147,"end":1294.4067878787873,"text":"公司，","segment":"13-01"},{"start":1294.4067878787873,"end":1297.948848484848,"text":"正要求政府出資為每家公司蓋一座晶圓廠。","segment":"13-01"},{"start":1297.948848484848,"end":1300.5587878787874,"text":"這在當時看來是個無理的要求，","segment":"13-01"},{"start":1300.5587878787874,"end":1303.7279999999996,"text":"但我必須給出一個更宏大的「交代」。","segment":"13-01"},{"start":1303.7279999999996,"end":1308.1878058252423,"text":"從那一天到9月4日，這十四天是我一生中創新價","segment":"13-02"},{"start":1308.1878058252423,"end":1309.606834951456,"text":"值最高的兩週。","segment":"13-02"},{"start":1309.606834951456,"end":1312.647611650485,"text":"我冷靜分析：台灣的設計能力低、","segment":"13-02"},{"start":1312.647611650485,"end":1314.4720776699025,"text":"研發落後世界三年，","segment":"13-02"},{"start":1314.4720776699025,"end":1318.9318834951453,"text":"唯一強項是製造良率。如果我們像英特爾或德儀那","segment":"13-02"},{"start":1318.9318834951453,"end":1320.350912621359,"text":"樣做垂直整合，","segment":"13-02"},{"start":1320.350912621359,"end":1324.6079999999997,"text":"必敗無疑。我需要一個全世界都沒見過的模式。","segment":"13-02"},{"start":1324.6079999999997,"end":1327.2599999999998,"text":"答案就是「專業晶圓代工」。","segment":"13-03"},{"start":1327.2599999999998,"end":1329.5039999999997,"text":"我們不設計自己的產品，","segment":"13-03"},{"start":1329.5039999999997,"end":1333.9919999999997,"text":"不跟客戶競爭。我們要成為別人的「實質晶圓廠」","segment":"13-03"},{"start":1333.9919999999997,"end":1334.1959999999997,"text":"，","segment":"13-03"},{"start":1334.1959999999997,"end":1338.4799999999998,"text":"把製造做到極致。這個想法在當時是一場豪賭，","segment":"13-03"},{"start":1338.4799999999998,"end":1342.9679999999996,"text":"因為在那之前，世界上根本沒有這樣的市場存在。","segment":"13-03"},{"start":1342.9679999999996,"end":1347.1608510638293,"text":"9月10日，我向俞國華院長簡報。我告訴他，","segment":"13-04"},{"start":1347.1608510638293,"end":1349.7564255319144,"text":"這是一個高代價的長期賭博。","segment":"13-04"},{"start":1349.7564255319144,"end":1352.1523404255313,"text":"我們要走出一條全新的路：","segment":"13-04"},{"start":1352.1523404255313,"end":1355.945872340425,"text":"專門為別人製造晶圓。俞院長聽得很專心，","segment":"13-04"},{"start":1355.945872340425,"end":1358.9407659574463,"text":"他在這個「專業代工」的方案中，","segment":"13-04"},{"start":1358.9407659574463,"end":1361.7359999999996,"text":"看到了台灣半導體唯一的生機。","segment":"13-04"},{"start":1361.7359999999996,"end":1365.5341463414632,"text":"這是我三十幾年來第一篇正式的中文公文。","segment":"13-05"},{"start":1365.5341463414632,"end":1367.1333658536582,"text":"我當時並不知道，","segment":"13-05"},{"start":1367.1333658536582,"end":1371.5312195121949,"text":"這短短兩週的思維火花，即將重寫全球半導體的遊","segment":"13-05"},{"start":1371.5312195121949,"end":1372.3308292682925,"text":"戲規則。","segment":"13-05"},{"start":1372.3308292682925,"end":1375.3293658536584,"text":"我赴了這場命運的約會，而籌碼，","segment":"13-05"},{"start":1375.3293658536584,"end":1378.1279999999997,"text":"就是這套前無古人的商業模式。","segment":"13-05"},{"start":1378.1279999999997,"end":1382.1671999999996,"text":"多年後我才明白，當初如果沒有那兩週的「豪賭」","segment":"13-06"},{"start":1382.1671999999996,"end":1382.3507999999997,"text":"，","segment":"13-06"},{"start":1382.3507999999997,"end":1385.1047999999996,"text":"台積電絕不會成為今日的台積電。","segment":"13-06"},{"start":1385.1047999999996,"end":1388.2259999999997,"text":"命運有時不在於你擁有的資源有多少，","segment":"13-06"},{"start":1388.2259999999997,"end":1390.6127999999997,"text":"而在於你是否敢在關鍵時刻，","segment":"13-06"},{"start":1390.6127999999997,"end":1392.8159999999998,"text":"選擇一條沒人走過的賽道。","segment":"13-06"},{"start":1392.8159999999998,"end":1396.2521379310342,"text":"一九八六年一月，台積電還在籌備階段。","segment":"14-01"},{"start":1396.2521379310342,"end":1398.1611034482755,"text":"在經建會的審議會上，","segment":"14-01"},{"start":1398.1611034482755,"end":1402.3608275862066,"text":"中央銀行張繼正總裁聽完我的簡報後，問了一句：","segment":"14-01"},{"start":1402.3608275862066,"end":1406.3696551724136,"text":"「你憑什麼與美國、日本公司競爭？」我回答：","segment":"14-01"},{"start":1406.3696551724136,"end":1409.4239999999998,"text":"「我們憑好的服務、憑商譽競爭。」","segment":"14-01"},{"start":1409.4239999999998,"end":1412.2936774193545,"text":"張總裁聽完哈哈大笑，他說：「哈，","segment":"14-02"},{"start":1412.2936774193545,"end":1414.266580645161,"text":"台灣公司要憑商譽競爭，","segment":"14-02"},{"start":1414.266580645161,"end":1417.3156129032254,"text":"倒是第一次聽聞。」那種譏諷的語氣，","segment":"14-02"},{"start":1417.3156129032254,"end":1420.5439999999996,"text":"反映了當時環境對「誠信」兩字的陌生。","segment":"14-02"},{"start":1420.5439999999996,"end":1424.4898064516126,"text":"但我心裡清楚，對於只做「客製品」的代工業來說","segment":"14-02"},{"start":1424.4898064516126,"end":1424.6691612903223,"text":"，","segment":"14-02"},{"start":1424.6691612903223,"end":1426.1039999999998,"text":"商譽就是命根子。","segment":"14-02"},{"start":1426.1039999999998,"end":1429.7215999999999,"text":"一九八七年公司開張，我們一無所有，","segment":"14-03"},{"start":1429.7215999999999,"end":1431.2112,"text":"只有兩塊基石：","segment":"14-03"},{"start":1431.2112,"end":1434.616,"text":"製造優越與客戶信任。我立下鐵律：","segment":"14-03"},{"start":1434.616,"end":1436.5312,"text":"「不與客戶競爭」。","segment":"14-03"},{"start":1436.5312,"end":1441.2127999999998,"text":"我們絕不設計自己的產品。在那個半導體春秋戰國","segment":"14-03"},{"start":1441.2127999999998,"end":1441.8511999999998,"text":"時代，","segment":"14-03"},{"start":1441.8511999999998,"end":1445.2559999999999,"text":"誠信變成了我們最難得的競爭武器。","segment":"14-03"},{"start":1445.2559999999999,"end":1448.3218064516127,"text":"試煉很快就來了。一九八七年底，","segment":"14-04"},{"start":1448.3218064516127,"end":1450.570064516129,"text":"英特爾的葛洛夫來視察。","segment":"14-04"},{"start":1450.570064516129,"end":1454.0446451612902,"text":"當時沒人相信台灣能做出世界級晶片。","segment":"14-04"},{"start":1454.0446451612902,"end":1456.088516129032,"text":"他在一廠巡視後驚呼：","segment":"14-04"},{"start":1456.088516129032,"end":1459.7674838709677,"text":"「居然你們真的有一座運轉中的六吋廠！","segment":"14-04"},{"start":1459.7674838709677,"end":1460.7894193548386,"text":"」這一刻，","segment":"14-04"},{"start":1460.7894193548386,"end":1464.264,"text":"我們通過了全世界最嚴苛的技術認證。","segment":"14-04"},{"start":1464.264,"end":1467.4319999999998,"text":"雖然初期的英特爾訂單讓我們賠錢，","segment":"14-05"},{"start":1467.4319999999998,"end":1469.2139999999997,"text":"但我們咬牙做下去。","segment":"14-05"},{"start":1469.2139999999997,"end":1472.1839999999997,"text":"我們證明了：只要台積電答應的，","segment":"14-05"},{"start":1472.1839999999997,"end":1474.3619999999999,"text":"必定不計代價全力以赴。","segment":"14-05"},{"start":1474.3619999999999,"end":1476.936,"text":"這份信任，讓英特爾、高通、","segment":"14-05"},{"start":1476.936,"end":1481.292,"text":"博通後來陸續把台積電當作他們「實質上的晶圓廠","segment":"14-05"},{"start":1481.292,"end":1481.6879999999999,"text":"」。","segment":"14-05"},{"start":1481.6879999999999,"end":1485.8710399999998,"text":"九○年代中期，我親自寫下十條經營理念。","segment":"14-06"},{"start":1485.8710399999998,"end":1487.6323199999997,"text":"第一條就是誠信，","segment":"14-06"},{"start":1487.6323199999997,"end":1492.4758399999996,"text":"也就是說真話、不誇張、不作秀。有人說我頑固，","segment":"14-06"},{"start":1492.4758399999996,"end":1497.3193599999995,"text":"但我知道，這不是迂腐，而是台積電能夠屹立不搖","segment":"14-06"},{"start":1497.3193599999995,"end":1498.1999999999998,"text":"的靈魂。","segment":"14-06"},{"start":1498.1999999999998,"end":1502.2319999999997,"text":"三十多年後，台積電已是世界「必需」的公司。","segment":"14-07"},{"start":1502.2319999999997,"end":1505.1119999999999,"text":"當初那些質疑商譽的人早已老去，","segment":"14-07"},{"start":1505.1119999999999,"end":1506.84,"text":"而我們守護的誠信，","segment":"14-07"},{"start":1506.84,"end":1510.2959999999998,"text":"已成為全球半導體版圖上最堅固的堡壘。","segment":"14-07"},{"start":1510.2959999999998,"end":1514.0312195121949,"text":"曾有位分析師這樣嘲諷德儀當年的迷途：","segment":"15-01"},{"start":1514.0312195121949,"end":1515.2762926829266,"text":"「巨山咆哮，","segment":"15-01"},{"start":1515.2762926829266,"end":1519.2190243902437,"text":"出來的卻是一隻老鼠。」那種失焦的痛苦，","segment":"15-01"},{"start":1519.2190243902437,"end":1520.6716097560973,"text":"我親身經歷過。","segment":"15-01"},{"start":1520.6716097560973,"end":1525.2368780487802,"text":"所以我決定，台積電這座山，一定要專注於製造，","segment":"15-01"},{"start":1525.2368780487802,"end":1527.312,"text":"讓它真正地咆哮起來。","segment":"15-01"},{"start":1527.312,"end":1530.8799999999999,"text":"九○年代，一場寧靜的革命在矽谷爆發。","segment":"15-02"},{"start":1530.8799999999999,"end":1535.2408888888888,"text":"人類的創業精神催生了數百家「無晶圓廠」設計公","segment":"15-02"},{"start":1535.2408888888888,"end":1535.6373333333331,"text":"司。","segment":"15-02"},{"start":1535.6373333333331,"end":1538.8088888888888,"text":"他們沒有巨額資本蓋廠，而台積電，","segment":"15-02"},{"start":1538.8088888888888,"end":1540.791111111111,"text":"就是他們唯一的依靠，","segment":"15-02"},{"start":1540.791111111111,"end":1543.368,"text":"是他們「實質上的晶圓廠」。","segment":"15-02"},{"start":1543.368,"end":1547.8966153846154,"text":"一九九○年底，我帶著主管們對著牆壁大聲疾呼：","segment":"15-03"},{"start":1547.8966153846154,"end":1552.425230769231,"text":"「一百億！一百億！」當時這聽起來像個瘋狂的夢","segment":"15-03"},{"start":1552.425230769231,"end":1552.631076923077,"text":"，","segment":"15-03"},{"start":1552.631076923077,"end":1556.1304615384615,"text":"但我們知道，蓽路藍縷的時代結束了，","segment":"15-03"},{"start":1556.1304615384615,"end":1557.9830769230769,"text":"台積電的黃金時代，","segment":"15-03"},{"start":1557.9830769230769,"end":1559.424,"text":"正在轉彎角上。","segment":"15-03"},{"start":1559.424,"end":1564.2954285714286,"text":"接下來的十年，我們開始了瘋狂的追逐。在新竹、","segment":"15-04"},{"start":1564.2954285714286,"end":1569.1668571428572,"text":"在南科，挖土機從未停過。我們十年內產能增加了","segment":"15-04"},{"start":1569.1668571428572,"end":1570.0525714285716,"text":"十六倍。","segment":"15-04"},{"start":1570.0525714285716,"end":1574.481142857143,"text":"有人譏笑我在南科四千億的投資是「膨風」，","segment":"15-04"},{"start":1574.481142857143,"end":1578.024,"text":"但我相信，市場的咆哮才剛剛開始。","segment":"15-04"},{"start":1578.024,"end":1580.9421176470587,"text":"一九九七年，台積電在紐約上市。","segment":"15-05"},{"start":1580.9421176470587,"end":1583.2766117647056,"text":"我們不再只是台灣的公司，","segment":"15-05"},{"start":1583.2766117647056,"end":1586.9728941176468,"text":"我們進入了全球資本市場的海洋。那一刻，","segment":"15-05"},{"start":1586.9728941176468,"end":1591.2527999999998,"text":"我心中那柄懸掛多年的「達摩克利斯之劍」終於消","segment":"15-05"},{"start":1591.2527999999998,"end":1591.641882352941,"text":"失，","segment":"15-05"},{"start":1591.641882352941,"end":1594.56,"text":"我們擁有了掌握自己命運的底氣。","segment":"15-05"},{"start":1594.56,"end":1599.0726399999999,"text":"九○年代的咆哮，奠定了台積電世界「必需」的地","segment":"15-06"},{"start":1599.0726399999999,"end":1599.4828799999998,"text":"位。","segment":"15-06"},{"start":1599.4828799999998,"end":1602.1494399999997,"text":"這不僅是營收與利潤的跳躍，","segment":"15-06"},{"start":1602.1494399999997,"end":1604.6108799999997,"text":"更是商業模式的徹底成局。","segment":"15-06"},{"start":1604.6108799999997,"end":1607.6876799999998,"text":"巨山依舊在咆哮，而這次出來的，","segment":"15-06"},{"start":1607.6876799999998,"end":1609.944,"text":"是改變世界的護國神山。","segment":"15-06"},{"start":1609.944,"end":1613.2723636363637,"text":"一九九○年代，台積電的技術進步神速，","segment":"16-01"},{"start":1613.2723636363637,"end":1614.7516363636364,"text":"我們在十四年內，","segment":"16-01"},{"start":1614.7516363636364,"end":1618.8196363636364,"text":"走過了九個技術世代。雖然那時我們已趕上九成以","segment":"16-01"},{"start":1618.8196363636364,"end":1620.298909090909,"text":"上的半導體公司，","segment":"16-01"},{"start":1620.298909090909,"end":1622.8876363636364,"text":"但我心裡知道，若要真正成局，","segment":"16-01"},{"start":1622.8876363636364,"end":1624.7367272727272,"text":"我們不能只當跟隨者，","segment":"16-01"},{"start":1624.7367272727272,"end":1626.216,"text":"必須成為領先者。","segment":"16-01"},{"start":1626.216,"end":1629.9561702127658,"text":"蔣尚義報到的第一天，我開門見山地要求：","segment":"16-02"},{"start":1629.9561702127658,"end":1631.7278297872338,"text":"台積電的研發水準，","segment":"16-02"},{"start":1631.7278297872338,"end":1635.8617021276593,"text":"必須拉到全球領先地位。他當時聽了非常驚愕，","segment":"16-02"},{"start":1635.8617021276593,"end":1640.1924255319148,"text":"回答說領先者的研發投資，往往是第二名的三倍。","segment":"16-02"},{"start":1640.1924255319148,"end":1644.5231489361702,"text":"但我很堅持，因為這是台積電邁向頂峰的唯一活路","segment":"16-02"},{"start":1644.5231489361702,"end":1644.7199999999998,"text":"。","segment":"16-02"},{"start":1644.7199999999998,"end":1648.664096385542,"text":"一九九九年，當時的半導體巨人ＩＢＭ向我們招手","segment":"16-03"},{"start":1648.664096385542,"end":1648.8433734939758,"text":"，","segment":"16-03"},{"start":1648.8433734939758,"end":1651.5325301204819,"text":"提議共同開發○．一三微米製程。","segment":"16-03"},{"start":1651.5325301204819,"end":1653.504578313253,"text":"這對當時的台積電來說，","segment":"16-03"},{"start":1653.504578313253,"end":1657.4486746987952,"text":"是一個巨大的技術誘惑，因為ＩＢＭ在那時仍擁有","segment":"16-03"},{"start":1657.4486746987952,"end":1659.6,"text":"如「神」一般的技術形象。","segment":"16-03"},{"start":1659.6,"end":1663.6575652173913,"text":"但令我欣慰且驚喜的是，我的兩位大將曾繁城與蔣","segment":"16-04"},{"start":1663.6575652173913,"end":1664.2108695652173,"text":"尚義，","segment":"16-04"},{"start":1664.2108695652173,"end":1667.3462608695652,"text":"甚至沒有問我，就直接拒絕了ＩＢＭ。","segment":"16-04"},{"start":1667.3462608695652,"end":1670.2972173913042,"text":"他們深知技術是半導體公司的靈魂，","segment":"16-04"},{"start":1670.2972173913042,"end":1674.3547826086956,"text":"一旦選擇「合作開發」，我們就得送團隊去遠方聽","segment":"16-04"},{"start":1674.3547826086956,"end":1675.0925217391305,"text":"命於人，","segment":"16-04"},{"start":1675.0925217391305,"end":1676.568,"text":"從此失去自主性。","segment":"16-04"},{"start":1676.568,"end":1680.9194482758621,"text":"ＩＢＭ轉身找了我們的競爭者聯電合作。幾年後，","segment":"16-05"},{"start":1680.9194482758621,"end":1685.2708965517243,"text":"聯電董事長坦承，與ＩＢＭ的結盟讓他們栽了一個","segment":"16-05"},{"start":1685.2708965517243,"end":1686.0620689655173,"text":"大跟頭。","segment":"16-05"},{"start":1686.0620689655173,"end":1689.424551724138,"text":"而我們，因為堅持了孤獨的自主研發，","segment":"16-05"},{"start":1689.424551724138,"end":1691.9958620689656,"text":"終於在○．一三微米戰役中，","segment":"16-05"},{"start":1691.9958620689656,"end":1693.776,"text":"看見了頂峰的風景。","segment":"16-05"},{"start":1693.776,"end":1697.9851267605634,"text":"這場拒絕誘惑的技術豪賭，鞏固了我們「技術自主","segment":"16-06"},{"start":1697.9851267605634,"end":1698.9417464788733,"text":"」的靈魂。","segment":"16-06"},{"start":1698.9417464788733,"end":1701.620281690141,"text":"這讓我明白：一個公司的命運，","segment":"16-06"},{"start":1701.620281690141,"end":1703.5335211267607,"text":"取決於你在誘惑面前，","segment":"16-06"},{"start":1703.5335211267607,"end":1707.3600000000001,"text":"是否依然記得自己是誰，以及你要去往哪裡。","segment":"16-06"},{"start":1707.3600000000001,"end":1710.0833142857143,"text":"二○○五年，我七十四歲了。","segment":"17-01"},{"start":1710.0833142857143,"end":1712.1781714285714,"text":"當時台積電如日中天，","segment":"17-01"},{"start":1712.1781714285714,"end":1716.1584,"text":"我看不到一片烏雲，決定釋出執行長職務，","segment":"17-01"},{"start":1716.1584,"end":1717.6248,"text":"由蔡力行接任。","segment":"17-01"},{"start":1717.6248,"end":1721.8145142857143,"text":"我原本以為，這是我邁向完全退休的第一步。","segment":"17-01"},{"start":1721.8145142857143,"end":1722.0240000000001,"text":",","segment":"17-01"},{"start":1722.0240000000001,"end":1725.6076363636364,"text":"沒想到，二○○八年金融海嘯席捲全球。","segment":"17-02"},{"start":1725.6076363636364,"end":1729.1912727272727,"text":"台積電的營收在短短兩季內萎縮了一半。","segment":"17-02"},{"start":1729.1912727272727,"end":1733.5712727272728,"text":"面對這場史無前例的風暴，當時的管理團隊做出了","segment":"17-02"},{"start":1733.5712727272728,"end":1735.562181818182,"text":"一個讓我痛心的決定：","segment":"17-02"},{"start":1735.562181818182,"end":1739.544,"text":"以「績效評估」為名，資遣了八百多名同仁。","segment":"17-02"},{"start":1739.544,"end":1743.588292682927,"text":"我在德儀時期就堅決反對以績效作為裁員手段。","segment":"17-03"},{"start":1743.588292682927,"end":1747.6325853658539,"text":"看到同仁們在我的公寓門口高喊「企業巨無霸，","segment":"17-03"},{"start":1747.6325853658539,"end":1751.8694634146343,"text":"說謊欺負人」，我深感痛心。這不僅是勞資糾紛，","segment":"17-03"},{"start":1751.8694634146343,"end":1755.336,"text":"更是台積電「誠信正直」價值觀的崩塌。","segment":"17-03"},{"start":1755.336,"end":1759.014065934066,"text":"我太太Sophie為了這件事徹夜未眠。","segment":"17-04"},{"start":1759.014065934066,"end":1759.981978021978,"text":"清晨六點，","segment":"17-04"},{"start":1759.981978021978,"end":1764.240791208791,"text":"她獨自去買了幾十份早餐，送到家門口的小公園慰","segment":"17-04"},{"start":1764.240791208791,"end":1765.595868131868,"text":"問抗爭的同仁。","segment":"17-04"},{"start":1765.595868131868,"end":1769.2739340659339,"text":"那一刻，她的人文關懷軟化了堅硬的對峙，","segment":"17-04"},{"start":1769.2739340659339,"end":1772.3712527472526,"text":"也讓我看到了解決問題的唯一出路：","segment":"17-04"},{"start":1772.3712527472526,"end":1772.952,"text":"誠信。","segment":"17-04"},{"start":1772.952,"end":1777.132,"text":"五月二十日，我對全體同仁發表錄影談話。","segment":"17-05"},{"start":1777.132,"end":1778.0120000000002,"text":"我宣布：","segment":"17-05"},{"start":1778.0120000000002,"end":1781.5320000000002,"text":"邀請所有被離職同仁回任。我重申：","segment":"17-05"},{"start":1781.5320000000002,"end":1785.0520000000001,"text":"「台積人是台積電最重要的資產」，","segment":"17-05"},{"start":1785.0520000000001,"end":1788.352,"text":"績效評估絕不是遣散同仁的手段。","segment":"17-05"},{"start":1788.352,"end":1790.332,"text":"台積電必須說真話，","segment":"17-05"},{"start":1790.332,"end":1791.432,"text":"做對的事。","segment":"17-05"},{"start":1791.432,"end":1795.683076923077,"text":"為了挽回企業靈魂，我決定在七十八歲的高齡收回","segment":"17-06"},{"start":1795.683076923077,"end":1796.8424615384615,"text":"執行長職務。","segment":"17-06"},{"start":1796.8424615384615,"end":1800.9003076923077,"text":"這是我「老驥伏櫪」的開始。我要向世界證明，","segment":"17-06"},{"start":1800.9003076923077,"end":1805.1513846153846,"text":"台積電的成功不只是數字，更是對「誠信正直」價","segment":"17-06"},{"start":1805.1513846153846,"end":1806.504,"text":"值的絕對守護。","segment":"17-06"},{"start":1806.504,"end":1810.0438208955222,"text":"這次回歸，讓我明白：一個偉大的公司，","segment":"17-07"},{"start":1810.0438208955222,"end":1812.4037014925373,"text":"在危機時刻最不該放棄的，","segment":"17-07"},{"start":1812.4037014925373,"end":1816.1401791044775,"text":"就是它最初建構的那塊基石。當誠信回歸，","segment":"17-07"},{"start":1816.1401791044775,"end":1819.483343283582,"text":"台積電才真正具備了攀向巔峰的底氣。","segment":"17-07"},{"start":1819.483343283582,"end":1819.6799999999998,"text":",","segment":"17-07"},{"start":1819.6799999999998,"end":1824.1798918918917,"text":"蘋果自一九七六年成立以來，就是科技界的傳奇。","segment":"18-01"},{"start":1824.1798918918917,"end":1828.475243243243,"text":"二○○七年智慧型手機問世，徹底改變了世界。","segment":"18-01"},{"start":1828.475243243243,"end":1831.13427027027,"text":"當時，蘋果晶片找三星代工，","segment":"18-01"},{"start":1831.13427027027,"end":1833.5887567567565,"text":"但隨著三星也開始做手機，","segment":"18-01"},{"start":1833.5887567567565,"end":1837.2704864864863,"text":"蘋果的處境變得尷尬：它的主要供應商，","segment":"18-01"},{"start":1837.2704864864863,"end":1839.5204324324322,"text":"竟成了它最大的競爭者。","segment":"18-01"},{"start":1839.5204324324322,"end":1842.3839999999998,"text":"這就是台積電等待已久的機會。","segment":"18-01"},{"start":1842.3839999999998,"end":1845.0190434782608,"text":"二○一○年十一月九日傍晚，","segment":"18-02"},{"start":1845.0190434782608,"end":1847.0459999999998,"text":"我剛開完董事會回家。","segment":"18-02"},{"start":1847.0459999999998,"end":1851.5053043478258,"text":"Sophie告訴我，她的表弟郭台銘帶了一位蘋","segment":"18-02"},{"start":1851.5053043478258,"end":1853.329565217391,"text":"果副總到家裡吃飯。","segment":"18-02"},{"start":1853.329565217391,"end":1857.788869565217,"text":"那是傑夫．威廉斯。在晚餐桌上，傑夫單刀直入，","segment":"18-02"},{"start":1857.788869565217,"end":1861.0319999999997,"text":"希望台積電能為蘋果生產自研晶片。","segment":"18-02"},{"start":1861.0319999999997,"end":1865.1380970873784,"text":"他一開口就說：「我們會讓你享有四○％的毛利率","segment":"18-03"},{"start":1865.1380970873784,"end":1865.3247378640774,"text":"。","segment":"18-03"},{"start":1865.3247378640774,"end":1868.124349514563,"text":"」我心裡想，這價格並不算大方。","segment":"18-03"},{"start":1868.124349514563,"end":1870.3640388349513,"text":"我問：「是二十八奈米嗎？","segment":"18-03"},{"start":1870.3640388349513,"end":1873.7235728155338,"text":"」他搖頭，他說他要的是「二十奈米」。","segment":"18-03"},{"start":1873.7235728155338,"end":1877.2697475728153,"text":"這對台積電來說是個「繞道」的技術挑戰，","segment":"18-03"},{"start":1877.2697475728153,"end":1880.2559999999996,"text":"但我知道，我們絕不能拒絕這扇門。","segment":"18-03"},{"start":1880.2559999999996,"end":1883.8280816326526,"text":"合作並非一帆風順。二○一一年三月，","segment":"18-04"},{"start":1883.8280816326526,"end":1885.719183673469,"text":"傑夫突然打來電話，","segment":"18-04"},{"start":1885.719183673469,"end":1889.5013877551016,"text":"說英特爾想插手，協商必須暫停兩個月。","segment":"18-04"},{"start":1889.5013877551016,"end":1892.443102040816,"text":"我親自飛往矽谷見提姆．庫克。","segment":"18-04"},{"start":1892.443102040816,"end":1896.2253061224487,"text":"提姆在午餐時淡淡地對我說：「別擔心，","segment":"18-04"},{"start":1896.2253061224487,"end":1898.3265306122446,"text":"英特爾不擅長做代工。","segment":"18-04"},{"start":1898.3265306122446,"end":1900.8479999999997,"text":"」這句話，給了我定心丸。","segment":"18-04"},{"start":1900.8479999999997,"end":1904.8578113207545,"text":"為了吃下蘋果的訂單，我做了「智慮的」財務豪賭","segment":"18-05"},{"start":1904.8578113207545,"end":1905.040075471698,"text":"。","segment":"18-05"},{"start":1905.040075471698,"end":1908.1385660377357,"text":"我們決定舉債七十一億美元投資產能，","segment":"18-05"},{"start":1908.1385660377357,"end":1911.05479245283,"text":"這在當時超出了台積電的常規規畫。","segment":"18-05"},{"start":1911.05479245283,"end":1914.5178113207546,"text":"我告訴蘋果，我們只承諾一半的需求估計，","segment":"18-05"},{"start":1914.5178113207546,"end":1917.6163018867924,"text":"因為台積電的信譽建立在「一旦承諾，","segment":"18-05"},{"start":1917.6163018867924,"end":1920.1679999999997,"text":"必定不計代價實現」的基礎上。","segment":"18-05"},{"start":1920.1679999999997,"end":1922.3555862068963,"text":"二○二四年，傑夫再度來訪，","segment":"18-06"},{"start":1922.3555862068963,"end":1926.0576551724134,"text":"他對我說：「台積電是蘋果非常少數的最好夥伴之","segment":"18-06"},{"start":1926.0576551724134,"end":1926.3942068965514,"text":"一。","segment":"18-06"},{"start":1926.3942068965514,"end":1929.7597241379308,"text":"」這次敲門，不只創造了台積電的營收巔峰，","segment":"18-06"},{"start":1929.7597241379308,"end":1932.4521379310343,"text":"更向世界證明：當誠信與技術結合，","segment":"18-06"},{"start":1932.4521379310343,"end":1934.8079999999998,"text":"我們就是世界「必需」的公司。","segment":"18-06"},{"start":1934.8079999999998,"end":1939.024633663366,"text":"一九八一年底，我與前妻分離。此後的二十年，","segment":"19-01"},{"start":1939.024633663366,"end":1942.2373069306927,"text":"我歷經了德儀的離職、通用的挫敗，","segment":"19-01"},{"start":1942.2373069306927,"end":1944.646811881188,"text":"最後來到台灣創辦台積電。","segment":"19-01"},{"start":1944.646811881188,"end":1948.6626534653462,"text":"我在年齡上邁向晚年，心情上則是飽經風霜。","segment":"19-01"},{"start":1948.6626534653462,"end":1951.8753267326729,"text":"我本以為，此生已無意再進入婚姻，","segment":"19-01"},{"start":1951.8753267326729,"end":1955.0879999999997,"text":"直到我遇到了她──Sophie。","segment":"19-01"},{"start":1955.0879999999997,"end":1959.0735483870965,"text":"Sophie比我年輕十三歲，她的活潑、樂觀，","segment":"19-02"},{"start":1959.0735483870965,"end":1961.42864516129,"text":"讓我覺得自己又年輕了起來。","segment":"19-02"},{"start":1961.42864516129,"end":1963.602580645161,"text":"她擁有溫暖的「人文心」，","segment":"19-02"},{"start":1963.602580645161,"end":1966.3199999999997,"text":"正好調和了我冷靜的「科技腦」。","segment":"19-02"},{"start":1966.3199999999997,"end":1970.3017411764704,"text":"二○○一年一月，我與Sophie在加州低調完","segment":"19-03"},{"start":1970.3017411764704,"end":1970.6637176470585,"text":"婚。","segment":"19-03"},{"start":1970.6637176470585,"end":1973.016564705882,"text":"那是我們兩人第二次的婚姻。","segment":"19-03"},{"start":1973.016564705882,"end":1976.093364705882,"text":"我們不再追求少年時期的憧憬或情慾，","segment":"19-03"},{"start":1976.093364705882,"end":1980.0751058823528,"text":"我們要的是一種純真的相互照應，是「執子之手，","segment":"19-03"},{"start":1980.0751058823528,"end":1981.7039999999997,"text":"與子偕老」的盟約。","segment":"19-03"},{"start":1981.7039999999997,"end":1985.9402790697673,"text":"但這份歸宿，伴隨的是台積電最嚴峻的考驗。","segment":"19-04"},{"start":1985.9402790697673,"end":1989.3293023255812,"text":"新婚後的第一天，我來不及度蜜月。","segment":"19-04"},{"start":1989.3293023255812,"end":1991.8710697674417,"text":"我一早搭飛機奔向奧斯汀、","segment":"19-04"},{"start":1991.8710697674417,"end":1996.1073488372092,"text":"達拉斯，再飛波士頓。三天內飛了近萬英里，","segment":"19-04"},{"start":1996.1073488372092,"end":1999.9199999999996,"text":"親自安撫那些因網路泡沫而焦慮的客戶。","segment":"19-04"},{"start":1999.9199999999996,"end":2002.5466046511624,"text":"二月，我們在報上宣布婚訊。","segment":"19-05"},{"start":2002.5466046511624,"end":2005.1732093023252,"text":"隨後在圓山大飯店的國宴中，","segment":"19-05"},{"start":2005.1732093023252,"end":2009.0120930232554,"text":"Sophie成為全台灣媒體注目的焦點。","segment":"19-05"},{"start":2009.0120930232554,"end":2010.0223255813949,"text":"從那以後，","segment":"19-05"},{"start":2010.0223255813949,"end":2014.4673488372089,"text":"無論是國外的政經論壇，還是台大、北大的演講，","segment":"19-05"},{"start":2014.4673488372089,"end":2017.2959999999996,"text":"她始終是我最堅強的精神支柱。","segment":"19-05"},{"start":2017.2959999999996,"end":2021.8992676056334,"text":"一年後，我們終於在紐西蘭皇后鎮度了遲來的蜜月","segment":"19-06"},{"start":2021.8992676056334,"end":2022.1085070422532,"text":"。","segment":"19-06"},{"start":2022.1085070422532,"end":2026.711774647887,"text":"在那安靜甜蜜的十天裡，我讀著《中國大歷史》，","segment":"19-06"},{"start":2026.711774647887,"end":2030.2688450704222,"text":"她陪著我。她說，在台積電的生活中，","segment":"19-06"},{"start":2030.2688450704222,"end":2032.1519999999996,"text":"我獲得的比她更多。","segment":"19-06"},{"start":2032.1519999999996,"end":2035.8307499999996,"text":"少年戀充滿憧憬，中年戀重在事業扶持，","segment":"19-07"},{"start":2035.8307499999996,"end":2038.4876249999995,"text":"而晚年戀是純真的相互照應。","segment":"19-07"},{"start":2038.4876249999995,"end":2041.1444999999994,"text":"我很慶幸，在人生的下半場，","segment":"19-07"},{"start":2041.1444999999994,"end":2043.1882499999995,"text":"我赴了與命運的約會，","segment":"19-07"},{"start":2043.1882499999995,"end":2045.2319999999995,"text":"也找到了愛情的歸宿。","segment":"19-07"},{"start":2045.2319999999995,"end":2049.229009345794,"text":"二○一八年六月五日，這是我最後一次以董事長身","segment":"20-01"},{"start":2049.229009345794,"end":2050.682467289719,"text":"分主持股東大會。","segment":"20-01"},{"start":2050.682467289719,"end":2053.4077009345788,"text":"自二十四歲進入半導體界到現在，","segment":"20-01"},{"start":2053.4077009345788,"end":2056.1329345794384,"text":"這場長達六十三年的職業馬拉松，","segment":"20-01"},{"start":2056.1329345794384,"end":2059.948261682242,"text":"終於要在今天抵達終點了。我離開時的台積電，","segment":"20-01"},{"start":2059.948261682242,"end":2062.491813084111,"text":"已不再是當初沒人看好的公司，","segment":"20-01"},{"start":2062.491813084111,"end":2064.6719999999996,"text":"而是世界「必需」的公司。","segment":"20-01"},{"start":2064.6719999999996,"end":2068.981485714285,"text":"回首一九八七年，全公司只有兩百五十八位同仁；","segment":"20-02"},{"start":2068.981485714285,"end":2071.723885714285,"text":"三十年後，台積電創造了奇蹟。","segment":"20-02"},{"start":2071.723885714285,"end":2074.4662857142853,"text":"我們從落後世界兩代半的製程，","segment":"20-02"},{"start":2074.4662857142853,"end":2077.404571428571,"text":"拚到了七奈米技術獨家領先世界。","segment":"20-02"},{"start":2077.404571428571,"end":2079.3634285714284,"text":"這不僅是數字的跳躍，","segment":"20-02"},{"start":2079.3634285714284,"end":2082.1058285714284,"text":"更是對「技術領先、製造優越、","segment":"20-02"},{"start":2082.1058285714284,"end":2085.24,"text":"客戶信任」這三塊基石的終極驗證。","segment":"20-02"},{"start":2085.24,"end":2087.6822068965516,"text":"為了確保台積電的永續經營，","segment":"20-03"},{"start":2087.6822068965516,"end":2089.7486896551723,"text":"我規畫了「雙首長制」：","segment":"20-03"},{"start":2089.7486896551723,"end":2093.1302068965515,"text":"由劉德音擔任董事長，魏哲家擔任總裁。","segment":"20-03"},{"start":2093.1302068965515,"end":2095.5724137931034,"text":"這是我的最後一個經營創新，","segment":"20-03"},{"start":2095.5724137931034,"end":2099.141793103448,"text":"讓兩位優秀的接班人各司其職、緊密合作，","segment":"20-03"},{"start":2099.141793103448,"end":2101.584,"text":"帶領台積電攀向更高的巔峰。","segment":"20-03"},{"start":2101.584,"end":2105.4582857142855,"text":"我曾兩度對自己說：「我與命運有一個約會！","segment":"20-04"},{"start":2105.4582857142855,"end":2108.9451428571424,"text":"」。第一次去德儀，改變了我的前半生；","segment":"20-04"},{"start":2108.9451428571424,"end":2110.3011428571426,"text":"第二次來台灣，","segment":"20-04"},{"start":2110.3011428571426,"end":2114.1754285714283,"text":"改變了我的後半生。我很慶幸在一九八五年，","segment":"20-04"},{"start":2114.1754285714283,"end":2117.8559999999998,"text":"我赴了這場命運的約會，並創造了台積電。","segment":"20-04"},{"start":2117.8559999999998,"end":2121.674769230769,"text":"退休後，我想去做些一直想做、卻還沒做的事：","segment":"20-05"},{"start":2121.674769230769,"end":2125.6753846153842,"text":"完成這本自傳、與Sophie去我們熱愛的城市","segment":"20-05"},{"start":2125.6753846153842,"end":2126.2209230769226,"text":"旅行、","segment":"20-05"},{"start":2126.2209230769226,"end":2130.221538461538,"text":"重溫大學時代的閱讀樂趣。台積電的責任已落在接","segment":"20-05"},{"start":2130.221538461538,"end":2131.494461538461,"text":"班人的肩膀上，","segment":"20-05"},{"start":2131.494461538461,"end":2135.4950769230763,"text":"而我，將帶著虔誠的祝福，漸漸與每天發生的事情","segment":"20-05"},{"start":2135.4950769230763,"end":2136.7679999999996,"text":"「漸行漸遠」。","segment":"20-05"},{"start":2136.7679999999996,"end":2141.0111999999995,"text":"六十三年的半導體生涯，幾乎全部都是積極、","segment":"20-06"},{"start":2141.0111999999995,"end":2145.0422399999993,"text":"前進的。我最成功的工作，無疑是台積電。","segment":"20-06"},{"start":2145.0422399999993,"end":2147.8003199999994,"text":"我對這家公司寄予深切期待，","segment":"20-06"},{"start":2147.8003199999994,"end":2152.4678399999993,"text":"也慶幸自己這一生，始終昂首走在自己選擇的路上","segment":"20-06"},{"start":2152.4678399999993,"end":2152.6799999999994,"text":"。","segment":"20-06"}],"visuals":[{"id":"visual-001","start":0.0,"end":7.02,"image":"assets/images/visual-001.webp","audioIndex":0,"heading":"亂世中的流亡者","showHeading":true},{"id":"visual-002","start":7.02,"end":14.04,"image":"assets/images/visual-002.webp","audioIndex":0,"heading":"亂世中的流亡者","showHeading":true},{"id":"visual-003","start":14.04,"end":20.407999999999998,"image":"assets/images/visual-003.webp","audioIndex":1,"heading":"亂世中的流亡者","showHeading":false},{"id":"visual-004","start":20.407999999999998,"end":26.775999999999996,"image":"assets/images/visual-004.webp","audioIndex":1,"heading":"亂世中的流亡者","showHeading":false},{"id":"visual-005","start":26.775999999999996,"end":33.144,"image":"assets/images/visual-005.webp","audioIndex":1,"heading":"亂世中的流亡者","showHeading":false},{"id":"visual-006","start":33.144,"en <script>
const app=document.querySelector('#app'),stage=document.querySelector('#stage'),art=[document.querySelector('#artA'),document.querySelector('#artB')],audio=document.querySelector('#audio'),caption=document.querySelector('#caption'),heading=document.querySelector('#heading'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),status=document.querySelector('#status');
let audioIndex=0,visualIndex=-1,front=0,isPlaying=false,seeking=false,pendingSeek=0,controlsTimer;const motions=['motion-push','motion-left','motion-pull','motion-right','motion-diagonal'];seek.max=DATA.totalDuration;
const at=(items,time)=>{let lo=0,hi=items.length-1;while(lo<=hi){const mid=(lo+hi)>>1,it=items[mid];if(time<it.start)hi=mid-1;else if(time>=it.end)lo=mid+1;else return mid}return Math.max(0,Math.min(items.length-1,lo-1))};
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function globalTime(){return DATA.audio[audioIndex].start+audio.currentTime}
function hideControls(){if(isPlaying)app.classList.add('controls-hidden')}
function revealControls(){app.classList.remove('controls-hidden');clearTimeout(controlsTimer);if(isPlaying)controlsTimer=setTimeout(hideControls,2400)}
function setVisual(index,force=false){if(index===visualIndex&&!force)return;visualIndex=index;const v=DATA.visuals[index],next=1-front,old=front,newArt=art[next];newArt.className='art';newArt.style.setProperty('--motion-duration',`${Math.max(2,v.end-v.start)}s`);newArt.src=v.image;newArt.onload=()=>{newArt.classList.add('active',motions[index%motions.length]);art[old].classList.remove('active');front=next};const nextVisual=DATA.visuals[index+1];if(nextVisual){const preload=new Image();preload.src=nextVisual.image}const a=DATA.audio[v.audioIndex],chapter=Number(a.id.split('-')[0]);heading.textContent=`第 ${chapter} 章｜${a.heading}`;}
function update(){if(seeking)return;const t=globalTime(),vi=at(DATA.visuals,t),ci=at(DATA.captions,t);setVisual(vi);caption.textContent=DATA.captions[ci]?.text||'';seek.value=t;status.textContent=`${fmt(t)}／${fmt(DATA.totalDuration)}　｜　第 ${visualIndex+1}／${DATA.visuals.length} 張`}
function loadAudio(i,time=DATA.audio[i].start){audioIndex=Math.max(0,Math.min(DATA.audio.length-1,i));const item=DATA.audio[audioIndex];pendingSeek=Math.max(0,time-item.start);audio.src=item.audio;audio.load();setVisual(at(DATA.visuals,time),true);update()}
async function start(){try{await audio.play();isPlaying=true;play.textContent='暫停';revealControls()}catch{status.textContent='請再按一次播放，以啟用旁白'}}function pause(){audio.pause();isPlaying=false;play.textContent='播放';clearTimeout(controlsTimer);app.classList.remove('controls-hidden')}
play.onclick=()=>isPlaying?pause():start();prev.onclick=()=>{pause();loadAudio(audioIndex-1);};next.onclick=()=>{pause();loadAudio(audioIndex+1);};stage.addEventListener('pointermove',revealControls);stage.addEventListener('pointerdown',revealControls);app.addEventListener('pointermove',revealControls);app.addEventListener('keydown',revealControls);audio.addEventListener('loadedmetadata',()=>{audio.currentTime=pendingSeek;if(!seeking)update()});audio.addEventListener('timeupdate',update);audio.addEventListener('ended',()=>{if(audioIndex<DATA.audio.length-1){loadAudio(audioIndex+1);start()}else pause()});seek.addEventListener('input',()=>{revealControls();seeking=true;const t=Number(seek.value),vi=at(DATA.visuals,t),ci=at(DATA.captions,t);setVisual(vi);caption.textContent=DATA.captions[ci]?.text||'';status.textContent=`${fmt(t)}／${fmt(DATA.totalDuration)}`});seek.addEventListener('change',()=>{const t=Number(seek.value),was=isPlaying;pause();loadAudio(at(DATA.audio,t),t);seeking=false;if(was)start()});loadAudio(0,0);
</script></body></html>
