*{box-sizing:border-box}html,body{margin:0;background:#111c25;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#fff}#stage{width:100vw;height:100vh;position:relative;overflow:hidden;background:#17232d}#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:opacity .45s ease}#shade{position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(transparent,rgba(0,0,0,.42))}#heading{position:absolute;top:3.2vh;left:4vw;max-width:70vw;background:rgba(14,35,51,.88);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 18px;font-weight:700;font-size:clamp(15px,1.45vw,27px);opacity:0;transition:opacity .35s}#caption{position:absolute;bottom:3.2vh;left:3%;right:3%;min-height:13%;padding:15px 28px;border-radius:16px;border:2px solid rgba(255,255,255,.72);background:rgba(0,0,0,.88);font-weight:900;font-size:clamp(23px,2.35vw,44px);line-height:1.4;text-align:center;color:#fff;text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}#tools{position:fixed;left:50%;bottom:18px;top:auto;transform:translateX(-50%);z-index:5;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:999px;background:rgba(8,16,22,.82);box-shadow:0 8px 24px rgba(0,0,0,.28);transition:opacity .25s ease,transform .25s ease,visibility .25s ease;visibility:visible;opacity:1;pointer-events:auto}#tools.is-hidden{opacity:0 !important;transform:translate(-50%,16px);pointer-events:none !important;visibility:hidden !important}button{font:700 16px "Microsoft JhengHei";padding:9px 15px;border:0;border-radius:999px;color:#123;background:#f6efe2;cursor:pointer}#status{background:rgba(0,0,0,.55);padding:8px 13px;border-radius:999px}#bar{position:fixed;bottom:0;left:0;height:6px;background:#f28a3d;width:0;z-index:5}@keyframes push{from{transform:scale(1.01) translate(0,0)}to{transform:scale(1.15) translate(-2%,-1%)}}@keyframes left{from{transform:scale(1.12) translate(2%,0)}to{transform:scale(1.04) translate(-2%,0)}}@keyframes pull{from{transform:scale(1.15)}to{transform:scale(1.02)}}@keyframes right{from{transform:scale(1.03) translate(-2%,0)}to{transform:scale(1.14) translate(2%,-1%)}}@keyframes diagonal{from{transform:scale(1.04) translate(-1%,2%)}to{transform:scale(1.14) translate(2%,-2%)}}</style></head><body><div id="stage"><img id="art" src="assets/images/redraw-001.webp" alt="手繪動畫插畫"><div id="shade"></div><div id="heading"></div><div id="caption"></div></div><div id="tools"><button id="play">播放</button><button id="back">上一頁</button><button id="next">下一頁</button><span id="status">準備中</span></div><div id="bar"></div><script>const D={"caps": [{"start": 0.0, "end": 5.09, "text": "時代的背叛｜台灣高教內卷的十大真相"}, {"start": 5.09, "end": 11.292, "text": "站在台北市大安區的十字路口，如果你仔細觀察那些在紅燈前焦急等待、"}, {"start": 11.292, "end": 17.494, "text": "穿著外送平台制服的騎士們，你可能會驚訝地發現，"}, {"start": 17.494, "end": 23.696, "text": "在每五台呼嘯而過的機車中，或許就有一位擁有博士頭銜的駕駛。"}, {"start": 23.696, "end": 29.898, "text": "這不是什麼勵志的「斜槓人生」故事，而是台灣高等教育現狀中最殘酷、"}, {"start": 29.898, "end": 36.1, "text": "最顯眼的縮影。"}, {"start": 36.1, "end": 42.04, "text": "如果你去問一個 40 歲的台灣人，他這輩子對父母最大的期望是什麼，"}, {"start": 42.04, "end": 47.98, "text": "九成的人會回答：「考上好大學」。在那個年代，"}, {"start": 47.98, "end": 53.92, "text": "大學文憑是階級晉升的「鐵門票」，代表著你從此告別了工地的體力勞動與工廠的流水線，"}, {"start": 53.92, "end": 59.86, "text": "換取了一份象徵體面與穩定的「鐵飯碗」。"}, {"start": 59.86, "end": 65.208, "text": "然而，當你轉向今天 20 出頭的年輕人，"}, {"start": 65.208, "end": 70.556, "text": "詢問大學教會了他們什麼時，得到的答案往往是一句面無表情的自嘲："}, {"start": 70.556, "end": 75.904, "text": "「學會了接受自己是個廢物」。我們正處於台灣教育史上最「魔幻」的時代："}, {"start": 75.904, "end": 81.252, "text": "滿街都是大學生，滿地都是碩士，連便利商店幫你加熱便當的店員，"}, {"start": 81.252, "end": 86.6, "text": "都可能是中文系的碩士生。"}, {"start": 86.6, "end": 93.36, "text": "學歷，這張曾經通往未來的船票，如今為何變成了綁在年輕人腳上沉重的鐵球？"}, {"start": 93.36, "end": 100.12, "text": "作為一名長期觀察社會結構的評論者，我將透過這篇深度調查報告，"}, {"start": 100.12, "end": 106.88, "text": "為你扒開台灣教育圈最病態、最荒誕的十個內卷真相。"}, {"start": 106.88, "end": 112.972, "text": "台灣高等教育崩壞的第一個徵兆，始於「門檻」的消失。"}, {"start": 112.972, "end": 119.064, "text": "2008 年，台灣大學錄取分數曾創下 7."}, {"start": 119.064, "end": 125.156, "text": "69 分的歷史新低。這意味著考生甚至不需要看題目，"}, {"start": 125.156, "end": 131.248, "text": "隨機塗抹答案卷，都能理直氣壯地踏進大學校門，"}, {"start": 131.248, "end": 137.34, "text": "並在四年後拿回一張印有學士學位的證書。"}, {"start": 137.34, "end": 142.24, "text": "回溯 30 年前，台灣大學錄取率低於 20%，"}, {"start": 142.24, "end": 147.14, "text": "考上大學是光宗耀祖、鄰里放炮慶祝的榮耀。"}, {"start": 147.14, "end": 152.04, "text": "但根據教育部數據，2023 年的大專院校錄取率已高達 97%，"}, {"start": 152.04, "end": 156.94, "text": "且連續多年維持在此水平。這已不再是「考」大學，"}, {"start": 156.94, "end": 161.84, "text": "而是「登記入學」；只要不交白卷、不睡過頭，"}, {"start": 161.84, "end": 166.74, "text": "人人都有大學念。"}, {"start": 166.74, "end": 171.11, "text": "當文憑從沉甸甸的金磚變成比超市傳單還廉價的紙張，"}, {"start": 171.11, "end": 175.48, "text": "它的價值便在氾濫中徹底崩塌。"}, {"start": 175.48, "end": 181.505, "text": "雖然文憑貶值，但讀書的代價卻逐年攀升。"}, {"start": 181.505, "end": 187.53, "text": "就讀私立大學一學期的學雜費約 5 至 6 萬台幣，"}, {"start": 187.53, "end": 193.555, "text": "四年的純學費支出便高達 40 到 50 萬，"}, {"start": 193.555, "end": 199.58, "text": "若加計生活費與課本費，至少需耗費 60 到 80 萬台幣。"}, {"start": 199.58, "end": 205.637, "text": "以 2024 年台灣基本工資月薪 27,"}, {"start": 205.637, "end": 211.693, "text": "470 元計算，一名社會新鮮人需不吃不喝整整兩年才湊得齊這筆錢。"}, {"start": 211.693, "end": 217.75, "text": "目前台灣有超過 80 萬名年輕人一出校門就背負著沉重的就學貸款。"}, {"start": 217.75, "end": 222.663, "text": "諷刺的是，當他們拿著這張價值 60 萬的「職場入場券」來到社會門口時，"}, {"start": 222.663, "end": 227.577, "text": "卻發現所有人手裡都拿著同樣的票，而雇主卻冷冷地說："}, {"start": 227.577, "end": 232.49, "text": "「我們現在只需要能搬貨的人」。"}, {"start": 232.49, "end": 239.42, "text": "在少子化的巨浪下，大學數量卻仍維持在 150 多所，"}, {"start": 239.42, "end": 246.35, "text": "這導致校方為了生存，將核心業務從「教學」轉向「招商」。"}, {"start": 246.35, "end": 253.28, "text": "所謂的「學店」，其運作模式與美容院辦會員卡無異："}, {"start": 253.28, "end": 260.21, "text": "只要你按時交學費，學校便負責讓你畢業。"}, {"start": 260.21, "end": 266.09, "text": "這些學校的教學品質堪憂，有的教授沿用 20 年前的講義，"}, {"start": 266.09, "end": 271.97, "text": "有的考試則直接發放考古題背答案。更荒誕的是，"}, {"start": 271.97, "end": 277.85, "text": "部分學校甚至與東南亞仲介合作，以「高品質教育」為誘餌，"}, {"start": 277.85, "end": 283.73, "text": "將外籍學生騙來台灣，卻讓他們在破爛的校園與語言不通的課堂中自生自滅。"}, {"start": 283.73, "end": 289.61, "text": "這不是教育，而是以少子化危機為藉口的制度化詐欺。"}, {"start": 289.61, "end": 297.067, "text": "台灣的產業結構極度傾斜，80% 以上的高薪職位集中在半導體、"}, {"start": 297.067, "end": 304.523, "text": "資工、電機等理工領域。這導致文史哲學科的碩博士生，"}, {"start": 304.523, "end": 311.98, "text": "在就業市場上的價值甚至不如一張悠遊卡。"}, {"start": 311.98, "end": 317.75, "text": "一名中文系或歷史所碩士，投資了六年時間與數十萬學費，"}, {"start": 317.75, "end": 323.52, "text": "畢業後的起薪往往僅有 26k 到 27k，"}, {"start": 323.52, "end": 329.29, "text": "與高中畢業直接打工的同儕無異。在便利商店穿著橘色制服刷條碼的台大中文碩士，"}, {"start": 329.29, "end": 335.06, "text": "面對社會的苦笑背後，藏著最殘忍的判決："}, {"start": 335.06, "end": 340.83, "text": "這個社會並不需要你的博學，甚至會因為你「讀太多書」而限制你的發展空間。"}, {"start": 340.83, "end": 346.715, "text": "在台北的職場中，有一種被美化為「累積經驗」的剝削形式："}, {"start": 346.715, "end": 352.6, "text": "無薪實習。實習生每天九點打卡、八點下班，"}, {"start": 352.6, "end": 358.485, "text": "處理雜務與跑腿，三個月後換來的僅是一張實習證明，"}, {"start": 358.485, "end": 364.37, "text": "而非薪水。"}, {"start": 364.37, "end": 369.9, "text": "更離譜的是，許多公司連交通與伙食補貼都不提供，"}, {"start": 369.9, "end": 375.43, "text": "學生每個月需倒貼三、四千元來「資助」年營收上億的企業培育人才。"}, {"start": 375.43, "end": 380.96, "text": "企業主的邏輯荒謬至極：「我給你經歷，這就是你的報酬」。"}, {"start": 380.96, "end": 386.49, "text": "在這種扭曲的評估體系下，年輕人的熱情淪為免費的勞動力，"}, {"start": 386.49, "end": 392.02, "text": "成為內卷循環中的廉價燃料。"}, {"start": 392.02, "end": 398.393, "text": "2023 年台北市環保局召考清潔隊員，"}, {"start": 398.393, "end": 404.765, "text": "錄取率不到 8%，其中竟然出現了博士學歷的報考者。"}, {"start": 404.765, "end": 411.138, "text": "一名寒窗苦讀十載、產出十幾萬字論文的博士，"}, {"start": 411.138, "end": 417.51, "text": "其最終的職業選擇竟是追求月薪 4 萬元的穩定清潔工作。"}, {"start": 417.51, "end": 423.438, "text": "這反映出台灣大專院校職缺的極度飽和，一個冷門系所的講師雀額，"}, {"start": 423.438, "end": 429.366, "text": "往往有兩三百個博士在搶。搶不到的人，只能在實驗室擔任高薪雜工（博士後研究），"}, {"start": 429.366, "end": 435.294, "text": "年過 35 仍無存款、無保險、不敢結婚，"}, {"start": 435.294, "end": 441.222, "text": "看著當年沒念大學的技職同學買房買車。這不是黑色幽默，"}, {"start": 441.222, "end": 447.15, "text": "而是台灣學術象牙塔崩塌的真實餘震。"}, {"start": 447.15, "end": 453.783, "text": "在今天的台灣求職市場，學歷不再是金牌敲門磚，"}, {"start": 453.783, "end": 460.417, "text": "有時反而是砸腳的石頭。許多投遞月薪三萬元職缺的碩士生，"}, {"start": 460.417, "end": 467.05, "text": "會被建議「隱藏學歷」。"}, {"start": 467.05, "end": 472.286, "text": "原因在於雇主的心理：「這人學歷太高，一定請不起、"}, {"start": 472.286, "end": 477.522, "text": "留不住、不好管」。雇主寧可錄取乖巧、領最低工資的高職生，"}, {"start": 477.522, "end": 482.758, "text": "也不願錄取會用學術理論挑戰管理方式的碩士。"}, {"start": 482.758, "end": 487.994, "text": "這種「高不成、低不就」的尷尬，讓無數高學歷青年在職場的入口處徘徊，"}, {"start": 487.994, "end": 493.23, "text": "進退維谷。"}, {"start": 493.23, "end": 499.968, "text": "如果說學歷貶值是個人的悲劇，那大學退場就是體系的全面潰敗。"}, {"start": 499.968, "end": 506.705, "text": "隨著少子化加速，2023 年首府大學等多所學校相繼倒閉，"}, {"start": 506.705, "end": 513.442, "text": "學生被迫成為「學術孤兒」，面臨學分不被承認、"}, {"start": 513.442, "end": 520.18, "text": "人生成本付諸流水的困境。"}, {"start": 520.18, "end": 526.733, "text": "預計未來 10 年，台灣還會有至少 20 所大學面臨停辦。"}, {"start": 526.733, "end": 533.287, "text": "這是一場經濟與教育的雙重災難。當校長與決策者還在船艙討論救生圈的材質時，"}, {"start": 533.287, "end": 539.84, "text": "載著無數青年青春的船隻早已在無聲中沉沒。"}, {"start": 539.84, "end": 545.85, "text": "在士林、逢甲等夜市，越來越多口齒清晰、"}, {"start": 545.85, "end": 551.86, "text": "談吐文雅的年輕老闆，其實是外文所、資工所或餐飲管理碩士。"}, {"start": 551.86, "end": 557.87, "text": "他們選擇在 40 度的油鍋前炸雞排，不是因為愛好，"}, {"start": 557.87, "end": 563.88, "text": "而是因為現實：寫字樓 3 萬元的薪水養不活自己，"}, {"start": 563.88, "end": 569.89, "text": "但夜市擺攤一個月能淨賺 7 到 10 萬。"}, {"start": 569.89, "end": 575.47, "text": "這不是「行行出狀元」的勵志故事，而是社會薪資結構崩壞後的被迫選擇。"}, {"start": 575.47, "end": 581.05, "text": "這些高學歷者必須放下知識分子的最後一絲尊嚴，"}, {"start": 581.05, "end": 586.63, "text": "才能在這個城市活下去。那一套讀了 18 年書才換來的西裝，"}, {"start": 586.63, "end": 592.21, "text": "終究撐不起在台北生存的成本。"}, {"start": 592.21, "end": 599.6, "text": "這是台灣高教內卷最可怕的終點：外送員中擁有碩博士學位的人數，"}, {"start": 599.6, "end": 606.99, "text": "在五年內暴漲了將近四倍。"}, {"start": 606.99, "end": 611.996, "text": "一名投入 200 萬台幣、耗費 10 年光陰拿到的博士學位，"}, {"start": 611.996, "end": 617.002, "text": "在現實市場中卻換不到一個月薪 3 萬 5 以上的穩定職缺。"}, {"start": 617.002, "end": 622.008, "text": "最終，那些關於後現代主義、解構理論的高深學問，"}, {"start": 622.008, "end": 627.014, "text": "被厚厚的灰塵覆蓋在租屋處的角落，而主人正騎著破舊機車，"}, {"start": 627.014, "end": 632.02, "text": "為了每單 40 元的獎勵在巷弄間穿梭。"}, {"start": 632.02, "end": 639.94, "text": "台灣的大學文憑，正逐漸演變成一種「鑽石效應」："}, {"start": 639.94, "end": 647.86, "text": "它本非必需品，卻被整個社會透過 30 年的洗腦，"}, {"start": 647.86, "end": 655.78, "text": "塑造成階級晉升的虛假門票，引誘一代又一代的年輕人砸下重金換取一張越來越不值錢的入場券。"}, {"start": 655.78, "end": 661.587, "text": "如果你也是那個背負學貸、在城市裡找不到位置的高學歷青年，"}, {"start": 661.587, "end": 667.395, "text": "請記住：錯的不是你，而是規則壞了。你不必為送外賣或打工感到羞恥，"}, {"start": 667.395, "end": 673.202, "text": "真正該感到羞恥的，是那個許下「好好讀書就能出人頭地」諾言，"}, {"start": 673.202, "end": 679.01, "text": "卻在事後毀約並假裝若無其事的時代。"}, {"start": 679.01, "end": 684.195, "text": "這場內卷競賽還在繼續，但或許我們該停下來問問："}, {"start": 684.195, "end": 689.38, "text": "我們還要讓多少青春，陪葬在這個扭曲的評估體系裡？"}], "timeline": [{"start": 0.0, "end": 7.034, "image": 1, "motion": "push"}, {"start": 7.034, "end": 14.069, "image": 2, "motion": "pan-left"}, {"start": 14.069, "end": 21.103, "image": 3, "motion": "pull"}, {"start": 21.103, "end": 28.138, "image": 4, "motion": "pan-right"}, {"start": 28.138, "end": 35.172, "image": 5, "motion": "diagonal"}, {"start": 35.172, "end": 42.207, "image": 6, "motion": "push"}, {"start": 42.207, "end": 49.241, "image": 7, "motion": "pan-left"}, {"start": 49.241, "end": 56.276, "image": 8, "motion": "pull"}, {"start": 56.276, "end": 63.31, "image": 9, "motion": "pan-right"}, {"start": 63.31, "end": 70.345, "image": 10, "motion": "diagonal"}, {"start": 70.345, "end": 77.379, "image": 11, "motion": "push"}, {"start": 77.379, "end": 84.414, "image": 12, "motion": "pan-left"}, {"start": 84.414, "end": 91.448, "image": 13, "motion": "pull"}, {"start": 91.448, "end": 98.483, "image": 14, "motion": "pan-right"}, {"start": 98.483, "end": 105.517, "image": 15, "motion": "diagonal"}, {"start": 105.517, "end": 112.552, "image": 16, "motion": "push"}, {"start": 112.552, "end": 119.586, .552, "end": 527.587, "image": 75, "motion": "diagonal"}, {"start": 527.587, "end": 534.621, "image": 76, "motion": "push"}, {"start": 534.621, "end": 541.656, "image": 77, "motion": "pan-left"}, {"start": 541.656, "end": 548.69, "image": 78, "motion": "pull"}, {"start": 548.69, "end": 555.725, "image": 79, "motion": "pan-right"}, {"start": 555.725, "end": 562.759, "image": 80, "motion": "diagonal"}, {"start": 562.759, "end": 569.794, "image": 81, "motion": "push"}, {"start": 569.794, "end": 576.828, "image": 82, "motion": "pan-left"}, {"start": 576.828, "end": 583.863, "image": 83, "motion": "pull"}, {"start": 583.863, "end": 590.897, "image": 84, "motion": "pan-right"}, {"start": 590.897, "end": 597.932, "image": 85, "motion": "diagonal"}, {"start": 597.932, "end": 604.966, "image": 86, "motion": "push"}, {"start": 604.966, "end": 612.001, "image": 87, "motion": "pan-left"}, {"start": 612.001, "end": 619.035, "image": 88, "motion": "pull"}, {"start": 619.035, "end": 626.07, "image": 89, "motion": "pan-right"}, {"start": 626.07, "end": 633.104, "image": 90, "motion": "diagonal"}, {"start": 633.104, "end": 640.139, "image": 91, "motion": "push"}, {"start": 640.139, "end": 647.173, "image": 92, "motion": "pan-left"}, {"start": 647.173, "end": 654.208, "image": 93, "motion": "pull"}, {"start": 654.208, "end": 661.242, "image": 94, "motion": "pan-right"}, {"start": 661.242, "end": 668.277, "image": 95, "motion": "diagonal"}, {"start": 668.277, "end": 675.311, "image": 96, "motion": "push"}, {"start": 675.311, "end": 682.346, "image": 97, "motion": "pan-left"}, {"start": 682.346, "end": 689.38, "image": 98, "motion": "pull"}], "segments": [{"id": "title", "heading": "時代的背叛｜台灣高教內卷的十大真相", "audio": "title.mp3", "text": "", "page": 0, "start": 0, "end": 5.09, "show_heading": true}, {"id": "page-01", "heading": "前言：消失的「門票」，失落的一代", "audio": "page-01.mp3", "text": "站在台北市大安區的十字路口，如果你仔細觀察那些在紅燈前焦急等待、穿著外送平台制服的騎士們，你可能會驚訝地發現，在每五台呼嘯而過的機車中，或許就有一位擁有博士頭銜的駕駛。這不是什麼勵志的「斜槓人生」故事，而是台灣高等教育現狀中最殘酷、最顯眼的縮影。", "page": 1, "start": 5.09, "end": 36.1, "show_heading": true}, {"id": "page-02", "heading": "前言：消失的「門票」，失落的一代", "audio": "page-02.mp3", "text": "如果你去問一個 40 歲的台灣人，他這輩子對父母最大的期望是什麼，九成的人會回答：「考上好大學」。在那個年代，大學文憑是階級晉升的「鐵門票」，代表著你從此告別了工地的體力勞動與工廠的流水線，換取了一份象徵體面與穩定的「鐵飯碗」。", "page": 2, "start": 36.1, "end": 59.86, "show_heading": false}, {"id": "page-03", "heading": "前言：消失的「門票」，失落的一代", "audio": "page-03.mp3", "text": "然而，當你轉向今天 20 出頭的年輕人，詢問大學教會了他們什麼時，得到的答案往往是一句面無表情的自嘲：「學會了接受自己是個廢物」。我們正處於台灣教育史上最「魔幻」的時代：滿街都是大學生，滿地都是碩士，連便利商店幫你加熱便當的店員，都可能是中文系的碩士生。", "page": 3, "start": 59.86, "end": 86.6, "show_heading": false}, {"id": "page-04", "heading": "前言：消失的「門票」，失落的一代", "audio": "page-04.mp3", "text": "學歷，這張曾經通往未來的船票，如今為何變成了綁在年輕人腳上沉重的鐵球？作為一名長期觀察社會結構的評論者，我將透過這篇深度調查報告，為你扒開台灣教育圈最病態、最荒誕的十個內卷真相。", "page": 4, "start": 86.6, "end": 106.88, "show_heading": false}, {"id": "page-05", "heading": "真相十：學歷大通膨，7 分也能上大學的荒謬劇", "audio": "page-05.mp3", "text": "台灣高等教育崩壞的第一個徵兆，始於「門檻」的消失。2008 年，台灣大學錄取分數曾創下 7.69 分的歷史新低。這意味著考生甚至不需要看題目，隨機塗抹答案卷，都能理直氣壯地踏進大學校門，並在四年後拿回一張印有學士學位的證書。", "page": 5, "start": 106.88, "end": 137.34, "show_heading": true}, {"id": "page-06", "heading": "真相十：學歷大通膨，7 分也能上大學的荒謬劇", "audio": "page-06.mp3", "text": "回溯 30 年前，台灣大學錄取率低於 20%，考上大學是光宗耀祖、鄰里放炮慶祝的榮耀。但根據教育部數據，2023 年的大專院校錄取率已高達 97%，且連續多年維持在此水平。這已不再是「考」大學，而是「登記入學」；只要不交白卷、不睡過頭，人人都有大學念。", "page": 6, "start": 137.34, "end": 166.74, "show_heading": false}, {"id": "page-07", "heading": "真相十：學歷大通膨，7 分也能上大學的荒謬劇", "audio": "page-07.mp3", "text": "當文憑從沉甸甸的金磚變成比超市傳單還廉價的紙張，它的價值便在氾濫中徹底崩塌。", "page": 7, "start": 166.74, "end": 175.48000000000002, "show_heading": false}, {"id": "page-08", "heading": "真相九：60 萬起步的「學貸賣身契」", "audio": "page-08.mp3", "text": "雖然文憑貶值，但讀書的代價卻逐年攀升。就讀私立大學一學期的學雜費約 5 至 6 萬台幣，四年的純學費支出便高達 40 到 50 萬，若加計生活費與課本費，至少需耗費 60 到 80 萬台幣。", "page": 8, "start": 175.48000000000002, "end": 199.58, "show_heading": true}, {"id": "page-09", "heading": "真相九：60 萬起步的「學貸賣身契」", "audio": "page-09.mp3", "text": "以 2024 年台灣基本工資月薪 27,470 元計算，一名社會新鮮人需不吃不喝整整兩年才湊得齊這筆錢。目前台灣有超過 80 萬名年輕人一出校門就背負著沉重的就學貸款。", "page": 9, "start": 199.58, "end": 217.75, "show_heading": false}, {"id": "page-10", "heading": "真相九：60 萬起步的「學貸賣身契」", "audio": "page-10.mp3", "text": "諷刺的是，當他們拿著這張價值 60 萬的「職場入場券」來到社會門口時，卻發現所有人手裡都拿著同樣的票，而雇主卻冷冷地說：「我們現在只需要能搬貨的人」。", "page": 10, "start": 217.75, "end": 232.49, "show_heading": false}, {"id": "page-11", "heading": "真相八：「腳到、錢到、畢業到」的私校學店產業鏈", "audio": "page-11.mp3", "text": "在少子化的巨浪下，大學數量卻仍維持在 150 多所，這導致校方為了生存，將核心業務從「教學」轉向「招商」。所謂的「學店」，其運作模式與美容院辦會員卡無異：只要你按時交學費，學校便負責讓你畢業。", "page": 11, "start": 232.49, "end": 260.21000000000004, "show_heading": true}, {"id": "page-12", "heading": "真相八：「腳到、錢到、畢業到」的私校學店產業鏈", "audio": "page-12.mp3", "text": "這些學校的教學品質堪憂，有的教授沿用 20 年前的講義，有的考試則直接發放考古題背答案。更荒誕的是，部分學校甚至與東南亞仲介合作，以「高品質教育」為誘餌，將外籍學生騙來台灣，卻讓他們在破爛的校園與語言不通的課堂中自生自滅。這不是教育，而是以少子化危機為藉口的制度化詐欺。", "page": 12, "start": 260.21000000000004, "end": 289.61, "show_heading": false}, {"id": "page-13", "heading": "真相七：文組碩士的「薪資判決書」", "audio": "page-13.mp3", "text": "台灣的產業結構極度傾斜，80% 以上的高薪職位集中在半導體、資工、電機等理工領域。這導致文史哲學科的碩博士生，在就業市場上的價值甚至不如一張悠遊卡。", "page": 13, "start": 289.61, "end": 311.98, "show_heading": true}, {"id": "page-14", "heading": "真相七：文組碩士的「薪資判決書」", "audio": "page-14.mp3", "text": "一名中文系或歷史所碩士，投資了六年時間與數十萬學費，畢業後的起薪往往僅有 26k 到 27k，與高中畢業直接打工的同儕無異。在便利商店穿著橘色制服刷條碼的台大中文碩士，面對社會的苦笑背後，藏著最殘忍的判決：這個社會並不需要你的博學，甚至會因為你「讀太多書」而限制你的發展空間。", "page": 14, "start": 311.98, "end": 340.83000000000004, "show_heading": false}, {"id": "page-15", "heading": "真相六：無薪實習------倒貼錢買「現代學徒制」", "audio": "page-15.mp3", "text": "在台北的職場中，有一種被美化為「累積經驗」的剝削形式：無薪實習。實習生每天九點打卡、八點下班，處理雜務與跑腿，三個月後換來的僅是一張實習證明，而非薪水。", "page": 15, "start": 340.83000000000004, "end": 364.37000000000006, "show_heading": true}, {"id": "page-16", "heading": "真相六：無薪實習------倒貼錢買「現代學徒制」", "audio": "page-16.mp3", "text": "更離譜的是，許多公司連交通與伙食補貼都不提供，學生每個月需倒貼三、四千元來「資助」年營收上億的企業培育人才。企業主的邏輯荒謬至極：「我給你經歷，這就是你的報酬」。在這種扭曲的評估體系下，年輕人的熱情淪為免費的勞動力，成為內卷循環中的廉價燃料。", "page": 16, "start": 364.37000000000006, "end": 392.02000000000004, "show_heading": false}, {"id": "page-17", "heading": "真相五：學歷雪崩------博士報考清潔隊員", "audio": "page-17.mp3", "text": "2023 年台北市環保局召考清潔隊員，錄取率不到 8%，其中竟然出現了博士學歷的報考者。一名寒窗苦讀十載、產出十幾萬字論文的博士，其最終的職業選擇竟是追求月薪 4 萬元的穩定清潔工作。", "page": 17, "start": 392.02000000000004, "end": 417.51000000000005, "show_heading": true}, {"id": "page-18", "heading": "真相五：學歷雪崩------博士報考清潔隊員", "audio": "page-18.mp3", "text": "這反映出台灣大專院校職缺的極度飽和，一個冷門系所的講師雀額，往往有兩三百個博士在搶。搶不到的人，只能在實驗室擔任高薪雜工（博士後研究），年過 35 仍無存款、無保險、不敢結婚，看著當年沒念大學的技職同學買房買車。這不是黑色幽默，而是台灣學術象牙塔崩塌的真實餘震。", "page": 18, "start": 417.51000000000005, "end": 447.15000000000003, "show_heading": false}, {"id": "page-19", "heading": "真相四：職場荒誕劇------「隱藏碩士學歷」", "audio": "page-19.mp3", "text": "在今天的台灣求職市場，學歷不再是金牌敲門磚，有時反而是砸腳的石頭。許多投遞月薪三萬元職缺的碩士生，會被建議「隱藏學歷」。", "page": 19, "start": 447.15000000000003, "end": 467.05, "show_heading": true}, {"id": "page-20", "heading": "真相四：職場荒誕劇------「隱藏碩士學歷」", "audio": "page-20.mp3", "text": "原因在於雇主的心理：「這人學歷太高，一定請不起、留不住、不好管」。雇主寧可錄取乖巧、領最低工資的高職生，也不願錄取會用學術理論挑戰管理方式的碩士。這種「高不成、低不就」的尷尬，讓無數高學歷青年在職場的入口處徘徊，進退維谷。", "page": 20, "start": 467.05, "end": 493.23, "show_heading": false}, {"id": "page-21", "heading": "真相三：大學退場，成千上萬的「學術孤兒」", "audio": "page-21.mp3", "text": "如果說學歷貶值是個人的悲劇，那大學退場就是體系的全面潰敗。隨著少子化加速，2023 年首府大學等多所學校相繼倒閉，學生被迫成為「學術孤兒」，面臨學分不被承認、人生成本付諸流水的困境。", "page": 21, "start": 493.23, "end": 520.1800000000001, "show_heading": true}, {"id": "page-22", "heading": "真相三：大學退場，成千上萬的「學術孤兒」", "audio": "page-22.mp3", "text": "預計未來 10 年，台灣還會有至少 20 所大學面臨停辦。這是一場經濟與教育的雙重災難。當校長與決策者還在船艙討論救生圈的材質時，載著無數青年青春的船隻早已在無聲中沉沒。", "page": 22, "start": 520.1800000000001, "end": 539.84, "show_heading": false}, {"id": "page-23", "heading": "真相二：夜市攤位------高學歷者的「尊嚴墳墓」", "audio": "page-23.mp3", "text": "在士林、逢甲等夜市，越來越多口齒清晰、談吐文雅的年輕老闆，其實是外文所、資工所或餐飲管理碩士。他們選擇在 40 度的油鍋前炸雞排，不是因為愛好，而是因為現實：寫字樓 3 萬元的薪水養不活自己，但夜市擺攤一個月能淨賺 7 到 10 萬。", "page": 23, "start": 539.84, "end": 569.89, "show_heading": true}, {"id": "page-24", "heading": "真相二：夜市攤位------高學歷者的「尊嚴墳墓」", "audio": "page-24.mp3", "text": "這不是「行行出狀元」的勵志故事，而是社會薪資結構崩壞後的被迫選擇。這些高學歷者必須放下知識分子的最後一絲尊嚴，才能在這個城市活下去。那一套讀了 18 年書才換來的西裝，終究撐不起在台北生存的成本。", "page": 24, "start": 569.89, "end": 592.21, "show_heading": false}, {"id": "page-25", "heading": "真相一：博士送外賣------內卷的最底層鏡頭", "audio": "page-25.mp3", "text": "這是台灣高教內卷最可怕的終點：外送員中擁有碩博士學位的人數，在五年內暴漲了將近四倍。", "page": 25, "start": 592.21, "end": 606.99, "show_heading": true}, {"id": "page-26", "heading": "真相一：博士送外賣------內卷的最底層鏡頭", "audio": "page-26.mp3", "text": "一名投入 200 萬台幣、耗費 10 年光陰拿到的博士學位，在現實市場中卻換不到一個月薪 3 萬 5 以上的穩定職缺。最終，那些關於後現代主義、解構理論的高深學問，被厚厚的灰塵覆蓋在租屋處的角落，而主人正騎著破舊機車，為了每單 40 元的獎勵在巷弄間穿梭。", "page": 26, "start": 606.99, "end": 632.02, "show_heading": false}, {"id": "page-27", "heading": "結語：這是一場制度化的「龐氏騙局」嗎？", "audio": "page-27.mp3", "text": "台灣的大學文憑，正逐漸演變成一種「鑽石效應」：它本非必需品，卻被整個社會透過 30 年的洗腦，塑造成階級晉升的虛假門票，引誘一代又一代的年輕人砸下重金換取一張越來越不值錢的入場券。", "page": 27, "start": 632.02, "end": 655.78, "show_heading": true}, {"id": "page-28", "heading": "結語：這是一場制度化的「龐氏騙局」嗎？", "audio": "page-28.mp3", "text": "如果你也是那個背負學貸、在城市裡找不到位置的高學歷青年，請記住：錯的不是你，而是規則壞了。你不必為送外賣或打工感到羞恥，真正該感到羞恥的，是那個許下「好好讀書就能出人頭地」諾言，卻在事後毀約並假裝若無其事的時代。", "page": 28, "start": 655.78, "end": 679.01, "show_heading": false}, {"id": "page-29", "heading": "結語：這是一場制度化的「龐氏騙局」嗎？", "audio": "page-29.mp3", "text": "這場內卷競賽還在繼續，但或許我們該停下來問問：我們還要讓多少青春，陪葬在這個扭曲的評估體系裡？", "page": 29, "start": 679.01, "end": 689.38, "show_heading": false}], "total": 689.38},art=document.querySelector('#art'),cap=document.querySelector('#caption'),heading=document.querySelector('#heading'),status=document.querySelector('#status'),bar=document.querySelector('#bar');let i=0,playing=false,started=0,offset=0,last=-1;const audio=D.segments.map(x=>new Audio('audio/'+x.audio));function sceneAt(t){return D.timeline.findIndex(x=>t>=x.start&&t<x.end)}function render(t){t=Math.max(0,Math.min(D.total-.01,t));let si=sceneAt(t);if(si<0)si=D.timeline.length-1;const s=D.timeline[si];if(si!==last){last=si;art.style.opacity=0;setTimeout(()=>{art.src='assets/images/redraw-'+String(s.image).padStart(3,'0')+'.webp' egments[Math.max(0,i-1)].start,playing);next.onclick=()=>go(D.segments[Math.min(D.segments.length-1,i+1)].start,playing);go(0,false);</script></body></html>
