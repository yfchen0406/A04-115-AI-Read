:"結語","voiceover_ref":"voiceover-100","shot_ref":"shot-100"},{"id":"scene-101","act":"第四幕：未來——AI 浪潮與輝達之道","title":"永遠的白板與純粹意志","caption":"「偉大來自性格，而非聰明。」","shot_type":"全景","mood":"意志、定義","source":"結語","voiceover_ref":"voiceover-101","shot_ref":"shot-101"},{"id":"scene-102","act":"第四幕：未來——AI 浪潮與輝達之道","title":"故事才剛剛開始","caption":"「我熱愛輝達。」","shot_type":"全景","mood":"痛苦、禮物","source":"第1章","voiceover_ref":"voiceover-102","shot_ref":"shot-102"},{"id":"scene-103","act":"第四幕：未來——AI 浪潮與輝達之道","title":"定義輝達之道","caption":"輝達之道：結合自主與高標準的意志","shot_type":"中景","mood":"熱情、未來","source":"結語","voiceover_ref":"voiceover-103","shot_ref":"shot-103"},{"id":"scene-104","act":"第四幕：未來——AI 浪潮與輝達之道","title":"逆境是最好的禮物","caption":"「希望你承受足夠的痛苦與磨難」","shot_type":"特寫","mood":"性格、閉環","source":"結語","voiceover_ref":"voiceover-104","shot_ref":"shot-104"},{"id":"scene-105","act":"第四幕：未來——AI 浪潮與輝達之道","title":"定義未來的熱情","caption":"執行長的承諾：「我熱愛輝達」","shot_type":"中景","mood":"","source":"B04-逐場產生逐字稿.docx","voiceover_ref":"voiceover-105","shot_ref":"shot-105"},{"id":"scene-106","act":"第四幕：未來——AI 浪潮與輝達之道","title":"最後的閉環：回歸丹尼餐廳","caption":"偉大來自性格，而非聰明","shot_type":"中景","mood":"","source":"B04-逐場產生逐字稿.docx","voiceover_ref":"voiceover-106","shot_ref":"shot-106"}],"voiceover":[{"id":"voiceover-001","scene_id":"scene-001","text":"1970年代，年幼的黃仁勳被送往肯塔基州的奧奈達浸信會學校。這所學校在1890年代創立時，原是為了安置長期不和家庭的孩子，本質上是一所專收問題少年的教養院。學生每天必須跨越危險的旋轉橋去上課，迎接他們的是極其嚴格的作息與紀律。","estimated":false,"audio":"audio/scene-001.mp3","duration":21.408},{"id":"voiceover-002","scene_id":"scene-002","text":"在這所學校，每個學生都必須從事體力活。年僅十多歲、身為少數亞裔的黃仁勳，被指派負責整棟三層樓宿舍的清潔工作。他回憶道：「我得掃廁所，所以一定會看到那種東西。」這段日子不僅是勞動的磨練，更是對心理韌性的極致考驗。","estimated":false,"audio":"audio/scene-002.mp3","duration":19.752},{"id":"voiceover-003","scene_id":"scene-003","text":"由於年紀最小且種族不同，黃仁勳初到校時常挨揍，室友甚至是一位大他八歲、全身佈滿刀疤的少年。黃仁勳選擇不閃避恐懼，他主動教室友讀書換取對方教他舉重。舉重不僅給了他力量，更給了他為自己挺身而出的信心。","estimated":false,"audio":"audio/scene-003.mp3","duration":18.792},{"id":"voiceover-004","scene_id":"scene-004","text":"這段教養院式的歲月，塑造了黃仁勳街頭霸王般的心性。他曾表示：「我從不主動找人打架，但也絕對不會閃避。」他相信卓越來自克服逆境所塑造的性格，而這份忍受不適與磨難的能力，將成為他日後經營輝達的核心哲學。","estimated":false,"audio":"audio/scene-004.mp3","duration":17.856},{"id":"voiceover-005","scene_id":"scene-005","text":"15 歲時，黃仁勳在波特蘭的丹尼餐廳開始了他的第一份工作。他從最底層的洗碗工和掃廁所做起，他曾開誠布公地回憶道：「我掃的廁所應該比史上任何執行長都多」。這段經歷迫使極度內向怕羞的他走出保護殼，學習與人交際。","estimated":false,"audio":"audio/scene-005.mp3","duration":18.864},{"id":"voiceover-006","scene_id":"scene-006","text":"他學會在混亂場面與沉重時間壓力下工作，並挑戰依照最高標準完成每一項微不足道的任務。為了證明自己是最好的服務生，他甚至強迫自己追求荒謬的目標，例如一次端起比其他員工更多的咖啡杯。他在日常的辛勞中，找到了對品質的滿足感。","estimated":false,"audio":"audio/scene-006.mp3","duration":19.992},{"id":"voiceover-007","scene_id":"scene-007","text":"他很早就觀察到高標準與高效率的權衡。因為製作與清理奶昔極為耗時，他會試著勸顧客改點可樂；他坦言：「我討厭奶昔，因為我討厭製作奶昔」。他深信自己是該店最棒的洗碗工與服務生，這份韌性成為他日後經營公司的核心。","estimated":false,"audio":"audio/scene-007.mp3","duration":19.464},{"id":"voiceover-008","scene_id":"scene-008","text":"1980年代末，昇陽電腦正著手開發新款工作站。儘管工程副總裁拉克羅深信中央處理器 CPU 足以處理一切，不需要獨立繪圖晶片，但主管羅辛決定背著上司研發。他將克蒂斯．普里姆與克里斯．馬拉科夫斯基安排在同一間辦公室，開啟了這項未經核准的計畫。","estimated":false,"audio":"audio/scene-008.mp3","duration":22.032},{"id":"voiceover-009","scene_id":"scene-009","text":"這支兩人小組被稱為「祕密繪圖」團隊，正進行一項公司高層不希望任何人去做的工作。普里姆設計出一款被稱為「怪物」的繪圖加速器，能獨力處理高達 80% 的計算工作量。這項突破性的設計將圖形處理從 CPU 移出，讓專業晶片負責其擅長的任務。","estimated":false,"audio":"audio/scene-009.mp3","duration":21.096},{"id":"voiceover-010","scene_id":"scene-010","text":"普里姆與馬拉科夫斯基經常為了晶片決策吵得不可開交，甚至對彼此咆哮。當時負責聯繫昇陽與供應商的黃仁勳將這些衝突視為「磨劍」的範例。他認為最好的構想往往來自激烈的辯論，這種欣然接受衝突的態度，後來成為他經營輝達的核心哲學。","estimated":false,"audio":"audio/scene-010.mp3","duration":20.52},{"id":"voiceover-011","scene_id":"scene-011","text":"1989 年，團隊終於確定規格，打造出包含數十萬個電晶體的「GX 繪圖引擎」。GX 能讓視窗系統捲動文字的速度超越肉眼觀察，隨後更成為每一部昇陽工作站的標準配備。這項巨大的技術成就讓這對搭檔聲名大噪，也為日後的創業埋下了種子。","estimated":false,"audio":"audio/scene-011.mp3","duration":20.16},{"id":"voiceover-012","scene_id":"scene-012","text":"1992年底，黃仁勳、普里姆與馬拉科夫斯基經常在東聖荷西議會大道與貝里薩路交叉口的丹尼餐廳碰面。馬拉科夫斯基回憶道：「我們就去那邊，點無限暢飲的咖啡，然後工作四個鐘頭。」他們在油煙與咖啡香中，試圖將腦中的繪圖技術轉化為可行的商業計畫。","estimated":false,"audio":"audio/scene-012.mp3","duration":21.072},{"id":"voiceover-013","scene_id":"scene-013","text":"三位創辦人判定，真正的機會在個人電腦而非專業工作站。當時 PC 市場正迎來微軟 Windows 3.1 的爆發與 PCI 匯流排標準的出現，這讓三位工程師預見了 PC 處理高品質 3D 繪圖的強烈需求。他們打算讓每位玩家都玩得到 3D 遊戲，而不僅限於能在工作中接觸昂貴工作站的人。","estimated":false,"audio":"audio/scene-013.mp3","duration":22.992},{"id":"voiceover-014","scene_id":"scene-014","text":"當時黃仁勳熱愛他在 LSI Logic 的工作，他對兩位夥伴提出挑戰：「我到底憑什麼要離職加入你們？」他要求兩人必須證明這家新公司最終能達到「年銷售額 5,000 萬美元」的規模才肯加入。黃仁勳對商業模式的嚴謹要求，迫使團隊必須在創業第一天就思考市場現實。","estimated":false,"audio":"audio/scene-014.mp3","duration":20.832},{"id":"voiceover-015","scene_id":"scene-015","text":"在反覆分析市場與潛在對手後，本身也愛打電動的黃仁勳判定年營收 5,000 萬美元是可能的。他拋出一個關鍵問題：「我們幹嘛為他人作嫁？」這句話成為創業的最後動力。三個工程師決定放棄穩定的高薪，去創造一個當時甚至還未被命名的 3D 繪圖市場。","estimated":false,"audio":"audio/scene-015.mp3","duration":20.52},{"id":"voiceover-016","scene_id":"scene-016","text":"1993年初，三位共同創辦人開始在普里姆位於佛利蒙的家中工作。普里姆清空了臥室以外的每個房間，將家具全部搬到車庫，擺上大型摺疊桌來放置設備。最初的幾週，三人每天聚在一起最重要的大事，就是決定午餐要吃什麼。","estimated":false,"audio":"audio/scene-016.mp3","duration":19.32},{"id":"voiceover-017","scene_id":"scene-017","text":"他們訂購了一部捷威科技製造的個人電腦，但這台機器卻讓創辦人們摸不著頭緒。馬拉科夫斯基回憶道：「我們不是 PC 人。說來好笑，我們都要占領 PC 市場了，卻對 PC 一無所知。」當時他們僅有的最強大武器，是一部從昇陽帶出來的工作站。","estimated":false,"audio":"audio/scene-017.mp3","duration":19.896},{"id":"voiceover-018","scene_id":"scene-018","text":"黃仁勳出馬找了科律律師事務所，律師問他口袋有多少錢，他回答兩百美元。隨後黃仁勳回到家中，要求另外兩位夥伴也各拿出兩百美元「買下」公司股份。對於這筆初始投資，黃仁勳後來的評論道：「那是筆划算的交易。」","estimated":false,"audio":"audio/scene-018.mp3","duration":18.936},{"id":"voiceover-019","scene_id":"scene-019","text":"普里姆在拉丁文字典中找到了代表「嫉妒」的單字 Invidia。他們去掉開頭字母，正式將公司命名為 Nvidia，並在 1993 年 4 月 5 日完成註冊。他們暗自希望，這家研發 NV1 晶片的公司，有朝一日會成為人家嫉妒的對象。","estimated":false,"audio":"audio/scene-019.mp3","duration":17.976},{"id":"voiceover-020","scene_id":"scene-020","text":"1993年5月底，三位創辦人來到被譽為「全世界最厲害創投」的紅杉資本進行募資。雖然輝達當時還沒有自己的專利晶片，但他們帶備了破解過的昇陽顯示卡，準備進行概念驗證。對於當時對草創公司投資興趣極低的市場環境來說，這是一場決定生死的關鍵面談。","estimated":false,"audio":"audio/scene-020.mp3","duration":21.984},{"id":"voiceover-021","scene_id":"scene-021","text":"創辦人相信眼花繚亂的圖形足以說服對方，但瓦倫丁卻恨透了產品示範。他認為創業家常過度炫耀技術，卻忽略了對市場與競爭優勢的理解。示範一結束，瓦倫丁隨即轉換成他特有的風格，連珠砲般丟出一長串問題，被馬拉科夫斯基形容為一場「庭審」。","estimated":false,"audio":"audio/scene-021.mp3","duration":21.0},{"id":"voiceover-022","scene_id":"scene-022","text":"瓦倫丁逼問輝達到底是遊戲機、繪圖還是音訊公司，普里姆卻試圖以晦澀的工程術語回答「我們全部都是」。瓦倫丁嚴厲地警告，不知道自己是誰的公司必然失敗。黃仁勳後來坦承這場推銷做得「爛透了」，他無法解釋自己在為誰做產品，更無法說明憑什麼成功。","estimated":false,"audio":"audio/scene-022.mp3","duration":20.952},{"id":"voiceover-023","scene_id":"scene-023","text":"儘管簡報並不成功，但基於柯里根對黃仁勳個人才華的強力背書，紅杉資本與薩特山最終各投資了 100 萬美元。瓦倫丁在會議結束前發出著名的威脅：「要是你們害我賠錢，我會殺了你們。」這讓黃仁勳學到，個人的名聲往往走在商業計畫之前。","estimated":false,"audio":"audio/scene-023.mp3","duration":19.488},{"id":"voiceover-024","scene_id":"scene-024","text":"為了在資源匱乏的 PC 市場突圍，普里姆在 NV1 中採取了極冒險的設計。他選擇以四邊形渲染來節省昂貴的記憶體成本，並執意加入專利的波表合成音訊，試圖在單一晶片上整合圖形與聲音。這是一項展現技術敏銳度的設計，卻也要求全球軟體開發者必須為此徹底修改遊戲程式。","estimated":false,"audio":"audio/scene-024.mp3","duration":22.968},{"id":"voiceover-025","scene_id":"scene-025","text":"然而，輝達嚴重誤判了市場演進的速度。在 NV1 研發兩年間，記憶體價格從每 MB 50 美元暴跌至 5 美元，這讓原本節省成本的賣點瞬間失去意義。遊戲開發商不再有動機為了輝達的特殊標準去改寫程式，NV1 陷入了與主流技術孤立的困境。","estimated":false,"audio":"audio/scene-025.mp3","duration":20.016},{"id":"voiceover-026","scene_id":"scene-026","text":"決定 NV1 命運的是當時最受歡迎的遊戲《毀滅戰士》。這款定義產業標準的作品在 NV1 上執行效率極差，且晶片的專利音訊格式與主流聲霸卡標準完全衝突。輝達原本想推動產業發展，卻發現自己打造的技術竟然跟不上世界最火熱的遊戲腳步。","estimated":false,"audio":"audio/scene-026.mp3","duration":20.184},{"id":"voiceover-027","scene_id":"scene-027","text":"到了 1996 年春天，市場傳來了毀滅性的消息。合作夥伴帝盟多媒體將近二十五萬顆 NV1 晶片全數退回，馬拉科夫斯基沉重地體認到：「我們原本以為打造了偉大的技術，原來那不是偉大的產品。」公司花了 1,500 萬美元研發，現金流卻即將乾涸，第一幕在破產的陰影下戛然而止。","estimated":false,"audio":"audio/scene-027.mp3","duration":22.56},{"id":"voiceover-028","scene_id":"scene-028","text":"1996 年春天，輝達迎來了成立以來的最大災難。原本預計大賣的第一款產品 NV1 晶片，因為與市場主流標準不符，遭到核心合作夥伴帝盟多媒體近乎全數退貨。被退回的晶片數量高達二十五萬塊，這讓原本意氣風發的公司瞬間陷入停滯。,","estimated":false,"audio":"audio/scene-028.mp3","duration":20.04},{"id":"voiceover-029","scene_id":"scene-029","text":"面對堆積如山的退貨，共同創辦人馬拉科夫斯基沉重地體認到：「我們原本以為打造了偉大的技術，原來那不是偉大的產品。」輝達在設計時過度追求技術展現，添加了過多市場並不在意的功能，最終導致產品與實際需求徹底脫節。,","estimated":false,"audio":"audio/scene-029.mp3","duration":17.736},{"id":"voiceover-030","scene_id":"scene-030","text":"輝達當時已投入將近 1,500 萬美元研發 NV1，然而銷售慘澹意味著成本完全無法回收。公司現金流即將乾涸，陷入嚴重的破產危機。黃仁勳意識到，如果不儘快拿到更多錢，這間創立僅三年的公司，其夢想將在自作自受中猛然破滅。,","estimated":false,"audio":"audio/scene-030.mp3","duration":20.256},{"id":"voiceover-031","scene_id":"scene-031","text":"黃仁勳深感挫敗，他開始反省並承認自己雖有才華，但「經營一家公司是一項新技能」。他下令停止在錯誤方向上的盲目努力，判定公司必須尋求外援。最後的希望，指向了遠在日本東京、同樣處於開發矛盾中的合作夥伴 SEGA。,,","estimated":false,"audio":"audio/scene-031.mp3","duration":18.96},{"id":"voiceover-032","scene_id":"scene-032","text":"1996 年，來自日本合作夥伴 SEGA 的消息對輝達而言如同死刑。由於 SEGA 的程式設計師對輝達堅持的專利四邊形渲染技術極度反感，他們正式通知輝達，新一代遊戲機將不再採用開發中的 NV2 晶片。這項決定意味著輝達即將失去唯一的營收來源與生存希望。","estimated":false,"audio":"audio/scene-032.mp3","duration":21.648},{"id":"voiceover-033","scene_id":"scene-033","text":"黃仁勳與普里姆飛抵東京進行最後談判。黃仁勳在壓力下展現了極大的理智誠實，他向 SEGA 執行長坦承輝達在技術路徑上的失敗，並承認「經營一家公司是一項新技能」。他不再試圖說服對方接受錯誤的技術，而是尋求讓公司活下去的轉機。","estimated":false,"audio":"audio/scene-033.mp3","duration":20.184},{"id":"voiceover-034","scene_id":"scene-034","text":"黃仁勳請求 SEGA 依約支付研發款項，他指出合約中訂有「交付原型即付款」的條款：只要輝達能造出安裝在舊型主機板面積上的晶片原型，SEGA 仍須支付 100 萬美元。這是一場近乎卑微的請求，旨在將這筆錢轉化為研發下一款晶片 NV3 的救命錢。","estimated":false,"audio":"audio/scene-034.mp3","duration":19.728},{"id":"voiceover-035","scene_id":"scene-035","text":"SEGA 最終同意了這項請求，這 100 萬美元成為輝達在乾涸邊緣最後的救生索。黃仁勳隨即下令停止在錯誤方向上的盲目努力，將所有資源集中投入到順應市場標準的 RIVA 128。這場東京之行，讓輝達在承認徹底失敗後，反而握住了逆轉勝的火種。","estimated":false,"audio":"audio/scene-035.mp3","duration":20.52},{"id":"voiceover-036","scene_id":"scene-036","text":"1996年，由於產品與市場標準脫節，輝達陷入了嚴重的資金危機。原本寄予厚望的產品線悉數停滯，公司的發展藍圖在瞬間崩解。為了在乾涸的現金流中保留最後一線生機，黃仁勳決定採取激進的組織縮減，將公司規模強行壓縮。","estimated":false,"audio":"audio/scene-036.mp3","duration":19.896},{"id":"voiceover-037","scene_id":"scene-037","text":"輝達的員工總數從原本的一百多人銳減至四十人，超過半數的人員在這次裁員中離開。原本建制完整的銷售與行銷團隊幾乎全數解散。軟體工程師德懷特．狄爾克斯回憶當時的混亂道：「我們原本有行銷團隊，有銷售團隊，忽然之間，我們的產品路線圖不再可行。」","estimated":false,"audio":"audio/scene-037.mp3","duration":21.84},{"id":"voiceover-038","scene_id":"scene-038","text":"恐懼與焦慮成為了黃仁勳最愛的激勵工具。從這天起，他開始在每一場全體會議上反覆對留任者宣告：「我們再三十天就要破產了。」這不僅是一句警語，更是一種對抗自滿的文化，要求這四十名核心工程師必須在極限壓力下生存。","estimated":false,"audio":"audio/scene-038.mp3","duration":18.36},{"id":"voiceover-039","scene_id":"scene-039","text":"儘管銀行裡還有微薄餘額，但在輝達內部，這群人感覺自己「一直處在零點」。黃仁勳向員工解釋，只要發生幾個錯誤決策，現金就會立刻歸零。這種對失敗的偏執，迫使留下來的團隊拋棄所有雜念，將所有資源孤注一擲在唯一的翻身機會：NV3。","estimated":false,"audio":"audio/scene-039.mp3","duration":20.928},{"id":"voiceover-040","scene_id":"scene-040","text":"1996 年底，輝達的財務狀況極度不穩定。銀行裡僅剩的三百萬美元，只夠維持公司九個月的營運。而要在強敵環伺的市場中活下來，開發中的新晶片 RIVA 128 必須以超越常理的速度完成，這是一場與死神的競賽。","estimated":false,"audio":"audio/scene-040.mp3","duration":18.48},{"id":"voiceover-041","scene_id":"scene-041","text":"為了實現「光速」開發，黃仁勳堅持投入一百萬美元購買一台冰箱大小的 Ikos 模擬機。儘管這會讓公司的存活期縮短為六個月，但他拒絕了其他主管籌措更多資金以爭取時間的建議，他堅定地表示：「我們籌不到更多錢了，我們非這樣做不可。」","estimated":false,"audio":"audio/scene-041.mp3","duration":19.08},{"id":"voiceover-042","scene_id":"scene-042","text":"模擬機讓團隊能在實體晶片製造前就開發軟體，這縮短了一年的開發時間。然而操作極為艱難，機器光是載入 Windows 就要十五分鐘，測試師必須看著地圖操作游標，以免動作過快導致系統鎖住。儘管緩慢，這台機器在開發初期就抓到了硬體錯誤，證明了這場豪賭的價值。","estimated":false,"audio":"audio/scene-042.mp3","duration":22.848},{"id":"voiceover-043","scene_id":"scene-043","text":"開發過程充滿意外。由於模擬機佔據大片空間且線路雜亂，曾有夜班清潔工為了插吸塵器的插頭，誤拔了模擬機電源。這導致工程師執行整晚的基準測試全毀，團隊被迫從頭開始。在離破產只有幾十天的壓力下，任何一點細微的人為疏忽都可能致命。","estimated":false,"audio":"audio/scene-043.mp3","duration":21.504},{"id":"voiceover-044","scene_id":"scene-044","text":"1993 年 4 月，輝達攜帶著代號 NV3 的 RIVA 128 晶片樣機趕往大會。這是公司翻身的最後機會，但樣機極度不穩定，研發團隊直到開幕前幾小時才勉強讓它維持運作，且在執行測試時隨時可能鎖住系統。","estimated":false,"audio":"audio/scene-044.mp3","duration":17.784},{"id":"voiceover-045","scene_id":"scene-045","text":"當時的市場霸主 3dfx 派員到輝達攤位，找機會恥笑 NV1 的失敗，甚至直言：「喔，你們還在？」隨後 3dfx 共同創辦人塞勒斯親臨現場。業界都在觀望，這家被放任自生自滅的公司，是否真的能如期拿出產品。","estimated":false,"audio":"audio/scene-045.mp3","duration":17.88},{"id":"voiceover-046","scene_id":"scene-046","text":"為了展現測試的真實性，銷售經理克里斯汀森決定大膽博弈。他在塞勒斯面前主動關掉系統並宣稱：「為了給您最好的經驗，我會先關掉系統，讓您看看完整、順暢的運作過程。」他深知樣機在重開機後極易當機，但他別無選擇。","estimated":false,"audio":"audio/scene-046.mp3","duration":18.72},{"id":"voiceover-047","scene_id":"scene-047","text":"樣機成功跑出了驚人的數據，效能不僅優於 3dfx 的基準，也強過當時任何消費級顯示卡。對手 Rendition 的架構師唐納文看完示範後感嘆：「太神奇了。」這項數據宣告了輝達正式重返 3D 圖形市場。","estimated":false,"audio":"audio/scene-047.mp3","duration":15.96},{"id":"voiceover-048","scene_id":"scene-048","text":"RIVA 128 在展場引起的騷動讓輝達聲名大噪，也讓塞勒斯體認到這家公司並未破產。然而，技術上的突破並未立即改變財務絕境。此時輝達銀行裡的現金依然只夠支撐最後幾星期的薪水，生存的火種依然脆弱。","estimated":false,"audio":"audio/scene-048.mp3","duration":18.312},{"id":"voiceover-049","scene_id":"scene-049","text":"1997年夏季步入尾聲，儘管新晶片的數據令人振奮，但輝達的財務狀況仍處於崩潰邊緣。黃仁勳在餐廳召集全體員工，他讀出第一張紙上的銀行結餘金額，甚至精確到了美分。讀完後，他平淡地說：「我們在銀行裡就這麼多錢。」這筆錢僅夠支付最後幾星期的薪水。","estimated":false,"audio":"audio/scene-049.mp3","duration":22.32},{"id":"voiceover-050","scene_id":"scene-050","text":"緊接著，黃仁勳掏出第二張紙，宣布收到來自 STB 系統的三萬組 RIVA 128 訂單。這筆及時雨般的訂單讓輝達免於倒閉。RIVA 128 上市僅四個月就賣出百萬組，公司在 1997 年第四季獲利 140 萬美元，這不僅是公司成立四年的首次獲利，更是從瀕死中奪回的奇蹟。","estimated":false,"audio":"audio/scene-050.mp3","duration":23.208},{"id":"voiceover-051","scene_id":"scene-051","text":"在該年年底的公司會議上，黃仁勳展現了他的戲劇天分。他走遍會議室，發給每人一張一美元新鈔。他將這些鈔票視為 RIVA 訂單賜予的財務救生索，並藉此提醒眾人，雖然度過了最深的危機，但處境依然不穩定，必須時刻保持警惕。","estimated":false,"audio":"audio/scene-051.mp3","duration":19.392},{"id":"voiceover-052","scene_id":"scene-052","text":"黃仁勳特別表揚了負責包裝出貨的凱瑟琳，宣布她應得雙倍獎金。回顧這段時光，黃仁勳感嘆：「RIVA 128是一個奇蹟。」在走投無路之際，這群工程師憑藉正確的技術決策與純粹的意志力，將輝達從三十天內破產的咒語中拯救出來，並準備迎接下一場長期賭注。","estimated":false,"audio":"audio/scene-052.mp3","duration":21.336},{"id":"voiceover-053","scene_id":"scene-053","text":"2002年，研究員馬克．哈里斯觀察到，科學家正試圖使用 GeForce 3 執行非圖形應用。由於當時的 GPU 僅能理解圖形指令，研究員必須將數學矩陣乘法「破解」並偽裝成圖形函式。這種繞道而行的模擬方式雖然顯著提升了運算速度，卻需要極為特殊的程式設計技巧。","estimated":false,"audio":"audio/scene-053.mp3","duration":22.68},{"id":"voiceover-054","scene_id":"scene-054","text":"學術界最初使用冗長的術語，如「利用圖形硬體達成其他目的」來描述這種現象。馬克．哈里斯決定創造一個更簡單的名稱：「在 GPU 上執行通用運算」，簡稱 GPGPU。他創辦了 GPGPU.org 網站推廣此趨勢，該平台迅速成為全球研究人員交換 GPU 算力心得的熱門據點。","estimated":false,"audio":"audio/scene-054.mp3","duration":22.176},{"id":"voiceover-055","scene_id":"scene-055","text":"取得博士學位後，哈里斯加入輝達，驚訝地發現「GPGPU」一詞已在員工間廣泛使用。黃仁勳也敏銳察覺到，這項技術有潛力將 GPU 擴展至醫學影像等領域。然而，當時所有任務都必須透過專屬圖形的 Cg 語言執行，專利權與專業限制成為技術普及的巨大障礙。","estimated":false,"audio":"audio/scene-055.mp3","duration":21.72},{"id":"voiceover-056","scene_id":"scene-056","text":"輝達內部隨後啟動了一個代號為「NV50」的祕密計畫，目標是打造一種全新的程式設計模型。這項技術後來被命名為「統一計算架構」，即 CUDA，它允許科學家使用廣泛流行的 C 語言進行運算。這項決定將使 GPU 轉變為能與 CPU 分擔所有次要科學任務的巨大引擎。","estimated":false,"audio":"audio/scene-056.mp3","duration":21.504},{"id":"voiceover-057","scene_id":"scene-057","text":"輝達內部當時正啟動一項代號「NV50」的祕密計畫，目標是研發最具前瞻性的通用運算模式。這項模型後來被正式命名為「統一計算架構」，也就是 CUDA，旨在讓 GPU 能夠分擔 CPU 處理的所有科學與工業任務。","estimated":false,"audio":"audio/scene-057.mp3","duration":16.944},{"id":"voiceover-058","scene_id":"scene-058","text":"CUDA 的誕生仰賴軟硬體團隊的緊密配合。軟體專家巴克開發程式設計環境，硬體架構師尼可斯則確保晶片納入更大的記憶體快取。他們共同管理複雜的指令網路，讓 GPU 數千個運算核心能平行執行任務。","estimated":false,"audio":"audio/scene-058.mp3","duration":17.256},{"id":"voiceover-059","scene_id":"scene-059","text":"儘管成本極高，黃仁勳仍堅持 CUDA 必須應用在包含遊戲卡的每一條產品線，以確保它能迅速成為產業標準。他對團隊下達明確指示：「我們應該讓 CUDA 技術無所不在，讓它成為核心基礎技術」。","estimated":false,"audio":"audio/scene-059.mp3","duration":15.6},{"id":"voiceover-060","scene_id":"scene-060","text":"輝達投入四年時間與近五億美元打造第一款具備運算功能的 G80 晶片，其內部擁有 128 個 CUDA 核心。雖然這項投資讓晶片成本大幅增加，黃仁勳仍深信加速運算能解決一般電腦無法處理的問題。","estimated":false,"audio":"audio/scene-060.mp3","duration":16.224},{"id":"voiceover-061","scene_id":"scene-061","text":"2006 年 CUDA 發表後，市場反應冷淡。2007 年，大約五十位金融分析師親赴輝達總部，聽取管理階層解釋為何華爾街應該繼續相信這家公司。當時輝達為了支持 CUDA，毛利率顯著縮水，分析師們普遍對這項耗資巨大且看不見短期回報的技術抱持懷疑態度。","estimated":false,"audio":"audio/scene-061.mp3","duration":21.432},{"id":"voiceover-062","scene_id":"scene-062","text":"午餐會移師到露天停車場進行，氣氛一如簡陋的自助餐般尷尬。分析師們連珠砲似地詢問短期財務問題，希望知道 CUDA 到底對毛利率有何影響。儘管黃仁勳重申長期獲利的展望，但分析師仍將注意力放在未來幾個月的盈餘，而非他口中那幾年後才會成形的 GPU 運算市場。","estimated":false,"audio":"audio/scene-062.mp3","duration":22.728},{"id":"voiceover-063","scene_id":"scene-063","text":"分析師丹尼爾．恩斯特打破了沉悶的財務拷問，他詢問 GPU 是否能解決 Photoshop 處理高解析度影像變慢的問題。黃仁勳的眼睛亮了起來，他向恩斯特透露 Adobe 正是合作夥伴，GPU 將卸載 CPU 的運算任務以提高速度。他堅定地表示：「這正是我所說的即將來臨的『GPU 時代』。」","estimated":false,"audio":"audio/scene-063.mp3","duration":22.176},{"id":"voiceover-064","scene_id":"scene-064","text":"在 2007 年至 2008 年間，輝達股價下跌逾 80%，華爾街幾乎判定公司走在錯誤道路上。面對投資人要求修正策略的壓力，黃仁勳拒絕讓步，他坦言：「我相信 CUDA，我對它的潛力深信不疑。」他深知這是一場長期的孤獨飛行，為了實現願景，他選擇忍受當下的財務磨難。","estimated":false,"audio":"audio/scene-064.mp3","duration":22.656},{"id":"voiceover-065","scene_id":"scene-065","text":"CUDA 發表初期，學術界對此興致缺缺。首席科學家大衛．柯爾克在一年內舉辦了一百多場演講，試圖說服教授們改變電腦科學的授課內容，卻在世界各地面臨冷遇。柯爾克回憶當時的挫折：「沒有人知道如何利用 CUDA 架構設計程式……我真的是到處碰壁。」","estimated":false,"audio":"audio/scene-065.mp3","duration":20.616},{"id":"voiceover-066","scene_id":"scene-066","text":"轉機出現在伊利諾大學香檳分校，系主任布拉胡特勸說柯爾克親自授課。2007 年，柯爾克每隔一週便從科羅拉多州飛往伊利諾州，與獲獎教授胡文美搭檔教導平行運算。他們錄下課程並在網路免費提供，這項計畫成功吸引了全球研究人員的目光。","estimated":false,"audio":"audio/scene-066.mp3","duration":20.76},{"id":"voiceover-067","scene_id":"scene-067","text":"為了建立教學標準，柯爾克與胡文美親自撰寫了教科書，並於 2010 年正式出版。這本書隨後被翻譯成多國語言、獲數百所學校採用，售出數萬冊。這成為 CUDA 發展史上的關鍵轉捩點，讓這套原本沒人懂的架構，正式成為全球工程師的必修課。","estimated":false,"audio":"audio/scene-067.mp3","duration":20.664},{"id":"voiceover-068","scene_id":"scene-068","text":"輝達同時推動了一項特殊的捐贈計畫。為了避免現金捐贈被大學收取的管理費稀釋，柯爾克決定直接捐贈硬體設備。他直言這並非完全無私：「我們希望大學在課堂上使用我們的硬體，而不是超微的設備。」這項策略確保了新一代人才在進入職場前，就已熟悉輝達的生態系。","estimated":false,"audio":"audio/scene-068.mp3","duration":22.008},{"id":"voiceover-069","scene_id":"scene-069","text":"在聖地牙哥超級電腦中心，羅斯．沃克目睹了科研算力分配的不公。當時，極其稀缺的運算資源往往優先分配給已成名的頂尖科學家，年輕研究員的提案大多被否決。沃克感嘆，這造成了「獲得算力的唯一途徑，就是之前已經獲得過算力」的壟斷瓶頸，讓許多傑出想法胎死腹中。","estimated":false,"audio":"audio/scene-069.mp3","duration":22.632},{"id":"voiceover-070","scene_id":"scene-070","text":"沃克決心為研究界尋找更經濟的算力。他曾嘗試破解遊戲主機，也考慮過每顆要價數萬美元的專用晶片，但都因成本或技術障礙而失敗。最後，他發現原本用於渲染 3D 圖像的顯卡具備處理複雜矩陣運算的潛力，這才找上輝達，試圖將生物模擬程式 AMBER 移植到 CUDA 平台上。","estimated":false,"audio":"audio/scene-070.mp3","duration":22.464},{"id":"voiceover-071","scene_id":"scene-071","text":"2009 年，支援 GPU 的 AMBER 軟體問世，運算速度比以往版本提升了驚人的五十倍。這項突破實現了算力民主化的夢想，研究員只需要幾張輝達遊戲顯卡，就能擁有媲美一整排伺服器的效能。沃克直言：「你可以花兩千美元買四個 GeForce 顯卡，就能擁有高效能工作站，這完全改變了遊戲規則」。","estimated":false,"audio":"audio/scene-071.mp3","duration":23.784},{"id":"voiceover-072","scene_id":"scene-072","text":"然而，輝達基於獲利考量，開始限制研究員購買較便宜的遊戲卡，並建議改用高價的 Tesla 系列。沃克對此強烈反對，他透過極端測試證明遊戲卡同樣精確，並指出「輝達成功的關鍵在於允許 CUDA 在 GeForce 顯示卡上執行」。這場博弈揭示了輝達在建立生態系過程中，必須面對商業利潤與用戶利益的複雜拉鋸。","estimated":false,"audio":"audio/scene-072.mp3","duration":24.624},{"id":"voiceover-073","scene_id":"scene-073","text":"隨著輝達規模擴大至數千人，黃仁勳意識到傳統官僚體系會導致資訊扭曲。他決定建立極度扁平的組織，取消一對一的私下會議，並讓多達六十位高階主管直接向他報告。這種設計確保了每個人都能同時獲得相同的資訊，讓公司能像新創團隊般維持「光速」反應。","estimated":false,"audio":"audio/scene-073.mp3","duration":21.96},{"id":"voiceover-074","scene_id":"scene-074","text":"為了掌握公司脈動，黃仁勳要求員工定期發送「五要事」電郵，詳述優先處理任務與市場現況。理想的內容必須以代表具體行動的動詞開頭。他認為正式的狀態更新報告往往會被「清洗」掉爭議與問題，而五要事電郵則能保留真實的痛點與技術風險。","estimated":false,"audio":"audio/scene-074.mp3","duration":21.072},{"id":"voiceover-075","scene_id":"scene-075","text":"每週日深夜，黃仁勳會花數小時閱讀大約一百封員工電郵。他曾坦言：「我在尋找微弱的訊號。要捕捉強烈訊號很容易，但我想在訊號還微弱時就截獲它們。」正是透過這些來自基層工程師的報告，他敏銳捕捉到機器學習正要爆發的訊號，並隨即下令投入更多軟體人才。","estimated":false,"audio":"audio/scene-075.mp3","duration":22.344},{"id":"voiceover-076","scene_id":"scene-076","text":"黃仁勳的回覆通常快如閃電，並要求員工在二十四小時內採取行動。他向員工強調「使命才是老闆」，所有決策應為了顧客利益與技術使命服務，而非為了取悅主管。這種對抗自滿的預防文化，讓輝達在市場轉向 AI 的關鍵時刻，能迅速重新分配資源並全員投入。","estimated":false,"audio":"audio/scene-076.mp3","duration":22.224},{"id":"voiceover-077","scene_id":"scene-077","text":"2010 年，電腦視覺領域陷入瓶頸，專家們致力於開發更好的演算法，卻收效甚微。史丹佛教授李飛飛建立了包含數百萬張標記圖像的 ImageNet 數據庫並發起競賽。在前兩屆比賽中，傳統軟體的分類正確率難以突破百分之七十五，學術界仍在尋找能讓電腦真正「看懂」世界的點火裝置。","estimated":false,"audio":"audio/scene-077.mp3","duration":23.808},{"id":"voiceover-078","scene_id":"scene-078","text":"2012 年，傑佛瑞．辛頓與他的學生開發了 AlexNet 模型，利用兩顆普通輝達 GPU 支援深度學習神經網路。這個模型在兩週內完成訓練，並在第三屆競賽中取得百分之八十五的正確率，遠超所有競爭對手。這場勝利向全世界證明，GPU 提供的加速運算正是點燃人工智慧革命的關鍵火花。","estimated":false,"audio":"audio/scene-078.mp3","duration":23.832},{"id":"voiceover-079","scene_id":"scene-079","text":"儘管內部高層存在反對聲音，黃仁勳仍決定推翻質疑，下令將人工智慧列為公司最優先要務。他要求優秀人才若正在從事其他工作，必須立即調整重心投入深度學習。黃仁勳確信 AI 將顯著擴大軟硬體市場，這項決定讓輝達從圖形顯示卡公司，正式轉型為人工智慧帝國的基礎設施商。","estimated":false,"audio":"audio/scene-079.mp3","duration":23.784},{"id":"voiceover-080","scene_id":"scene-080","text":"2017年，谷歌研究人員發表了具有里程碑意義的論文。黃仁勳迅速察覺到 Transformer 架構中自注意力機制的潛力，認定其能有效辨識數據模式並進行平行運算。他隨即在內部會議詳細討論這項技術，指示軟體團隊針對尚未爆發的生成式人工智慧市場進行優化。","estimated":false,"audio":"audio/scene-080.mp3","duration":21.144},{"id":"voiceover-081","scene_id":"scene-081","text":"雖然當時 Hopper 架構晶片的開發已接近尾聲，距離量產封裝僅剩數月，但黃仁勳與架構師團隊決定承擔成本，在晶片面積中大幅增加對人工智慧的硬體支援。他們決定納入專門用於深度學習的張量核心，這項在最後時刻自願進行的設計調整，在晶片界前所未見。","estimated":false,"audio":"audio/scene-081.mp3","duration":21.048},{"id":"voiceover-082","scene_id":"scene-082","text":"軟體團隊隨後開發出「Transformer Engine」專用函式庫，能自動為任務選擇最有效率的運算精度。搭載此引擎的 GPU 可將原本需要數月的模型訓練，縮短至數小時完成。這項決策讓輝達在 ChatGPT 出現時已準備就緒，正式開啟了人工智慧的基礎設施時代。","estimated":false,"audio":"audio/scene-082.mp3","duration":21.0},{"id":"voiceover-083","scene_id":"scene-083","text":"2023 年 5 月 24 日星期三，全球市場正屏息以待。自 2022 年底 ChatGPT 引發生成式人工智慧熱潮後，投資人急欲確認這股浪潮究意能為這家晶片製造商帶來多少實質收益。交易員曼圭諾坐在終端機前，等待著即將決定市場走向的頭條新聞。","estimated":false,"audio":"audio/scene-083.mp3","duration":21.096},{"id":"voiceover-084","scene_id":"scene-084","text":"財報公布瞬間，終端機跳出了震撼數據：輝達預測第二季營收將達 110 億美元，比華爾街預估的高出整整 40 億美元。分析師拉斯岡將此形容為「大爆炸」，稱其前景在各方面都無疑是「宇宙級別」。這項半導體史上最大幅度的營收增幅，瞬間引爆了市場。","estimated":false,"audio":"audio/scene-084.mp3","duration":21.912},{"id":"voiceover-085","scene_id":"scene-085","text":"財報公布次日，輝達股價飆升百分之二十四，單日市值增加了 1,840 億美元，光是這項增值就超過了英特爾的總市值。這場大爆炸向全世界證明，黃仁勳過去十年將重心全押在人工智慧的豪賭已正式收網，輝達正式成為定義 AI 時代的基礎設施龍頭。","estimated":false,"audio":"audio/scene-085.mp3","duration":20.76},{"id":"voiceover-086","scene_id":"scene-086","text":"黃仁勳在隨後的演講中趁勝追擊，他向滿座聽眾傳遞了一個極其簡單的訊息：「買愈多，省愈多」。他將 AI 定義為能預測未來的通用函式逼近器，宣示著全球資料中心正從傳統 CPU 轉向 GPU 平行運算。這一刻，世界終於看懂了這家從丹尼餐廳起家的公司。","estimated":false,"audio":"audio/scene-086.mp3","duration":21.288},{"id":"voiceover-087","scene_id":"scene-087","text":"2023 年，生成式人工智慧的需求讓訂單量攀升至物理極限。輝達的高端 AI 產品並非單純的晶片，而是由多達三萬五千個組件組成的複雜系統。面對如此龐大的硬體需求，輝達必須跨出設計者的舒適圈，直接介入地表最複雜的供應鏈協作。, [B01]","estimated":false,"audio":"audio/scene-087.mp3","duration":21.24},{"id":"voiceover-088","scene_id":"scene-088","text":"輝達向合作夥伴派出了被稱為「飛虎隊」的精銳工程小組，進駐台積電、富士康與緯創等工廠。這支部隊的任務不只是監督，他們直接購買設備、資助擴建廠房，並推動自動化測試。輝達透過深度介入製造端，確保亞洲廠區能以「光速」釋放產能。, [B01]","estimated":false,"audio":"audio/scene-088.mp3","duration":22.176},{"id":"voiceover-089","scene_id":"scene-089","text":"傳統製造商通常在流程間預留十四至十八週的緩衝時間，以避免上游問題導致停工。飛虎隊則在製程初期就導入嚴密控制，消除了閒置時間。儘管這種做法極其燒錢且會拖累短期獲利，但輝達堅持以這種方式維持在 AI 賽道上的絕對領先。","estimated":false,"audio":"audio/scene-089.mp3","duration":20.208},{"id":"voiceover-090","scene_id":"scene-090","text":"供應鏈的成功動員，讓黃仁勳得以在台北國際電腦展宣示「買愈多，省愈多」的邏輯。他將 AI 定義為能預測未來的通用函式逼近器，並透過飛虎隊的執行力，將 GPU 轉化為 AI 時代的標準算力貨幣。這一刻，輝達正式確立了全球 AI 基礎設施的龍頭地位。, [B01]","estimated":false,"audio":"audio/scene-090.mp3","duration":22.368},{"id":"voiceover-091","scene_id":"scene-091","text":"執掌輝達三十一年，黃仁勳始終拒絕在私人辦公室工作。他每天待在總部「奮進者號」大樓內的「大都會」會議室主持小組會議。這種無隔閡的空間設計，象徵著他對資訊透明與直接溝通的極致追求，讓執行長能隨時與一線專案保持聯繫。","estimated":false,"audio":"audio/scene-091.mp3","duration":20.04},{"id":"voiceover-092","scene_id":"scene-092","text":"為了維持如新創公司般的光速反應，黃仁勳建立了極度扁平的組織。他有多達六十位高階主管直接向他報告，藉此取消了一對一的私下會議。這種結構確保每個人都能同時獲得相同的資訊，徹底杜絕了大型企業常見的官僚制度與地盤爭奪。","estimated":false,"audio":"audio/scene-092.mp3","duration":19.656},{"id":"voiceover-093","scene_id":"scene-093","text":"在「大都會」會議室裡，黃仁勳不斷強調「使命才是老闆」。他認為所有決策都應是為了顧客利益與技術突破服務，而非為了取悅主管。他會在會議上公開說明自己的思考邏輯，透過這種教學式的管理，將自己的策略直覺灌輸給每一位專案負責人。","estimated":false,"audio":"audio/scene-093.mp3","duration":20.496},{"id":"voiceover-094","scene_id":"scene-094","text":"輝達的會議室裡幾乎看不到投影機或 PPT，取而代之的是占滿整面牆的白板。黃仁勳堅持手繪架構，並在解決問題後將其擦掉。這塊白板象徵著輝達「不進則退」的哲學，無論昨天的構想多麼精湛，今天都要重新開始創新。","estimated":false,"audio":"audio/scene-094.mp3","duration":18.72},{"id":"voiceover-095","scene_id":"scene-095","text":"執掌三兆美元帝國的黃仁勳，至今仍引以為傲的是他在基層磨練出的工作倫理。他曾多次向媒體與員工直言：「我掃的廁所應該比史上任何執行長都多。」對他而言，不管是洗第一百次廁所，還是決定 AI 晶片的未來，每一項任務都必須依照最高標準完成，沒有任何苦差事是卑微的。,","estimated":false,"audio":"audio/scene-095.mp3","duration":22.104},{"id":"voiceover-096","scene_id":"scene-096","text":"為了對抗成功帶來的自滿，黃仁勳對自己極度嚴苛。他在內部會議透露，每天早上照鏡子時，他對自己說的第一句話就是：「你真差勁。」這種「理智的誠實」要求團隊必須隨時承認失敗、從錯誤中學習，並確保公司始終處於生存模式，而非沉溺於股價與排名的分數。,,","estimated":false,"audio":"audio/scene-096.mp3","duration":21.648},{"id":"voiceover-097","scene_id":"scene-097","text":"黃仁勳深信，「偉大和聰明無關，偉大來自性格。」他在肯塔基州奧奈達度過的磨難歲月，培養出如街頭霸王般不閃避衝突的韌性。這份性格讓他在面對 NV1 失敗、CUDA 被質疑的長夜裡，依然能憑藉純粹的意志力帶領輝達一次次戰勝自己，活出最純粹的「輝達之道」。,,","estimated":false,"audio":"audio/scene-097.mp3","duration":20.664},{"id":"voiceover-098","scene_id":"scene-098","text":"輝達的故事幾乎與黃仁勳的個人意志共生，這讓他成為了公司最強的引擎，卻也是外界眼中的「單點故障」。三十一年後，當他再度拿起白板筆，迎接下一波數位生物學或機器人浪潮時，這場關於韌性與創新的冒險才剛剛開始。只要白板尚未擦掉，新的契機就不會停歇。,","estimated":false,"audio":"audio/scene-098.mp3","duration":22.008},{"id":"voiceover-099","scene_id":"scene-099","text":"輝達在 2024 年攀上全球市值巔峰，超越微軟與蘋果，成為 AI 時代的心臟。然而，這家三十一歲的公司依然維持著高度的危機感，這源於其特殊的組織結構。外界常將黃仁勳視為這部龐大機器的「單點故障」，質疑當這套完全依賴個人意志運作的文化失去核心時，三兆美元的帝國能否延續其光速。","estimated":false,"audio":"audio/scene-099.mp3","duration":24.24},{"id":"voiceover-100","scene_id":"scene-100","text":"儘管生成式人工智慧需求如日中天，但「規模定律」的限制正悄然浮現。隨著大型語言模型對數據與算力的吞噬接近收益遞減點，輝達必須證明除了提供訓練晶片外，還能在推理市場與數位生物學等新領域建立第二條護城河。對黃仁勳來說，這意味著他必須帶領輝達，在下一個「三十天內破產」的威脅成真前，再次定義未來的運算。","estimated":false,"audio":"audio/scene-100.mp3","duration":26.76},{"id":"voiceover-101","scene_id":"scene-101","text":"黃仁勳深信輝達成功的祕訣在於「純粹的意志力」，這份性格讓公司在無數次瀕死中學會了如何忍受磨難。對他而言，白板的空白並不代表結束，而是全新的契機。這塊板子曾畫過 NV1、CUDA 與 Transformer，如今正等待著下一波能解決人類最棘手問題的架構。","estimated":false,"audio":"audio/scene-101.mp3","duration":21.288},{"id":"voiceover-102","scene_id":"scene-102","text":"當被問及如何看待輝達的巔峰，黃仁勳僅表示：「我熱愛輝達。」他將繼續選擇那條最艱難的路，在物理定律的極限邊緣奔跑。白板上的新構想即將被擦掉重來，對這群工程師而言，定義 AI 時代的冒險其實才剛剛開始。只要意志尚未耗盡，這場關於韌性與創新的長跑就不會停歇。","estimated":false,"audio":"audio/scene-102.mp3","duration":22.944},{"id":"voiceover-103","scene_id":"scene-103","text":"究竟何謂「輝達之道」？這套文化結合了罕見的員工自主與最高標準，要求團隊始終在物理定律的極限邊緣奔跑。其核心本質，正是黃仁勳對這段三十一年旅程的最終總結：「純粹的意志力」。正是這股力量，讓三個工程師敢於押注不存在的市場，並在無數次瀕死危機中，戰勝了對成功與自滿的恐懼。","estimated":false,"audio":"audio/scene-103.mp3","duration":25.176},{"id":"voiceover-104","scene_id":"scene-104","text":"對於成功，黃仁勳有著與眾不同的見解，他深信逆境才是最好的老師。他曾多次向大眾直言，他希望人們能「承受足夠的痛苦與磨難」，因為性格只能由克服挫折來塑造。這份不閃避衝突的街頭霸王性格，讓輝達學會將每一次失敗轉化為進化的養分。在追求卓越的長跑中，堅韌的性格遠比聰明才智更為關鍵。","estimated":false,"audio":"audio/scene-104.mp3","duration":25.8},{"id":"voiceover-105","scene_id":"scene-105","text":"掌舵三十一年後，黃仁勳依然以「光速」駕駛著輝達這輛精密賽車。當被問及如何看待這段從洗碗槽到三兆美元帝國的傳奇旅程時，他僅以最單純且毫不避諱的熱情回答：「我熱愛輝達。」這場關於韌性與創新的冒險從未結束，只要意志尚未耗盡，這家定義 AI 時代的公司，腳步就不會停歇。","estimated":false,"audio":"audio/scene-105.mp3","duration":22.656},{"id":"voiceover-106","scene_id":"scene-106","text":"偉大來自性格，而非聰明。那個曾在肯塔基州掃廁所的亞裔少年，與如今站在全球運算頂峰的執行長，始終共享著同一個靈魂。白板上的精湛構想會被擦掉重來，每一次的「三十天內破產」都是輝達全新的起點。全片在創業原點的殘影中收尾，宣告著「輝達之道」永恆的戰鬥循環。","estimated":false,"audio":"audio/scene-106.mp3","duration":23.736}],"playback":{"total_duration":2219.4,"scenes":[{"id":"scene-001","start":0.0,"end":21.408,"duration":21.408,"audio":"audio/scene-001.mp3"},{"id":"scene-002","start":21.408,"end":41.16,"duration":19.752,"audio":"audio/scene-002.mp3"},{"id":"scene-003","start":41.16,"end":59.952,"duration":18.792,"audio":"audio/scene-003.mp3"},{"id":"scene-004","start":59.952,"end":77.808,"duration":17.856,"audio":"audio/scene-004.mp3"},{"id":"scene-005","start":77.808,"end":96.672,"duration":18.864,"audio":"audio/scene-005.mp3"},{"id":"scene-006","start":96.672,"end":116.664,"duration":19.992,"audio":"audio/scene-006.mp3"},{"id":"scene-007","start":116.664,"end":136.128,"duration":19.464,"audio":"audio/scene-007.mp3"},{"id":"scene-008","start":136.128,"end":158.16,"duration":22.032,"audio":"audio/scene-008.mp3"},{"id":"scene-009","start":158.16,"end":179.256,"duration":21.096,"audio":"audio/scene-009.mp3"},{"id":"scene-010","start":179.256,"end":199.776,"duration":20.52,"audio":"audio/scene-010.mp3"},{"id":"scene-011","start":199.776,"end":219.936,"duration":20.16,"audio":"audio/scene-011.mp3"},{"id":"scene-012","start":219.936,"end":241.008,"duration":21.072,"audio":"audio/scene-012.mp3"},{"id":"scene-013","start":241.008,"end":264.0,"duration":22.992,"audio":"audio/scene-013.mp3"},{"id":"scene-014","start":264.0,"end":284.832,"duration":20.832,"audio":"audio/scene-014.mp3"},{"id":"scene-015","start":284.832,"end":305.352,"du 3"},{"id":"scene-057","start":1135.632,"end":1152.576,"duration":16.944,"audio":"audio/scene-057.mp3"},{"id":"scene-058","start":1152.576,"end":1169.832,"duration":17.256,"audio":"audio/scene-058.mp3"},{"id":"scene-059","start":1169.832,"end":1185.432,"duration":15.6,"audio":"audio/scene-059.mp3"},{"id":"scene-060","start":1185.432,"end":1201.656,"duration":16.224,"audio":"audio/scene-060.mp3"},{"id":"scene-061","start":1201.656,"end":1223.088,"duration":21.432,"audio":"audio/scene-061.mp3"},{"id":"scene-062","start":1223.088,"end":1245.816,"duration":22.728,"audio":"audio/scene-062.mp3"},{"id":"scene-063","start":1245.816,"end":1267.992,"duration":22.176,"audio":"audio/scene-063.mp3"},{"id":"scene-064","start":1267.992,"end":1290.648,"duration":22.656,"audio":"audio/scene-064.mp3"},{"id":"scene-065","start":1290.648,"end":1311.264,"duration":20.616,"audio":"audio/scene-065.mp3"},{"id":"scene-066","start":1311.264,"end":1332.024,"duration":20.76,"audio":"audio/scene-066.mp3"},{"id":"scene-067","start":1332.024,"end":1352.688,"duration":20.664,"audio":"audio/scene-067.mp3"},{"id":"scene-068","start":1352.688,"end":1374.696,"duration":22.008,"audio":"audio/scene-068.mp3"},{"id":"scene-069","start":1374.696,"end":1397.328,"duration":22.632,"audio":"audio/scene-069.mp3"},{"id":"scene-070","start":1397.328,"end":1419.792,"duration":22.464,"audio":"audio/scene-070.mp3"},{"id":"scene-071","start":1419.792,"end":1443.576,"duration":23.784,"audio":"audio/scene-071.mp3"},{"id":"scene-072","start":1443.576,"end":1468.2,"duration":24.624,"audio":"audio/scene-072.mp3"},{"id":"scene-073","start":1468.2,"end":1490.16,"duration":21.96,"audio":"audio/scene-073.mp3"},{"id":"scene-074","start":1490.16,"end":1511.232,"duration":21.072,"audio":"audio/scene-074.mp3"},{"id":"scene-075","start":1511.232,"end":1533.576,"duration":22.344,"audio":"audio/scene-075.mp3"},{"id":"scene-076","start":1533.576,"end":1555.8,"duration":22.224,"audio":"audio/scene-076.mp3"},{"id":"scene-077","start":1555.8,"end":1579.608,"duration":23.808,"audio":"audio/scene-077.mp3"},{"id":"scene-078","start":1579.608,"end":1603.44,"duration":23.832,"audio":"audio/scene-078.mp3"},{"id":"scene-079","start":1603.44,"end":1627.224,"duration":23.784,"audio":"audio/scene-079.mp3"},{"id":"scene-080","start":1627.224,"end":1648.368,"duration":21.144,"audio":"audio/scene-080.mp3"},{"id":"scene-081","start":1648.368,"end":1669.416,"duration":21.048,"audio":"audio/scene-081.mp3"},{"id":"scene-082","start":1669.416,"end":1690.416,"duration":21.0,"audio":"audio/scene-082.mp3"},{"id":"scene-083","start":1690.416,"end":1711.512,"duration":21.096,"audio":"audio/scene-083.mp3"},{"id":"scene-084","start":1711.512,"end":1733.424,"duration":21.912,"audio":"audio/scene-084.mp3"},{"id":"scene-085","start":1733.424,"end":1754.184,"duration":20.76,"audio":"audio/scene-085.mp3"},{"id":"scene-086","start":1754.184,"end":1775.472,"duration":21.288,"audio":"audio/scene-086.mp3"},{"id":"scene-087","start":1775.472,"end":1796.712,"duration":21.24,"audio":"audio/scene-087.mp3"},{"id":"scene-088","start":1796.712,"end":1818.888,"duration":22.176,"audio":"audio/scene-088.mp3"},{"id":"scene-089","start":1818.888,"end":1839.096,"duration":20.208,"audio":"audio/scene-089.mp3"},{"id":"scene-090","start":1839.096,"end":1861.464,"duration":22.368,"audio":"audio/scene-090.mp3"},{"id":"scene-091","start":1861.464,"end":1881.504,"duration":20.04,"audio":"audio/scene-091.mp3"},{"id":"scene-092","start":1881.504,"end":1901.16,"duration":19.656,"audio":"audio/scene-092.mp3"},{"id":"scene-093","start":1901.16,"end":1921.656,"duration":20.496,"audio":"audio/scene-093.mp3"},{"id":"scene-094","start":1921.656,"end":1940.376,"duration":18.72,"audio":"audio/scene-094.mp3"},{"id":"scene-095","start":1940.376,"end":1962.48,"duration":22.104,"audio":"audio/scene-095.mp3"},{"id":"scene-096","start":1962.48,"end":1984.128,"duration":21.648,"audio":"audio/scene-096.mp3"},{"id":"scene-097","start":1984.128,"end":2004.792,"duration":20.664,"audio":"audio/scene-097.mp3"},{"id":"scene-098","start":2004.792,"end":2026.8,"duration":22.008,"audio":"audio/scene-098.mp3"},{"id":"scene-099","start":2026.8,"end":2051.04,"duration":24.24,"audio":"audio/scene-099.mp3"},{"id":"scene-100","start":2051.04,"end":2077.8,"duration":26.76,"audio":"audio/scene-100.mp3"},{"id":"scene-101","start":2077.8,"end":2099.088,"duration":21.288,"audio":"audio/scene-101.mp3"},{"id":"scene-102","start":2099.088,"end":2122.032,"duration":22.944,"audio":"audio/scene-102.mp3"},{"id":"scene-103","start":2122.032,"end":2147.208,"duration":25.176,"audio":"audio/scene-103.mp3"},{"id":"scene-104","start":2147.208,"end":2173.008,"duration":25.8,"audio":"audio/scene-104.mp3"},{"id":"scene-105","start":2173.008,"end":2195.664,"duration":22.656,"audio":"audio/scene-105.mp3"},{"id":"scene-106","start":2195.664,"end":2219.4,"duration":23.736,"audio":"audio/scene-106.mp3"}],"captions":[{"id":"aligned-caption-001","scene_id":"scene-001","start":0.0,"end":7.136,"text":"1970年代，年幼的黃仁勳被送往肯塔基州的奧奈達浸信會學校。"},{"id":"aligned-caption-002","scene_id":"scene-001","start":7.136,"end":14.272,"text":"這所學校在1890年代創立時，原是為了安置長期不和家庭的孩子，本質上是一所專收問題少年的教養院。"},{"id":"aligned-caption-003","scene_id":"scene-001","start":14.272,"end":21.408,"text":"學生每天必須跨越危險的旋轉橋去上課，迎接他們的是極其嚴格的作息與紀律。"},{"id":"aligned-caption-004","scene_id":"scene-002","start":21.408,"end":31.284,"text":"在這所學校，每個學生都必須從事體力活。年僅十多歲、身為少數亞裔的黃仁勳，被指派負責整棟三層樓宿舍的清潔工作。"},{"id":"aligned-caption-005","scene_id":"scene-002","start":31.284,"end":41.16,"text":"他回憶道：「我得掃廁所，所以一定會看到那種東西。」這段日子不僅是勞動的磨練，更是對心理韌性的極致考驗。"},{"id":"aligned-caption-006","scene_id":"scene-003","start":41.16,"end":50.556,"text":"由於年紀最小且種族不同，黃仁勳初到校時常挨揍，室友甚至是一位大他八歲、全身佈滿刀疤的少年。"},{"id":"aligned-caption-007","scene_id":"scene-003","start":50.556,"end":59.952,"text":"黃仁勳選擇不閃避恐懼，他主動教室友讀書換取對方教他舉重。舉重不僅給了他力量，更給了他為自己挺身而出的信心。"},{"id":"aligned-caption-008","scene_id":"scene-004","start":59.952,"end":68.88,"text":"這段教養院式的歲月，塑造了黃仁勳街頭霸王般的心性。他曾表示：「我從不主動找人打架，但也絕對不會閃避。"},{"id":"aligned-caption-009","scene_id":"scene-004","start":68.88,"end":77.808,"text":"」他相信卓越來自克服逆境所塑造的性格，而這份忍受不適與磨難的能力，將成為他日後經營輝達的核心哲學。"},{"id":"aligned-caption-010","scene_id":"scene-005","start":77.808,"end":84.096,"text":"15 歲時，黃仁勳在波特蘭的丹尼餐廳開始了他的第一份工作。"},{"id":"aligned-caption-011","scene_id":"scene-005","start":84.096,"end":90.384,"text":"他從最底層的洗碗工和掃廁所做起，他曾開誠布公地回憶道：「我掃的廁所應該比史上任何執行長都多」。"},{"id":"aligned-caption-012","scene_id":"scene-005","start":90.384,"end":96.672,"text":"這段經歷迫使極度內向怕羞的他走出保護殼，學習與人交際。"},{"id":"aligned-caption-013","scene_id":"scene-006","start":96.672,"end":103.336,"text":"他學會在混亂場面與沉重時間壓力下工作，並挑戰依照最高標準完成每一項微不足道的任務。"},{"id":"aligned-caption-014","scene_id":"scene-006","start":103.336,"end":110.0,"text":"為了證明自己是最好的服務生，他甚至強迫自己追求荒謬的目標，例如一次端起比其他員工更多的咖啡杯。"},{"id":"aligned-caption-015","scene_id":"scene-006","start":110.0,"end":116.664,"text":"他在日常的辛勞中，找到了對品質的滿足感。"},{"id":"aligned-caption-016","scene_id":"scene-007","start":116.664,"end":126.396,"text":"他很早就觀察到高標準與高效率的權衡。因為製作與清理奶昔極為耗時，他會試著勸顧客改點可樂；"},{"id":"aligned-caption-017","scene_id":"scene-007","start":126.396,"end":136.128,"text":"他坦言：「我討厭奶昔，因為我討厭製作奶昔」。他深信自己是該店最棒的洗碗工與服務生，這份韌性成為他日後經營公司的核心。"},{"id":"aligned-caption-018","scene_id":"scene-008","start":136.128,"end":143.472,"text":"1980年代末，昇陽電腦正著手開發新款工作站。"},{"id":"aligned-caption-019","scene_id":"scene-008","start":143.472,"end":150.816,"text":"儘管工程副總裁拉克羅深信中央處理器 CPU 足以處理一切，不需要獨立繪圖晶片，但主管羅辛決定背著上司研發。"},{"id":"aligned-caption-020","scene_id":"scene-008","start":150.816,"end":158.16,"text":"他將克蒂斯．普里姆與克里斯．馬拉科夫斯基安排在同一間辦公室，開啟了這項未經核准的計畫。"},{"id":"aligned-caption-021","scene_id":"scene-009","start":158.16,"end":165.192,"text":"這支兩人小組被稱為「祕密繪圖」團隊，正進行一項公司高層不希望任何人去做的工作。"},{"id":"aligned-caption-022","scene_id":"scene-009","start":165.192,"end":172.224,"text":"普里姆設計出一款被稱為「怪物」的繪圖加速器，能獨力處理高達 80% 的計算工作量。"},{"id":"aligned-caption-023","scene_id":"scene-009","start":172.224,"end":179.256,"text":"這項突破性的設計將圖形處理從 CPU 移出，讓專業晶片負責其擅長的任務。"},{"id":"aligned-caption-024","scene_id":"scene-010","start":179.256,"end":186.096,"text":"普里姆與馬拉科夫斯基經常為了晶片決策吵得不可開交，甚至對彼此咆哮。"},{"id":"aligned-caption-025","scene_id":"scene-010","start":186.096,"end":192.936,"text":"當時負責聯繫昇陽與供應商的黃仁勳將這些衝突視為「磨劍」的範例。"},{"id":"aligned-caption-026","scene_id":"scene-010","start":192.936,"end":199.776,"text":"他認為最好的構想往往來自激烈的辯論，這種欣然接受衝突的態度，後來成為他經營輝達的核心哲學。"},{"id":"aligned-caption-027","scene_id":"scene-011","start":199.776,"end":206.496,"text":"1989 年，團隊終於確定規格，打造出包含數十萬個電晶體的「GX 繪圖引擎」。"},{"id":"aligned-caption-028","scene_id":"scene-011","start":206.496,"end":213.216,"text":"GX 能讓視窗系統捲動文字的速度超越肉眼觀察，隨後更成為每一部昇陽工作站的標準配備。"},{"id":"aligned-caption-029","scene_id":"scene-011","start":213.216,"end":219.936,"text":"這項巨大的技術成就讓這對搭檔聲名大噪，也為日後的創業埋下了種子。"},{"id":"aligned-caption-030","scene_id":"scene-012","start":219.936,"end":226.96,"text":"1992年底，黃仁勳、普里姆與馬拉科夫斯基經常在東聖荷西議會大道與貝里薩路交叉口的丹尼餐廳碰面。"},{"id":"aligned-caption-031","scene_id":"scene-012","start":226.96,"end":233.984,"text":"馬拉科夫斯基回憶道：「我們就去那邊，點無限暢飲的咖啡，然後工作四個鐘頭。"},{"id":"aligned-caption-032","scene_id":"scene-012","start":233.984,"end":241.008,"text":"」他們在油煙與咖啡香中，試圖將腦中的繪圖技術轉化為可行的商業計畫。"},{"id":"aligned-caption-033","scene_id":"scene-013","start":241.008,"end":248.672,"text":"三位創辦人判定，真正的機會在個人電腦而非專業工作站。"},{"id":"aligned-caption-034","scene_id":"scene-013","start":248.672,"end":256.336,"text":"當時 PC 市場正迎來微軟 Windows 3.1 的爆發與 PCI 匯流排標準的出現，這讓三位工程師預見了 PC 處理高品質 3D 繪圖的強烈需求。"},{"id":"aligned-caption-035","scene_id":"scene-013","start":256.336,"end":264.0,"text":"他們打算讓每位玩家都玩得到 3D 遊戲，而不僅限於能在工作中接觸昂貴工作站的人。"},{"id":"aligned-caption-036","scene_id":"scene-014","start":264.0,"end":270.944,"text":"當時黃仁勳熱愛他在 LSI Logic 的工作，他對兩位夥伴提出挑戰：「我到底憑什麼要離職加入你們？"},{"id":"aligned-caption-037","scene_id":"scene-014","start":270.944,"end":277.888,"text":"」他要求兩人必須證明這家新公司最終能達到「年銷售額 5,000 萬美元」的規模才肯加入。"},{"id":"aligned-caption-038","scene_id":"scene-014","start":277.888,"end":284.832,"text":"黃仁勳對商業模式的嚴謹要求，迫使團隊必須在創業第一天就思考市場現實。"},{"id":"aligned-caption-039","scene_id":"scene-015","start":284.832,"end":291.672,"text":"在反覆分析市場與潛在對手後，本身也愛打電動的黃仁勳判定年營收 5,000 萬美元是可能的。"},{"id":"aligned-caption-040","scene_id":"scene-015","start":291.672,"end":298.512,"text":"他拋出一個關鍵問題：「我們幹嘛為他人作嫁？」這句話成為創業的最後動力。"},{"id":"aligned-caption-041","scene_id":"scene-015","start":298.512,"end":305.352,"text":"三個工程師決定放棄穩定的高薪，去創造一個當時甚至還未被命名的 3D 繪圖市場。"},{"id":"aligned-caption-042","scene_id":"scene-016","start":305.352,"end":311.792,"text":"1993年初，三位共同創辦人開始在普里姆位於佛利蒙的家中工作。"},{"id":"aligned-caption-043","scene_id":"scene-016","start":311.792,"end":318.232,"text":"普里姆清空了臥室以外的每個房間，將家具全部搬到車庫，擺上大型摺疊桌來放置設備。"},{"id":"aligned-caption-044","scene_id":"scene-016","start":318.232,"end":324.672,"text":"最初的幾週，三人每天聚在一起最重要的大事，就是決定午餐要吃什麼。"},{"id":"aligned-caption-045","scene_id":"scene-017","start":324.672,"end":334.62,"text":"他們訂購了一部捷威科技製造的個人電腦，但這台機器卻讓創辦人們摸不著頭緒。馬拉科夫斯基回憶道：「我們不是 PC 人。"},{"id":"aligned-caption-046","scene_id":"scene-017","start":334.62,"end":344.568,"text":"說來好笑，我們都要占領 PC 市場了，卻對 PC 一無所知。」當時他們僅有的最強大武器，是一部從昇陽帶出來的工作站。"},{"id":"aligned-caption-047","scene_id":"scene-018","start":344.568,"end":350.88,"text":"黃仁勳出馬找了科律律師事務所，律師問他口袋有多少錢，他回答兩百美元。"},{"id":"aligned-caption-048","scene_id":"scene-018","start":350.88,"end":357.192,"text":"隨後黃仁勳回到家中，要求另外兩位夥伴也各拿出兩百美元「買下」公司股份。"},{"id":"aligned-caption-049","scene_id":"scene-018","start":357.192,"end":363.504,"text":"對於這筆初始投資，黃仁勳後來的評論道：「那是筆划算的交易。」"},{"id":"aligned-caption-050","scene_id":"scene-019","start":363.504,"end":369.496,"text":"普里姆在拉丁文字典中找到了代表「嫉妒」的單字 Invidia。"},{"id":"aligned-caption-051","scene_id":"scene-019","start":369.496,"end":375.488,"text":"他們去掉開頭字母，正式將公司命名為 Nvidia，並在 1993 年 4 月 5 日完成註冊。"},{"id":"aligned-caption-052","scene_id":"scene-019","start":375.488,"end":381.48,"text":"他們暗自希望，這家研發 NV1 晶片的公司，有朝一日會成為人家嫉妒的對象。"},{"id":"aligned-caption-053","scene_id":"scene-020","start":381.48,"end":388.808,"text":"1993年5月底，三位創辦人來到被譽為「全世界最厲害創投」的紅杉資本進行募資。"},{"id":"aligned-caption-054","scene_id":"scene-020","start":388.808,"end":396.136,"text":"雖然輝達當時還沒有自己的專利晶片，但他們帶備了破解過的昇陽顯示卡，準備進行概念驗證。"},{"id":"aligned-caption-055","scene_id":"scene-020","start":396.136,"end":403.464,"text":"對於當時對草創公司投資興趣極低的市場環境來說，這是一場決定生死的關鍵面談。"},{"id":"aligned-caption-056","scene_id":"scene-021","start":403.464,"end":413.964,"text":"創辦人相信眼花繚亂的圖形足以說服對方，但瓦倫丁卻恨透了產品示範。他認為創業家常過度炫耀技術，卻忽略了對市場與競爭優勢的理解。"},{"id":"aligned-caption-057","scene_id":"scene-021","start":413.964,"end":424.464,"text":"示範一結束，瓦倫丁隨即轉換成他特有的風格，連珠砲般丟出一長串問題，被馬拉科夫斯基形容為一場「庭審」。"},{"id":"aligned-caption-058","scene_id":"scene-022","start":424.464,"end":431.448,"text":"瓦倫丁逼問輝達到底是遊戲機、繪圖還是音訊公司，普里姆卻試圖以晦澀的工程術語回答「我們全部都是」。"},{"id":"aligned-caption-059","scene_id":"scene-022","start":431.448,"end":438.432,"text":"瓦倫丁嚴厲地警告，不知道自己是誰的公司必然失敗。"},{"id":"aligned-caption-060","scene_id":"scene-022","start":438.432,"end":445.416,"text":"黃仁勳後來坦承這場推銷做得「爛透了」，他無法解釋自己在為誰做產品，更無法說明憑什麼成功。"},{"id":"aligned-caption-061","scene_id":"scene-023","start":445.416,"end":455.16,"text":"儘管簡報並不成功，但基於柯里根對黃仁勳個人才華的強力背書，紅杉資本與薩特山最終各投資了 100 萬美元。"},{"id":"aligned-caption-062","scene_id":"scene-023","start":455.16,"end":464.904,"text":"瓦倫丁在會議結束前發出著名的威脅：「要是你們害我賠錢，我會殺了你們。」這讓黃仁勳學到，個人的名聲往往走在商業計畫之前。"},{"id":"aligned-caption-063","scene_id":"scene-024","start":464.904,"end":472.56,"text":"為了在資源匱乏的 PC 市場突圍，普里姆在 NV1 中採取了極冒險的設計。"},{"id":"aligned-caption-064","scene_id":"scene-024","start":472.56,"end":480.216,"text":"他選擇以四邊形渲染來節省昂貴的記憶體成本，並執意加入專利的波表合成音訊，試圖在單一晶片上整合圖形與聲音。"},{"id":"aligned-caption-065","scene_id":"scene-024","start":480.216,"end":487.872,"text":"這是一項展現技術敏銳度的設計，卻也要求全球軟體開發者必須為此徹底修改遊戲程式。"},{"id":"aligned-caption-066","scene_id":"scene-025","start":487.872,"end":494.544,"text":"然而，輝達嚴重誤判了市場演進的速度。"},{"id":"aligned-caption-067","scene_id":"scene-025","start":494.544,"end":501.216,"text":"在 NV1 研發兩年間，記憶體價格從每 MB 50 美元暴跌至 5 美元，這讓原本節省成本的賣點瞬間失去意義。"},{"id":"aligned-caption-068","scene_id":"scene-025","start":501.216,"end":507.888,"text":"遊戲開發商不再有動機為了輝達的特殊標準去改寫程式，NV1 陷入了與主流技術孤立的困境。"},{"id":"aligned-caption-069","scene_id":"scene-026","start":507.888,"end":514.616,"text":"決定 NV1 命運的是當時最受歡迎的遊戲《毀滅戰士》。"},{"id":"aligned-caption-070","scene_id":"scene-026","start":514.616,"end":521.344,"text":"這款定義產業標準的作品在 NV1 上執行效率極差，且晶片的專利音訊格式與主流聲霸卡標準完全衝突。"},{"id":"aligned-caption-071","scene_id":"scene-026","start":521.344,"end":528.072,"text":"輝達原本想推動產業發展，卻發現自己打造的技術竟然跟不上世界最火熱的遊戲腳步。"},{"id":"aligned-caption-072","scene_id":"scene-027","start":528.072,"end":535.592,"text":"到了 1996 年春天，市場傳來了毀滅性的消息。"},{"id":"aligned-caption-073","scene_id":"scene-027","start":535.592,"end":543.112,"text":"合作夥伴帝盟多媒體將近二十五萬顆 NV1 晶片全數退回，馬拉科夫斯基沉重地體認到：「我們原本以為打造了偉大的技術，原來那不是偉大的產品。"},{"id":"aligned-caption-074","scene_id":"scene-027","start":543.112,"end":550.632,"text":"」公司花了 1,500 萬美元研發，現金流卻即將乾涸，第一幕在破產的陰影下戛然而止。"},{"id":"aligned-caption-075","scene_id":"scene-028","start":550.632,"end":557.312,"text":"1996 年春天，輝達迎來了成立以來的最大災難。"},{"id":"aligned-caption-076","scene_id":"scene-028","start":557.312,"end":563.992,"text":"原本預計大賣的第一款產品 NV1 晶片，因為與市場主流標準不符，遭到核心合作夥伴帝盟多媒體近乎全數退貨。"},{"id":"aligned-caption-077","scene_id":"scene-028","start":563.992,"end":570.672,"text":"被退回的晶片數量高達二十五萬塊，這讓原本意氣風發的公司瞬間陷入停滯。,"},{"id":"aligned-caption-078","scene_id":"scene-029","start":570.672,"end":579.54,"text":"面對堆積如山的退貨，共同創辦人馬拉科夫斯基沉重地體認到：「我們原本以為打造了偉大的技術，原來那不是偉大的產品。"},{"id":"aligned-caption-079","scene_id":"scene-029","start":579.54,"end":588.408,"text":"」輝達在設計時過度追求技術展現，添加了過多市場並不在意的功能，最終導致產品與實際需求徹底脫節。,"},{"id":"aligned-caption-080","scene_id":"scene-030","start":588.408,"end":595.16,"text":"輝達當時已投入將近 1,500 萬美元研發 NV1，然而銷售慘澹意味著成本完全無法回收。"},{"id":"aligned-caption-081","scene_id":"scene-030","start":595.16,"end":601.912,"text":"公司現金流即將乾涸，陷入嚴重的破產危機。"},{"id":"aligned-caption-082","scene_id":"scene-030","start":601.912,"end":608.664,"text":"黃仁勳意識到，如果不儘快拿到更多錢，這間創立僅三年的公司，其夢想將在自作自受中猛然破滅。,"},{"id":"aligned-caption-083","scene_id":"scene-031","start":608.664,"end":614.984,"text":"黃仁勳深感挫敗，他開始反省並承認自己雖有才華，但「經營一家公司是一項新技能」。"},{"id":"aligned-caption-084","scene_id":"scene-031","start":614.984,"end":621.304,"text":"他下令停止在錯誤方向上的盲目努力，判定公司必須尋求外援。"},{"id":"aligned-caption-085","scene_id":"scene-031","start":621.304,"end":627.624,"text":"最後的希望，指向了遠在日本東京、同樣處於開發矛盾中的合作夥伴 SEGA。,,"},{"id":"aligned-caption-086","scene_id":"scene-032","start":627.624,"end":634.84,"text":"1996 年，來自日本合作夥伴 SEGA 的消息對輝達而言如同死刑。"},{"id":"aligned-caption-087","scene_id":"scene-032","start":634.84,"end":642.056,"text":"由於 SEGA 的程式設計師對輝達堅持的專利四邊形渲染技術極度反感，他們正式通知輝達，新一代遊戲機將不再採用開發中的 NV2 晶片。"},{"id":"aligned-caption-088","scene_id":"scene-032","start":642.056,"end":649.272,"text":"這項決定意味著輝達即將失去唯一的營收來源與生存希望。"},{"id":"aligned-caption-089","scene_id":"scene-033","start":649.272,"end":656.0,"text":"黃仁勳與普里姆飛抵東京進行最後談判。"},{"id":"aligned-caption-090","scene_id":"scene-033","start":656.0,"end":662.728,"text":"黃仁勳在壓力下展現了極大的理智誠實，他向 SEGA 執行長坦承輝達在技術路徑上的失敗，並承認「經營一家公司是一項新技能」。"},{"id":"aligned-caption-091","scene_id":"scene-033","start":662.728,"end":669.456,"text":"他不再試圖說服對方接受錯誤的技術，而是尋求讓公司活下去的轉機。"},{"id":"aligned-caption-092","scene_id":"scene-034","start":669.456,"end":679.32,"text":"黃仁勳請求 SEGA 依約支付研發款項，他指出合約中訂有「交付原型即付款」的條款：只要輝達能造出安裝在舊型主機板面積上的晶片原型，SEGA 仍須支付 100 萬美元。"},{"id":"aligned-caption-093","scene_id":"scene-034","start":679.32,"end":689.184,"text":"這是一場近乎卑微的請求，旨在將這筆錢轉化為研發下一款晶片 NV3 的救命錢。"},{"id":"aligned-caption-094","scene_id":"scene-035","start":689.184,"end":696.024,"text":"SEGA 最終同意了這項請求，這 100 萬美元成為輝達在乾涸邊緣最後的救生索。"},{"id":"aligned-caption-095","scene_id":"scene-035","start":696.024,"end":702.864,"text":"黃仁勳隨即下令停止在錯誤方向上的盲目努力，將所有資源集中投入到順應市場標準的 RIVA 128。"},{"id":"aligned-caption-096","scene_id":"scene-035","start":702.864,"end":709.704,"text":"這場東京之行，讓輝達在承認徹底失敗後，反而握住了逆轉勝的火種。"},{"id":"aligned-caption-097","scene_id":"scene-036","start":709.704,"end":719.652,"text":"1996年，由於產品與市場標準脫節，輝達陷入了嚴重的資金危機。原本寄予厚望的產品線悉數停滯，公司的發展藍圖在瞬間崩解。"},{"id":"aligned-caption-098","scene_id":"scene-036","start":719.652,"end":729.6,"text":"為了在乾涸的現金流中保留最後一線生機，黃仁勳決定採取激進的組織縮減，將公司規模強行壓縮。"},{"id":"aligned-caption-099","scene_id":"scene-037","start":729.6,"end":740.52,"text":"輝達的員工總數從原本的一百多人銳減至四十人，超過半數的人員在這次裁員中離開。原本建制完整的銷售與行銷團隊幾乎全數解散。"},{"id":"aligned-caption-100","scene_id":"scene-037","start":740.52,"end":751.44,"text":"軟體工程師德懷特．狄爾克斯回憶當時的混亂道：「我們原本有行銷團隊，有銷售團隊，忽然之間，我們的產品路線圖不再可行。」"},{"id":"aligned-caption-101","scene_id":"scene-038","start":751.44,"end":760.62,"text":"恐懼與焦慮成為了黃仁勳最愛的激勵工具。從這天起，他開始在每一場全體會議上反覆對留任者宣告：「我們再三十天就要破產了。"},{"id":"aligned-caption-102","scene_id":"scene-038","start":760.62,"end":769.8,"text":"」這不僅是一句警語，更是一種對抗自滿的文化，要求這四十名核心工程師必須在極限壓力下生存。"},{"id":"aligned-caption-103","scene_id":"scene-039","start":769.8,"end":776.776,"text":"儘管銀行裡還有微薄餘額，但在輝達內部，這群人感覺自己「一直處在零點」。"},{"id":"aligned-caption-104","scene_id":"scene-039","start":776.776,"end":783.752,"text":"黃仁勳向員工解釋，只要發生幾個錯誤決策，現金就會立刻歸零。"},{"id":"aligned-caption-105","scene_id":"scene-039","start":783.752,"end":790.728,"text":"這種對失敗的偏執，迫使留下來的團隊拋棄所有雜念，將所有資源孤注一擲在唯一的翻身機會：NV3。"},{"id":"aligned-caption-106","scene_id":"scene-040","start":790.728,"end":799.968,"text":"1996 年底，輝達的財務狀況極度不穩定。銀行裡僅剩的三百萬美元，只夠維持公司九個月的營運。"},{"id":"aligned-caption-107","scene_id":"scene-040","start":799.968,"end":809.208,"text":"而要在強敵環伺的市場中活下來，開發中的新晶片 RIVA 128 必須以超越常理的速度完成，這是一場與死神的競賽。"},{"id":"aligned-caption-108","scene_id":"scene-041","start":809.208,"end":815.568,"text":"為了實現「光速」開發，黃仁勳堅持投入一百萬美元購買一台冰箱大小的 Ikos 模擬機。"},{"id":"aligned-caption-109","scene_id":"scene-041","start":815.568,"end":821.928,"text":"儘管這會讓公司的存活期縮短為六個月，但他拒絕了其他主管籌措更多資金以爭取時間的建議，他堅定地表示：「我們籌不到更多錢了，我們非這樣做不可。"},{"id":"aligned-caption-110","scene_id":"scene-041","start":821.928,"end":828.288,"text":"」"},{"id":"aligned-caption-111","scene_id":"scene-042","start":828.288,"end":835.904,"text":"模擬機讓團隊能在實體晶片製造前就開發軟體，這縮短了一年的開發時間。"},{"id":"aligned-caption-112","scene_id":"scene-042","start":835.904,"end":843.52,"text":"然而操作極為艱難，機器光是載入 Windows 就要十五分鐘，測試師必須看著地圖操作游標，以免動作過快導致系統鎖住。"},{"id":"aligned-caption-113","scene_id":"scene-042","start":843.52,"end":851.136,"text":"儘管緩慢，這台機器在開發初期就抓到了硬體錯誤，證明了這場豪賭的價值。"},{"id":"aligned-caption-114","scene_id":"scene-043","start":851.136,"end":861.888,"text":"開發過程充滿意外。由於模擬機佔據大片空間且線路雜亂，曾有夜班清潔工為了插吸塵器的插頭，誤拔了模擬機電源。"},{"id":"aligned-caption-115","scene_id":"scene-043","start":861.888,"end":872.64,"text":"這導致工程師執行整晚的基準測試全毀，團隊被迫從頭開始。在離破產只有幾十天的壓力下，任何一點細微的人為疏忽都可能致命。"},{"id":"aligned-caption-116","scene_id":"scene-044","start":872.64,"end":881.532,"text":"1993 年 4 月，輝達攜帶著代號 NV3 的 RIVA 128 晶片樣機趕往大會。"},{"id":"aligned-caption-117","scene_id":"scene-044","start":881.532,"end":890.424,"text":"這是公司翻身的最後機會，但樣機極度不穩定，研發團隊直到開幕前幾小時才勉強讓它維持運作，且在執行測試時隨時可能鎖住系統。"},{"id":"aligned-caption-118","scene_id":"scene-045","start":890.424,"end":899.364,"text":"當時的市場霸主 3dfx 派員到輝達攤位，找機會恥笑 NV1 的失敗，甚至直言：「喔，你們還在？"},{"id":"aligned-caption-119","scene_id":"scene-045","start":899.364,"end":908.304,"text":"」隨後 3dfx 共同創辦人塞勒斯親臨現場。業界都在觀望，這家被放任自生自滅的公司，是否真的能如期拿出產品。"},{"id":"aligned-caption-120","scene_id":"scene-046","start":908.304,"end":914.544,"text":"為了展現測試的真實性，銷售經理克里斯汀森決定大膽博弈。"},{"id":"aligned-caption-121","scene_id":"scene-046","start":914.544,"end":920.784,"text":"他在塞勒斯面前主動關掉系統並宣稱：「為了給您最好的經驗，我會先關掉系統，讓您看看完整、順暢的運作過程。"},{"id":"aligned-caption-122","scene_id":"scene-046","start":920.784,"end":927.024,"text":"」他深知樣機在重開機後極易當機，但他別無選擇。"},{"id":"aligned-caption-123","scene_id":"scene-047","start":927.024,"end":935.004,"text":"樣機成功跑出了驚人的數據，效能不僅優於 3dfx 的基準，也強過當時任何消費級顯示卡。"},{"id":"aligned-caption-124","scene_id":"scene-047","start":935.004,"end":942.984,"text":"對手 Rendition 的架構師唐納文看完示範後感嘆：「太神奇了。」這項數據宣告了輝達正式重返 3D 圖形市場。"},{"id":"aligned-caption-125","scene_id":"scene-048","start":942.984,"end":952.14,"text":"RIVA 128 在展場引起的騷動讓輝達聲名大噪，也讓塞勒斯體認到這家公司並未破產。然而，技術上的突破並未立即改變財務絕境。"},{"id":"aligned-caption-126","scene_id":"scene-048","start":952.14,"end":961.296,"text":"此時輝達銀行裡的現金依然只夠支撐最後幾星期的薪水，生存的火種依然脆弱。"},{"id":"aligned-caption-127","scene_id":"scene-049","start":961.296,"end":968.736,"text":"1997年夏季步入尾聲，儘管新晶片的數據令人振奮，但輝達的財務狀況仍處於崩潰邊緣。"},{"id":"aligned-caption-128","scene_id":"scene-049","start":968.736,"end":976.176,"text":"黃仁勳在餐廳召集全體員工，他讀出第一張紙上的銀行結餘金額，甚至精確到了美分。讀完後，他平淡地說：「我們在銀行裡就這麼多錢。"},{"id":"aligned-caption-129","scene_id":"scene-049","start":976.176,"end":983.616,"text":"」這筆錢僅夠支付最後幾星期的薪水。"},{"id":"aligned-caption-130","scene_id":"scene-050","start":983.616,"end":995.22,"text":"緊接著，黃仁勳掏出第二張紙，宣布收到來自 STB 系統的三萬組 RIVA 128 訂單。這筆及時雨般的訂單讓輝達免於倒閉。"},{"id":"aligned-caption-131","scene_id":"scene-050","start":995.22,"end":1006.824,"text":"RIVA 128 上市僅四個月就賣出百萬組，公司在 1997 年第四季獲利 140 萬美元，這不僅是公司成立四年的首次獲利，更是從瀕死中奪回的奇蹟。"},{"id":"aligned-caption-132","scene_id":"scene-051","start":1006.824,"end":1016.52,"text":"在該年年底的公司會議上，黃仁勳展現了他的戲劇天分。他走遍會議室，發給每人一張一美元新鈔。"},{"id":"aligned-caption-133","scene_id":"scene-051","start":1016.52,"end":1026.216,"text":"他將這些鈔票視為 RIVA 訂單賜予的財務救生索，並藉此提醒眾人，雖然度過了最深的危機，但處境依然不穩定，必須時刻保持警惕。"},{"id":"aligned-caption-134","scene_id":"scene-052","start":1026.216,"end":1036.884,"text":"黃仁勳特別表揚了負責包裝出貨的凱瑟琳，宣布她應得雙倍獎金。回顧這段時光，黃仁勳感嘆：「RIVA 128是一個奇蹟。"},{"id":"aligned-caption-135","scene_id":"scene-052","start":1036.884,"end":1047.552,"text":"」在走投無路之際，這群工程師憑藉正確的技術決策與純粹的意志力，將輝達從三十天內破產的咒語中拯救出來，並準備迎接下一場長期賭注。"},{"id":"aligned-caption-136","scene_id":"scene-053","start":1047.552,"end":1055.112,"text":"2002年，研究員馬克．哈里斯觀察到，科學家正試圖使用 GeForce 3 執行非圖形應用。"},{"id":"aligned-caption-137","scene_id":"scene-053","start":1055.112,"end":1062.672,"text":"由於當時的 GPU 僅能理解圖形指令，研究員必須將數學矩陣乘法「破解」並偽裝成圖形函式。"},{"id":"aligned-caption-138","scene_id":"scene-053","start":1062.672,"end":1070.232,"text":"這種繞道而行的模擬方式雖然顯著提升了運算速度，卻需要極為特殊的程式設計技巧。"},{"id":"aligned-caption-139","scene_id":"scene-054","start":1070.232,"end":1077.624,"text":"學術界最初使用冗長的術語，如「利用圖形硬體達成其他目的」來描述這種現象。"},{"id":"aligned-caption-140","scene_id":"scene-054","start":1077.624,"end":1085.016,"text":"馬克．哈里斯決定創造一個更簡單的名稱：「在 GPU 上執行通用運算」，簡稱 GPGPU。"},{"id":"aligned-caption-141","scene_id":"scene-054","start":1085.016,"end":1092.408,"text":"他創辦了 GPGPU.org 網站推廣此趨勢，該平台迅速成為全球研究人員交換 GPU 算力心得的熱門據點。"},{"id":"aligned-caption-142","scene_id":"scene-055","start":1092.408,"end":1099.648,"text":"取得博士學位後，哈里斯加入輝達，驚訝地發現「GPGPU」一詞已在員工間廣泛使用。"},{"id":"aligned-caption-143","scene_id":"scene-055","start":1099.648,"end":1106.888,"text":"黃仁勳也敏銳察覺到，這項技術有潛力將 GPU 擴展至醫學影像等領域。"},{"id":"aligned-caption-144","scene_id":"scene-055","start":1106.888,"end":1114.128,"text":"然而，當時所有任務都必須透過專屬圖形的 Cg 語言執行，專利權與專業限制成為技術普及的巨大障礙。"},{"id":"aligned-caption-145","scene_id":"scene-056","start":1114.128,"end":1121.296,"text":"輝達內部隨後啟動了一個代號為「NV50」的祕密計畫，目標是打造一種全新的程式設計模型。"},{"id":"aligned-caption-146","scene_id":"scene-056","start":1121.296,"end":1128.464,"text":"這項技術後來被命名為「統一計算架構」，即 CUDA，它允許科學家使用廣泛流行的 C 語言進行運算。"},{"id":"aligned-caption-147","scene_id":"scene-056","start":1128.464,"end":1135.632,"text":"這項決定將使 GPU 轉變為能與 CPU 分擔所有次要科學任務的巨大引擎。"},{"id":"aligned-caption-148","scene_id":"scene-057","start":1135.632,"end":1144.104,"text":"輝達內部當時正啟動一項代號「NV50」的祕密計畫，目標是研發最具前瞻性的通用運算模式。"},{"id":"aligned-caption-149","scene_id":"scene-057","start":1144.104,"end":1152.576,"text":"這項模型後來被正式命名為「統一計算架構」，也就是 CUDA，旨在讓 GPU 能夠分擔 CPU 處理的所有科學與工業任務。"},{"id":"aligned-caption-150","scene_id":"scene-058","start":1152.576,"end":1161.204,"text":"CUDA 的誕生仰賴軟硬體團隊的緊密配合。軟體專家巴克開發程式設計環境，硬體架構師尼可斯則確保晶片納入更大的記憶體快取。"},{"id":"aligned-caption-151","scene_id":"scene-058","start":1161.204,"end":1169.832,"text":"他們共同管理複雜的指令網路，讓 GPU 數千個運算核心能平行執行任務。"},{"id":"aligned-caption-152","scene_id":"scene-059","start":1169.832,"end":1177.632,"text":"儘管成本極高，黃仁勳仍堅持 CUDA 必須應用在包含遊戲卡的每一條產品線，以確保它能迅速成為產業標準。"},{"id":"aligned-caption-153","scene_id":"scene-059","start":1177.632,"end":1185.432,"text":"他對團隊下達明確指示：「我們應該讓 CUDA 技術無所不在，讓它成為核心基礎技術」。"},{"id":"aligned-caption-154","scene_id":"scene-060","start":1185.432,"end":1193.544,"text":"輝達投入四年時間與近五億美元打造第一款具備運算功能的 G80 晶片，其內部擁有 128 個 CUDA 核心。"},{"id":"aligned-caption-155","scene_id":"scene-060","start":1193.544,"end":1201.656,"text":"雖然這項投資讓晶片成本大幅增加，黃仁勳仍深信加速運算能解決一般電腦無法處理的問題。"},{"id":"aligned-caption-156","scene_id":"scene-061","start":1201.656,"end":1208.8,"text":"2006 年 CUDA 發表後，市場反應冷淡。"},{"id":"aligned-caption-157","scene_id":"scene-061","start":1208.8,"end":1215.944,"text":"2007 年，大約五十位金融分析師親赴輝達總部，聽取管理階層解釋為何華爾街應該繼續相信這家公司。"},{"id":"aligned-caption-158","scene_id":"scene-061","start":1215.944,"end":1223.088,"text":"當時輝達為了支持 CUDA，毛利率顯著縮水，分析師們普遍對這項耗資巨大且看不見短期回報的技術抱持懷疑態度。"},{"id":"aligned-caption-159","scene_id":"scene-062","start":1223.088,"end":1230.664,"text":"午餐會移師到露天停車場進行，氣氛一如簡陋的自助餐般尷尬。"},{"id":"aligned-caption-160","scene_id":"scene-062","start":1230.664,"end":1238.24,"text":"分析師們連珠砲似地詢問短期財務問題，希望知道 CUDA 到底對毛利率有何影響。"},{"id":"aligned-caption-161","scene_id":"scene-062","start":1238.24,"end":1245.816,"text":"儘管黃仁勳重申長期獲利的展望，但分析師仍將注意力放在未來幾個月的盈餘，而非他口中那幾年後才會成形的 GPU 運算市場。"},{"id":"aligned-caption-162","scene_id":"scene-063","start":1245.816,"end":1253.208,"text":"分析師丹尼爾．恩斯特打破了沉悶的財務拷問，他詢問 GPU 是否能解決 Photoshop 處理高解析度影像變慢的問題。"},{"id":"aligned-caption-163","scene_id":"scene-063","start":1253.208,"end":1260.6,"text":"黃仁勳的眼睛亮了起來，他向恩斯特透露 Adobe 正是合作夥伴，GPU 將卸載 CPU 的運算任務以提高速度。"},{"id":"aligned-caption-164","scene_id":"scene-063","start":1260.6,"end":1267.992,"text":"他堅定地表示：「這正是我所說的即將來臨的『GPU 時代』。」"},{"id":"aligned-caption-165","scene_id":"scene-064","start":1267.992,"end":1275.544,"text":"在 2007 年至 2008 年間，輝達股價下跌逾 80%，華爾街幾乎判定公司走在錯誤道路上。"},{"id":"aligned-caption-166","scene_id":"scene-064","start":1275.544,"end":1283.096,"text":"面對投資人要求修正策略的壓力，黃仁勳拒絕讓步，他坦言：「我相信 CUDA，我對它的潛力深信不疑。"},{"id":"aligned-caption-167","scene_id":"scene-064","start":1283.096,"end":1290.648,"text":"」他深知這是一場長期的孤獨飛行，為了實現願景，他選擇忍受當下的財務磨難。"},{"id":"aligned-caption-168","scene_id":"scene-065","start":1290.648,"end":1297.52,"text":"CUDA 發表初期，學術界對此興致缺缺。"},{"id":"aligned-caption-169","scene_id":"scene-065","start":1297.52,"end":1304.392,"text":"首席科學家大衛．柯爾克在一年內舉辦了一百多場演講，試圖說服教授們改變電腦科學的授課內容，卻在世界各地面臨冷遇。"},{"id":"aligned-caption-170","scene_id":"scene-065","start":1304.392,"end":1311.264,"text":"柯爾克回憶當時的挫折：「沒有人知道如何利用 CUDA 架構設計程式……我真的是到處碰壁。」"},{"id":"aligned-caption-171","scene_id":"scene-066","start":1311.264,"end":1318.184,"text":"轉機出現在伊利諾大學香檳分校，系主任布拉胡特勸說柯爾克親自授課。"},{"id":"aligned-caption-172","scene_id":"scene-066","start":1318.184,"end":1325.104,"text":"2007 年，柯爾克每隔一週便從科羅拉多州飛往伊利諾州，與獲獎教授胡文美搭檔教導平行運算。"},{"id":"aligned-caption-173","scene_id":"scene-066","start":1325.104,"end":1332.024,"text":"他們錄下課程並在網路免費提供，這項計畫成功吸引了全球研究人員的目光。"},{"id":"aligned-caption-174","scene_id":"scene-067","start":1332.024,"end":1338.912,"text":"為了建立教學標準，柯爾克與胡文美親自撰寫了教科書，並於 2010 年正式出版。"},{"id":"aligned-caption-175","scene_id":"scene-067","start":1338.912,"end":1345.8,"text":"這本書隨後被翻譯成多國語言、獲數百所學校採用，售出數萬冊。"},{"id":"aligned-caption-176","scene_id":"scene-067","start":1345.8,"end":1352.688,"text":"這成為 CUDA 發展史上的關鍵轉捩點，讓這套原本沒人懂的架構，正式成為全球工程師的必修課。"},{"id":"aligned-caption-177","scene_id":"scene-068","start":1352.688,"end":1360.024,"text":"輝達同時推動了一項特殊的捐贈計畫。為了避免現金捐贈被大學收取的管理費稀釋，柯爾克決定直接捐贈硬體設備。"},{"id":"aligned-caption-178","scene_id":"scene-068","start":1360.024,"end":1367.36,"text":"他直言這並非完全無私：「我們希望大學在課堂上使用我們的硬體，而不是超微的設備。"},{"id":"aligned-caption-179","scene_id":"scene-068","start":1367.36,"end":1374.696,"text":"」這項策略確保了新一代人才在進入職場前，就已熟悉輝達的生態系。"},{"id":"aligned-caption-180","scene_id":"scene-069","start":1374.696,"end":1382.24,"text":"在聖地牙哥超級電腦中心，羅斯．沃克目睹了科研算力分配的不公。"},{"id":"aligned-caption-181","scene_id":"scene-069","start":1382.24,"end":1389.784,"text":"當時，極其稀缺的運算資源往往優先分配給已成名的頂尖科學家，年輕研究員的提案大多被否決。"},{"id":"aligned-caption-182","scene_id":"scene-069","start":1389.784,"end":1397.328,"text":"沃克感嘆，這造成了「獲得算力的唯一途徑，就是之前已經獲得過算力」的壟斷瓶頸，讓許多傑出想法胎死腹中。"},{"id":"aligned-caption-183","scene_id":"scene-070","start":1397.328,"end":1408.56,"text":"沃克決心為研究界尋找更經濟的算力。他曾嘗試破解遊戲主機，也考慮過每顆要價數萬美元的專用晶片，但都因成本或技術障礙而失敗。"},{"id":"aligned-caption-184","scene_id":"scene-070","start":1408.56,"end":1419.792,"text":"最後，他發現原本用於渲染 3D 圖像的顯卡具備處理複雜矩陣運算的潛力，這才找上輝達，試圖將生物模擬程式 AMBER 移植到 CUDA 平台上。"},{"id":"aligned-caption-185","scene_id":"scene-071","start":1419.792,"end":1427.72,"text":"2009 年，支援 GPU 的 AMBER 軟體問世，運算速度比以往版本提升了驚人的五十倍。"},{"id":"aligned-caption-186","scene_id":"scene-071","start":1427.72,"end":1435.648,"text":"這項突破實現了算力民主化的夢想，研究員只需要幾張輝達遊戲顯卡，就能擁有媲美一整排伺服器的效能。"},{"id":"aligned-caption-187","scene_id":"scene-071","start":1435.648,"end":1443.576,"text":"沃克直言：「你可以花兩千美元買四個 GeForce 顯卡，就能擁有高效能工作站，這完全改變了遊戲規則」。"},{"id":"aligned-caption-188","scene_id":"scene-072","start":1443.576,"end":1451.784,"text":"然而，輝達基於獲利考量，開始限制研究員購買較便宜的遊戲卡，並建議改用高價的 Tesla 系列。"},{"id":"aligned-caption-189","scene_id":"scene-072","start":1451.784,"end":1459.992,"text":"沃克對此強烈反對，他透過極端測試證明遊戲卡同樣精確，並指出「輝達成功的關鍵在於允許 CUDA 在 GeForce 顯示卡上執行」。"},{"id":"aligned-caption-190","scene_id":"scene-072","start":1459.992,"end":1468.2,"text":"這場博弈揭示了輝達在建立生態系過程中，必須面對商業利潤與用戶利益的複雜拉鋸。"},{"id":"aligned-caption-191","scene_id":"scene-073","start":1468.2,"end":1475.52,"text":"隨著輝達規模擴大至數千人，黃仁勳意識到傳統官僚體系會導致資訊扭曲。"},{"id":"aligned-caption-192","scene_id":"scene-073","start":1475.52,"end":1482.84,"text":"他決定建立極度扁平的組織，取消一對一的私下會議，並讓多達六十位高階主管直接向他報告。"},{"id":"aligned-caption-193","scene_id":"scene-073","start":1482.84,"end":1490.16,"text":"這種設計確保了每個人都能同時獲得相同的資訊，讓公司能像新創團隊般維持「光速」反應。"},{"id":"aligned-caption-194","scene_id":"scene-074","start":1490.16,"end":1500.696,"text":"為了掌握公司脈動，黃仁勳要求員工定期發送「五要事」電郵，詳述優先處理任務與市場現況。理想的內容必須以代表具體行動的動詞開頭。"},{"id":"aligned-caption-195","scene_id":"scene-074","start":1500.696,"end":1511.232,"text":"他認為正式的狀態更新報告往往會被「清洗」掉爭議與問題，而五要事電郵則能保留真實的痛點與技術風險。"},{"id":"aligned-caption-196","scene_id":"scene-075","start":1511.232,"end":1518.68,"text":"每週日深夜，黃仁勳會花數小時閱讀大約一百封員工電郵。他曾坦言：「我在尋找微弱的訊號。"},{"id":"aligned-caption-197","scene_id":"scene-075","start":1518.68,"end":1526.128,"text":"要捕捉強烈訊號很容易，但我想在訊號還微弱時就截獲它們。"},{"id":"aligned-caption-198","scene_id":"scene-075","start":1526.128,"end":1533.576,"text":"」正是透過這些來自基層工程師的報告，他敏銳捕捉到機器學習正要爆發的訊號，並隨即下令投入更多軟體人才。"},{"id":"aligned-caption-199","scene_id":"scene-076","start":1533.576,"end":1540.984,"text":"黃仁勳的回覆通常快如閃電，並要求員工在二十四小時內採取行動。"},{"id":"aligned-caption-200","scene_id":"scene-076","start":1540.984,"end":1548.392,"text":"他向員工強調「使命才是老闆」，所有決策應為了顧客利益與技術使命服務，而非為了取悅主管。"},{"id":"aligned-caption-201","scene_id":"scene-076","start":1548.392,"end":1555.8,"text":"這種對抗自滿的預防文化，讓輝達在市場轉向 AI 的關鍵時刻，能迅速重新分配資源並全員投入。"},{"id":"aligned-caption-202","scene_id":"scene-077","start":1555.8,"end":1563.736,"text":"2010 年，電腦視覺領域陷入瓶頸，專家們致力於開發更好的演算法，卻收效甚微。"},{"id":"aligned-caption-203","scene_id":"scene-077","start":1563.736,"end":1571.672,"text":"史丹佛教授李飛飛建立了包含數百萬張標記圖像的 ImageNet 數據庫並發起競賽。"},{"id":"aligned-caption-204","scene_id":"scene-077","start":1571.672,"end":1579.608,"text":"在前兩屆比賽中，傳統軟體的分類正確率難以突破百分之七十五，學術界仍在尋找能讓電腦真正「看懂」世界的點火裝置。"},{"id":"aligned-caption-205","scene_id":"scene-078","start":1579.608,"end":1587.552,"text":"2012 年，傑佛瑞．辛頓與他的學生開發了 AlexNet 模型，利用兩顆普通輝達 GPU 支援深度學習神經網路。"},{"id":"aligned-caption-206","scene_id":"scene-078","start":1587.552,"end":1595.496,"text":"這個模型在兩週內完成訓練，並在第三屆競賽中取得百分之八十五的正確率，遠超所有競爭對手。"},{"id":"aligned-caption-207","scene_id":"scene-078","start":1595.496,"end":1603.44,"text":"這場勝利向全世界證明，GPU 提供的加速運算正是點燃人工智慧革命的關鍵火花。"},{"id":"aligned-caption-208","scene_id":"scene-079","start":1603.44,"end":1611.368,"text":"儘管內部高層存在反對聲音，黃仁勳仍決定推翻質疑，下令將人工智慧列為公司最優先要務。"},{"id":"aligned-caption-209","scene_id":"scene-079","start":1611.368,"end":1619.296,"text":"他要求優秀人才若正在從事其他工作，必須立即調整重心投入深度學習。"},{"id":"aligned-caption-210","scene_id":"scene-079","start":1619.296,"end":1627.224,"text":"黃仁勳確信 AI 將顯著擴大軟硬體市場，這項決定讓輝達從圖形顯示卡公司，正式轉型為人工智慧帝國的基礎設施商。"},{"id":"aligned-caption-211","scene_id":"scene-080","start":1627.224,"end":1634.272,"text":"2017年，谷歌研究人員發表了具有里程碑意義的論文。"},{"id":"aligned-caption-212","scene_id":"scene-080","start":1634.272,"end":1641.32,"text":"黃仁勳迅速察覺到 Transformer 架構中自注意力機制的潛力，認定其能有效辨識數據模式並進行平行運算。"},{"id":"aligned-caption-213","scene_id":"scene-080","start":1641.32,"end":1648.368,"text":"他隨即在內部會議詳細討論這項技術，指示軟體團隊針對尚未爆發的生成式人工智慧市場進行優化。"},{"id":"aligned-caption-214","scene_id":"scene-081","start":1648.368,"end":1658.892,"text":"雖然當時 Hopper 架構晶片的開發已接近尾聲，距離量產封裝僅剩數月，但黃仁勳與架構師團隊決定承擔成本，在晶片面積中大幅增加對人工智慧的硬體支援。"},{"id":"aligned-caption-215","scene_id":"scene-081","start":1658.892,"end":1669.416,"text":"他們決定納入專門用於深度學習的張量核心，這項在最後時刻自願進行的設計調整，在晶片界前所未見。"},{"id":"aligned-caption-216","scene_id":"scene-082","start":1669.416,"end":1676.416,"text":"軟體團隊隨後開發出「Transformer Engine」專用函式庫，能自動為任務選擇最有效率的運算精度。"},{"id":"aligned-caption-217","scene_id":"scene-082","start":1676.416,"end":1683.416,"text":"搭載此引擎的 GPU 可將原本需要數月的模型訓練，縮短至數小時完成。"},{"id":"aligned-caption-218","scene_id":"scene-082","start":1683.416,"end":1690.416,"text":"這項決策讓輝達在 ChatGPT 出現時已準備就緒，正式開啟了人工智慧的基礎設施時代。"},{"id":"aligned-caption-219","scene_id":"scene-083","start":1690.416,"end":1697.448,"text":"2023 年 5 月 24 日星期三，全球市場正屏息以待。"},{"id":"aligned-caption-220","scene_id":"scene-083","start":1697.448,"end":1704.48,"text":"自 2022 年底 ChatGPT 引發生成式人工智慧熱潮後，投資人急欲確認這股浪潮究意能為這家晶片製造商帶來多少實質收益。"},{"id":"aligned-caption-221","scene_id":"scene-083","start":1704.48,"end":1711.512,"text":"交易員曼圭諾坐在終端機前，等待著即將決定市場走向的頭條新聞。"},{"id":"aligned-caption-222","scene_id":"scene-084","start":1711.512,"end":1722.468,"text":"財報公布瞬間，終端機跳出了震撼數據：輝達預測第二季營收將達 110 億美元，比華爾街預估的高出整整 40 億美元。"},{"id":"aligned-caption-223","scene_id":"scene-084","start":1722.468,"end":1733.424,"text":"分析師拉斯岡將此形容為「大爆炸」，稱其前景在各方面都無疑是「宇宙級別」。這項半導體史上最大幅度的營收增幅，瞬間引爆了市場。"},{"id":"aligned-caption-224","scene_id":"scene-085","start":1733.424,"end":1743.804,"text":"財報公布次日，輝達股價飆升百分之二十四，單日市值增加了 1,840 億美元，光是這項增值就超過了英特爾的總市值。"},{"id":"aligned-caption-225","scene_id":"scene-085","start":1743.804,"end":1754.184,"text":"這場大爆炸向全世界證明，黃仁勳過去十年將重心全押在人工智慧的豪賭已正式收網，輝達正式成為定義 AI 時代的基礎設施龍頭。"},{"id":"aligned-caption-226","scene_id":"scene-086","start":1754.184,"end":1761.28,"text":"黃仁勳在隨後的演講中趁勝追擊，他向滿座聽眾傳遞了一個極其簡單的訊息：「買愈多，省愈多」。"},{"id":"aligned-caption-227","scene_id":"scene-086","start":1761.28,"end":1768.376,"text":"他將 AI 定義為能預測未來的通用函式逼近器，宣示著全球資料中心正從傳統 CPU 轉向 GPU 平行運算。"},{"id":"aligned-caption-228","scene_id":"scene-086","start":1768.376,"end":1775.472,"text":"這一刻，世界終於看懂了這家從丹尼餐廳起家的公司。"},{"id":"aligned-caption-229","scene_id":"scene-087","start":1775.472,"end":1782.552,"text":"2023 年，生成式人工智慧的需求讓訂單量攀升至物理極限。"},{"id":"aligned-caption-230","scene_id":"scene-087","start":1782.552,"end":1789.632,"text":"輝達的高端 AI 產品並非單純的晶片，而是由多達三萬五千個組件組成的複雜系統。"},{"id":"aligned-caption-231","scene_id":"scene-087","start":1789.632,"end":1796.712,"text":"面對如此龐大的硬體需求，輝達必須跨出設計者的舒適圈，直接介入地表最複雜的供應鏈協作。, [B01]"},{"id":"aligned-caption-232","scene_id":"scene-088","start":1796.712,"end":1804.104,"text":"輝達向合作夥伴派出了被稱為「飛虎隊」的精銳工程小組，進駐台積電、富士康與緯創等工廠。"},{"id":"aligned-caption-233","scene_id":"scene-088","start":1804.104,"end":1811.496,"text":"這支部隊的任務不只是監督，他們直接購買設備、資助擴建廠房，並推動自動化測試。"},{"id":"aligned-caption-234","scene_id":"scene-088","start":1811.496,"end":1818.888,"text":"輝達透過深度介入製造端，確保亞洲廠區能以「光速」釋放產能。, [B01]"},{"id":"aligned-caption-235","scene_id":"scene-089","start":1818.888,"end":1828.992,"text":"傳統製造商通常在流程間預留十四至十八週的緩衝時間，以避免上游問題導致停工。飛虎隊則在製程初期就導入嚴密控制，消除了閒置時間。"},{"id":"aligned-caption-236","scene_id":"scene-089","start":1828.992,"end":1839.096,"text":"儘管這種做法極其燒錢且會拖累短期獲利，但輝達堅持以這種方式維持在 AI 賽道上的絕對領先。"},{"id":"aligned-caption-237","scene_id":"scene-090","start":1839.096,"end":1846.552,"text":"供應鏈的成功動員，讓黃仁勳得以在台北國際電腦展宣示「買愈多，省愈多」的邏輯。"},{"id":"aligned-caption-238","scene_id":"scene-090","start":1846.552,"end":1854.008,"text":"他將 AI 定義為能預測未來的通用函式逼近器，並透過飛虎隊的執行力，將 GPU 轉化為 AI 時代的標準算力貨幣。"},{"id":"aligned-caption-239","scene_id":"scene-090","start":1854.008,"end":1861.464,"text":"這一刻，輝達正式確立了全球 AI 基礎設施的龍頭地位。, [B01]"},{"id":"aligned-caption-240","scene_id":"scene-091","start":1861.464,"end":1871.484,"text":"執掌輝達三十一年，黃仁勳始終拒絕在私人辦公室工作。他每天待在總部「奮進者號」大樓內的「大都會」會議室主持小組會議。"},{"id":"aligned-caption-241","scene_id":"scene-091","start":1871.484,"end":1881.504,"text":"這種無隔閡的空間設計，象徵著他對資訊透明與直接溝通的極致追求，讓執行長能隨時與一線專案保持聯繫。"},{"id":"aligned-caption-242","scene_id":"scene-092","start":1881.504,"end":1891.332,"text":"為了維持如新創公司般的光速反應，黃仁勳建立了極度扁平的組織。他有多達六十位高階主管直接向他報告，藉此取消了一對一的私下會議。"},{"id":"aligned-caption-243","scene_id":"scene-092","start":1891.332,"end":1901.16,"text":"這種結構確保每個人都能同時獲得相同的資訊，徹底杜絕了大型企業常見的官僚制度與地盤爭奪。"},{"id":"aligned-caption-244","scene_id":"scene-093","start":1901.16,"end":1911.408,"text":"在「大都會」會議室裡，黃仁勳不斷強調「使命才是老闆」。他認為所有決策都應是為了顧客利益與技術突破服務，而非為了取悅主管。"},{"id":"aligned-caption-245","scene_id":"scene-093","start":1911.408,"end":1921.656,"text":"他會在會議上公開說明自己的思考邏輯，透過這種教學式的管理，將自己的策略直覺灌輸給每一位專案負責人。"},{"id":"aligned-caption-246","scene_id":"scene-094","start":1921.656,"end":1931.016,"text":"輝達的會議室裡幾乎看不到投影機或 PPT，取而代之的是占滿整面牆的白板。黃仁勳堅持手繪架構，並在解決問題後將其擦掉。"},{"id":"aligned-caption-247","scene_id":"scene-094","start":1931.016,"end":1940.376,"text":"這塊白板象徵著輝達「不進則退」的哲學，無論昨天的構想多麼精湛，今天都要重新開始創新。"},{"id":"aligned-caption-248","scene_id":"scene-095","start":1940.376,"end":1947.744,"text":"執掌三兆美元帝國的黃仁勳，至今仍引以為傲的是他在基層磨練出的工作倫理。"},{"id":"aligned-caption-249","scene_id":"scene-095","start":1947.744,"end":1955.112,"text":"他曾多次向媒體與員工直言：「我掃的廁所應該比史上任何執行長都多。"},{"id":"aligned-caption-250","scene_id":"scene-095","start":1955.112,"end":1962.48,"text":"」對他而言，不管是洗第一百次廁所，還是決定 AI 晶片的未來，每一項任務都必須依照最高標準完成，沒有任何苦差事是卑微的。,"},{"id":"aligned-caption-251","scene_id":"scene-096","start":1962.48,"end":1973.304,"text":"為了對抗成功帶來的自滿，黃仁勳對自己極度嚴苛。他在內部會議透露，每天早上照鏡子時，他對自己說的第一句話就是：「你真差勁。"},{"id":"aligned-caption-252","scene_id":"scene-096","start":1973.304,"end":1984.128,"text":"」這種「理智的誠實」要求團隊必須隨時承認失敗、從錯誤中學習，並確保公司始終處於生存模式，而非沉溺於股價與排名的分數。,,"},{"id":"aligned-caption-253","scene_id":"scene-097","start":1984.128,"end":1991.016,"text":"黃仁勳深信，「偉大和聰明無關，偉大來自性格。」他在肯塔基州奧奈達度過的磨難歲月，培養出如街頭霸王般不閃避衝突的韌性。"},{"id":"aligned-caption-254","scene_id":"scene-097","start":1991.016,"end":1997.904,"text":"這份性格讓他在面對 NV1 失敗、CUDA 被質疑的長夜裡，依然能憑藉純粹的意志力帶領輝達一次次戰勝自己，活出最純粹的「輝達之道」。"},{"id":"aligned-caption-255","scene_id":"scene-097","start":1997.904,"end":2004.792,"text":",,"},{"id":"aligned-caption-256","scene_id":"scene-098","start":2004.792,"end":2012.128,"text":"輝達的故事幾乎與黃仁勳的個人意志共生，這讓他成為了公司最強的引擎，卻也是外界眼中的「單點故障」。"},{"id":"aligned-caption-257","scene_id":"scene-098","start":2012.128,"end":2019.464,"text":"三十一年後，當他再度拿起白板筆，迎接下一波數位生物學或機器人浪潮時，這場關於韌性與創新的冒險才剛剛開始。"},{"id":"aligned-caption-258","scene_id":"scene-098","start":2019.464,"end":2026.8,"text":"只要白板尚未擦掉，新的契機就不會停歇。,"},{"id":"aligned-caption-259","scene_id":"scene-099","start":2026.8,"end":2034.88,"text":"輝達在 2024 年攀上全球市值巔峰，超越微軟與蘋果，成為 AI 時代的心臟。"},{"id":"aligned-caption-260","scene_id":"scene-099","start":2034.88,"end":2042.96,"text":"然而，這家三十一歲的公司依然維持著高度的危機感，這源於其特殊的組織結構。"},{"id":"aligned-caption-261","scene_id":"scene-099","start":2042.96,"end":2051.04,"text":"外界常將黃仁勳視為這部龐大機器的「單點故障」，質疑當這套完全依賴個人意志運作的文化失去核心時，三兆美元的帝國能否延續其光速。"},{"id":"aligned-caption-262","scene_id":"scene-100","start":2051.04,"end":2059.96,"text":"儘管生成式人工智慧需求如日中天，但「規模定律」的限制正悄然浮現。"},{"id":"aligned-caption-263","scene_id":"scene-100","start":2059.96,"end":2068.88,"text":"隨著大型語言模型對數據與算力的吞噬接近收益遞減點，輝達必須證明除了提供訓練晶片外，還能在推理市場與數位生物學等新領域建立第二條護城河。"},{"id":"aligned-caption-264","scene_id":"scene-100","start":2068.88,"end":2077.8,"text":"對黃仁勳來說，這意味著他必須帶領輝達，在下一個「三十天內破產」的威脅成真前，再次定義未來的運算。"},{"id":"aligned-caption-265","scene_id":"scene-101","start":2077.8,"end":2084.896,"text":"黃仁勳深信輝達成功的祕訣在於「純粹的意志力」，這份性格讓公司在無數次瀕死中學會了如何忍受磨難。"},{"id":"aligned-caption-266","scene_id":"scene-101","start":2084.896,"end":2091.992,"text":"對他而言，白板的空白並不代表結束，而是全新的契機。"},{"id":"aligned-caption-267","scene_id":"scene-101","start":2091.992,"end":2099.088,"text":"這塊板子曾畫過 NV1、CUDA 與 Transformer，如今正等待著下一波能解決人類最棘手問題的架構。"},{"id":"aligned-caption-268","scene_id":"scene-102","start":2099.088,"end":2106.736,"text":"當被問及如何看待輝達的巔峰，黃仁勳僅表示：「我熱愛輝達。」他將繼續選擇那條最艱難的路，在物理定律的極限邊緣奔跑。"},{"id":"aligned-caption-269","scene_id":"scene-102","start":2106.736,"end":2114.384,"text":"白板上的新構想即將被擦掉重來，對這群工程師而言，定義 AI 時代的冒險其實才剛剛開始。"},{"id":"aligned-caption-270","scene_id":"scene-102","start":2114.384,"end":2122.032,"text":"只要意志尚未耗盡，這場關於韌性與創新的長跑就不會停歇。"},{"id":"aligned-caption-271","scene_id":"scene-103","start":2122.032,"end":2130.424,"text":"究竟何謂「輝達之道」？這套文化結合了罕見的員工自主與最高標準，要求團隊始終在物理定律的極限邊緣奔跑。"},{"id":"aligned-caption-272","scene_id":"scene-103","start":2130.424,"end":2138.816,"text":"其核心本質，正是黃仁勳對這段三十一年旅程的最終總結：「純粹的意志力」。"},{"id":"aligned-caption-273","scene_id":"scene-103","start":2138.816,"end":2147.208,"text":"正是這股力量，讓三個工程師敢於押注不存在的市場，並在無數次瀕死危機中，戰勝了對成功與自滿的恐懼。"},{"id":"aligned-caption-274","scene_id":"scene-104","start":2147.208,"end":2155.808,"text":"對於成功，黃仁勳有著與眾不同的見解，他深信逆境才是最好的老師。"},{"id":"aligned-caption-275","scene_id":"scene-104","start":2155.808,"end":2164.408,"text":"他曾多次向大眾直言，他希望人們能「承受足夠的痛苦與磨難」，因為性格只能由克服挫折來塑造。"},{"id":"aligned-caption-276","scene_id":"scene-104","start":2164.408,"end":2173.008,"text":"這份不閃避衝突的街頭霸王性格，讓輝達學會將每一次失敗轉化為進化的養分。在追求卓越的長跑中，堅韌的性格遠比聰明才智更為關鍵。"},{"id":"aligned-caption-277","scene_id":"scene-105","start":2173.008,"end":2180.56,"text":"掌舵三十一年後，黃仁勳依然以「光速」駕駛著輝達這輛精密賽車。"},{"id":"aligned-caption-278","scene_id":"scene-105","start":2180.56,"end":2188.112,"text":"當被問及如何看待這段從洗碗槽到三兆美元帝國的傳奇旅程時，他僅以最單純且毫不避諱的熱情回答：「我熱愛輝達。"},{"id":"aligned-caption-279","scene_id":"scene-105","start":2188.112,"end":2195.664,"text":"」這場關於韌性與創新的冒險從未結束，只要意志尚未耗盡，這家定義 AI 時代的公司，腳步就不會停歇。"},{"id":"aligned-caption-280","scene_id":"scene-106","start":2195.664,"end":2203.576,"text":"偉大來自性格，而非聰明。那個曾在肯塔基州掃廁所的亞裔少年，與如今站在全球運算頂峰的執行長，始終共享著同一個靈魂。"},{"id":"aligned-caption-281","scene_id":"scene-106","start":2203.576,"end":2211.488,"text":"白板上的精湛構想會被擦掉重來，每一次的「三十天內破產」都是輝達全新的起點。"},{"id":"aligned-caption-282","scene_id":"scene-106","start":2211.488,"end":2219.4,"text":"全片在創業原點的殘影中收尾，宣告著「輝達之道」永恆的戰鬥循環。"}],"timeline":[{"id":"aligned-beat-001","scene_id":"scene-001","start":0.0,"end":7.136,"image":"redraw-001.webp","motion":"push","unit":1},{"id":"aligned-beat-002","scene_id":"scene-001","start":7.136,"end":14.272,"image":"redraw-002.webp","motion":"left","unit":2},{"id":"aligned-beat-003","scene_id":"scene-001","start":14.272,"end":21.408,"image":"redraw-003.webp","motion":"pull","unit":3},{"id":"aligned-beat-004","scene_id":"scene-002","start":21.408,"end":31.284,"image":"redraw-004.webp","motion":"right","unit":1},{"id":"aligned-beat-005","scene_id":"scene-00
