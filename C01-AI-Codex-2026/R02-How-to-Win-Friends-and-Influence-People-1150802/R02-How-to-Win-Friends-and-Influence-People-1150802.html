<!--
THESIS: 37 則法則是一張能在日常對話前攤開的關係地圖，而不是一串被動閱讀的章節。
OWN-WORLD: 深靛藍書封、霧白書頁、芥末金書籤與硃砂紅註記；以鋼筆手寫感標題與清楚的繁中閱讀字體並置。
STORY: 讀者先選擇一個關係情境，再翻閱法則、切換插畫視角，最後帶走一個可嘗試的行動。
FIRST VIEWPORT: 左側是書名、五大部分與開始閱讀；右側是大型封面插圖預留區及三套插圖切換器。
FORM: 可翻閱的關係筆記本；章節索引、法則頁碼與細讀抽屜維持閱讀節奏。
-->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2.《人性的弱點》37 則法則 ~ 115.08.02!</title>
  <style>
    :root{--ink:#17243e;--paper:#fffdf6;--mist:#edf1f0;--line:#c8c8bd;--gold:#c48a22;--red:#a74036;--muted:#5f6775;--sans:"Microsoft JhengHei","Noto Sans TC",sans-serif;--pen:"DFKai-SB","BiauKai","KaiTi",cursive}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#dfe5e7;color:var(--ink);font-family:var(--pen)} button,input{font:inherit}.book{max-width:1500px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 18px 60px #17243e2d}.top{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.08em}.mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;font-size:.9rem}.random{border:1px solid var(--ink);background:transparent;padding:8px 14px;cursor:pointer;color:var(--ink)}.random:hover,.random:focus-visible{background:var(--ink);color:var(--paper)}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);min-height:480px}.hero-copy{padding:clamp(40px,5.5vw,72px);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.kicker{font-family:var(--sans);color:var(--red);font-size:.86rem;letter-spacing:.16em;margin:0 0 18px}.hero h1{font-size:clamp(2.4rem,4.5vw,4.2rem);line-height:1.12;max-width:14ch;margin:0}.intro{font-family:var(--sans);font-size:.98rem;line-height:2;max-width:37em;color:#39485d;margin:24px 0}.start{align-self:flex-start;text-decoration:none;color:#fff;background:var(--red);padding:13px 20px;box-shadow:5px 6px 0 #e4c891}.hero-art{background:var(--ink);padding:24px clamp(26px,3vw,40px);display:grid;align-content:center;gap:14px}.hero-art .stage{max-width:none;width:100%;margin:auto}.quote-band{padding:30px clamp(22px,8vw,110px);background:var(--ink);color:var(--paper);text-align:center;font-size:clamp(1.3rem,2.4vw,2.05rem);line-height:1.65}.quote-band strong{color:#f3c768;font-weight:400}
    .visual-switch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.visual-switch button{border:1px solid #d9e0e4;background:#ffffff15;color:#fff;padding:8px 12px;cursor:pointer}.visual-switch button.active,.visual-switch button:hover{background:var(--gold);border-color:var(--gold);color:#17243e}.autoplay{font-family:var(--sans);font-size:.8rem;color:#f7f1df;display:flex;justify-content:center;gap:7px;align-items:center}.autoplay input{accent-color:var(--gold)}
    .stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#e9e2d3;border:1px solid #d3c4a5}.stage img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .32s ease}.stage.loading img{opacity:0}.slot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--sans);font-size:.85rem;line-height:1.7;color:#65707d;background:linear-gradient(145deg,#fbf7eb,#e5ebed)}.slot span{display:block;color:var(--red);font-weight:700;margin-bottom:4px}.stage.ready .slot{display:none}
    .chapter-bar{padding:25px clamp(20px,5vw,72px) 10px;background:var(--mist);border-bottom:1px solid var(--line)}.chapters{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}.chapter{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);padding:10px 14px;color:var(--ink);cursor:pointer;transition:transform .18s ease,background .18s ease,color .18s ease}.chapter:hover,.chapter.active{background:var(--ink);color:#fff;transform:translateY(-2px)}.content{padding:38px clamp(20px,5vw,72px) 70px}.toolrow{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:22px}.toolrow h2{font-size:clamp(1.75rem,3vw,2.45rem);margin:0}.toolrow p{font-family:var(--sans);margin:5px 0 0;color:var(--muted);font-size:.9rem}.search{width:min(320px,48%);border:1px solid var(--line);padding:11px 13px;background:#fff}.pagination{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}.pagination button{min-width:35px;height:35px;border:1px solid var(--line);background:var(--paper);cursor:pointer}.pagination button.active,.pagination button:hover{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px}.law{padding:19px;border:1px solid var(--line);background:#fffefa;box-shadow:6px 7px 0 #dde0da}.law:nth-child(3n+2){background:#f8f3e8}.law .stage{cursor:pointer;margin-bottom:17px}.law h3{font-size:1.34rem;line-height:1.4;margin:0 0 10px}.law p{font-family:var(--sans);font-size:.92rem;line-height:1.85;margin:0;color:#3c4552}.part-tag{font-family:var(--sans);font-size:.76rem;color:var(--red);letter-spacing:.05em;margin-bottom:8px}.footer{padding:22px;text-align:center;border-top:1px solid var(--line);font-family:var(--sans);font-size:.78rem;color:var(--muted)}
    dialog{width:min(1200px,calc(100% - 20px));max-height:92vh;border:0;padding:0;background:var(--paper);box-shadow:0 24px 90px #0008}dialog::backdrop{background:#17243eb5}.detail{max-height:92vh;overflow:auto;padding:clamp(20px,3.2vw,42px)}.close{float:right;border:0;background:transparent;font-size:1.5rem;cursor:pointer}.detail h2{font-size:clamp(1.7rem,3.5vw,2.5rem);margin:12px 40px 22px 0}.detail h3{font-size:1.12rem;color:var(--red);margin:23px 0 7px}.detail p{font-family:var(--sans);font-size:clamp(1rem,1.45vw,1.12rem);line-height:2;margin:0;max-width:none}.gold-quote{font-family:var(--pen)!important;font-size:1.18rem!important;color:#4b3034;padding-top:22px}.famous{margin-top:22px!important;padding:18px 20px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:#fff8e7}.source{font-size:.88rem!important;color:var(--muted)}.detail-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.detail-controls button{border:1px solid var(--line);padding:8px 11px;background:#fff;cursor:pointer}.detail-controls button.active{background:var(--ink);color:#fff}
    @media(max-width:760px){body{background:var(--paper)}.book{box-shadow:none}.top{padding:15px 18px}.hero{grid-template-columns:1fr;min-height:0}.hero-copy{border-right:0;padding:44px 22px 48px}.hero h1{max-width:11ch}.hero-art{padding:22px}.chapter-bar{padding:20px 18px 6px}.content{padding:28px 18px 52px}.toolrow{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.detail{padding:24px 20px}.law{box-shadow:4px 5px 0 #dde0da}}
  </style>
</head>
<body>
  <div class="book">
    <header class="top"><div class="brand"><span class="mark">人</span>人性的弱點・閱讀筆記</div><button class="random" id="randomLaw">今日選一則</button></header>
    <section class="hero"><div class="hero-copy"><p class="kicker">五大部分・37 則法則</p><h1>把理解人，變成每天的練習</h1><p class="intro">以白話整理《人性的弱點》的溝通、領導與家庭相處觀念。選一則法則，讀懂它，再把一個小做法帶回今天的關係裡。</p><a class="start" href="#laws">開始翻閱　↓</a></div><div class="hero-art"><div class="stage" data-number="0"><img src="images/placeholder.svg" alt="人性的弱點封面插圖"><div class="slot"><div><span>封面插圖預留位置</span><b data-path></b></div></div></div><div class="visual-switch" data-switch></div><label class="autoplay"><input type="checkbox" id="autoRotate"> 自動輪播三套插圖</label></div></section>
    <div class="quote-band">改變關係的起點，往往不是說服別人，<strong>而是先理解對方。</strong></div>
    <section id="laws"><div class="chapter-bar"><div class="chapters" id="chapters" aria-label="五大部分"></div></div><main class="content"><div class="toolrow"><div><h2 id="sectionTitle">全部法則</h2><p>點擊插圖，閱讀完整內容與金句。</p></div><input class="search" id="search" type="search" placeholder="搜尋法則、關鍵字……"></div><nav class="pagination" id="pagination" aria-label="法則分頁"></nav><div class="grid" id="lawGrid"></div></main></section>
    <footer class="footer">《人性的弱點》37 則法則｜三套插圖可切換｜圖片尚未放入時會顯示存放位置</footer>
  </div>
  <dialog id="dialog"><article class="detail"><button class="close" aria-label="關閉">×</button><div id="detailBody"></div></article></dialog>
  <script src="人性的弱點-內容資料.js"></script>
  <script>
    const styles=[{id:'q-style',name:'Q 版資訊圖表',prefix:'a'},{id:'doraemon',name:'多啦A夢動漫風',prefix:'b'},{id:'totoro',name:'龍貓吉卜力風',prefix:'c'}];
    let visualStyle='q-style',autoTimer=null,part='全部法則',page=1,query=''; const pageSize=6; const laws=window.humanNatureLaws||[];
    const chapters=['全部法則',...Array.from(new Set(laws.map(l=>l.part)))]; const grid=document.getElementById('lawGrid'),pages=document.getElementById('pagination'),sectionTitle=document.getElementById('sectionTitle');
    const pathFor=n=>{const style=styles.find(s=>s.id===visualStyle);return `images/${visualStyle}/${style.prefix}${String(n).padStart(2,'0')}.webp`};
    function hydrateStage(stage){const n=stage.dataset.number, img=stage.querySelector('img'), label=stage.querySelector('[data-path]');const path=pathFor(n);stage.classList.add('loading');stage.classList.remove('ready');label.textContent=path;img.alt=`${n==='0'?'封面':`第 ${n} 則法則`}・${styles.find(s=>s.id===visualStyle).name}插圖`;img.onload=()=>{stage.classList.remove('loading');stage.classList.add('ready')};img.onerror=()=>{stage.classList.remove('loading');stage.classList.remove('ready')};img.src=path;}
    function hydrateAll(){document.querySelectorAll('.stage').forEach(hydrateStage);document.querySelectorAll('[data-switch]').forEach(box=>{box.innerHTML='';styles.forEach(s=>{const b=document.createElement('button');b.textContent=s.name;b.className=s.id===visualStyle?'active':'';b.onclick=()=>setStyle(s.id);box.appendChild(b)})})}
    function setStyle(id){visualStyle=id;hydrateAll()}
    function filtered(){const needle=query.toLowerCase();return laws.filter(l=>(part==='全部法則'||l.part===part)&&`${l.title}${l.part}${l.description}${l.application}`.toLowerCase().includes(needle))}
    function render(){const data=filtered(),count=Math.max(1,Math.ceil(data.length/pageSize));page=Math.min(page,count);sectionTitle.textContent=part;grid.innerHTML='';data.slice((page-1)*pageSize,page*pageSize).forEach(l=>{const card=document.createElement('article');card.className='law';card.innerHTML=`<div class="part-tag">${l.part}</div><div class="stage" data-number="${l.number}" role="button" tabindex="0" aria-label="查看第 ${l.number} 則完整內容"><img src="images/placeholder.svg" alt="第 ${l.number} 則法則插圖"><div class="slot"><div><span>插圖預留位置</span><b data-path></b></div></div></div><h3>${l.title}</h3><p>${l.description}</p>`;const stage=card.querySelector('.stage');stage.onclick=()=>openDetail(l);stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(l)}};grid.appendChild(card)});if(!data.length)grid.innerHTML='<p>找不到相符法則，換一個關鍵字試試。</p>';pages.innerHTML='';for(let i=1;i<=count;i++){const b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.onclick=()=>{page=i;render();document.getElementById('laws').scrollIntoView()};pages.appendChild(b)};document.querySelectorAll('.chapter').forEach(b=>b.classList.toggle('active',b.textContent===part));hydrateAll()}
    function openDetail(l){const id=String(l.number).padStart(2,'0');document.getElementById('detailBody').innerHTML=`<div class="stage" data-number="${l.number}"><img src="images/placeholder.svg" alt="第 ${l.number} 則法則插圖"><div class="slot"><div><span>插圖預留位置</span><b data-path></b></div></div></div><div class="detail-controls" data-switch></div><h2>法則 ${l.number}：${l.title}</h2><h3>法則說明</h3><p>${l.description}</p><h3>工作與生活應用</h3><p>${l.application}</p><p class="gold-quote">${l.quote}</p><p class="famous">「${l.famousQuote.text}」<br>— ${l.famousQuote.author}</p><p class="source">出處：${l.famousQuote.source}</p>`;hydrateAll();document.getElementById('dialog').showModal()}
    chapters.forEach(c=>{const b=document.createElement('button');b.className='chapter';b.textContent=c;b.onclick=()=>{part=c;page=1;render()};document.getElementById('chapters').appendChild(b)});
    document.getElementById('search').oninput=e=>{query=e.target.value.trim();page=1;render()};document.querySelector('.close').onclick=()=>document.getElementById('dialog').close();document.getElementById('randomLaw').onclick=()=>openDetail(laws[Math.floor(Math.random()*laws.length)]);
    document.getElementById('autoRotate').onchange=e=>{clearInterval(autoTimer);if(e.target.checked)autoTimer=setInterval(()=>setStyle(styles[(styles.findIndex(s=>s.id===visualStyle)+1)%styles.length].id),4200)};render();
  </script>
</body>
</html>
