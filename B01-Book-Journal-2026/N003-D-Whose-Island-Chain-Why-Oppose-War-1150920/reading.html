": 70.193, "end": 73.437, "text": "關於全球與台海戰爭局勢的思索》。"}, {"start": 73.437, "end": 85.6, "text": "這本書由陽明交通大學榮譽教授傅大為主編，集結了九位來自傳播學、政治學、社會學、歷史學與新聞第一線的台灣學者與社運工作者。"}, {"start": 85.78, "end": 100.14, "text": "他們試圖突破傳統的思考框架，帶領聽眾從地緣政治、國際歷史、媒體傳播、性別視角與社會運動等多個面向，重新審視台灣在西太平洋的位置。"}, {"start": 100.32, "end": 118.44, "text": "聽完這篇二十分鐘以上的完整說書旁白，即使你從未讀過這本書，也能清楚掌握作者群如何理解第一島鏈、如何拆解霸權結構、如何批判台灣內部的政治情緒，以及他們對兩岸未來提出了哪些不同的可能性。"}, {"start": 118.62, "end": 125.371, "text": "這不是一份條列式的讀書筆記，而是一段帶有紀錄片感與深刻思考的聲音旅程。"}, {"start": 125.371, "end": 127.492, "text": "前言｜這是一本什麼書？"}, {"start": 127.492, "end": 132.7, "text": "要理解這本書的出現，必須回到二千零二十三年春天的台灣。"}, {"start": 132.88, "end": 147.84, "text": "當時，傅大為、盧倩儀、馮建三與郭力昕四位學者，共同發起了一份反戰聲明，針對俄烏戰爭的教訓、美國在東亞的角色以及台灣當局的兩岸政策提出尖銳的反省。"}, {"start": 148.02, "end": 164.86, "text": "這份聲明在台灣社會引發了巨大的波瀾與政治議論，但也因此凝聚了一群關心和平的知識分子與行動者，隨後擴大組成反戰工作網絡，持續進行研究與出版。"}, {"start": 165.04, "end": 172.363, "text": "到了二千零二十六年秋天，這套累積三年的深刻思考，最終集結成《誰的島鏈？"}, {"start": 172.363, "end": 173.409, "text": "為何反戰？"}, {"start": 173.409, "end": 175.92, "text": "》這本極具份量的論文集。"}, {"start": 175.92, "end": 181.36, "text": "這本書的核心問題意識，可以從書名中的兩個問號來理解。"}, {"start": 181.54, "end": 184.206, "text": "第一個問號是「誰的島鏈？"}, {"start": 184.206, "end": 193.314, "text": "」冷戰時期由美國劃定的第一島鏈，究竟是島上居民的家園，還是大國地緣博弈的圍堵工具？"}, {"start": 193.314, "end": 195.98, "text": "第二個問號是「為何反戰？"}, {"start": 196.16, "end": 204.21, "text": "」在各國競相擴張軍備、甚至將備戰等同於和平的今天，作者群為什麼堅持提出反戰？"}, {"start": 204.21, "end": 213.32, "text": "他們認為，真正的和平不能建立在無限升高的軍事對抗上，而是需要窮盡智慧去化解衝突的根源。"}, {"start": 213.5, "end": 221.3, "text": "作為一本多人合著的論述集，這本書並沒有單一的教條，而是呈現出豐富的思考光譜。"}, {"start": 221.48, "end": 239.6, "text": "九位作者雖然擁有不同的學術專業與分析角度，但他們擁有共同的關切，那就是拒絕讓台灣成為大國對抗的棋子與戰場，並試圖在備戰與投降的狹隘選項之外，為台灣與東亞尋找第三種思路。"}, {"start": 239.78, "end": 247.727, "text": "作者群介紹在進入全書四大部分的詳細分析之前，我們簡單認識參與撰寫的九位主要作者。"}, {"start": 247.727, "end": 263.62, "text": "主編傅大為教授是台灣科技與社會研究的重量級學者，長年關注公共知識分子的社會責任，他在書中主要負責導言，並從國際左翼與地緣政治的角度分析第一島鏈與台灣的中立定位。"}, {"start": 263.8, "end": 274.589, "text": "張鈞凱是資深媒體人與原鄉人文化工作室執行長，他深入研究沖繩的歷史與在地抗爭，提供冷峻的地緣政治分析。"}, {"start": 274.589, "end": 287.32, "text": "鍾秀梅是成功大學台灣文學系教授，她將視野拉到北美與全球社會運動，探討面對川普主義時，基層人民如何進行陣地戰與抗震抵抗。"}, {"start": 287.5, "end": 303.06, "text": "馮建三是政治大學新聞學系退休教授，長期關注拉丁美洲政治與國際政治經濟學，他在書中詳細記錄委內瑞拉的自主抗爭，並對比台海未來的兩種可能模式。"}, {"start": 303.24, "end": 315.276, "text": "盧倩儀是中央研究院歐美研究所研究員，她提出具備歷史縱深的四層次分析法，剖析台灣社會對西方帝國的零警覺與防衛思覺失調。"}, {"start": 315.276, "end": 327.52, "text": "郭力昕是政治大學傳播學院兼任教授與影像文化評論者，他從文化批判與集體心理切入，剖析台灣政治情緒中的仇恨動員與跪美傳統。"}, {"start": 327.7, "end": 342.86, "text": "郭耀中是台灣和平實踐研究工作室執行長，他從社運第一線的視角，紀錄近年台灣聲援巴勒斯坦的反戰運動，並反省冷戰意識形態對學術與社運的籠罩。"}, {"start": 343.04, "end": 353.857, "text": "王顥中是苦勞網資深記者，他從女性主義與前南斯拉夫的歷史經驗出發，深刻批判戰時主體性與排他性國族主義的陷阱。"}, {"start": 353.857, "end": 366.92, "text": "羅世宏是中正大學傳播學系教授，他從傳播政治經濟學的角度，剖析安全化與平台化如何製造戰爭想像，並提出和平新聞學與民主防護盾的構想。"}, {"start": 367.1, "end": 379.127, "text": "這九位作者各自從不同的位置出發，交織出一幅跨越沖繩、委內瑞拉、巴勒斯坦、台灣內部政治與傳播媒體的宏大思維地圖。"}, {"start": 379.127, "end": 383.5, "text": "主要篇幅將放在全書的四個部分與十個章節。"}, {"start": 383.68, "end": 387.709, "text": "第一部分｜第一島鏈上的反戰與台灣有事？"}, {"start": 387.709, "end": 390.89, "text": "第一章｜帝國夾縫還是帝國黑手？"}, {"start": 390.89, "end": 395.767, "text": "全書的第一部分，把焦點放在台灣所處的第一島鏈。"}, {"start": 395.767, "end": 401.28, "text": "第一章由張鈞凱撰寫，章名叫做「帝國夾縫還是帝國黑手？"}, {"start": 401.46, "end": 404.064, "text": "台灣與沖繩的和平威脅」。"}, {"start": 404.064, "end": 410.79, "text": "章名本身帶有鮮明的立場，介紹時必須清楚說明這是作者提出的分析。"}, {"start": 410.79, "end": 417.3, "text": "作者在文章一開場，帶領讀者來到一九四五年沖繩戰役的血淚遺跡。"}, {"start": 417.48, "end": 427.749, "text": "當時在日軍皇民化與全員玉碎的思想灌輸下，大量沖繩居民被迫集體自殺，造成二十萬軍民慘烈犧牲。"}, {"start": 427.749, "end": 439.16, "text": "隨後，作者將視角轉向邊野古漁港，記錄七十五歲的浦島悅子女士，獨自守護海岸長達十九年的反美軍基地抗爭。"}, {"start": 439.34, "end": 446.277, "text": "故事與理論連結的部分，作者借用日本學者高橋哲哉提出的犧牲的體系概念。"}, {"start": 446.277, "end": 459.54, "text": "高橋哲哉指出，美日同盟為了自身的國防與霸權利益，理所當然地要求邊緣的沖繩承擔巨量美軍基地的苦痛，這是一種帶有父權與殖民宰制的結構。"}, {"start": 459.72, "end": 477.68, "text": "張鈞凱在分析中指出，近年台灣某些知識界與媒體發展出一種帝國夾縫理論，把台灣面對中國威脅與沖繩承受美日壓力，描繪成同病相憐的弱者，聲稱兩地被鎖在不同的地緣政治夾縫中。"}, {"start": 477.86, "end": 485.87, "text": "作者批判，這種說法表面上是感同身受的偽善，實質上卻是一種再島鏈化的父權慾望。"}, {"start": 485.87, "end": 496.62, "text": "因為寄望美軍馳援台灣的抗中主張者，本質上是在勸誘沖繩人民繼續忍受美軍駐紮，要沖繩為了台灣的利益而犧牲。"}, {"start": 496.8, "end": 506.423, "text": "作者強調，沖繩歷史給台灣最重要的啟示是，一旦擦槍走火爆發戰爭，無處可逃的人們就會淪為肉盾。"}, {"start": 506.423, "end": 513.48, "text": "台灣人不該天真地以為備戰就能避戰，更不該甘願充當美國沸騰的護城河。"}, {"start": 513.66, "end": 522.45, "text": "作者提出，唯有台沖人民共同追求島鏈無事，才能徹底打破西方加諸於東亞的殖民枷鎖。"}, {"start": 522.45, "end": 534.62, "text": "第二章｜在第一島鏈上反戰第二章由主編傅大為撰寫，題目是「在第一島鏈上反戰：從台灣反戰聲明到日本台灣有事論」。"}, {"start": 534.8, "end": 548.88, "text": "作者首先回顧了一九六〇年日本民間反對日美安保條約強行通過的五四事件，當時數百萬日本民眾衝擊國會，展現出戰後日本強烈的反戰傳統。"}, {"start": 549.06, "end": 554.903, "text": "這段歷史連結到日本和平憲法第九條以及著名的瓶蓋理論。"}, {"start": 554.903, "end": 569.06, "text": "瓶蓋理論認為，日美安保條約表面上是用來壓制日本軍國主義復闢的瓶蓋，實則迫使日本成為美國在東亞的前鋒，甚至推動日本走向再軍事化。"}, {"start": 569.24, "end": 581.362, "text": "在分析台灣內部時，傅大為梳理了台灣從解嚴以來的三波反戰運動，並詳細記錄二千零二十三年台灣反戰聲明發表後的發展。"}, {"start": 581.362, "end": 590.84, "text": "面對綠營與網路陣營的抹紅圍剿，反戰學者們擴大組成工作網絡，積極進行思想突破與國際交流。"}, {"start": 591.02, "end": 600.127, "text": "作者提出，台灣不該逢中必反、逢美必跪，而應該在中美兩大國之間保持一個左翼中立島的立場。"}, {"start": 600.127, "end": 607.54, "text": "這不是維持現狀，而是透過中立來推動兩岸和談與交流，拋棄第一島鏈的枷鎖。"}, {"start": 607.72, "end": 611.63, "text": "接著，文章深入分析日本政壇的情況。"}, {"start": 611.63, "end": 630.72, "text": "從安倍晉三到高市早苗提出的台灣有事就是日本有事論，作者指出，高市早苗將台灣有事正式化，信誓旦旦要擴軍、修憲並解禁集體自衛權，這是在配合美國要求盟友分擔防衛負擔的策略。"}, {"start": 630.9, "end": 649.26, "text": "然而，這種挑釁言論在日本國內激起了廣大的反對聲浪，例如二千零二十六年數萬日本民眾在國會前的示威，顯示出戰後日本在美國霸權下，內部一直存在著擴軍與反戰兩股力量的激烈對立。"}, {"start": 649.44, "end": 653.974, "text": "最後，傅大為探討了東亞和平運動的跨國連帶。"}, {"start": 653.974, "end": 672.76, "text": "作者特別引用日本學者大西廣的分析，提到日本右翼政黨參政黨雖然立場保守，但因為堅決主張日本獨立、反對外國駐軍，因此在廢除日美安保條約的目標上，呈現出左翼與右翼政治聯盟的可能性。"}, {"start": 672.94, "end": 679.853, "text": "作者主張，日、台、韓的和平力量應該跨國合作，共同對抗區域的再軍事化。"}, {"start": 679.853, "end": 692.46, "text": "完成第一部分的討論，我們可以看到，兩位作者共同揭示了第一島鏈並不是天然存在的地理屏障，而是二戰後美國用軍事力量劃出的圍堵線。"}, {"start": 692.64, "end": 706.2, "text": "作者們一致認為，不能只從台灣單一角度看安全，而必須看清沖繩與日本西南諸島人民對軍事基地的抵抗，拒絕讓家園成為大國博弈的戰場。"}, {"start": 706.38, "end": 714.484, "text": "第二部分｜美國因素及其反制、翻牆與重生第三章｜面對川普，如何不受統治？"}, {"start": 714.484, "end": 722.82, "text": "進入第二部分，全書將視野擴大到全球帝國權力的運作，特別是美國因素的分析。"}, {"start": 723.0, "end": 728.924, "text": "第三章由鍾秀梅教授撰寫，題目是「面對川普，如何不受統治？"}, {"start": 728.924, "end": 732.52, "text": "從娜歐蜜．克萊恩的抵抗觀念談起」。"}, {"start": 732.7, "end": 748.06, "text": "作者以二千零十五年加拿大民間發起的《躍進宣言》，以及二千零二十五年美國明尼阿波利斯市民抵抗移民海關執法局（移民海關執法局）濫捕的社區陣地戰作為開場故事。"}, {"start": 748.24, "end": 754.186, "text": "市民們築起通訊與生活支援的人牆，保護移民鄰居免受搜捕。"}, {"start": 754.186, "end": 760.131, "text": "這些基層行動連結到加拿大知名作家娜歐蜜．克萊恩的思想。"}, {"start": 760.131, "end": 769.16, "text": "克萊恩長期批判新自由主義與災難資本主義，揭露菁英階層如何利用震盪時刻強加極端政策。"}, {"start": 769.34, "end": 783.3, "text": "針對川普主義的崛起，克萊恩提出抗震抵抗與抗震路線圖，強調社會運動不能只對不公義說不，更要對經濟公平、氣候正義與民主大聲說肯定。"}, {"start": 783.48, "end": 794.189, "text": "克萊恩參與起草的《躍進宣言》，就是一套提出擺脫石化依賴、推動在地生態農業與消除貧富不均的替代願景。"}, {"start": 794.189, "end": 798.56, "text": "同時，文章分析了川普主義的新法西斯性格。"}, {"start": 798.74, "end": 812.86, "text": "作者引用學者拉斯繆森與克萊恩的觀察，指出川普主義利用群眾在急劇變革中失去主導敘事權的憤怒，將民粹動員推向一種量子疊加態。"}, {"start": 813.04, "end": 819.8, "text": "克萊恩注意到，許多普通人因為對體制自由派的不滿，被吸引進右翼陣營。"}, {"start": 819.8, "end": 831.68, "text": "而明尼阿波利斯市民透過互助網絡、法律援助與生活物資支援所展開的陣地戰，證明了基層的組織與文化堡壘能有效削弱民粹霸權。"}, {"start": 831.86, "end": 839.063, "text": "鍾秀梅最後說明，為什麼一本討論台灣與台海的書要引入北美的抵抗經驗。"}, {"start": 839.063, "end": 849.54, "text": "因為台灣社會長期浸泡在美國理想主義的神話中，忽視了川普主義與霸權體系對受薪階級與全球環境的摧殘。"}, {"start": 849.72, "end": 859.437, "text": "理解北美的抗震抵抗，有助於台灣民眾建立批判視野，思考如何在強權環伺下保持自身的自主性。"}, {"start": 859.437, "end": 861.923, "text": "第四章｜希望殺得死嗎？"}, {"start": 861.923, "end": 867.12, "text": "第四章由馮建三教授撰寫，題目是「希望殺得死嗎？"}, {"start": 867.3, "end": 871.085, "text": "新委內瑞拉的誕生、成就，與美國的干預」。"}, {"start": 871.085, "end": 879.98, "text": "作者以極其詳盡的歷史資料，記錄了委內瑞拉從一九九八年查維茲當選總統以來，所推動的玻利瓦爾革命。"}, {"start": 880.16, "end": 897.0, "text": "文章介紹了新委內瑞拉在黃金八年間的成就：透過石油利益重新分配，年均經濟成長率達到百分之四點八，貧窮率與失業率大幅下降，大學教育與醫療保健普及到最底層的貧民區。"}, {"start": 897.18, "end": 908.675, "text": "此外，文章特別強調了大小公社運動的興起，讓基層民眾能夠透過參與式民主，自行編列預算、建設社區與推動地方變革。"}, {"start": 908.675, "end": 915.7, "text": "然而，這個試圖走自主道路的南方國家，卻面臨了美國長期的霸凌與干預。"}, {"start": 915.88, "end": 929.72, "text": "作者詳細梳理了從二千零二年政變、私人媒體停播新聞進行恐怖宣傳、傳統菁英發起囤積物資的經濟戰，到川普政府祭出最大壓力策略。"}, {"start": 929.9, "end": 946.18, "text": "美國凍結委內瑞拉海外數百億美元資產、強行賤賣委國在美資產西特戈石油公司，甚至發動金融封鎖，導致委內瑞拉石油產量暴跌、物價飛漲與數百萬人口外流。"}, {"start": 946.36, "end": 952.397, "text": "美軍更在公海襲擊船隻，乃至以軍事行動挾持國家領導人。"}, {"start": 952.397, "end": 964.24, "text": "馮建三回答了讀者最關心的問題：為什麼一本討論台海戰爭與和平的書，要花這麼大篇幅討論拉丁美洲的委內瑞拉？"}, {"start": 964.42, "end": 975.361, "text": "作者指出，委內瑞拉的經驗展示了任何信守經濟民主與自主路線的南方國家，在面對美帝國主義時所承受的極限施壓。"}, {"start": 975.361, "end": 985.46, "text": "主流媒體往往將委內瑞拉的經濟困境歸咎於社會主義的失敗，卻刻意掩蓋了美國金融與工業恐怖主義的破壞。"}, {"start": 985.64, "end": 995.932, "text": "了解委內瑞拉，能讓台灣讀者看清美國霸權外交的真實面貌，明白一昧依附霸權並不能帶來真正的安全。"}, {"start": 995.932, "end": 1006.0, "text": "第五章｜翻牆看世界第五章由盧倩儀研究員撰寫，題目是「翻牆看世界，洞見台灣的防衛思覺失調」。"}, {"start": 1006.18, "end": 1011.658, "text": "作者在文章一開場，對比了兩場相隔八十年的歷史性演講。"}, {"start": 1011.658, "end": 1017.347, "text": "一場是一九四六年邱吉爾發表的鐵幕演說，開啟了冷戰對立；"}, {"start": 1017.347, "end": 1024.3, "text": "另一場是二〇二六年美國國務卿魯比歐在慕尼黑安全會議上的脫面具演說。"}, {"start": 1024.48, "end": 1036.949, "text": "魯比歐在演講中竟無比惋惜地懷念西方五百年帝國殖民擴張的輝煌，並坦言是共產主義與反殖民運動打斷了西方的統治。"}, {"start": 1036.949, "end": 1046.36, "text": "作者指出，這證明了西方帝國殖民主義從未中斷，戴上面具時用騙的，脫下面具時用搶的。"}, {"start": 1046.54, "end": 1051.759, "text": "在此基礎上，盧倩儀提出白話的防衛思覺失調概念。"}, {"start": 1051.759, "end": 1059.248, "text": "作者指出，台灣主流輿論把國際真實狀況與美中台關係當成兩個平行宇宙。"}, {"start": 1059.248, "end": 1069.46, "text": "在台灣的小宇宙裡，美國被奉為文明、人權與正義的永遠保護者，中國則被定型為唯一邪惡的加害者。"}, {"start": 1069.64, "end": 1090.28, "text": "即使美國在世界各地轟炸學校、綁架主權國家元首、實施非法經濟制裁餓死平民，台灣主流敘事依然對美國掏出天文數字購買武器爭論不休，對保護者展現出零警覺、零防範與近乎宗教狂熱的迷信。"}, {"start": 1090.46, "end": 1095.363, "text": "為了拉開分析縱深，盧倩儀提出四層次分析法。"}, {"start": 1095.363, "end": 1098.631, "text": "第一層是扁平隔絕的主流敘事；"}, {"start": 1098.631, "end": 1101.9, "text": "第二層是帝國殖民的歷史本質；"}, {"start": 1102.08, "end": 1125.6, "text": "第三層是具體微觀的帝國工具，聚焦於情報機構如中央情報局、國家民主基金會，以及透過星鏈和人工智慧高科技軍工巨頭（如帕蘭泰爾公司）對他國媒體、公民團體與全民數據進行的滲透與操弄，將他國變成殲滅鏈的實驗室；"}, {"start": 1125.78, "end": 1131.387, "text": "第四層則是人民，強調改變的力量最終來自人民的覺醒。"}, {"start": 1131.387, "end": 1144.62, "text": "作者呼籲，台灣人必須勇敢翻牆，突破帝國禁錮思想的認知操弄，看清西方帝國主義的真實運作，才能建立真正利己且成熟的防禦觀。"}, {"start": 1144.8, "end": 1160.08, "text": "完成第二部分的旁白小結，這三章從北美抵抗運動、委內瑞拉的自主困境，到西方帝國殖民歷史的演變，為聽眾構建了一幅全球地緣政治的立體視角。"}, {"start": 1160.26, "end": 1172.304, "text": "作者們提醒，台灣如果只聽信美國單方面的敘事，就會深陷防衛思覺失調，唯有翻牆認識真實的世界，才能找回台灣的自主性。"}, {"start": 1172.304, "end": 1175.1, "text": "第三部分｜台灣內部的再批判"}, {"start": 1175.28, "end": 1186.023, "text": "第六章｜仇恨與和平，毀滅與希望第三部分將批判的鋒芒轉向台灣內部的政治心理、冷戰遺緒與社運困境。"}, {"start": 1186.023, "end": 1196.08, "text": "第六章由郭力昕教授撰寫，題目是「仇恨與和平，毀滅與希望：從仇中的綠營與瘋狂的川普談起」。"}, {"start": 1196.26, "end": 1206.165, "text": "作者在文章開場，引用了泰國清邁大學教授在一千零二十五年泰柬邊境戰爭時發出的感人臉書省思。"}, {"start": 1206.165, "end": 1217.42, "text": "泰國教授寫道：「民族主義讓我們對生命的價值產生不平等的認知，他人死亡帶來的喜悅是民族主義最黑暗之處。"}, {"start": 1217.6, "end": 1223.008, "text": "我們能不能不再是泰國人或柬埔寨人，回歸有血有肉的人？"}, {"start": 1223.008, "end": 1232.16, "text": "」這段對狂熱國族主義的扣問，連結到民族主義的黑暗面以及台灣高等教育體系中的學術自我殖民。"}, {"start": 1232.34, "end": 1237.217, "text": "郭力昕深刻描繪了某種無以名狀的台灣集體性格。"}, {"start": 1237.217, "end": 1248.3, "text": "首先是僥倖賭運氣的心理，從政府到民間缺乏理性的風險評估，習慣賭一把，把國家安全寄託在神明或美國身上。"}, {"start": 1248.48, "end": 1253.619, "text": "其次是被歷史經驗形塑的自卑、自憐與自我賤斥心理。"}, {"start": 1253.619, "end": 1257.902, "text": "更重要的是，台灣擁有獨步全球的跪美傳統。"}, {"start": 1257.902, "end": 1269.68, "text": "在好萊塢影視長期幾乎全面盤據民眾視線的意識形態教化下，台灣社會對美國只剩下崇拜、臣服與幻想，不敢進行任何質疑。"}, {"start": 1269.86, "end": 1278.514, "text": "作者批評，執政當局與綠營政治圈為了鞏固政權，利用去脈絡的仇恨語言將抗中保台反智化。"}, {"start": 1278.514, "end": 1289.7, "text": "凡是提出交流或和平主張的人，一律被抹紅為投降者或中共同路人，這種仇恨動員甚至一路延續到大罷免的政治宣傳上。"}, {"start": 1289.88, "end": 1295.881, "text": "然而，作者指出，這種簡化的仇恨話術終究會走向窮途末路。"}, {"start": 1295.881, "end": 1302.105, "text": "為了尋找希望，郭力昕引入了印尼與南韓知識分子的行動典範。"}, {"start": 1302.105, "end": 1313.44, "text": "印尼學者針對全球學術新自由主義與數據庫霸權，提出國家知識主權宣言，主張透過認識論不服從來切斷學術依附；"}, {"start": 1313.62, "end": 1319.057, "text": "南韓學者則發起跨國知識人聯合聲明，抵抗強權干預。"}, {"start": 1319.057, "end": 1337.18, "text": "最後，作者將目光投向台灣的新世代，記錄了在地青年透過饒舌音樂批判帝國主義、在傳統市場經營文化空間等切片，寄望年輕世代能將政治殘渣丟進歷史垃圾桶，開創大氣的未來。"}, {"start": 1337.36, "end": 1351.0, "text": "第七章｜在冷戰意識形態籠罩下匍匐前行第七章由郭耀中撰寫，題目是「在冷戰意識形態籠罩下匍匐前行：對當前台灣反戰運動的省思」。"}, {"start": 1351.18, "end": 1358.428, "text": "文章以二千零二十四年台灣巴勒斯坦自由連線抗議台北航太展作為開場故事。"}, {"start": 1358.428, "end": 1368.02, "text": "行動者在調查中震驚地發現，台灣重要的以色列武器零件供應商，竟然同時涉足國內商業媒體的經營。"}, {"start": 1368.2, "end": 1382.64, "text": "這個發現揭示了軍工資本對媒體溝通的控制，也解釋了為什麼台灣主流媒體對本土聲援巴勒斯坦的抗議幾乎一字不提，卻不斷複製西方與以色列官方的論述。"}, {"start": 1382.82, "end": 1387.481, "text": "作者分析了台灣反戰運動面臨的深層結構困境。"}, {"start": 1387.481, "end": 1398.58, "text": "一方面，冷戰意識形態與去歷史化的大國恐懼深植人心，使社會大眾習慣從西方媒體的視角看待中東或國際衝突。"}, {"start": 1398.76, "end": 1417.96, "text": "另一方面，高等教育市場化與商品化之後，學者面臨升等、計畫與同儕審查的沉重壓力，加上抗中保台教條的籠罩，逼使許多原本關心社會的學者選擇噤聲或劃清界線，導致社運圈內部出現互相審查與切割的現象。"}, {"start": 1418.14, "end": 1425.192, "text": "郭耀中記錄了聲援巴勒斯坦運動在吸納不同政治立場群眾時的局促與爭議。"}, {"start": 1425.192, "end": 1441.86, "text": "有些台派行動者為了避免被貼上中共同路人的標籤，在遊行中刻意舉起台獨旗幟進行自清與切割，甚至提出因為以色列跟中國好所以要挺巴勒斯坦等未脫離抗中框架的弔詭說詞。"}, {"start": 1442.04, "end": 1448.468, "text": "作者最後提出反省，強調反戰運動不能停留在去歷史化的大國恐懼中。"}, {"start": 1448.468, "end": 1457.8, "text": "如果只敢批判遠方的衝突，卻不敢觸碰美國對台灣國防布建的明目張膽干涉，反戰運動就會失去力道。"}, {"start": 1457.98, "end": 1466.472, "text": "作者主張，台灣的反戰社群必須勇敢跨越冷戰藩籬，重建反帝反殖的統一戰線。"}, {"start": 1466.472, "end": 1480.06, "text": "第八章｜當防衛成為排他第八章由王顥中撰寫，題目是「當防衛成為排他：台灣戰時主體性的陷阱與女性主義反戰路線之爭」。"}, {"start": 1480.24, "end": 1488.28, "text": "作者首先介紹了俄烏戰爭爆發後，國際女性主義內部關於是否支持軍援的激烈論戰。"}, {"start": 1488.28, "end": 1492.627, "text": "接著，文章引入前南斯拉夫內戰的歷史經驗。"}, {"start": 1492.627, "end": 1502.84, "text": "前南斯拉夫女性主義者記錄了國家如何透過戰爭宣傳，重新動員好戰男性氣概，並將女性降格為生育機器。"}, {"start": 1503.02, "end": 1508.608, "text": "王顥中深入剖析了台灣學界如何挪用與剪裁東歐的抵抗論。"}, {"start": 1508.608, "end": 1519.14, "text": "某些學者借用東歐經驗，將反對軍國主義與批判美國霸權的傳統反戰立場，降格為過時的冷戰思維或道德潔癖。"}, {"start": 1519.32, "end": 1531.671, "text": "學者劉文等人提出酷兒防衛政治與集體戰時主體性，主張在面臨威脅的爭議國家中，酷兒與邊緣主體應該擁抱國家主權與武裝防衛。"}, {"start": 1531.671, "end": 1541.68, "text": "作者揭露，這種論述實際上是將民防與戰時動員改寫成進步修辭，使軍隊穿上了一層多元包容的性別迷彩。"}, {"start": 1541.86, "end": 1546.403, "text": "王顥中用簡單的方式解釋了戰時主體性的陷阱。"}, {"start": 1546.403, "end": 1554.623, "text": "當國家機器以防衛之名將社會推向戰備狀態時，必然會在內部尋找並製造潛在的威脅。"}, {"start": 1554.623, "end": 1563.06, "text": "在台灣，這個被防衛邏輯工具化與排他的對象，正是數量龐大且多數為女性的大陸配偶。"}, {"start": 1563.24, "end": 1572.796, "text": "陸配在兩岸敵對結構下，被要求進行嚴格的忠誠審查，甚至被扣上國安破口或第五縱隊的標籤。"}, {"start": 1572.796, "end": 1580.76, "text": "作者指出，這種針對陸配的政治權利剝奪，是典型的性別化國族主義排他政治。"}, {"start": 1580.94, "end": 1586.763, "text": "在國家安全的最高原則下，社會對陸配的痛苦變得去人性化。"}, {"start": 1586.763, "end": 1601.86, "text": "王顥中強調，真正的女性主義絕不是教導人民如何成為合格的戰備主體，更不是在內部尋找代罪羊，而是要堅持拆解國家主權戰車，守住不被去人性化的底線。"}, {"start": 1602.04, "end": 1612.442, "text": "完成第三部分的旁白小結，這三章對台灣內部的政治情緒、高教噤聲與防衛排他進行了深刻的自我解剖。"}, {"start": 1612.442, "end": 1624.88, "text": "作者們提醒，當防衛變成一種排他的法西斯氛圍時，受害的不只是異見者與婚姻移民，更是台灣社會本身的民主與人性底線。"}, {"start": 1625.06, "end": 1627.859, "text": "第四部分｜兩岸未來的遠景？"}, {"start": 1627.859, "end": 1631.304, "text": "第九章｜金門模式或是烏克蘭模式？"}, {"start": 1631.304, "end": 1636.471, "text": "全書的第四部分，試圖為台海與世界的未來尋找遠景。"}, {"start": 1636.471, "end": 1642.5, "text": "第九章由馮建三教授撰寫，題目是「金門模式或是烏克蘭模式？"}, {"start": 1642.68, "end": 1645.813, "text": "台海與世界未來的兩種可能性」。"}, {"start": 1645.813, "end": 1650.198, "text": "作者首先白話解釋了兩種模式代表的分析框架。"}, {"start": 1650.198, "end": 1660.64, "text": "金門模式二點零代表的是和平路線，以金門三十多年來解除戰地政務、從小三通到金廈同城生活圈的實踐為基礎。"}, {"start": 1660.82, "end": 1676.22, "text": "作者指出，金門從過去的地獄變成今日交流的橋樑，示範了兩岸可以透過多交流、多對話與制度化協商，尋求外交與國防統合的新中國內涵，實現共存共榮。"}, {"start": 1676.4, "end": 1681.834, "text": "相對地，烏克蘭模式二點零代表的是衝突與戰爭路線。"}, {"start": 1681.834, "end": 1701.76, "text": "文章詳細分析了俄烏戰爭的悲劇，指出美英等北約強權如何將烏克蘭作為耗弱俄羅斯的代理人，阻撓早期的和平協議，最後導致烏克蘭數百萬人流離失所、青年逃避兵役、經濟與環境遭到毀滅性破壞。"}, {"start": 1701.94, "end": 1705.941, "text": "馮建三討論了兩岸的地緣政治與戰爭風險。"}, {"start": 1705.941, "end": 1723.42, "text": "作者指出，雖然兩岸領導人都有保持理性的空間，但如果台灣執政者迷信備戰才能止戰，編列天文數字的國防特別預算，自甘成為美國的代理人與豪豬，就會將台灣推向變形的烏克蘭模式。"}, {"start": 1723.6, "end": 1739.2, "text": "作者算了一筆帳，如果能將龐大的國防經費移作民生使用，不僅能填補勞保基金，還能大幅增加社工、食品安全檢查員、護理師與心理健康資源，真正造福人民。"}, {"start": 1739.38, "end": 1751.07, "text": "馮建三特別強調，文章並不是替讀者選擇任何一種模式，而是要提醒台灣社會，金門模式或是烏克蘭模式都不是命中注定的宿命。"}, {"start": 1751.07, "end": 1763.58, "text": "兩岸擁有同文同種與歷史連帶，台北與北京都有各自的正當性，唯有透過平等的政治協商，共商雙方都能接受的一中內涵，才能趨吉避凶。"}, {"start": 1763.76, "end": 1780.24, "text": "第十章｜安全化、平台化與和平新聞學第十章也是全書的完結章，由羅世宏教授撰寫，題目是「安全化、平台化與和平新聞學：兩岸戰爭與和平前景的傳播學分析」。"}, {"start": 1780.42, "end": 1785.604, "text": "作者首先用生活化的語言，白話解釋三個核心專有名詞。"}, {"start": 1785.604, "end": 1788.092, "text": "第一個名詞是「安全化」。"}, {"start": 1788.092, "end": 1803.02, "text": "這指的是政治人物或媒體把某個議題建構為生存威脅，使得原本屬於正常民主審議的討論，被移轉到例外狀態的治理模式，讓限制人權或大幅擴軍被視為理所當然。"}, {"start": 1803.2, "end": 1805.817, "text": "第二個名詞是「平台化」。"}, {"start": 1805.817, "end": 1812.795, "text": "在當前數位資本主義下，社群平台的商業模式建立在注意力的商品化上。"}, {"start": 1812.795, "end": 1816.72, "text": "演算法天然偏好高情緒、高衝突的內容。"}, {"start": 1816.9, "end": 1824.414, "text": "因此，強調敵我對立與戰爭威脅的敘事，在平台上具有結構性的流量優勢。"}, {"start": 1824.414, "end": 1827.602, "text": "第三個名詞是「和平新聞學」。"}, {"start": 1827.602, "end": 1831.7, "text": "這是相對於傳統戰爭新聞學的專業實作。"}, {"start": 1831.88, "end": 1847.36, "text": "戰爭新聞學只關心直接暴力與勝負，而和平新聞學則扮演冷卻劑的角色，補足衝突成因，揭露去人性化與情緒操弄，為降溫與對話保留公共空間。"}, {"start": 1847.54, "end": 1854.994, "text": "羅世宏分析，台海局勢之所以危急，不只是軍事部署的問題，更是一個傳播問題。"}, {"start": 1854.994, "end": 1861.62, "text": "媒體與平台不斷再生產必有一戰的荒謬現實主義，將預告性煽動常態化。"}, {"start": 1861.8, "end": 1867.444, "text": "為了對抗這種例外狀態，作者提出了民主防護盾的制度構想。"}, {"start": 1867.444, "end": 1881.24, "text": "民主防護盾不是靠擴張行政管制，而是靠保障媒體獨立、穩定公共媒體預算、問責平台演算法以及建立制度化的溝通護欄，厚植台灣社會的和平能力。"}, {"start": 1881.42, "end": 1893.02, "text": "完成第四部分的旁白小結，這兩章從兩岸未來的發展路徑與傳播媒體的制度改革，為全書提出了具建設性的遠景。"}, {"start": 1893.02, "end": 1902.3, "text": "作者們主張，和平不是天真的幻想，而是一套需要制度、智慧與公共空間共同建構的工程。"}, {"start": 1902.48, "end": 1904.701, "text": "全書總結｜誰的島鏈？"}, {"start": 1904.701, "end": 1905.811, "text": "為何反戰？"}, {"start": 1905.811, "end": 1913.141, "text": "讀完整本書的十個章節，我們重新回到書名中的兩個核心問題：誰的島鏈？"}, {"start": 1913.141, "end": 1914.251, "text": "為何反戰？"}, {"start": 1914.251, "end": 1925.8, "text": "我們不需要把前面十章重新摘要一次，而是把四個部分串聯起來，看看這本著作如何重新定義了台海問題的討論邊界。"}, {"start": 1925.98, "end": 1936.515, "text": "從第一部分對沖繩與日本安保的歷史考察，我們看到第一島鏈不是保護台灣的堅固盾牌，而是大國圍堵的軍事線；"}, {"start": 1936.515, "end": 1947.26, "text": "從第二部分對川普主義、委內瑞拉與西方帝國歷史的剖析，我們看清了美國因素的真實面貌與台灣的防衛思覺失調；"}, {"start": 1947.44, "end": 1958.821, "text": "從第三部分對台灣內部政治情緒、冷戰教條與戰時主體性的批判，我們警惕到防衛邏輯如何轉化為內部的排他與去人性化；"}, {"start": 1958.821, "end": 1967.04, "text": "最後從第四部分對金門模式與和平新聞學的探討，我們看到了超越戰爭框架的制度可能。"}, {"start": 1967.22, "end": 1968.514, "text": "《誰的島鏈？"}, {"start": 1968.514, "end": 1969.592, "text": "為何反戰？"}, {"start": 1969.592, "end": 1974.767, "text": "》是一本具有明確問題意識與作者立場的多人論述集。"}, {"start": 1974.767, "end": 1979.295, "text": "作者群開宗明義展現了他們的左翼與反戰關切。"}, {"start": 1979.295, "end": 1985.98, "text": "理解這本書的觀點，並不代表聽眾必須全盤接受所有作者的政治判斷。"}, {"start": 1986.16, "end": 1999.68, "text": "這本書最重要的閱讀價值，在於它像是一把戳破迷思的思辨之刃，在主流輿論高度單一化的今天，提供了一組充滿歷史縱深與國際視野的分析框架。"}, {"start": 1999.86, "end": 2006.842, "text": "它讓我們明白，在備戰與投降之外，我們依然擁有主動思考與選擇和平的權利。"}, {"start": 2006.842, "end": 2010.233, "text": "結尾｜戰爭之外，還能如何想像和平？"}, {"start": 2010.233, "end": 2015.42, "text": "在說書的最後，讓我們以平靜、具有紀錄片感的方式收尾。"}, {"start": 2015.6, "end": 2020.359, "text": "我們不喊任何政治口號，也不替任何政治立場背書。"}, {"start": 2020.359, "end": 2027.602, "text": "讓我們回到幾個值得每一個人在心中反覆扣問的問題：戰爭究竟是如何形成的？"}, {"start": 2027.602, "end": 2031.12, "text": "敵人又是如何被一步一步想像出來的？"}, {"start": 2031.3, "end": 2035.572, "text": "當我們談論安全時，這個安全是由誰來定義的？"}, {"start": 2035.572, "end": 2041.267, "text": "是軍火商、政治人物，還是生活在這片土地上的有血有肉的人？"}, {"start": 2041.267, "end": 2047.98, "text": "傳播媒體與社群演算法，又如何在不知不覺中影響了我們理解世界的方式？"}, {"start": 2048.16, "end": 2054.46, "text": "當大國競爭日益升高，台灣究竟該如何精準地理解自己的位置？"}, {"start": 2054.46, "end": 2067.96, "text": "如果和平不是一句空洞的口號，也不是靠無限擴張軍備就能自動獲得的結果，而是一個需要社會長期付出智慧、勇氣與制度建構的過程；"}, {"start": 2068.14, "end": 2081.86, "text": "那麼，當我們面對動盪的局勢時，真正值得我們深刻思考的，也許不只是如何去面對下一場戰爭，而是我們該如何運用智慧，避免人們一步一步走向它。"}], "chapters": [{"title": "開場｜如果戰爭不是命中注定？", "startTime": 1.5, "sceneId": 1, "count": 14}, {"title": "前言｜這是一本什麼書？", "startTime": 125.371, "sceneId": 15, "count": 27}, {"title": "第一部分｜第一島鏈上的反戰與台灣有事？", "startTime": 383.68, "sceneId": 42, "count": 1}, {"title": "第一章｜帝國夾縫還是帝國黑手？", "startTime": 387.709, "sceneId": 43, "count": 16}, {"title": "第二章｜在第一島鏈上反戰第二章由主編傅大為撰寫，題目是「在第一島鏈上反戰：從台灣反戰聲明到日本台灣有事論」。", "startTime": 522.45, "sceneId": 59, "count": 16}, {"title": "第二部分｜美國因素及其反制、翻牆與重生第三章｜面對川普，如何不受統治？", "startTime": 706.38, "sceneId": 75, "count": 17}, {"title": "第四章｜希望殺得死嗎？", "startTime": 859.437, "sceneId": 92, "count": 14}, {"title": "第五章｜翻牆看世界第五章由盧倩儀研究員撰寫，題目是「翻牆看世界，洞見台灣的防衛思覺失調」。", "startTime": 995.932, "sceneId": 106, "count": 18}, {"title": "第三部分｜台灣內部的再批判", "startTime": 1172.304, "sceneId": 124, "count": 1}, {"title": "第六章｜仇恨與和平，毀滅與希望第三部分將批判的鋒芒轉向台灣內部的政治心理、冷戰遺緒與社運困境。", "startTime": 1175.28, "sceneId": 125, "count": 18}, {"title": "第七章｜在冷戰意識形態籠罩下匍匐前行第七章由郭耀中撰寫，題目是「在冷戰意識形態籠罩下匍匐前行：對當前台灣反戰運動的省思」。", "startTime": 1337.36, "sceneId": 143, "count": 12}, {"title": "第八章｜當防衛成為排他第八章由王顥中撰寫，題目是「當防衛成為排他：台灣戰時主體性的陷阱與女性主義反戰路線之爭」。", "startTime": 1466.472, "sceneId": 155, "count": 17}, {"title": "第四部分｜兩岸未來的遠景？", "startTime": 1625.06, "sceneId": 172, "count": 1}, {"title": "第九章｜金門模式或是烏克蘭模式？", "startTime": 1627.859, "sceneId": 173, "count": 14}, {"title": "第十章｜安全化、平台化與和平新聞學第十章也是全書的完結章，由羅世宏教授撰寫，題目是「安全化、平台化與和平新聞學：兩岸戰爭與和平前景的傳播學分析」。", "startTime": 1763.76, "sceneId": 187, "count": 17}, {"title": "全書總結｜誰的島鏈？", "startTime": 1902.48, "sceneId": 204, "count": 16}, {"title": "結尾｜戰爭之外，還能如何想像和平？", "startTime": 2006.842, "sceneId": 220, "count": 11}]};</script><script src="app.js"></script></body></html>
