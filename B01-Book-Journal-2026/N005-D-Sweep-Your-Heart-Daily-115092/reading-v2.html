ter": "結語｜今日即可開始的行動", "section": "結語｜今日即可開始的行動", "narration": "當外在慢慢清爽，人的心也比較有機會回到安定。也許，這就是掃除最簡單，也最深的一層意義。", "image": "assets/images/129.webp", "storyboard": "【禪寺日常掃除】清晨禪寺庭院中，禪僧持竹掃把緩慢掃落葉，石板地、木造迴廊與晨霧形成安定層次。本鏡只呈現一個主要事件，避免同時塞入過多象徵；與前後鏡在場景、主體或視角上形成明顯差異。", "shot": "窗外向內拍攝，以窗框作前景，呈現室內人物與光線變化", "prompt": "16:9橫式滿版，手繪日式插畫風，細緻墨線、色鉛筆與淡水彩質感，紙張肌理，電影感紀錄片構圖。主題：禪寺日常掃除。畫面內容：清晨禪寺庭院中，禪僧持竹掃把緩慢掃落葉，石板地、木造迴廊與晨霧形成安定層次。鏡位：窗外向內拍攝，以窗框作前景，呈現室內人物與光線變化。光線：陰天柔和散射光。前景、中景、後景層次清楚，人物動作自然，單一事件，生活場景符合台灣現代居家或日本禪寺脈絡。本鏡對應章節：結語｜今日即可開始的行動。畫面不要文字、不要標題、不要Logo、不要浮水印、四邊鋪滿、不留白、不加黑邊。", "motion": "pan-left", "srtCueRange": [320, 321]}, {"id": 130, "start": 1308.036, "end": 1315.04, "chapter": "結語｜今日即可開始的行動", "section": "結語｜今日即可開始的行動", "narration": "不是把房間整理得完美。而是在每一次掃除裡，把自己重新帶回生活。", "image": "assets/images/130.webp", "storyboard": "【禪寺日常掃除】清晨禪寺庭院中，禪僧持竹掃把緩慢掃落葉，石板地、木造迴廊與晨霧形成安定層次。本鏡只呈現一個主要事件，避免同時塞入過多象徵；與前後鏡在場景、主體或視角上形成明顯差異。", "shot": "室內向外拍攝，前景為整理中的物件，後景連結庭院或城市環境", "prompt": "16:9橫式滿版，手繪日式插畫風，細緻墨線、色鉛筆與淡水彩質感，紙張肌理，電影感紀錄片構圖。主題：禪寺日常掃除。畫面內容：清晨禪寺庭院中，禪僧持竹掃把緩慢掃落葉，石板地、木造迴廊與晨霧形成安定層次。鏡位：室內向外拍攝，前景為整理中的物件，後景連結庭院或城市環境。光線：室內暖色燈光。前景、中景、後景層次清楚，人物動作自然，單一事件，生活場景符合台灣現代居家或日本禪寺脈絡。本鏡對應章節：結語｜今日即可開始的行動。畫面不要文字、不要標題、不要Logo、不要浮水印、四邊鋪滿、不留白、不加黑邊。", "motion": "pan-right", "srtCueRange": [322, 323]}], "captions": [{"id": 1, "start": 1.5, "end": 3.691, "text": "你有沒有過這樣的經驗？"}, {"id": 2, "start": 3.691, "end": 8.271, "text": "明明只是想找一把鑰匙，卻翻遍桌面、抽屜和包包。"}, {"id": 3, "start": 8.271, "end": 13.25, "text": "明明衣櫃已經塞滿，出門前卻還是覺得沒有衣服可以穿。"}, {"id": 4, "start": 13.25, "end": 20.42, "text": "手機裡的訊息愈來愈多，家裡的東西愈買愈多，腦袋裡要處理的事情也愈堆愈多。"}, {"id": 5, "start": 20.6, "end": 23.798000000000002, "text": "很多人會告訴自己，等有時間再整理。"}, {"id": 6, "start": 23.798000000000002, "end": 28.689, "text": "可是，真正等到有時間時，往往已經不知道該從哪裡開始。"}, {"id": 7, "start": 28.689, "end": 34.52, "text": "枡野俊明的《每天把心掃乾淨》，就是從這個很普通的生活問題開始。"}, {"id": 8, "start": 34.7, "end": 41.035, "text": "這本書談的是掃除，卻不只是在教人怎麼掃地、擦桌子、整理衣櫃。"}, {"id": 9, "start": 41.035, "end": 49.06, "text": "作者真正想問的是，如果一個人的房間愈來愈亂，他的心是不是也可能正在失去秩序？"}, {"id": 10, "start": 49.24, "end": 56.791, "text": "反過來說，如果每天把眼前的環境整理乾淨，人的心是不是也會慢慢安定下來？"}, {"id": 11, "start": 56.791, "end": 62.4, "text": "枡野俊明是一位禪僧，也是長期從事禪庭園設計的工作者。"}, {"id": 12, "start": 62.58, "end": 67.45, "text": "他從禪寺的日常生活出發，把掃除看成一種修行。"}, {"id": 13, "start": 67.45, "end": 73.648, "text": "在寺院裡，就算地板看起來已經很乾淨，禪僧仍然會每天打掃。"}, {"id": 14, "start": 73.648, "end": 74.977, "text": "原因很簡單。"}, {"id": 15, "start": 74.977, "end": 78.74, "text": "掃除的目的，不只是因為髒了才清理。"}, {"id": 16, "start": 78.92, "end": 82.37, "text": "它也是每天重新整理自己的過程。"}, {"id": 17, "start": 82.37, "end": 86.97, "text": "這本書一共分成三章，提出三十五則整理術。"}, {"id": 18, "start": 86.97, "end": 91.34, "text": "第一章談的是，掃除到底對人生有什麼用。"}, {"id": 19, "start": 91.34, "end": 97.32, "text": "第二章談的是，為什麼擁有得愈少，反而可能活得愈富足。"}, {"id": 20, "start": 97.5, "end": 109.94, "text": "第三章則把這些觀念真正帶回家裡，從早晨、玄關、客廳、衣櫃、廚房，一路談到工作桌、陽台，以及一個人心靈可以安定下來的地方。"}, {"id": 21, "start": 110.12, "end": 111.809, "text": "先從第一章開始。"}, {"id": 22, "start": 111.809, "end": 115.609, "text": "作者談的第一個觀念，是「諸行無常」。"}, {"id": 23, "start": 115.609, "end": 121.309, "text": "這個詞聽起來很像佛學，其實可以用非常生活化的方式理解。"}, {"id": 24, "start": 121.309, "end": 125.32, "text": "今天剛掃乾淨的地板，明天還是會有灰塵。"}, {"id": 25, "start": 125.5, "end": 130.15, "text": "剛整理好的庭院，風一吹，樹葉還是會掉下來。"}, {"id": 26, "start": 130.15, "end": 134.578, "text": "今天心情很好，也不代表明天不會遇到煩惱。"}, {"id": 27, "start": 134.578, "end": 141.22, "text": "所以，世界上幾乎沒有一種狀態，可以整理一次之後永遠保持完美。"}, {"id": 28, "start": 141.4, "end": 144.958, "text": "這就是第一則整理術真正要說的事。"}, {"id": 29, "start": 144.958, "end": 151.184, "text": "人不必追求永遠不亂，而要學會在亂了之後，再把它整理回來。"}, {"id": 30, "start": 151.184, "end": 156.52, "text": "這個想法也自然連到第二則，掃除與「悟道」的關係。"}, {"id": 31, "start": 156.7, "end": 159.652, "text": "書中談到禪宗的香嚴智閑。"}, {"id": 32, "start": 159.652, "end": 164.571, "text": "他曾經努力追求答案，卻一直沒有真正突破。"}, {"id": 33, "start": 164.571, "end": 173.18, "text": "後來在日常勞動中，掃除時一顆石頭碰到竹子，發出的聲響成為他領悟的契機。"}, {"id": 34, "start": 173.36, "end": 177.566, "text": "這個故事不是在說掃地一定會讓人突然開悟。"}, {"id": 35, "start": 177.566, "end": 184.507, "text": "它更像是在提醒，人有時候愈拚命想一件事情，反而愈困在自己的念頭裡。"}, {"id": 36, "start": 184.507, "end": 192.92, "text": "當身體開始做一件單純、明確的工作，注意力回到當下，原本糾纏不清的念頭可能會鬆開。"}, {"id": 37, "start": 193.1, "end": 197.567, "text": "所以，如果今天心很亂，也許不必一直坐著想。"}, {"id": 38, "start": 197.567, "end": 199.269, "text": "先去擦一張桌子。"}, {"id": 39, "start": 199.269, "end": 200.758, "text": "先把地掃乾淨。"}, {"id": 40, "start": 200.758, "end": 202.46, "text": "先讓身體動起來。"}, {"id": 41, "start": 202.46, "end": 207.14, "text": "第三則，作者進一步把「掃除」稱為「掃除道」。"}, {"id": 42, "start": 207.32, "end": 210.313, "text": "為什麼要加上一個「道」字？"}, {"id": 43, "start": 210.313, "end": 213.996, "text": "因為他認為，掃除不是只追求技巧。"}, {"id": 44, "start": 213.996, "end": 228.04, "text": "書中藉由柳生宗矩與澤庵禪師相關的故事，談到真正的「道」，最後不是炫耀技術，而是長期練習之後，讓身體、心與行動自然合在一起。"}, {"id": 45, "start": 228.22, "end": 230.853, "text": "掃地的時候，就只是掃地。"}, {"id": 46, "start": 230.853, "end": 233.926, "text": "擦桌子的時候，就只是擦桌子。"}, {"id": 47, "start": 233.926, "end": 237.876, "text": "這看起來很簡單，但對現代人其實很難。"}, {"id": 48, "start": 237.876, "end": 244.02, "text": "很多人吃飯時看手機，走路時回訊息，工作時又不停切換視窗。"}, {"id": 49, "start": 244.2, "end": 249.927, "text": "我們以為自己同時做了很多事情，心卻很少真正停在眼前。"}, {"id": 50, "start": 249.927, "end": 253.01, "text": "第四則談的是禪僧的「作務」。"}, {"id": 51, "start": 253.01, "end": 256.755, "text": "作務就是寺院裡每天必須完成的勞動。"}, {"id": 52, "start": 256.755, "end": 261.16, "text": "掃除、整理、農務，都可以是修行的一部分。"}, {"id": 53, "start": 261.34, "end": 266.495, "text": "書中提到百丈懷海「一日不作，一日不食」的精神。"}, {"id": 54, "start": 266.495, "end": 272.995, "text": "重點不是把勞動變成懲罰，而是提醒人，生活不是只靠思想維持。"}, {"id": 55, "start": 272.995, "end": 275.46, "text": "很多事情必須親手去做。"}, {"id": 56, "start": 275.64, "end": 278.379, "text": "家也可以是一個人的生活道場。"}, {"id": 57, "start": 278.379, "end": 283.661, "text": "不需要等到有心情才整理，也不必把家事全部丟給某一個人。"}, {"id": 58, "start": 283.661, "end": 288.16, "text": "每個人把自己該做的部分做好，本身就是生活修養。"}, {"id": 59, "start": 288.34, "end": 295.282, "text": "接著第五則，作者說，掃除不只是把髒污清掉，也是把空間整頓好。"}, {"id": 60, "start": 295.282, "end": 301.298, "text": "一個房間如果到處堆著東西，人的眼睛會不停接收到訊息。"}, {"id": 61, "start": 301.298, "end": 303.38, "text": "這裡有東西還沒收。"}, {"id": 62, "start": 303.56, "end": 305.731, "text": "那裡有文件還沒處理。"}, {"id": 63, "start": 305.731, "end": 307.469, "text": "椅子上還有衣服。"}, {"id": 64, "start": 307.469, "end": 310.509, "text": "久了之後，人甚至會習慣混亂。"}, {"id": 65, "start": 310.509, "end": 315.069, "text": "作者認為，房間的狀態與人的心境會彼此影響。"}, {"id": 66, "start": 315.069, "end": 321.8, "text": "這不是說房間亂的人一定心亂，而是環境確實會不斷刺激人的注意力。"}, {"id": 67, "start": 321.98, "end": 324.501, "text": "第六則更直接談到時間。"}, {"id": 68, "start": 324.501, "end": 327.252, "text": "雜亂的房間，會浪費人生。"}, {"id": 69, "start": 327.252, "end": 331.148, "text": "因為東西沒有固定位置，就要一直找。"}, {"id": 70, "start": 331.148, "end": 336.42, "text": "找鑰匙，找文件，找充電線，找昨天才拿過的東西。"}, {"id": 71, "start": 336.6, "end": 339.784, "text": "真正浪費的還不只是那幾分鐘。"}, {"id": 72, "start": 339.784, "end": 343.422, "text": "人在找不到東西時，往往會開始急。"}, {"id": 73, "start": 343.422, "end": 346.833, "text": "一急，原本的平常心也跟著不見。"}, {"id": 74, "start": 346.833, "end": 349.789, "text": "因此第七則的答案非常簡單。"}, {"id": 75, "start": 349.789, "end": 353.2, "text": "所有東西，都應該有自己的位置。"}, {"id": 76, "start": 353.38, "end": 354.792, "text": "用完就放回去。"}, {"id": 77, "start": 354.792, "end": 359.836, "text": "這聽起來毫不起眼，卻可能是整本書最實用的原則之一。"}, {"id": 78, "start": 359.836, "end": 361.853, "text": "作者也談到輕裝上路。"}, {"id": 79, "start": 361.853, "end": 367.3, "text": "隨身帶太多東西，看似有備無患，實際上也會增加管理負擔。"}, {"id": 80, "start": 367.48, "end": 368.935, "text": "家裡也是一樣。"}, {"id": 81, "start": 368.935, "end": 374.131, "text": "東西愈多，就需要愈多空間、時間和注意力去照顧它們。"}, {"id": 82, "start": 374.131, "end": 376.21, "text": "第八則回到家的功能。"}, {"id": 83, "start": 376.21, "end": 379.12, "text": "家應該是最能放鬆休息的地方。"}, {"id": 84, "start": 379.12, "end": 390.76, "text": "如果一個人每天工作已經很累，回家後看到的卻是滿桌雜物、沒洗的杯子和堆積的衣服，身體雖然回家了，心卻很難真正休息。"}, {"id": 85, "start": 390.94, "end": 395.446, "text": "所以整理家，不只是為了客人來的時候好看。"}, {"id": 86, "start": 395.446, "end": 398.149, "text": "首先是為了住在裡面的人。"}, {"id": 87, "start": 398.149, "end": 399.952, "text": "第九則很有意思。"}, {"id": 88, "start": 399.952, "end": 404.232, "text": "作者說，愈看不見的地方，愈要細心打掃。"}, {"id": 89, "start": 404.232, "end": 410.54, "text": "家具底下、電器後面、牆角、窗框，都是最容易被忽略的地方。"}, {"id": 90, "start": 410.72, "end": 415.036, "text": "因為沒有人看見，所以很容易告訴自己，算了。"}, {"id": 91, "start": 415.036, "end": 422.23, "text": "但作者在意的是，這種「反正看不到」的態度，會不會也慢慢進入工作與生活？"}, {"id": 92, "start": 422.23, "end": 430.04, "text": "真正的標準，往往不是做給別人看的部分，而是沒有人檢查時，自己還願不願意做好。"}, {"id": 93, "start": 430.22, "end": 432.34, "text": "第十則談到「善緣」。"}, {"id": 94, "start": 432.34, "end": 438.7, "text": "作者把掃除力看成一種「因」，而人生遇到的人與機會則是「緣」。"}, {"id": 95, "start": 438.7, "end": 442.94, "text": "這裡不必把它理解成掃地就會帶來神奇好運。"}, {"id": 96, "start": 443.12, "end": 455.814, "text": "比較實際的理解是，當環境乾淨、心比較不焦躁，人就更有餘裕判斷什麼重要，也比較有可能注意到原本忽略的機會。"}, {"id": 97, "start": 455.814, "end": 459.72, "text": "第十一則則把掃除帶進工作與人際。"}, {"id": 98, "start": 459.9, "end": 463.561, "text": "工作桌有秩序，人比較容易開始工作。"}, {"id": 99, "start": 463.561, "end": 467.867, "text": "需要的資料找得到，也比較不會被雜物打斷。"}, {"id": 100, "start": 467.867, "end": 472.82, "text": "作者更進一步提醒，人的心裡也有需要清掃的東西。"}, {"id": 101, "start": 473.0, "end": 475.98, "text": "像嫉妒、固執、自私、憤怒。"}, {"id": 102, "start": 475.98, "end": 481.253, "text": "如果一直讓這些情緒堆積，人際關係也會變得擁擠。"}, {"id": 103, "start": 481.253, "end": 486.067, "text": "所以第一章真正要教的，不是十一種掃地技巧。"}, {"id": 104, "start": 486.067, "end": 488.36, "text": "它是在建立一個觀念。"}, {"id": 105, "start": 488.54, "end": 489.956, "text": "混亂會累積。"}, {"id": 106, "start": 489.956, "end": 491.373, "text": "灰塵會累積。"}, {"id": 107, "start": 491.373, "end": 492.789, "text": "雜物會累積。"}, {"id": 108, "start": 492.789, "end": 494.442, "text": "煩惱也會累積。"}, {"id": 109, "start": 494.442, "end": 501.051, "text": "最好的方法，不是等到受不了再一次處理，而是每天清掉一點。"}, {"id": 110, "start": 501.051, "end": 502.94, "text": "接著進入第二章。"}, {"id": 111, "start": 503.12, "end": 507.058, "text": "這一章的問題更接近現代人的消費生活。"}, {"id": 112, "start": 507.058, "end": 511.872, "text": "為什麼我們已經擁有很多東西，卻還是一直想買？"}, {"id": 113, "start": 511.872, "end": 517.56, "text": "第十二則，作者直接指出，購物很難真正填補內心的空虛。"}, {"id": 114, "start": 517.74, "end": 522.288, "text": "想要一件東西時，人會覺得得到它就會很滿足。"}, {"id": 115, "start": 522.288, "end": 526.619, "text": "可是買到之後，那種興奮通常維持不了多久。"}, {"id": 116, "start": 526.619, "end": 529.868, "text": "接著又會出現下一個想要的東西。"}, {"id": 117, "start": 529.868, "end": 532.9, "text": "作者用「少欲知足」提醒讀者。"}, {"id": 118, "start": 533.08, "end": 540.328, "text": "真正的富足，不是所有想要的東西都得到，而是知道什麼時候已經足夠。"}, {"id": 119, "start": 540.328, "end": 543.046, "text": "第十三則談「滯銷庫存」。"}, {"id": 120, "start": 543.046, "end": 550.52, "text": "家裡那些多年不用，卻一直捨不得處理的東西，就像企業賣不出去的庫存。"}, {"id": 121, "start": 550.7, "end": 555.066, "text": "它們不只占空間，也需要被搬動、管理、清潔。"}, {"id": 122, "start": 555.066, "end": 562.342, "text": "更重要的是，每一次看見，都會讓人重新面對一次「到底要不要處理」的問題。"}, {"id": 123, "start": 562.342, "end": 566.5, "text": "不過作者並不是主張把家裡清到什麼都沒有。"}, {"id": 124, "start": 566.68, "end": 571.429, "text": "真正重要的是，留下來的東西要和現在的生活有關。"}, {"id": 125, "start": 571.429, "end": 574.319, "text": "第十四則因此談到丟棄的標準。"}, {"id": 126, "start": 574.319, "end": 578.862, "text": "如果沒有標準，每拿起一件東西，都會開始猶豫。"}, {"id": 127, "start": 578.862, "end": 580.72, "text": "這個以後可能會用。"}, {"id": 128, "start": 580.9, "end": 582.309, "text": "那個當年很貴。"}, {"id": 129, "start": 582.309, "end": 583.516, "text": "這件有回憶。"}, {"id": 130, "start": 583.516, "end": 585.126, "text": "最後什麼都留下。"}, {"id": 131, "start": 585.126, "end": 588.748, "text": "所以整理前，要先建立自己的判斷原則。"}, {"id": 132, "start": 588.748, "end": 590.358, "text": "現在有沒有使用？"}, {"id": 133, "start": 590.358, "end": 591.968, "text": "是不是真的喜歡？"}, {"id": 134, "start": 591.968, "end": 593.98, "text": "未來是否有明確用途？"}, {"id": 135, "start": 594.16, "end": 600.142, "text": "整理的核心，不是比誰丟得多，而是能不能清楚決定什麼值得留下。"}, {"id": 136, "start": 600.142, "end": 605.925, "text": "第十五則很重要，因為它讓這本書不會走向「什麼都丟」的極端。"}, {"id": 137, "start": 605.925, "end": 607.52, "text": "作者談「轉化」。"}, {"id": 138, "start": 607.7, "end": 612.216, "text": "物品原本的用途結束了，不代表生命一定結束。"}, {"id": 139, "start": 612.216, "end": 614.152, "text": "有些東西可以修補。"}, {"id": 140, "start": 614.152, "end": 615.657, "text": "有些可以改作。"}, {"id": 141, "start": 615.657, "end": 618.668, "text": "有些可以轉送給真正需要的人。"}, {"id": 142, "start": 618.668, "end": 625.98, "text": "書中從器物與茶道的脈絡談到，真正的惜物，是盡可能讓物品繼續發揮作用。"}, {"id": 143, "start": 626.16, "end": 629.958, "text": "所以禪式整理和浪費並不是同一件事。"}, {"id": 144, "start": 629.958, "end": 631.745, "text": "第十六則談囤貨。"}, {"id": 145, "start": 631.745, "end": 636.884, "text": "看到特價，很多人第一個念頭是，多買一點比較省。"}, {"id": 146, "start": 636.884, "end": 644.48, "text": "可是如果買回家後占空間、忘記使用、最後過期，原本的便宜反而變成浪費。"}, {"id": 147, "start": 644.66, "end": 647.153, "text": "囤貨還有一個隱形成本。"}, {"id": 148, "start": 647.153, "end": 651.233, "text": "東西愈多，人愈難掌握自己到底有什麼。"}, {"id": 149, "start": 651.233, "end": 655.087, "text": "結果明明家裡已經有了，又重複購買。"}, {"id": 150, "start": 655.087, "end": 658.26, "text": "第十七則把方向轉回「喜愛」。"}, {"id": 151, "start": 658.44, "end": 663.287, "text": "與其一直買新的，不如長久使用真正喜歡的東西。"}, {"id": 152, "start": 663.287, "end": 669.897, "text": "東西少一點，每一件反而比較容易被看見、被使用，也被好好照顧。"}, {"id": 153, "start": 669.897, "end": 672.32, "text": "這和第十八則非常接近。"}, {"id": 154, "start": 672.5, "end": 677.377, "text": "「有的話很方便」的東西，其實很多「沒有也無妨」。"}, {"id": 155, "start": 677.377, "end": 681.441, "text": "現代商品很擅長告訴人，有了這個會更方便。"}, {"id": 156, "start": 681.441, "end": 683.27, "text": "但方便不等於必要。"}, {"id": 157, "start": 683.27, "end": 687.74, "text": "如果一年只用一次，是否一定要永久占一個位置？"}, {"id": 158, "start": 687.92, "end": 689.653, "text": "有些東西可以借。"}, {"id": 159, "start": 689.653, "end": 690.519, "text": "可以租。"}, {"id": 160, "start": 690.519, "end": 692.252, "text": "可以和家人共用。"}, {"id": 161, "start": 692.252, "end": 696.151, "text": "購買以前多問一句，沒有它真的不行嗎？"}, {"id": 162, "start": 696.151, "end": 698.318, "text": "很多衝動就會停下來。"}, {"id": 163, "start": 698.318, "end": 702.0, "text": "第十九則把整理從實體物品帶到資訊。"}, {"id": 164, "start": 702.18, "end": 705.737, "text": "作者用「半睜半閉」來談資訊氾濫。"}, {"id": 165, "start": 705.737, "end": 714.628, "text": "坐禪時，不是把眼睛完全閉起來，也不是讓視線不停追逐外界，而是保持一種適度的觀看。"}, {"id": 166, "start": 714.628, "end": 717.74, "text": "這個概念放到今天非常有意思。"}, {"id": 167, "start": 717.92, "end": 724.285, "text": "手機通知、新聞、社群、短影音、廣告，每一樣都在爭取人的注意力。"}, {"id": 168, "start": 724.285, "end": 730.24, "text": "如果所有資訊都毫無限制地進來，大腦就像一個從不清理的房間。"}, {"id": 169, "start": 730.42, "end": 732.346, "text": "所以資訊也要掃除。"}, {"id": 170, "start": 732.346, "end": 735.128, "text": "不需要每一則通知都立刻看。"}, {"id": 171, "start": 735.128, "end": 738.124, "text": "不需要每一件熱門話題都參加。"}, {"id": 172, "start": 738.124, "end": 741.334, "text": "能決定什麼不看，也是一種自由。"}, {"id": 173, "start": 741.334, "end": 742.832, "text": "第二十則談水。"}, {"id": 174, "start": 742.832, "end": 747.54, "text": "作者以禪門故事提醒人，一滴水也不要輕易浪費。"}, {"id": 175, "start": 747.72, "end": 751.446, "text": "書中談到道元禪師珍惜用水的精神。"}, {"id": 176, "start": 751.446, "end": 757.501, "text": "這個觀念可以延伸到電、紙張、食物，以及所有有限資源。"}, {"id": 177, "start": 757.501, "end": 759.131, "text": "節制不是窮酸。"}, {"id": 178, "start": 759.131, "end": 764.72, "text": "真正的節制，是知道自己使用的東西並不是理所當然。"}, {"id": 179, "start": 764.9, "end": 767.177, "text": "作者也談到「積陰德」。"}, {"id": 180, "start": 767.177, "end": 772.144, "text": "也就是即使沒有人看見，仍然願意做對別人有益的事。"}, {"id": 181, "start": 772.144, "end": 774.42, "text": "例如順手整理公共空間。"}, {"id": 182, "start": 774.42, "end": 779.18, "text": "不是為了得到稱讚，只是讓下一個使用的人更舒服。"}, {"id": 183, "start": 779.36, "end": 782.787, "text": "所以第二章真正整理的，是「欲望」。"}, {"id": 184, "start": 782.787, "end": 785.206, "text": "少一點，不一定代表失去。"}, {"id": 185, "start": 785.206, "end": 788.633, "text": "有時候，東西少了，空間反而回來了。"}, {"id": 186, "start": 788.633, "end": 791.052, "text": "資訊少了，注意力回來了。"}, {"id": 187, "start": 791.052, "end": 794.68, "text": "購物少了，對現有物品的珍惜也回來了。"}, {"id": 188, "start": 794.86, "end": 796.714, "text": "接著進入第三章。"}, {"id": 189, "start": 796.714, "end": 801.812, "text": "前兩章談的是觀念，第三章則開始真正走進家裡。"}, {"id": 190, "start": 801.812, "end": 807.374, "text": "第二十一則，作者說，無論有沒有髒，禪僧都會打掃。"}, {"id": 191, "start": 807.374, "end": 809.46, "text": "這就是習慣的力量。"}, {"id": 192, "start": 809.64, "end": 815.851, "text": "如果每天都要先判斷「今天夠不夠髒」，人很容易找到理由跳過。"}, {"id": 193, "start": 815.851, "end": 822.276, "text": "但如果掃除本來就是生活的一部分，就不需要每天和自己討價還價。"}, {"id": 194, "start": 822.276, "end": 826.56, "text": "第二十二則談到，打掃也能替大腦清出空間。"}, {"id": 195, "start": 826.74, "end": 830.673, "text": "當眼前有太多東西，大腦會不停收到刺激。"}, {"id": 196, "start": 830.673, "end": 836.055, "text": "桌上每一份沒有處理的文件，都像在提醒你還有事情沒做。"}, {"id": 197, "start": 836.055, "end": 843.3, "text": "所以當工作卡住時，有時候短暫整理桌面，不是在逃避工作，而是在減少干擾。"}, {"id": 198, "start": 843.48, "end": 846.476, "text": "第二十三則是「一早掃除」。"}, {"id": 199, "start": 846.476, "end": 848.551, "text": "作者特別重視早晨。"}, {"id": 200, "start": 848.551, "end": 853.622, "text": "一天剛開始，就先完成一個自己能掌握的小行動。"}, {"id": 201, "start": 853.622, "end": 855.236, "text": "把房間整理好。"}, {"id": 202, "start": 855.236, "end": 856.849, "text": "把地面掃乾淨。"}, {"id": 203, "start": 856.849, "end": 861.92, "text": "這種感覺和一醒來就被手機訊息拖走，非常不同。"}, {"id": 204, "start": 862.1, "end": 869.196, "text": "早晨的掃除像是在告訴自己，今天不是從混亂開始，而是從秩序開始。"}, {"id": 205, "start": 869.196, "end": 871.484, "text": "第二十四則來到玄關。"}, {"id": 206, "start": 871.484, "end": 873.316, "text": "玄關是家的入口。"}, {"id": 207, "start": 873.316, "end": 878.58, "text": "鞋子散落、紙箱堆積，回家第一眼看到的就是混亂。"}, {"id": 208, "start": 878.76, "end": 884.623, "text": "相反地，一個清爽的玄關，會讓人在進門時自然產生轉換。"}, {"id": 209, "start": 884.623, "end": 887.554, "text": "外面的忙碌到這裡暫時放下。"}, {"id": 210, "start": 887.554, "end": 889.81, "text": "回到家的節奏開始了。"}, {"id": 211, "start": 889.81, "end": 891.839, "text": "第二十五則談客廳。"}, {"id": 212, "start": 891.839, "end": 896.8, "text": "作者把客廳看成家的中心，也是家人的情感中樞。"}, {"id": 213, "start": 896.98, "end": 902.352, "text": "因為這不是某一個人的私人空間，而是大家共同使用的地方。"}, {"id": 214, "start": 902.352, "end": 908.32, "text": "如果客廳長期被個人物品占滿，家人自然也比較難舒服地坐在一起。"}, {"id": 215, "start": 908.32, "end": 912.1, "text": "整理公共空間，其實也是替關係保留空間。"}, {"id": 216, "start": 912.28, "end": 914.893, "text": "第二十六則談衣櫥與衣櫃。"}, {"id": 217, "start": 914.893, "end": 918.16, "text": "作者建議隨著季節重新檢視衣物。"}, {"id": 218, "start": 918.16, "end": 921.862, "text": "因為衣服最容易藏住人的「捨不得」。"}, {"id": 219, "start": 921.862, "end": 922.733, "text": "太貴了。"}, {"id": 220, "start": 922.733, "end": 924.04, "text": "以前很喜歡。"}, {"id": 221, "start": 924.04, "end": 926.0, "text": "瘦下來可能還能穿。"}, {"id": 222, "start": 926.18, "end": 930.99, "text": "可是如果多年沒有穿，它就只是一直占據位置。"}, {"id": 223, "start": 930.99, "end": 933.967, "text": "換季是一個很自然的時間點。"}, {"id": 224, "start": 933.967, "end": 940.38, "text": "把衣服重新拿出來，看見它，判斷它是否仍然屬於現在的生活。"}, {"id": 225, "start": 940.56, "end": 942.703, "text": "第二十七則是廚房。"}, {"id": 226, "start": 942.703, "end": 945.561, "text": "作者把廚房看成生命之源。"}, {"id": 227, "start": 945.561, "end": 956.04, "text": "每天吃進身體的食物都從這裡被處理，所以廚房的乾淨不只是好看，也關係到衛生與對食物的尊重。"}, {"id": 228, "start": 956.22, "end": 959.839, "text": "最簡單的方法，就是使用後立刻清理。"}, {"id": 229, "start": 959.839, "end": 962.181, "text": "油污剛出現時很好處理。"}, {"id": 230, "start": 962.181, "end": 965.162, "text": "放了幾天，才需要花更大力氣。"}, {"id": 231, "start": 965.162, "end": 968.355, "text": "這其實又回到全書最重要的原則。"}, {"id": 232, "start": 968.355, "end": 969.42, "text": "不要累積。"}, {"id": 233, "start": 969.6, "end": 971.486, "text": "第二十八則談冰箱。"}, {"id": 234, "start": 971.486, "end": 975.677, "text": "冰箱非常容易變成「先放進去再說」的地方。"}, {"id": 235, "start": 975.677, "end": 978.401, "text": "東西愈塞愈裡面，最後忘記。"}, {"id": 236, "start": 978.401, "end": 980.287, "text": "等發現時已經過期。"}, {"id": 237, "start": 980.287, "end": 983.64, "text": "所以冰箱裡的東西也應該各得其所。"}, {"id": 238, "start": 983.82, "end": 986.384, "text": "分類、固定位置、掌握存量。"}, {"id": 239, "start": 986.384, "end": 992.499, "text": "真正的收納不是把東西藏起來，而是讓需要的東西能被看見、被使用。"}, {"id": 240, "start": 992.499, "end": 995.063, "text": "第二十九則來到廁所與浴室。"}, {"id": 241, "start": 995.063, "end": 1000.98, "text": "這些地方很私密，卻也是人每天會使用，而且能夠短暫放鬆的空間。"}, {"id": 242, "start": 1001.16, "end": 1007.482, "text": "水垢、濕氣和污漬如果每天稍微處理，就不容易變成大工程。"}, {"id": 243, "start": 1007.482, "end": 1013.569, "text": "更重要的是，就算沒有客人會看到，也願意把它整理乾淨。"}, {"id": 244, "start": 1013.569, "end": 1018.72, "text": "因為生活品質首先是給自己，不是表演給別人看。"}, {"id": 245, "start": 1018.9, "end": 1021.5, "text": "第三十則談陽台與庭院。"}, {"id": 246, "start": 1021.5, "end": 1027.88, "text": "它們是家與外界交界的地方，也很容易變成堆放雜物的空間。"}, {"id": 247, "start": 1027.88, "end": 1031.189, "text": "作者本身長期從事禪庭園設計。"}, {"id": 248, "start": 1031.189, "end": 1039.46, "text": "他談庭園時，不只是把它當成裝飾，而是把有限空間變成可以安定心情的風景。"}, {"id": 249, "start": 1039.64, "end": 1043.376, "text": "即使沒有庭院，也可以整理一個小陽台。"}, {"id": 250, "start": 1043.376, "end": 1045.036, "text": "不需要很多東西。"}, {"id": 251, "start": 1045.036, "end": 1047.527, "text": "只要讓那裡重新可以呼吸。"}, {"id": 252, "start": 1047.527, "end": 1051.678, "text": "第三十一則談工作桌，而且連抽屜也要整理。"}, {"id": 253, "start": 1051.678, "end": 1058.32, "text": "如果桌面看起來乾淨，所有東西卻全部塞進抽屜，那只是把混亂藏起來。"}, {"id": 254, "start": 1058.5, "end": 1062.606, "text": "真正的秩序，是需要東西時知道它在哪裡。"}, {"id": 255, "start": 1062.606, "end": 1065.199, "text": "這個原則同樣適用於電腦。"}, {"id": 256, "start": 1065.199, "end": 1074.06, "text": "桌面看起來乾淨，但下載資料夾裡有幾千個不知道是什麼的檔案，其實只是數位版的塞抽屜。"}, {"id": 257, "start": 1074.24, "end": 1076.895, "text": "第三十二則談打掃工具。"}, {"id": 258, "start": 1076.895, "end": 1079.067, "text": "作者的答案很簡單。"}, {"id": 259, "start": 1079.067, "end": 1081.24, "text": "工具不需要太複雜。"}, {"id": 260, "start": 1081.24, "end": 1088.48, "text": "掃把、抹布、水桶，加上真正需要的基本工具，就已經能做很多事。"}, {"id": 261, "start": 1088.48, "end": 1095.48, "text": "如果每天清潔，污垢沒有累積，也不一定需要大量強力清潔用品。"}, {"id": 262, "start": 1095.66, "end": 1098.431, "text": "這一則對現代人很有提醒作用。"}, {"id": 263, "start": 1098.431, "end": 1103.182, "text": "有時候我們還沒有開始整理，就先買了一堆整理工具。"}, {"id": 264, "start": 1103.182, "end": 1105.953, "text": "最後工具本身又成為新的雜物。"}, {"id": 265, "start": 1105.953, "end": 1111.1, "text": "真正的掃除力，不是擁有多少工具，而是有沒有真的動手。"}, {"id": 266, "start": 1111.28, "end": 1114.122, "text": "第三十三則談「款待之心」。"}, {"id": 267, "start": 1114.122, "end": 1119.806, "text": "家整理乾淨，不只是為了自己，也可以是對來訪者的體貼。"}, {"id": 268, "start": 1119.806, "end": 1121.992, "text": "款待不等於昂貴裝潢。"}, {"id": 269, "start": 1121.992, "end": 1130.08, "text": "一個乾淨的座位，一條順暢的動線，一個讓人能安心坐下來的地方，就能表達尊重。"}, {"id": 270, "start": 1130.26, "end": 1133.353, "text": "整理空間，也是在替別人著想。"}, {"id": 271, "start": 1133.353, "end": 1138.434, "text": "第三十四則，作者建議家中留一個可以合掌的地方。"}, {"id": 272, "start": 1138.434, "end": 1141.526, "text": "這不一定要有非常正式的佛壇。"}, {"id": 273, "start": 1141.526, "end": 1149.7, "text": "依每個家庭的文化與信仰，可以是一個讓人安靜、感謝、想起重要的人與事的地方。"}, {"id": 274, "start": 1149.88, "end": 1153.213, "text": "一天之中，人的注意力不斷向外。"}, {"id": 275, "start": 1153.213, "end": 1157.88, "text": "工作、訊息、新聞、需求，全都在拉著我們走。"}, {"id": 276, "start": 1157.88, "end": 1165.88, "text": "如果家裡有一個位置，可以讓自己安靜一兩分鐘，那就像替心留下了一個停靠點。"}, {"id": 277, "start": 1166.06, "end": 1170.28, "text": "最後，第三十五則談的是「心靈的依靠」。"}, {"id": 278, "start": 1170.28, "end": 1174.722, "text": "全書走到最後，作者把掃除帶回更深的地方。"}, {"id": 279, "start": 1174.722, "end": 1182.94, "text": "人不只是需要乾淨的地板和整齊的桌面，也需要某些值得尊敬、感謝與珍惜的存在。"}, {"id": 280, "start": 1183.12, "end": 1187.591, "text": "書中談到對佛壇、墓地、祖先等精神依靠的照料。"}, {"id": 281, "start": 1187.591, "end": 1192.062, "text": "即使每個人的信仰不同，仍然可以理解這個核心。"}, {"id": 282, "start": 1192.062, "end": 1195.72, "text": "真正重要的東西，不能只在心裡說重視。"}, {"id": 283, "start": 1195.9, "end": 1198.126, "text": "也需要透過行動照顧。"}, {"id": 284, "start": 1198.126, "end": 1204.803, "text": "走完這三十五則，再回頭看，會發現這本書其實一直在講同一件事。"}, {"id": 285, "start": 1204.803, "end": 1208.587, "text": "人生很多問題，都是從「累積」開始。"}, {"id": 286, "start": 1208.587, "end": 1209.7, "text": "灰塵累積。"}, {"id": 287, "start": 1209.88, "end": 1210.94, "text": "物品累積。"}, {"id": 288, "start": 1210.94, "end": 1212.001, "text": "庫存累積。"}, {"id": 289, "start": 1212.001, "end": 1213.061, "text": "資訊累積。"}, {"id": 290, "start": 1213.061, "end": 1214.121, "text": "欲望累積。"}, {"id": 291, "start": 1214.121, "end": 1216.03, "text": "未完成的事情累積。"}, {"id": 292, "start": 1216.03, "end": 1218.362, "text": "最後連焦躁也一起累積。"}, {"id": 293, "start": 1218.362, "end": 1221.967, "text": "而枡野俊明提出的方法，並不戲劇化。"}, {"id": 294, "start": 1221.967, "end": 1225.36, "text": "他沒有要求讀者突然改變整個人生。"}, {"id": 295, "start": 1225.54, "end": 1227.94, "text": "他只是一直把人帶回眼前。"}, {"id": 296, "start": 1227.94, "end": 1229.74, "text": "現在可以掃掉什麼？"}, {"id": 297, "start": 1229.74, "end": 1231.54, "text": "現在可以放回什麼？"}, {"id": 298, "start": 1231.54, "end": 1234.14, "text": "現在有什麼其實已經不需要？"}, {"id": 299, "start": 1234.14, "end": 1236.54, "text": "現在有什麼值得好好珍惜？"}, {"id": 300, "start": 1236.54, "end": 1240.74, "text": "這也是「每天把心掃乾淨」最值得帶走的地方。"}, {"id": 301, "start": 1240.92, "end": 1244.341, "text": "整理，不是追求一個永遠不亂的人生。"}, {"id": 302, "start": 1244.341, "end": 1245.749, "text": "因為那不存在。"}, {"id": 303, "start": 1245.749, "end": 1250.578, "text": "真正重要的是，當生活開始亂時，自己知道怎麼回來。"}, {"id": 304, "start": 1250.578, "end": 1254.2, "text": "如果今天想開始，不必安排一場大掃除。"}, {"id": 305, "start": 1254.38, "end": 1257.586, "text": "先選一個十分鐘可以完成的地方。"}, {"id": 306, "start": 1257.586, "end": 1259.295, "text": "也許是一個抽屜。"}, {"id": 307, "start": 1259.295, "end": 1261.218, "text": "也許是玄關的鞋子。"}, {"id": 308, "start": 1261.218, "end": 1262.714, "text": "也許是工作桌。"}, {"id": 309, "start": 1262.714, "end": 1264.638, "text": "也許是冰箱的一層。"}, {"id": 310, "start": 1264.638, "end": 1266.775, "text": "也可以不是實體空間。"}, {"id": 311, "start": 1266.775, "end": 1269.98, "text": "把手機裡幾個不需要的通知關掉。"}, {"id": 312, "start": 1270.16, "end": 1273.694, "text": "把下載資料夾裡確定不要的檔案清掉。"}, {"id": 313, "start": 1273.694, "end": 1278.475, "text": "把一件一直放著、卻知道不會再使用的物品處理掉。"}, {"id": 314, "start": 1278.475, "end": 1282.009, "text": "做完之後，不必急著挑戰下一個房間。"}, {"id": 315, "start": 1282.009, "end": 1283.88, "text": "明天，再整理一點。"}, {"id": 316, "start": 1284.06, "end": 1289.944, "text": "因為這本書真正想建立的，不是整理技巧，而是一種生活節奏。"}, {"id": 317, "start": 1289.944, "end": 1291.836, "text": "每天掃掉一點灰塵。"}, {"id": 318, "start": 1291.836, "end": 1294.567, "text": "每天減少一點不必要的東西。"}, {"id": 319, "start": 1294.567, "end": 1298.14, "text": "每天替真正重要的事，留下一點空間。"}, {"id": 320, "start": 1298.32, "end": 1303.291, "text": "當外在慢慢清爽，人的心也比較有機會回到安定。"}, {"id": 321, "start": 1303.291, "end": 1308.036, "text": "也許，這就是掃除最簡單，也最深的一層意義。"}, {"id": 322, "start": 1308.036, "end": 1310.521, "text": "不是把房間整理得完美。"}, {"id": 323, "start": 1310.521, "end": 1315.04, "text": "而是在每一次掃除裡，把自己重新帶回生活。"}], "chapters": [{"title": "開場與作者介紹｜為什麼掃除會和人生有關", "startTime": 1.5, "sceneId": 1, "count": 9}, {"title": "第一章｜「掃除」之於人生的用處", "startTime": 110.12, "sceneId": 11, "count": 39, "indexCorrection": "Excel scene 11: 先從第一章開始。"}, {"title": "第二章｜如何擁有得越少，活得越富足", "startTime": 511.872, "sceneId": 49, "count": 31}, {"title": "第三章｜每天都閃閃發亮的禪式簡單掃除術", "startTime": 826.74, "sceneId": 80, "count": 31}, {"title": "全書總結｜整理外在，也整理自己的心", "startTime": 1130.26, "sceneId": 111, "count": 12}, {"title": "結語｜今日即可開始的行動", "startTime": 1240.92, "sceneId": 123, "count": 8}]};</script><script src="app.js"></script></body></html>
