<script>
const poems=[
{id:1,title:"飲湖上初晴後雨二首・其二",tag:"山水行旅",place:"西湖晴雨",text:"水光瀲灧晴方好，山色空濛雨亦奇。\n欲把西湖比西子，淡妝濃抹總相宜。",note:"晴雨各有不同的美。東坡把西湖比作西施，寫出不受單一標準限制的欣賞眼光。",x:774,y:390},
{id:2,title:"六月二十七日望湖樓醉書五絕・其一",tag:"山水行旅",place:"望湖樓驟雨",text:"黑雲翻墨未遮山，白雨跳珠亂入船。\n卷地風來忽吹散，望湖樓下水如天。",note:"黑雲、急雨、狂風與晴湖瞬息變換，像一幅在眼前展開的動態畫。",x:269,y:523},
{id:3,title:"惠崇春江晚景二首・其一",tag:"山水行旅",place:"春江暖鴨",text:"竹外桃花三兩枝，春江水暖鴨先知。\n蔞蒿滿地蘆芽短，正是河豚欲上時。",note:"桃花、暖水、鴨子與蘆芽，讓春意從細微的觀察中浮現。",x:521,y:243},
{id:4,title:"春宵",tag:"思念人情",place:"春夜花月",text:"春宵一刻值千金，花有清香月有陰。\n歌管樓臺聲細細，鞦韆院落夜沉沉。",note:"春夜的香氣、月色與遠處樂聲稍縱即逝，值得放慢腳步珍惜。",x:667,y:527},
{id:5,title:"海棠",tag:"思念人情",place:"東風月廊",text:"東風嫋嫋泛崇光，香霧空濛月轉廊。\n只恐夜深花睡去，故燒高燭照紅妝。",note:"詩人怕海棠在夜色裡沉睡，點燭相伴，珍惜眼前相遇。",x:192,y:356},
{id:6,title:"花影",tag:"哲思小品",place:"瑤臺月影",text:"重重疊疊上瑤臺，幾度呼童掃不開。\n剛被太陽收拾去，卻教明月送將來。",note:"花影掃不掉，日落後又被月光送回來。幽默中寫出萬物自有規律。",x:698,y:311},
{id:7,title:"琴詩",tag:"哲思小品",place:"松間聽琴",text:"若言琴上有琴聲，放在匣中何不鳴？\n若言聲在指頭上，何不於君指上聽？",note:"琴聲不只在琴，也不只在手指，而是彼此相遇後才發生。",x:429,y:557},
{id:8,title:"洗兒戲作",tag:"思念人情",place:"新生祝願",text:"人皆養子望聰明，我被聰明誤一生。\n惟願孩兒愚且魯，無災無難到公卿。",note:"東坡以戲謔口吻祝願孩子平安少災；傳本有「人家／人皆」等異文。",x:356,y:215},
{id:9,title:"東欄梨花",tag:"哲思小品",place:"東欄梨雪",text:"梨花淡白柳深青，柳絮飛時花滿城。\n惆悵東欄一株雪，人生看得幾清明。",note:"梨花如雪，春色正盛，詩人由眼前景物想到人生清明的時刻有限。",x:721,y:441},
{id:10,title:"有美堂暴雨",tag:"山水行旅",place:"錢塘急雨",text:"游人腳底一聲雷，滿座頑雲撥不開。\n天外黑風吹海立，浙東飛雨過江來。\n十分瀲灩金樽凸，千杖敲鏗羯鼓催。\n喚起謫仙泉灑面，倒傾鮫室瀉瓊瑰。",note:"雷聲、黑風與越江暴雨，把有美堂上的風雨寫成天地劇場。",x:247,y:456},
{id:11,title:"百步洪二首・其一",tag:"山水行旅",place:"百步洪急流",text:"長洪鬥落生跳波，輕舟南下如投梭。水師絕叫鳧雁起，亂石一線爭磋磨。有如兔走鷹隼落，駿馬下註千丈坡。斷弦離柱箭脫手，飛電過隙珠翻荷。四山眩轉風掠耳，但見流沫生千渦。險中得樂雖一快，何異水伯誇秋河。我生乘化日夜逝，坐覺一念逾新羅。紛紛爭奪醉夢裏，豈信荊棘埋銅駝。覺來俯仰失千劫，回視此水殊委蛇。君看岸邊蒼石上，古來篙眼如蜂窠。但應此心無所住，造物雖駛如余何。回船上馬各歸去，多言嘵嘵師所呵。",note:"小舟穿越急流後，詩意轉入人生感悟：流水再快，心若無所住便不受牽制。",x:633,y:211},
{id:12,title:"石鐘山記",tag:"哲思小品",place:"湖口石鐘山",text:"《水經》云：「彭蠡之口，有石鐘山焉。」酈元以為下臨深潭，微風鼓浪，水石相搏，聲如洪鐘。是說也，人常疑之。今以鐘磬置水中，雖大風浪，不能鳴也，而況石乎？至唐李渤始訪其遺蹤，得雙石於潭上，扣而聆之，南聲函胡，北音清越，桴止響騰，餘韻徐歇。自以為得之矣。然是說也，余尤疑之。石之鏗然有聲者，所在皆是也，而此獨以鐘名，何哉？\n\n元豐七年六月丁丑，余自齊安舟行適臨汝，而長子邁將赴饒之德興尉，送之至湖口，因得觀所謂石鐘者。寺僧使小童持斧，於亂石間擇其一二扣之，硿硿焉。余固笑而不信也。至莫夜月明，獨與邁乘小舟，至絕壁下。大石側立千尺，如猛獸奇鬼，森然欲搏人；而山上棲鶻，聞人聲亦驚起，磔磔雲霄間。又有若老人咳且笑於山谷中者，或曰此鷺鶿也。余方心動欲還，而大聲發於水上，噌吰如鐘鼓不絕。舟人大恐。徐而察之，則山下皆石穴罅，不知其淺深，微波入焉，涵澹澎湃而為此也。舟回至兩山間，將入港口，有大石當中流，可坐百人，空中而多竅，與風水相吞吐，有窾坎鏜鞳之聲，與向之噌吰者相應，如樂作焉。因笑謂邁曰：「汝識之乎？噌吰者，周景王之無射也；窾坎鏜鞳者，魏莊子之歌鐘也。古之人不余欺也！」\n\n事不目見耳聞，而臆斷其有無，可乎？酈元之所見聞，殆與余同，而言之不詳；士大夫終不肯以小舟夜泊絕壁之下，故莫能知；而漁工水師雖知而不能言。此世所以不傳也。而陋者乃以斧斤考擊而求之，自以為得其實。余是以記之，蓋嘆酈元之簡，而笑李渤之陋也。",note:"親自夜訪、聽察石穴與水聲後，東坡提出：判斷應建立在親見親聞的證據上。",x:570,y:531},
{id:13,title:"前赤壁賦",tag:"哲思小品",place:"赤壁秋江",text:"壬戌之秋，七月既望，蘇子與客泛舟遊於赤壁之下。清風徐來，水波不興。舉酒屬客，誦明月之詩，歌窈窕之章。少焉，月出於東山之上，徘徊於斗牛之間。白露橫江，水光接天。縱一葦之所如，凌萬頃之茫然。浩浩乎如馮虛御風，而不知其所止；飄飄乎如遺世獨立，羽化而登仙。\n\n於是飲酒樂甚，扣舷而歌之。歌曰：「桂棹兮蘭槳，擊空明兮溯流光。渺渺兮予懷，望美人兮天一方。」客有吹洞簫者，倚歌而和之。其聲嗚嗚然，如怨如慕，如泣如訴；餘音嫋嫋，不絕如縷。舞幽壑之潛蛟，泣孤舟之嫠婦。\n\n蘇子愀然，正襟危坐而問客曰：「何為其然也？」客曰：「月明星稀，烏鵲南飛，此非曹孟德之詩乎？西望夏口，東望武昌，山川相繆，鬱乎蒼蒼，此非孟德之困於周郎者乎？方其破荊州，下江陵，順流而東也，舳艫千里，旌旗蔽空，釃酒臨江，橫槊賦詩，固一世之雄也，而今安在哉？況吾與子漁樵於江渚之上，侶魚蝦而友麋鹿，駕一葉之扁舟，舉匏樽以相屬。寄蜉蝣於天地，渺滄海之一粟。哀吾生之須臾，羨長江之無窮。挾飛仙以遨遊，抱明月而長終。知不可乎驟得，託遺響於悲風。」\n\n蘇子曰：「客亦知夫水與月乎？逝者如斯，而未嘗往也；盈虛者如彼，而卒莫消長也。蓋將自其變者而觀之，則天地曾不能以一瞬；自其不變者而觀之，則物與我皆無盡也，而又何羨乎？且夫天地之間，物各有主，苟非吾之所有，雖一毫而莫取。惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色，取之無禁，用之不竭，是造物者之無盡藏也，而吾與子之所共適。」\n\n客喜而笑，洗盞更酌。肴核既盡，杯盤狼籍。相與枕藉乎舟中，不知東方之既白。",note:"從水月變化與不變的角度，東坡安頓了客人對生命短暫的感傷，也找到人人可共享的清風明月。",x:263,y:303},
{id:14,title:"後赤壁賦",tag:"山水行旅",place:"赤壁冬夜",text:"是歲十月之望，步自雪堂，將歸於臨皋。二客從予，過黃泥之坂。霜露既降，木葉盡脫，人影在地，仰見明月，顧而樂之，行歌相答。\n\n已而嘆曰：「有客無酒，有酒無肴，月白風清，如此良夜何？」客曰：「今者薄暮，舉網得魚，巨口細鱗，狀如松江之鱸。顧安所得酒乎？」歸而謀諸婦。婦曰：「我有斗酒，藏之久矣，以待子不時之須。」於是攜酒與魚，復遊於赤壁之下。江流有聲，斷岸千尺；山高月小，水落石出。曾日月之幾何，而江山不可復識矣！予乃攝衣而上，履巉巖，披蒙茸，踞虎豹，登虯龍，攀棲鶻之危巢，俯馮夷之幽宮。蓋二客不能從焉。劃然長嘯，草木震動，山鳴谷應，風起水湧。予亦悄然而悲，肅然而恐，凜乎其不可留也。反而登舟，放乎中流，聽其所止而休焉。\n\n時夜將半，四顧寂寥。適有孤鶴，橫江東來。翅如車輪，玄裳縞衣，戛然長鳴，掠予舟而西也。須臾客去，予亦就睡。夢一道士，羽衣蹁躚，過臨皋之下，揖予而言曰：「赤壁之遊樂乎？」問其姓名，俛而不答。「嗚呼噫嘻！我知之矣。疇昔之夜，飛鳴而過我者，非子也邪？」道士顧笑，予亦驚寤。開戶視之，不見其處。",note:"冬夜重遊赤壁，山月景色與秋夜全然不同，孤鶴與夢中道士又讓真幻交錯。",x:806,y:348},
{id:15,title:"記承天寺夜遊",tag:"哲思小品",place:"承天寺月色",text:"元豐六年十月十二日夜，解衣欲睡，月色入戶，欣然起行。念無與為樂者，遂至承天寺尋張懷民。懷民亦未寢，相與步於中庭。\n\n庭下如積水空明，水中藻、荇交橫，蓋竹柏影也。何夜無月？何處無竹柏？但少閒人如吾兩人者耳。",note:"庭院月光如澄澈積水，竹柏影交錯其中。尋常風景，需要有閒心的人才能看見。",x:365,y:511},
{id:16,title:"臨江仙・夜歸臨皋",tag:"人生曠達",place:"夜歸臨皋",text:"夜飲東坡醒復醉，歸來彷彿三更。家童鼻息已雷鳴。敲門都不應，倚杖聽江聲。\n\n長恨此身非我有，何時忘卻營營？夜闌風靜縠紋平。小舟從此逝，江海寄餘生。",note:"敲不開門的深夜，東坡倚杖聽江聲，將身世煩憂化成江海寄餘生的想像。",x:465,y:219},
{id:17,title:"浣溪沙・遊蘄水清泉寺",tag:"人生曠達",place:"蘭溪清泉",text:"山下蘭芽短浸溪，松間沙路淨無泥。蕭蕭暮雨子規啼。\n\n誰道人生無再少？門前流水尚能西！休將白髮唱黃雞。",note:"清泉向西流，讓東坡想到人生不必被年歲定義。",x:739,y:517},
{id:18,title:"浣溪沙・細雨斜風作曉寒",tag:"人生曠達",place:"春日清歡",text:"細雨斜風作曉寒，淡煙疏柳媚晴灘。入淮清洛漸漫漫。\n\n雪沫乳花浮午盞，蓼茸蒿筍試春盤。人間有味是清歡。",note:"一盞茶、一盤春菜便有清歡；日常的滋味不必靠奢華才能成全。",x:265,y:396},
{id:19,title:"西江月・世事一場大夢",tag:"人生曠達",place:"中秋孤月",text:"世事一場大夢，人生幾度秋涼？夜來風葉已鳴廊，看取眉頭鬢上。\n\n酒賤常愁客少，月明多被雲妨。中秋誰與共孤光？把盞淒然北望。",note:"承認人生有無常與孤獨，也把心事寄託在中秋月色之下。",x:694,y:268},
{id:20,title:"行香子・述懷",tag:"人生曠達",place:"月下閒居",text:"清夜無塵，月色如銀。酒斟時，須滿十分。浮名浮利，休苦勞神。嘆隙中駒，石中火，夢中身。\n\n雖抱文章，開口誰親？且陶陶，樂盡天真。幾時歸去，作個閒人。對一張琴，一壺酒，一溪雲。",note:"看淡浮名浮利，想像以琴、酒、溪雲度日的閒適生活。",x:486,y:587},
{id:21,title:"滿庭芳・蝸角虛名",tag:"哲思小品",place:"江南清風",text:"蝸角虛名，蠅頭微利，算來著甚幹忙？事皆前定，誰弱又誰強？且趁閒身未老，盡放我、些子疏狂。百年裏，渾教是醉，三萬六千場。\n\n思量、能幾許？憂愁風雨，一半相妨。又何須、抵死說短論長？幸對清風皓月、苔茵展、雲幕高張。江南好，千鍾美酒，一曲《滿庭芳》。",note:"以蝸角虛名反問人生何必忙碌，轉而把日子交還給清風明月。",x:349,y:276},
{id:22,title:"水龍吟・次韻章質夫楊花詞",tag:"思念人情",place:"春柳飛絮",text:"似花還似非花，也無人惜從教墜。拋家傍路，思量卻是，無情有思。縈損柔腸，困酣嬌眼，欲開還閉。夢隨風萬里，尋郎去處，又還被、鶯呼起。\n\n不恨此花飛盡，恨西園、落紅難綴。曉來雨過，遺蹤何在？一池萍碎。春色三分，二分塵土，一分流水。細看來，不是楊花，點點是離人淚。",note:"全詞把楊花寫成離人，眼前飛絮與深切情思交疊難分。",x:772,y:413},
{id:23,title:"賀新郎・乳燕飛華屋",tag:"思念人情",place:"榴花深院",text:"乳燕飛華屋，悄無人、桐陰轉午，晚涼新浴。手弄生綃白團扇，扇手一時似玉。漸困倚、孤眠清熟。簾外誰來推繡戶，枉教人、夢斷瑤臺曲。又卻是、風敲竹。\n\n石榴半吐紅巾蹙。待浮花浪蕊都盡，伴君幽獨。穠艷一枝細看取，芳心千重似束。又恐被、秋風驚綠。若待得君來向此，花前對酒不忍觸。共粉淚、兩簌簌。",note:"榴花盛放又怕秋風，詞中人與花相伴幽獨，情感含蓄婉轉。",x:243,y:503},
{id:24,title:"蝶戀花・密州上元",tag:"思念人情",place:"山城燈市",text:"燈火錢塘三五夜。明月如霜，照見人如畫。帳底吹笙香吐麝，此般風味應無價。\n\n寂寞山城人老也。擊鼓吹簫，乍入農桑社。火冷燈稀霜露下，昏昏雪意雲垂野。",note:"回想杭州上元燈市，再看密州鄉社的寂寥，熱鬧與孤清彼此映照。",x:552,y:246},
{id:25,title:"江城子・別徐州",tag:"思念人情",place:"隋堤送別",text:"天涯流落思無窮。既相逢，卻匆匆。攜手佳人，和淚折殘紅。為問東風餘幾許？春縱在，與誰同？\n\n隋堤三月水溶溶。背歸鴻，去吳中。回望彭城，清泗與淮通。寄我相思千點淚，流不到，楚江東。",note:"離開徐州回望彭城，千點相思淚隨河流也無法抵達心上人。",x:636,y:540},
{id:26,title:"八聲甘州・寄參寥子",tag:"思念人情",place:"錢塘秋江",text:"有情風、萬里卷潮來，無情送潮歸。問錢塘江上，西興浦口，幾度斜暉？不用思量今古，俯仰昔人非。誰似東坡老，白首忘機。\n\n記取西湖西畔，正春山好處，空翠煙霏。算詩人相得，如我與君稀。約他年、東還海道，願謝公、雅志莫相違。西州路，不應回首，為我沾衣。",note:"寄語友人參寥，回憶西湖春山與知己相惜，盼望他年重逢。",x:202,y:330},
{id:27,title:"南鄉子・重九涵輝樓呈徐君猷",tag:"思念人情",place:"涵輝樓重陽",text:"霜降水痕收。淺碧鱗鱗露遠洲。酒力漸消風力軟，颼颼。破帽多情卻戀頭。\n\n佳節若為酬。但把清尊斷送秋。萬事到頭都是夢，休休。明日黃花蝶也愁。",note:"重陽登樓飲酒，東坡以破帽自嘲，也以萬事如夢消解愁緒。",x:713,y:328},
{id:28,title:"西江月・照野瀰瀰淺浪",tag:"山水行旅",place:"春溪楊橋",text:"照野瀰瀰淺浪，橫空隱隱層霄。障泥未解玉驄驕，我欲醉眠芳草。\n\n可惜一溪風月，莫教踏碎瓊瑤。解鞍欹枕綠楊橋，杜宇一聲春曉。",note:"溪水映月如瓊瑤，詩人解鞍醉眠橋畔，不忍讓馬蹄踏碎風月。",x:394,y:549},
{id:29,title:"定風波・南海歸贈王定國侍人寓娘",tag:"人生曠達",place:"嶺南歸客",text:"常羨人間琢玉郎，天應乞與點酥娘。盡道清歌傳皓齒，風起，雪飛炎海變清涼。\n\n萬里歸來年愈少，微笑，笑時猶帶嶺梅香。試問嶺南應不好？卻道：此心安處是吾鄉。",note:"柔奴歷經遠謫仍笑答「此心安處是吾鄉」，寫出安頓內心的力量。",x:394,y:204},
{id:30,title:"惠州一絕・食荔枝",tag:"山水行旅",place:"羅浮荔枝",text:"羅浮山下四時春，盧橘楊梅次第新。\n日啖荔枝三百顆，不辭長作嶺南人。",note:"以嶺南鮮果寫出隨遇而安的豁達；末句另有「不妨」異文傳本。",x:708,y:459}

const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),field=document.querySelector('#island-field'),labels=document.querySelector('#island-labels');const visited=new Set(JSON.parse(localStorage.getItem('dongpo-visited')||'[]').filter(id=>id>=1&&id<=30));let currentFilter='全部',query='',yaw=-.35,tilt=.76,zoom=1.23,drag=null,view={w:1,h:1,scale:1};
for(const p of poems){const b=document.createElement('button');b.className='island-label3d';b.dataset.id=p.id;b.innerHTML=`<b>${String(p.id).padStart(2,'0')}</b>${p.title.replace(/・.*/, '')}`;b.setAttribute('aria-label',p.title+'，開啟詩詞');b.onclick=()=>openPoem(p);labels.append(b)}
function resizeWorld(){const box=field.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);view.w=box.width;view.h=box.height;canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);view.scale=Math.min(box.width/970,box.height/690)*1.08*zoom;document.querySelector('#zoom-level').textContent=Math.round(zoom*100)+'%';paintWorld()}

function visible(p){return(currentFilter==='全部'||p.tag===currentFilter)&&(!query||`${p.title}${p.tag}${p.place}${p.text}${p.note}`.toLowerCase().includes(query.toLowerCase()))}
