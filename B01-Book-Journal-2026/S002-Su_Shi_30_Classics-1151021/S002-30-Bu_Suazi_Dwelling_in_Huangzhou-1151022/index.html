  <link rel="stylesheet" href="./assets/main.css">
  <script>window.EPISODE_SETTINGS = {
    links: {
      home: './index.html', reading: './reading.html', chapters: './reading.html#chapter-index',
      youtubeWithSubtitles: 'https://youtu.be/5KRZFipadPo', // 請在此填入有字幕版 YouTube 網址
      youtubeWithoutSubtitles: 'https://youtu.be/5KRZFipadPo' // 請在此填入無字幕版 YouTube 網址
    },
    assets: { base: './', coverImage: './assets/images/cover.webp', sceneImagePattern: './assets/images/IMG{id}.webp', narrationAudio: './assets/audio/narration.mp3' }
  };
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-episode-link]').forEach(function (link) {
      var url = String(window.EPISODE_SETTINGS.links[link.dataset.episodeLink] || '').trim();
      var isYouTube = /^https:\/\/(?:(?:www|m)\.)?youtube\.com\//i.test(url) || /^https:\/\/youtu\.be\//i.test(url);
      if (isYouTube) {
        link.href = url;
        link.removeAttribute('aria-disabled');
      } else {
        link.href = '#';
        link.setAttribute('aria-disabled', 'true');
        link.addEventListener('click', function (event) { event.preventDefault(); });
      }
    });
  });
  </script>
</head>
