<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10191e">
  <title>巨頭的殞落｜第03集 A03-Nokia</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e3bb57;
      --ink: #f5f4ef
    }

    * {
      box-sizing: border-box
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #090f15;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif
    }

    .cover-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 0;
      background: #090f15
    }

    .cover-frame {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #111
    }

    .cover-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .cover-actions {
      position: absolute;
      z-index: 2;
      left: clamp(14px, 2.4vw, 34px);
      bottom: clamp(14px, 2.4vw, 34px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      width: auto;
      max-width: calc(100% - 28px);
      padding: 11px;
      border: 1px solid #ffffff55;
      border-radius: 14px;
      background: #08121bd9;
      box-shadow: 0 8px 24px #0007;
      backdrop-filter: blur(8px)
    }

    .cover-button {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid #ffffff80;
      border-radius: 999px;
      background: #172935e8;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      transition: transform .16s, border-color .16s, background .16s
    }

    .cover-button:hover,
    .cover-button:focus-visible {
      transform: translateY(-1px);
      border-color: var(--gold);
      background: #263b49;
      outline: 3px solid #e3bb5780;
      outline-offset: 2px
    }

    .cover-button.primary {
      border-color: var(--gold);
      background: var(--gold);
      color: #14212a
    }

    .cover-button.primary:hover,
    .cover-button.primary:focus-visible {
      background: #f0d184
    }

    @media(max-width:560px) {
      .cover-page {
        place-items: start center
      }

      .cover-frame {
        width: 100vw;
        margin-top: 0
      }

      .cover-actions {
        left: 10px;
        bottom: 10px;
        gap: 6px;
        max-width: calc(100% - 20px);
        padding: 8px
      }

      .cover-button {
        min-height: 36px;
        padding: 7px 9px;
        font-size: 12px
      }
    }
  </style>
</head>

<body>
  <main class="cover-page">
    <section class="cover-frame" aria-label="第03集封面">
      <h1 class="sr-only">巨頭的殞落｜第03集 A03-Nokia 諾基亞：在燃燒的平台上跳錯了方向</h1><img class="cover-image" src="cover.webp"
        alt="巨頭的殞落；第03集 A03-Nokia 諾基亞：在燃燒的平台上跳錯了方向">
      <nav class="cover-actions" aria-label="首頁連結"><a class="cover-button primary"
          href="website/index.html">進入動態敘事</a><!-- 同一支影片提供短網址與標準網址 --><a class="cover-button"
          href="https://youtu.be/8o25mGI2_zc" target="_blank" rel="noopener noreferrer">YouTube 影片（短網址）</a><a
          class="cover-button" href="https://www.youtube.com/watch?v=8o25mGI2_zc" target="_blank"
          rel="noopener noreferrer">YouTube 影片（標準網址）</a></nav>
    </section>
  </main>
</body>

</html>
