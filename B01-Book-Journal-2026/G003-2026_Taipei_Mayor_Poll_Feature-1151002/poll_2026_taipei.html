<header><div class="wrap"><h1>2026 台北市長民調大型專題</h1><div class="sub">蔣萬安 × 沈伯洋｜公開民調、內參、網路投票與 AI 模擬資料庫｜更新基準：2026/10/01</div><div class="notice">閱讀原則：正式抽樣民調、地方內參、網路自行投票與 AI 模擬採不同方法，本專題分開呈現，不把不同性質資料直接平均。藍色代表蔣萬安／中國國民黨；綠色代表沈伯洋／民主進步黨。</div></div></header>

 {id:'p3',date:'6/21–22',name:'震傳媒／山水民意研究',exec:'山水民意研究',chiang:55.2,shen:27.5,und:17.3,n:'1,074',moe:'±2.99%',method:'CATI；住宅電話系統抽樣加尾2碼隨機',source:'https://news.tvbs.com.tw/politics/3239410',note:'另有勝選看好度題目：蔣70.9%、沈15.0%；看好度不是支持度，故不併入支持度趨勢。'},
 {id:'p4',date:'8/5–7',name:'TPOC台灣議題研究中心',exec:'TPOC',chiang:48.4,shen:33,und:18.6,n:'1,099',moe:'±2.96%',method:'台北市20歲以上選民電話調查',source:'https://www.businesstoday.com.tw/article/category/183027/post/202608150008/',note:'與5、6月不同機構，不能把差距縮小直接視為同一追蹤樣本的支持度增減。'},
 {id:'p5',date:'9/16–18',name:'信民兩岸研究協會',exec:'畢肯市場研究／戴立安設計分析',chiang:41.7,shen:40.5,und:6,n:'1,076',moe:'±3.0%',method:'市話752＋手機324；CATI雙架構',source:'https://tw.news.yahoo.com/%E6%88%B4%E7%AB%8B%E5%AE%89%E4%BF%A1%E6%B0%91%E5%8D%94%E6%9C%83%E5%85%AC%E5%B8%83%E5%8F%B0%E5%8C%97%E5%B8%82%E9%95%B7%E9%81%B8%E8%88%89%E6%B0%91%E8%AA%BF-%E8%94%A3%E8%90%AC%E5%AE%89%E6%94%AF%E6%8C%81%E5%BA%A6417%EF%BC%85%E3%80%81%E6%B2%88%E4%BC%AF%E6%B4%8B405%EF%BC%85-014942378.html',note:'兩人差1.2個百分點，小於該調查公布的±3.0%抽樣誤差；另有勝選看好度，應與支持度分開閱讀。'}
];

const tabs=document.getElementById('tabs'),main=document.getElementById('main');pages.forEach(([id,label],i)=>{tabs.insertAdjacentHTML('beforeend',`<button class="tab ${i===0?'active':''} ${id==='media'?'media-feature':''}" data-id="${id}">${label}</button>`);main.insertAdjacentHTML('beforeend',`<section id="${id}" class="page ${i===0?'active':''}"></section>`)});

function pollTable(){return `<div class="table-wrap"><table><thead><tr><th>調查日期</th><th>民調／執行</th><th>${party}</th><th>${party2}</th><th>差距</th><th>樣本</th><th>誤差</th></tr></thead><tbody>${polls.map(p=>`<tr><td>${p.date}</td><td><b>${p.name}</b><div class="small">${p.exec}</div></td><td class="blue"><b>${p.chiang}%</b></td><td class="green"><b>${p.shen}%</b></td><td><b>${(p.chiang-p.shen).toFixed(1)}</b></td><td>${p.n}</td><td>${p.moe}</td></tr>`).join('')}</tbody></table></div>`}

function lineChart(mode){let vals=mode==='gap'?polls.map(p=>p.chiang-p.shen):polls.flatMap(p=>[p.chiang,p.shen]);let max=mode==='gap'?30:65,min=0;let W=100,H=100;let xs=polls.map((_,i)=>8+i*21);function y(v){return 94-(v-min)/(max-min)*84}function series(key,color){let a=polls.map((p,i)=>[xs[i],y(key==='gap'?p.chiang-p.shen:p[key])]);return a.slice(0,-1).map((pt,i)=>{let nx=a[i+1];let dx=nx[0]-pt[0],dy=nx[1]-pt[1],len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="line" style="left:${pt[0]}%;top:${pt[1]}%;width:${len}%;background:${color};transform:rotate(${ang}deg)"></div>`}).join('')+a.map((pt,i)=>`<div class="point" title="${polls[i].date}" style="left:${pt[0]}%;top:${pt[1]}%;background:${color}"></div>`).join('')}return `<div class="chart"><div class="plot">${[0,20,40,60].filter(v=>v<=max).map(v=>`<div class="gridline" style="top:${y(v)}%">${v}%</div>`).join('')}${mode==='gap'?series('gap','#9a6b00'):series('chiang','#1e90ff')+series('shen','#169b52')}${polls.map((p,i)=>`<div class="xlabel" style="left:${xs[i]}%"><b>${p.date}</b><br>${p.name.replace('台灣議題研究中心','').replace('民調中心','')}</div>`).join('')}</div></div>`}
document.getElementById('trend').innerHTML=`<div class="card"><h2>支持度趨勢折線圖</h2><div class="legend"><span><i class="dot" style="background:#1e90ff"></i>蔣萬安</span><span><i class="dot" style="background:#169b52"></i>沈伯洋</span></div>${lineChart('trend')}<p class="meta">此圖把不同機構的公開數值依時間排列，方便閱讀，但不是單一機構追蹤線。</p></div>`;
document.getElementById('gap').innerHTML=`<div class="card"><h2>蔣萬安－沈伯洋｜差距變化</h2>${lineChart('gap')}<div class="bars" style="margin-top:28px">${polls.map(p=>{let g=(p.chiang-p.shen).toFixed(1);return `<div class="barrow"><b>${p.date}</b><div class="track"><div class="fill" style="width:${g/30*100}%;background:#ffd84d"></div></div><b>${g}點</b></div>`}).join('')}</div><p class="meta">差距為兩位候選人支持度百分點相減；不代表勝選機率。</p></div>`;
polls.forEach((p,i)=>{document.getElementById(p.id).innerHTML=`<div class="card"><div class="poll-title"><div><span class="pill">第${i+1}筆正式民調</span><h2>${p.date}｜${p.name}</h2></div><a href="${p.source}" target="_blank" rel="noopener">查看來源 ↗</a></div><div class="score"><div class="scorebox lead-blue">${party}<div class="big blue">${p.chiang}%</div></div><div class="scorebox lead-green">${party2}<div class="big green">${p.shen}%</div></div><div class="scorebox"><b>兩者差距</b><div class="big">${(p.chiang-p.shen).toFixed(1)}</div><div>百分點</div></div></div><div class="grid" style="margin-top:16px"><div><h3>調查規格</h3><p class="meta">有效樣本：${p.n}<br>抽樣誤差：${p.moe}<br>方法：${p.method}<br>未表態／其他：約 ${p.und}%</p></div><div><h3>閱讀提醒</h3><p class="meta">${p.note}</p></div></div><h3>支持度比例</h3><div class="bars"><div class="barrow"><span>蔣萬安</span><div class="track"><div class="fill" style="width:${p.chiang}%;background:#1e90ff"></div></div><b>${p.chiang}%</b></div><div class="barrow"><span>沈伯洋</span><div class="track"><div class="fill" style="width:${p.shen}%;background:#169b52"></div></div><b>${p.shen}%</b></div></div></div>`});
const districts=[['北投','蔣萬安','9月信民調查數值較高'],['士林','沈伯洋','52.2% vs 37.0%（9月信民）'],['大同','蔣萬安','9月信民調查數值較高；5月部分調查呈不同結果'],['中山','沈伯洋','9月信民調查數值較高'],['松山','蔣萬安','9月信民調查數值較高'],['信義','蔣萬安','49.3% vs 25.3%（9月信民）'],['內湖','沈伯洋','9月信民調查數值較高'],['南港','沈伯洋','9月信民調查數值較高'],['中正','沈伯洋','9月信民調查數值較高'],['萬華','沈伯洋','9月信民調查數值較高'],['大安','沈伯洋','9月信民調查數值較高'],['文山','蔣萬安','9月信民調查數值較高']];

document.getElementById('media').addEventListener('click',e=>{let b=e.target.closest('.filterbtn');if(!b)return;document.querySelectorAll('#media .filterbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderMedia(b.dataset.media==='上報'?'__none__':b.dataset.media);});
renderMedia();
document.getElementById('sources').innerHTML=`<div class="grid">${polls.map(p=>`<div class="card source-card"><h3>${p.date}｜${p.name}</h3><p class="meta">執行／分析：${p.exec}<br>樣本：${p.n}｜誤差：${p.moe}<br>${p.method}</p><a href="${p.source}" target="_blank" rel="noopener">開啟公開來源 ↗</a></div>`).join('')}<div class="card source-card"><h3>資料方法說明</h3><p class="meta">① 支持度與勝選看好度分開。② 不把網路投票與電話抽樣平均。③ AI模擬單獨呈現。④ 行政區若公開來源沒有逐區百分比，就只標示公開可驗證的領先方向。⑤ 不以民調數字推導選舉結果。⑥ 9月媒體資料庫的「偏沈／偏蔣」是文本框架編碼，不是政治評分；轉載稿需去重。</p></div></div>`;
tabs.addEventListener('click',e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.id).classList.add('active');window.scrollTo({top:document.querySelector('.tabs').offsetTop,behavior:'smooth'})});
</script></body></html>
