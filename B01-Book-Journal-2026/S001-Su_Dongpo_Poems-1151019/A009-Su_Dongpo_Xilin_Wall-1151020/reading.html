<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b2e">
  <title>千年後，我們仍記得蘇東坡｜《題西林壁》</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/episode.css">
  <script>
    window.EPISODE_SETTINGS = {
      links: { home: './index.html' },
      assets: { base: './', coverImage: 'assets/images/cover.webp', sceneImagePattern: 'assets/images/{id}.webp', narrationAudio: 'assets/audio/narration.mp3' }
    };
  </script>
  <script defer src="./data/timeline-runtime.js"></script>
  <script defer src="./assets/js/timeline-core.js"></script>
  <script defer src="./assets/js/player.js"></script>
</head>
<body data-page="reader">
  <main class="reader-page">
    <header class="reader-header">
      <a class="back-link" href="./index.html">← 回到首頁</a>
      <div><p class="eyebrow">千年後，我們仍記得蘇東坡</p><h1>蘇軾《題西林壁》</h1></div>
      <span class="reader-duration" id="reader-count">21 鏡・5 章</span>
    </header>
    <section class="reader-shell" id="reader-shell" aria-label="旁白與分鏡同步播放器">
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage-art" id="stage-art" aria-live="off">
          <img class="frame-art frame-art-previous" id="previous-image" alt="" aria-hidden="true">
          <img class="frame-art frame-art-current" id="current-image" alt="">
        </div>
        <div class="frame-chapter" id="frame-chapter" aria-live="off"></div>
        <div class="frame-intro" id="frame-intro" aria-live="off"></div>
        <div class="frame-subtitle" id="frame-subtitle" aria-live="off"><span id="subtitle-text"></span></div>
        <button class="cover-start" id="cover-start" type="button" aria-label="開始播放旁白與閱讀">
          <img src="./assets/images/cover.webp" alt="">
          <span class="cover-shade"></span>
          <span class="cover-start-copy"><b aria-hidden="true">▶</b><strong>開始閱讀</strong><small>21 個分鏡・5 個章節・原速旁白</small></span>
        </button>
      </div>
      <audio class="master-audio" id="master-audio" src="./assets/audio/narration.mp3" preload="metadata"></audio>
      <div class="player-panel">
        <div class="seek-row">
          <span class="time-readout" id="time-now">00:00</span>
          <input class="seek-slider" id="seek-slider" aria-label="播放時間滑桿" type="range" min="0" max="286740" step="1" value="0">
          <span class="time-readout" id="time-end">04:47</span>
        </div>
        <div class="control-row">
          <button type="button" id="previous-chapter">上一章</button>
          <button type="button" id="previous-scene">前一鏡</button>
          <button type="button" class="play-control" id="play-toggle">播放</button>
          <button type="button" id="next-scene">下一鏡</button>
          <button type="button" id="next-chapter">下一章</button>
          <button type="button" id="mute-toggle">靜音</button>
          <label class="volume-control">音量 <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量"></label>
          <button type="button" id="fullscreen-toggle">全螢幕</button>
          <button type="button" id="restart-button">從頭重播</button>
        </div>
        <div class="playback-status" aria-live="polite">
          <span id="playback-label">尚未播放</span><span>播放速度 1.0×</span><span id="scene-label">IMG001</span><span id="chapter-label">不識廬山真面目</span>
        </div>
        <p class="playback-error" id="playback-error" role="status" hidden></p>
      </div>
    </section>
    <section class="chapter-section" id="chapter-index" aria-labelledby="chapter-heading">
      <p class="eyebrow">CHAPTER INDEX</p><h2 id="chapter-heading">章節索引</h2>
      <div class="chapter-list" id="chapter-list"></div>
    </section>
    <button class="sync-debug-toggle" id="debug-toggle" type="button" aria-controls="sync-debug-panel" aria-expanded="false">查看同步資訊</button>
    <section class="sync-debug" id="sync-debug-panel" hidden>
      <p>鏡頭與章節起點依 Excel，字幕原文與時碼依 SRT；播放畫面由 MP3 絕對時間驅動。SRT 文字尚未逐句人工聽辨，請以 QA 報告標示為準。</p>
      <p id="debug-time"></p>
    </section>
  </main>
</body>
</html>
