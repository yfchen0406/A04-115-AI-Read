<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>男聲～睿智平實｜無限機器</title><link rel="stylesheet" href="../styles.css"></head><body class="reading"><header class="topbar"><a href="../index.html">← 返回首頁</a><h1>無限機器：Gemini 推手哈薩比斯的超級智慧長征</h1><span>男聲～睿智平實</span></header><main><div class="stage-wrap"><section class="stage"><img id="sceneImage" src="images/001.webp" alt="第 1 鏡"><div id="stageChapter" class="stage-chapter"></div><div id="subtitle" class="stage-caption"></div></section></div><section class="player"><audio id="audio" preload="metadata" src="audio/narration.mp3"></audio><input id="seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="閱讀進度"><div class="controls"><button id="back">上一鏡</button><button id="play">播放旁白</button><button id="forward">下一鏡</button></div><div id="status" class="status">正在載入時間軸…</div></section><section class="chapters"><h2>章節索引</h2><div id="chapterList" class="chapter-list"></div></section></main><script>window.READER_CONFIG={"label": "男聲～睿智平實", "version": "D"};window.READER_DATA={"title":"無限機器：Gemini推手哈薩比斯的超級智慧長征","fps":30,"totalDuration":965.04,"audio":{"src":"audio/narration.mp3"},"captions":[{"start":1.5,"end":11.853,"text":"前言什麼樣的人，會花費數十年的時間追問智慧的本質，並最終掌握 Google 最核心的人工智慧研究力量？"},{"start":11.853,"end":19.46,"text":"這不是一個傳統的商業成功故事，而是一場人類試圖創造另一種智慧的史詩長征。"},{"start":19.64,"end":33.68,"text":"從倫敦北部的西洋棋神童，到獲頒諾貝爾化學獎的頂尖科學家，德米斯·哈薩比斯（Demis Hassabis）用他半生的執念，將科學幻想推向了現實。"},{"start":33.86,"end":49.34,"text":"《無限機器》（The Infinity Machine）這本書所記錄的，正是哈薩比斯與他創立的 DeepMind，如何從一家不被看好的倫敦初創實驗室，一步步發動重塑人類文明的超級智慧革命。"},{"start":49.52,"end":64.24,"text":"作者與本書視角本書作者塞巴斯蒂安·馬拉比（Sebastian Mallaby）是一位資深的歷史學家與傳記作家，以客觀且深度的紀實視角著稱。"},{"start":64.42,"end":75.506,"text":"馬拉比在歷時三年的深入追蹤中，與哈薩比斯進行了長達三十個小時的私下對話，並訪談了超過一百位科技與商業巨頭。"},{"start":75.506,"end":87.22,"text":"透過這座由文字構築的側寫，讀者得以穿透矽谷的熱潮與公關修辭，直視科技崇拜、資本誘惑與人類終極命運之間的深刻思辨。"},{"start":87.4,"end":100.32,"text":"第一部分：思想與起源一九七六年七月，哈薩比斯出生於倫敦北部一個多元文化的普通家庭，母親是新加坡華裔，父親是希臘塞浦路斯人。"},{"start":100.5,"end":118.02,"text":"哈薩比斯在四歲時展現出驚人的西洋棋天賦，五歲便跨級參加比賽，九歲時擔任英格蘭十一歲以下國家隊隊長，十三歲便晉升為國際象棋大師，全球同齡排名第二。"},{"start":118.2,"end":130.51,"text":"高強度的賽事與勝負壓力貫穿了他的童年，父親總是告誡他要付出絕對百分之百的努力，這種極致的驅動力深刻塑造了他日後的性格。"},{"start":130.51,"end":141.36,"text":"十一歲那年，在列支敦士登的一場長達十小時的殘局對弈中，哈薩比斯因疲憊誤判認輸，遭到現場勝者與旁人的嘲笑。"},{"start":141.54,"end":154.34,"text":"這場崩潰帶來了關鍵的頓悟：一群極其聰明的大腦將生命耗費在六十四個棋格的博弈中，難道不該把智力用在解開科學與醫學等更崇高的事業上嗎？"},{"start":154.52,"end":157.32,"text":"自此，哈薩比斯將目光轉向電腦。"},{"start":157.32,"end":172.44,"text":"他在十二歲時用比賽獎金買下電腦，並閱讀了大衛·利維（David Levy）撰寫的棋藝程式手冊，接觸到克勞德·香農（Claude Shannon）的一般通用計算機理論。"},{"start":172.62,"end":183.38,"text":"十二歲的哈薩比斯成功寫出了黑白棋遊戲《火與水》（Fire and Water），親眼見證了程式碼能夠產生擊敗人類的動態智力。"},{"start":183.56,"end":198.04,"text":"十五歲時，哈薩比斯憑藉改編遊戲作品打破常規，闖入歐洲頂尖電玩公司牛蛙公司（Bullfrog Productions），結識了鬼才創辦人彼得·莫利紐克斯（Peter Molyneux）。"},{"start":198.22,"end":210.34,"text":"他與團隊共同開發了著名的模擬遊戲《主題公園》（Theme Park），將複雜的人類情感與偏好模擬寫入有限狀態機，大獲商業成功。"},{"start":210.52,"end":222.4,"text":"期間，莫利紐克斯贈予他普立茲獎名著《哥德爾、艾舍爾、巴赫》（Gödel, Escher, Bach，簡稱 GEB），這本書徹底點燃了他的意識覺醒。"},{"start":222.58,"end":233.86,"text":"侯世達在書中提出，人類大腦是一個遵從物理法則的生物實體，意識與智力的關鍵不在於物質構成，而在於運作模式。"},{"start":234.04,"end":249.48,"text":"結合艾薩克·阿西莫夫（Isaac Asimov）與伊恩·班克斯（Iain Banks）的科幻小說，哈薩比斯確立了畢生使命：打造通用人工智慧（Artificial General Intelligence，簡稱 AGI）。"},{"start":249.66,"end":256.328,"text":"十八歲時，哈薩比斯拒絕了牛蛙公司高額留任支票，前往劍橋大學主修電腦科學。"},{"start":256.328,"end":266.7,"text":"受電影《生命的故事》（Life Story）中沃森與克里克發現 DNA 雙螺旋結構的激勵，他立志要在科學史上留下印記。"},{"start":266.88,"end":278.2,"text":"他意識到物理學領域已被愛因斯坦與費曼等巨匠探索極致，而人工智慧將是幫助人類探索宇宙終極奧秘的最強大工具。"},{"start":278.38,"end":292.58,"text":"在劍橋期間，哈薩比斯結識了考場成績優異的戴維·西爾弗（David Silver），兩人共同質疑當時主流的符號人工智慧（Symbolic AI）與一階邏輯的局限性。"},{"start":292.76,"end":307.72,"text":"在約翰·多格曼（John Daugman）教授的小組輔導課上，哈薩比斯迎來了涅槃時刻：資訊是現實的基本單位，而能自主學習與歸納的機器將是理解現實的最強工具。"},{"start":307.9,"end":321.54,"text":"一九九八年畢業後，二十二歲的哈薩比斯與西爾弗等夥伴創立了萬靈藥工作室（Elixir Studios），試圖藉由遊戲開發積累資金與人工智慧技術。"},{"start":321.72,"end":335.96,"text":"他們開發了充滿雄心的政治模擬遊戲《共和國：革命》（Republic: The Revolution），然而硬體效能的限制與過度激勵團隊導致的落差，讓公司面臨重重挫折。"},{"start":336.14,"end":347.049,"text":"二零零五年萬靈藥工作室關閉，這場失敗讓哈薩比斯精疲力竭，但也讓他深刻反思領導魅力與現實約束之間的微妙界限。"},{"start":347.049,"end":355.9,"text":"為了尋找人工智慧的終極範式，哈薩比斯決定重返學術界，前往倫敦大學學院攻讀神經科學博士。"},{"start":356.08,"end":377.84,"text":"在埃莉諾·馬圭爾（Eleanor Maguire）的指導下，他與達山·庫馬蘭（Dharshan Kumaran）在《美國國家科學院院刊》發表突破性論文，證明海馬迴受損的失憶症患者無法想像新體驗，揭示記憶與想像力共享相同神經網路，世界的結構本質上是心智的模擬建構。"},{"start":378.02,"end":391.46,"text":"第二部分：DeepMind 的形成與突破二零零九年完成博士後研究時，哈薩比斯在蓋茨比計算神經科學中心遇見了來自紐西蘭的沙恩·萊格（Shane Legg）。"},{"start":391.64,"end":401.28,"text":"萊格博士論文題為《機器超級智慧》（Machine Super Intelligence），並最早引入了通用人工智慧 AGI 這個術語。"},{"start":401.46,"end":412.34,"text":"隨後，透過弟弟的介紹，哈薩比斯結識了充滿社會運動熱情的穆斯塔法·蘇萊曼（Mustafa Suleyman），三人組成鐵三角。"},{"start":412.52,"end":423.76,"text":"二零一零年，DeepMind 在倫敦羅素廣場正式成立，目標是建立一個以使命為驅動的人工智慧曼哈頓計劃（Manhattan Project）。"},{"start":423.94,"end":430.727,"text":"在早期籌資過程中，主流學術界與倫敦風投大多將 AGI 視為天方夜譚。"},{"start":430.727,"end":440.06,"text":"倫敦金融家戴維·甘蒙（David Gammon）因懷有尋找上帝演算法的信仰而率先注入資金。"},{"start":440.24,"end":450.48,"text":"哈薩比斯遠赴舊金山奇點峰會，利用西洋棋中象與馬的博弈張力吸引了億萬富翁彼得·蒂爾（Peter Thiel）。"},{"start":450.66,"end":460.82,"text":"蒂爾的矽谷創投 Founders Fund 與盧克·諾塞克（Luke Nosek）看重哈薩比斯的使命感，於二零一零年底注入二百三十萬美元。"},{"start":461.0,"end":472.76,"text":"獲得資金後，DeepMind 在羅素廣場的小辦公室裡招募頂尖科學家，建立起重視信念、給予探索時間與包容技術奇才的獨特文化。"},{"start":472.94,"end":483.9,"text":"弗拉基米爾·姆尼赫（Volodymyr Mnih）於二零一三年加入，成為融合深度學習（Deep Learning）與強化學習（Reinforcement Learning）的核心推手。"},{"start":484.08,"end":491.955,"text":"深度學習擅長模式識別但缺乏主動性，強化學習則透過試錯獲取經驗但難以處理無結構數據。"},{"start":491.955,"end":505.4,"text":"在戴維·西爾弗的建議下，姆尼赫引入了模仿大腦海馬迴機制的記憶回放（Experience Replay）技術，解決了數據非隨機性導致的訓練紊亂。"},{"start":505.58,"end":516.94,"text":"團隊打造出深度 Q 網路（Deep Q-Network，簡稱 DQN），並選擇雅達利（Atari）經典電子遊戲作為通用測試沙盒。"},{"start":517.12,"end":529.88,"text":"二零一三年夏天，姆尼赫的智能體在《乒乓》（Pong）與《打磚塊》（Breakout）中展現出擊穿磚牆通道的超人類策略，並於太浩湖 NIPS 大會震撼全場。"},{"start":530.06,"end":532.891,"text":"這一成功吸引了矽谷巨頭的強烈關注。"},{"start":532.891,"end":545.38,"text":"埃隆·馬斯克與拉里·佩奇（Larry Page）在飛機上探討 AI 威脅，佩奇隨即指派工程主管艾倫·尤斯塔斯（Alan Eustace）接觸 DeepMind。"},{"start":545.56,"end":554.56,"text":"面對 Facebook 創辦人扎克伯格（Mark Zuckerberg）的高價挖角，哈薩比斯選擇了真正理解 AI 科學使命的佩奇。"},{"start":554.74,"end":560.877,"text":"二零一四年一月，Google 以六點五億美元正式收購 DeepMind。"},{"start":560.877,"end":568.82,"text":"哈薩比斯在收購協議中堅持保留倫敦總部、研究自主權，並要求設立獨立的倫理與安全審查委員會。"},{"start":569.0,"end":574.765,"text":"併入 Google 後，哈薩比斯將下一個高山定為古老的圍棋。"},{"start":574.765,"end":581.56,"text":"圍棋棋盤狀態高達 10 的 170 次方，被視為計算機無法逾越的直覺高地。"},{"start":581.74,"end":594.54,"text":"戴維·西爾弗與黃士傑（Aja Huang）主導研發 AlphaGo，將策略網路、價值網路與蒙特卡洛樹搜尋（Monte Carlo Tree Search，簡稱 MCTS）深度結合。"},{"start":594.72,"end":602.983,"text":"策略網路負責模仿人類直覺修剪搜尋樹，價值網路評估局勢獲勝機率，樹搜尋則進行慢思考內省。"},{"start":602.983,"end":613.36,"text":"二零一五年十月，AlphaGo 秘密以五比零擊敗歐洲圍棋冠軍樊麾，震撼刊登於《自然》（Nature）雜誌封面。"},{"start":613.54,"end":619.311,"text":"二零一六年三月，AlphaGo 在韓國首爾挑戰十八次世界冠軍李世石。"},{"start":619.311,"end":627.18,"text":"在第二局中，AlphaGo 下出了震撼圍棋界的第三十七步棋，展現出超越人類傳統棋譜的創造力。"},{"start":627.36,"end":639.773,"text":"儘管李世石在第四局以第七十八步「神之一手」扳回一城，AlphaGo 最終仍以四比一獲勝，宣告人工智慧邁入全新紀元。"},{"start":639.773,"end":643.32,"text":"第三部分：科學成果與超級智慧競賽"},{"start":643.5,"end":652.309,"text":"AlphaGo 的勝利只是開始，西爾弗在蜜月期間構想出完全擺脫人類知識束縛的 AlphaGo Zero。"},{"start":652.309,"end":659.5,"text":"該系統僅憑隨機走法與自我對弈，在短短幾天內便超越了累積數千年人類智慧的舊版模型。"},{"start":659.68,"end":674.6,"text":"隨後問世的 AlphaZero 更一舉精通了西洋棋、日本將棋與圍棋，打破了莫拉維克悖論（Moravec's paradox），證明通用強化學習演算法能自我湧現出高超的策略與直覺。"},{"start":674.78,"end":682.298,"text":"哈薩比斯隨即將戰線推向生命科學的核心：困擾生物學界五十年的蛋白質摺疊難題。"},{"start":682.298,"end":690.02,"text":"一條氨基酸鏈可能摺疊成 10 的 300 次方種構型，傳統晶體學實驗需耗費數年時間。"},{"start":690.2,"end":699.88,"text":"二零一七年，約翰·江珀（John Jumper）加入 DeepMind 蛋白質團隊，與安德魯·西內爾（Andrew Senior）共同推進研發。"},{"start":700.06,"end":711.46,"text":"團隊在 CASP13 競賽中憑藉 AlphaFold 1 奪冠後，勇於跳下懸崖進行架構重構，轉向直接預測三維座標的直接摺疊路線。"},{"start":711.64,"end":719.437,"text":"江珀團隊融合了 Transformer 深度學習架構與生物演化數據，打造出 AlphaFold 2。"},{"start":719.437,"end":725.2,"text":"二零二零年十一月，AlphaFold 2 在 CASP14 競賽中取得 92."},{"start":725.38,"end":731.368,"text":"4 的中位數得分，達到了與 X 射線晶體學實驗相當的原子級精確度。"},{"start":731.368,"end":745.14,"text":"這一突破解決了生物學的費馬大定理，DeepMind 將兩億個蛋白質結構免費開放給全球科學界，哈薩比斯與江珀也因此榮獲二零二四年諾貝爾化學獎。"},{"start":745.32,"end":750.687,"text":"然而，正當 DeepMind 在科學領域登頂時，AI 競賽的格局正發生劇烈震盪。"},{"start":750.687,"end":760.84,"text":"二零一七年，Google 研究團隊發表了劃時代的論文《Attention Is All You Need》，提出了 Transformer 神經網路架構。"},{"start":761.02,"end":773.22,"text":"離職創辦 OpenAI 的伊利亞·蘇茨克維與山姆·奧爾特曼敏銳抓住了這項技術，專註於大語言模型（Large Language Model）的規模化擴展。"},{"start":773.4,"end":783.51,"text":"二零二二年十一月，OpenAI 推出聊天機器人 ChatGPT，在兩個月內吸引一億用戶，引爆全球生成式 AI 狂潮。"},{"start":783.51,"end":791.56,"text":"ChatGPT 的成功對長期專注於強化學習與模擬環境的 DeepMind 帶來了巨大的衝擊。"},{"start":791.74,"end":799.82,"text":"哈薩比斯坦言自己早期低估了語言模型的接地性與通用性，Google 隨即進入戰爭狀態。"},{"start":800.0,"end":812.48,"text":"二零二三年四月，Google CEO 桑達爾·皮查伊（Sundar Pichai）宣佈將 Google Brain 與 DeepMind 正式合併為 Google DeepMind，由哈薩比斯出任 CEO。"},{"start":812.66,"end":821.23,"text":"哈薩比斯展現出強烈的競爭驅動力，整合山景城與倫敦的數千名工程師，發起對抗 OpenAI 的翻盤之戰。"},{"start":821.23,"end":827.3,"text":"二零二三年底起，Google DeepMind 陸續發佈 Gemini 1."},{"start":827.48,"end":831.424,"text":"0、具備百萬詞元超長工作記憶的 Gemini 1."},{"start":831.424,"end":834.512,"text":"5 Pro，以及高效的 Flash 模型。"},{"start":834.512,"end":841.2,"text":"隨著競賽白熱化，模型訓練面臨網際網路文本耗盡的數據牆（Data Wall）限制。"},{"start":841.38,"end":848.8,"text":"業界意識到，僅靠下一個詞元預測無法解決複雜的數學與邏輯推理。"},{"start":848.8,"end":856.22,"text":"技術路線再次回歸哈薩比斯與西爾弗堅持的強化學習與慢思考搜尋。"},{"start":856.4,"end":868.16,"text":"透過導入思維鏈（Chain of Thought）與思維詞元，OpenAI 發表了 o1 與 o3 推理模型，Google DeepMind 則推出了 Flash Thinking 與 Gemini 2."},{"start":868.34,"end":870.573,"text":"5、Gemini 3 系列。"},{"start":870.573,"end":884.9,"text":"二零二五年初，中國 AI 實驗室深度求索（DeepSeek）發佈 R1 開源推理模型，以極高的算力效率震驚全球，證實超級智慧競賽已演變為多國、多實驗室的無序交鋒。"},{"start":885.08,"end":888.992,"text":"在技術狂飆的背後，AI 安全與治理的困境日益凸顯。"},{"start":888.992,"end":902.52,"text":"傑弗裡·辛頓（Geoffrey Hinton）與約候·本吉奧（Yoshua Bengio）等圖靈獎得主紛紛發出生存風險警示，指出具備子目標的超級智慧可能帶來不可控的後果。"},{"start":902.7,"end":918.58,"text":"哈薩比斯呼籲建立類似歐洲核子研究中心（CERN）與國際原子能機構的國際治理框架，但在商業競賽與地緣政治下，單一實體控制的幻想已被打破。"},{"start":918.76,"end":929.921,"text":"結尾回顧這段歷程，「無限機器」不僅是一臺具備近乎無限數據處理能力的電腦，更是人類探索自我與宇宙的終極延伸。"},{"start":929.921,"end":940.24,"text":"從西洋棋盤上的童年頓悟，到諾貝爾獎頒獎台上的光榮時刻，哈薩比斯始終在好勝心與科學使命之間尋求平衡。"},{"start":940.42,"end":956.06,"text":"本書展現了四重永恆的張力：好奇心與權力的拉鋸、科學使命與商業競賽的衝擊、能力進展與安全治理的博弈，以及人類創造工具卻反過來被工具重塑的宿命。"},{"start":956.24,"end":965.04,"text":"通往通用超級智慧的道路已不可逆轉，這場關乎文明底色的深度對弈，才剛剛揭開序幕。"}],"scenes":[{"id":1,"chapter":"前言｜無限機器的文明提問","start":1.5,"end":11.853,"duration":10.353,"narration":"前言什麼樣的人，會花費數十年的時間追問智慧的本質，並最終掌握 Google 最核心的人工智慧研究力量？","subtitle":"前言什麼樣的人，會花費數十年的時間追問智慧的本質，並最終掌握 Google 最核心的人工智慧研究力量？","image":"images/001.webp","visualPrompt":"16:9 橫式滿版手繪插畫，繁體中文內容但畫面不放任何文字、Logo、浮水印或黑邊。主題屬於「前言｜無限機器的文明提問」。場景：深夜書房，一名少年與成年科學家的雙重剪影隔著發光棋盤相望，遠處是 Google 研究園區與星空，象徵長年追問智慧本質。 鏡位：低角度廣角，前景以象徵物框景，中景人物行動，後景建立時代與地點。環境以遊戲開發工作室為基礎，使用清晨冷色自然光，前景、中景、後景層次清楚。人物服裝、年齡、年代與事件相符；每一鏡只呈現一個核心事件。加入本段專屬物件與動作，避免使用泛化的『人物站在螢幕前』構圖，並與前後鏡頭在地點、姿勢、景別、光線、道具至少三項不同。畫面風格為自然墨線、彩色鉛筆與柔和水彩，紙張肌理細膩，敘事感強，構圖完整鋪滿四邊。","card":"深夜書房，一名少年與成年科學家的雙重剪影隔著發光棋盤相望，遠處是 Google 研究園區與星空，象徵長年追問智慧本質。","camera":"低角度廣角，前景以象徵物框景，中景人物行動，後景建立時代與地點","motion":"pull"},{"id":2,"chapter":"前言｜無限機器的文明提問","start":11.853,"end":19.46,"duration":7.607,"narration":"這不是一個傳統的商業成功故事，而是一場人類試圖創造另一種智慧的史詩長征。","subtitle":"這不是一個傳統的商業成功故事，而是一場人類試圖創造另一種智慧的史詩長征。","image":"images/002.webp","visualPrompt":"16:9 橫式滿版手繪插畫，繁體中文內容但畫面不放任何文字、Logo、浮水印或黑邊。主題屬於「前言｜無限機器的文明提問」。場景：人類研究者站在由電路、神經網路與宇宙星圖構成的漫長道路起點，遠方巨大光源象徵另一種智慧。 鏡位：高角度俯視，利用桌面、棋盤或文件形成幾何構圖。環境以矽谷投資會議為基礎，使用午後暖陽，前景、中景、後景層次清楚。人物服裝、年齡、年代與事件相符；每一鏡只呈現一個核心事件。加入本段專屬物件與動作，避免使用泛化的『人物站在螢幕前』構圖，並與前後鏡頭在地點、姿勢、景別、光線、道具至少三項不同。畫面風格為自然墨線、彩色鉛筆與柔和水彩，紙張肌理細膩，敘事感強，構圖完整鋪滿四邊。","card":"人類研究者站在由電路、神經網路與宇宙星圖構成的漫長道路起點，遠方巨大光源象徵另一種智慧。","camera":"高角度俯視，利用桌面、棋盤或文件形成幾何構圖","motion":"pan-left"},{"id":3,"chapter":"前言｜無限機器的文明提問","start":19.64,"end":33.68,"duration":14.04,"narration":"從倫敦北部的西洋棋神童，到獲頒諾貝爾化學獎的頂尖科學家，德米斯·哈薩比斯（Demis Hassabis）用他半生的執念，將科學幻想推向了現實。","subtitle":"從倫敦北部的西洋棋神童，到獲頒諾貝爾化學獎的頂尖科學家，德米斯·哈薩比斯（Demis Hassabis）用他半生的執念，將科學幻想推向了現實。","image":"images/003.webp","visualPrompt":"16:9 橫式滿版手繪插畫，繁體中文內容但畫面不放任何文字、Logo、浮水印或黑邊。主題屬於「
