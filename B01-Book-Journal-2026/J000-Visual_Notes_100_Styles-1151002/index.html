<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱讀視覺筆記｜100種風格</title><meta name="description" content="100個可複製的閱讀視覺筆記指令，依10類閱讀目的分類。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e90ff'/%3E%3Cpath d='M7 8h8v17H7zm10 0h8v17h-8' fill='%23fff3ac'/%3E%3C/svg%3E"><style>
:root{--blue:#0065c9;--ink:#123047;--yellow:#fff3ac}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f8fc;font-family:system-ui,"Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.75}header{background:#087ce7;color:white;padding:30px max(5vw,20px);border-bottom:8px solid var(--yellow)}header small{letter-spacing:.12em}h1{font-size:clamp(26px,4vw,44px);margin:6px 0}header p{margin:0;max-width:850px}main{max-width:1400px;padding:24px;margin:auto}.toolbar{background:white;border:1px solid #d5e3ef;border-radius:16px;padding:20px;margin-bottom:20px}.fields{display:flex;gap:16px;flex-wrap:wrap}label{flex:1;min-width:210px}input{display:block;width:100%;font:inherit;padding:10px 14px;border:1px solid #aebfce;border-radius:8px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}button{font:inherit;cursor:pointer;border:1px solid #a8c9e9;border-radius:8px;background:white;color:var(--blue);padding:8px 13px}button:hover{background:#eaf4ff}button.active{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,input:focus-visible{outline:3px solid #e6ad00;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{background:white;border:1px solid #d8e5ef;border-top:4px solid var(--blue);border-radius:12px;padding:20px;display:flex;flex-direction:column}article small{color:#45677f;font-size:14px}article h2{font-size:22px;margin:8px 0}article h2 span{color:var(--blue);margin-right:10px}article p{margin:5px 0 18px;flex:1}article footer{display:flex;flex-wrap:wrap;gap:8px}.full{background:var(--yellow);border-color:#e4d780}#status{min-height:30px;margin:8px 0 18px}details{margin-top:12px}summary{cursor:pointer}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#123047;color:white;padding:12px 24px;border-radius:10px;display:none}#manual{width:min(90vw,800px);border:0;border-radius:12px;padding:22px}textarea{width:100%;height:260px;font:inherit}.empty{padding:50px;text-align:center;background:white;border-radius:12px}.pagefoot{text-align:center;margin:30px 0;color:#45677f}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:15px}header{padding:22px}article{padding:18px}}@media print{.toolbar,article footer,#toast{display:none}.grid{display:block}article{break-inside:avoid;margin:12px 0}}
</style><header><small>READING NOTE COLLECTION · 001—100</small><h1>閱讀視覺筆記｜100種風格</h1><p>選一種適合的風格，附上書籍內容或閱讀筆記，再把指令交給 GPT。</p></header><main><section class="toolbar"><div class="fields"><label>搜尋風格或關鍵字<input id="search" type="search" placeholder="例如：人物、案例、記憶、手繪"></label><label>書名（選填，複製時自動帶入）<input id="book" placeholder="輸入您正在閱讀的書名"></label></div><nav id="categories" aria-label="風格分類"></nav><details><summary>使用說明與共用追加指令</summary><p>這些是提示詞，並非官方內建的隱藏指令。只提供書名時適合做閱讀導覽；提供內容後，請清楚標示涵蓋範圍。各種圖解與美術風格依書籍內容選用。</p><p id="common"></p><button id="copyCommon">複製追加指令</button></details></section><p id="status" role="status"></p><section class="grid" id="cards" aria-label="閱讀指令"></section><p class="pagefoot">共100種風格 · 10個分類 · 可離線開啟使用</p></main><div id="toast" role="status"></div><dialog id="manual"><h2>請選取並複製指令</h2><textarea readonly id="copytext"></textarea><form method="dialog"><button>關閉</button></form></dialog><script>const items=[{"id": 1, "title": "一頁式全書地圖", "prompt": "請將《【書名】》整理成一張全書知識地圖，包含核心問題、五大觀點、觀點關係與三項行動，讓我一眼掌握全貌。", "category": "全書總覽與筆記版式"}, {"id": 2, "title": "手繪視覺筆記", "prompt": "請將《【書名】》轉成手繪視覺筆記，用簡單插圖、箭頭、框線與關鍵詞呈現重點，像老師在黑板上講解。", "category": "手繪藝術與材質"}, {"id": 3, "title": "心智圖", "prompt": "請以《【書名】》的核心主題為中心，向外展開主要觀點、次要概念與案例，製作層次清楚的心智圖。", "category": "全書總覽與筆記版式"}, {"id": 4, "title": "六格漫畫", "prompt": "請把《【書名】》最重要的觀念改編成六格漫畫，以生活情境、人物對話與簡短旁白，讓我看懂並記住。", "category": "故事人物與場景"}, {"id": 5, "title": "懶人包資訊圖", "prompt": "請將《【書名】》濃縮成一張懶人包資訊圖，包含一句主旨、五個重點、三個應用與一個適用條件，搭配清楚圖示。", "category": "全書總覽與筆記版式"}, {"id": 6, "title": "便利貼知識牆", "prompt": "請把《【書名】》拆成便利貼知識牆，每張便利貼只放一個概念，依主題分組，用連線呈現概念之間的關係。", "category": "全書總覽與筆記版式"}, {"id": 7, "title": "雜誌跨頁筆記", "prompt": "請將《【書名】》整理成雜誌跨頁風格的閱讀筆記，以主標、副標、重點短文與圖解呈現，兼具美感與閱讀順序。", "category": "出版展示與編輯"}, {"id": 8, "title": "黑板教學圖", "prompt": "請把《【書名】》當成一堂課，製作黑板風格教學圖，依「問題→概念→例子→應用」排列，讓初學者也能理解。", "category": "教學解說與案例"}, {"id": 9, "title": "知識樹", "prompt": "請將《【書名】》畫成知識樹：樹根代表基礎假設，樹幹代表核心主張，樹枝代表主要觀點，果實代表實際應用。", "category": "概念結構與空間比喻"}, {"id": 10, "title": "冰山模型圖", "prompt": "請將《【書名】》適合深入分析的觀點整理成冰山圖，從表面現象逐層呈現行為模式、背後結構與深層假設。", "category": "概念結構與空間比喻"}, {"id": 11, "title": "金字塔重點圖", "prompt": "請將《【書名】》整理成金字塔圖，頂層放核心結論，中層放支持觀點，底層放證據與案例，呈現作者的論證結構。", "category": "概念結構與空間比喻"}, {"id": 12, "title": "因果關係圖", "prompt": "請找出《【書名】》的重要因果關係，製作箭頭圖，在連線上標示影響方向，並區分作者主張的因果與相關性。", "category": "系統運作與流程"}, {"id": 13, "title": "步驟流程圖", "prompt": "請將《【書名】》中可操作的方法整理成流程圖，標示起點、步驟、判斷條件與完成標準，方便我照著實踐。", "category": "系統運作與流程"}, {"id": 14, "title": "決策樹", "prompt": "請把《【書名】》中的建議轉成決策樹，透過簡單問題與分支，幫助我判斷在不同情境下適合採取什麼行動。", "category": "系統運作與流程"}, {"id": 15, "title": "時間軸筆記", "prompt": "請將《【書名】》中的歷史事件、人物發展或觀念演變整理成時間軸，標示重要節點、轉折與前後影響。", "category": "故事人物與場景"}, {"id": 16, "title": "雙欄對照圖", "prompt": "請找出《【書名】》最重要的一組對比，用雙欄圖呈現兩者的觀點、做法、適用情境與案例，保留作者的細節。", "category": "比較分析與證據"}, {"id": 17, "title": "四象限分析圖", "prompt": "請從《【書名】》選出兩個有依據的比較維度，製作四象限圖，把相關觀點或方法放入適當位置，解釋分類理由。", "category": "比較分析與證據"}, {"id": 18, "title": "生活場景圖", "prompt": "請將《【書名】》的五個核心觀念融入一張日常生活場景圖，每個場景搭配簡短標籤，讓抽象知識變得具體。", "category": "故事人物與場景"}, {"id": 19, "title": "七天行動路線圖", "prompt": "請將《【書名】》中適合我的方法，轉成七天行動路線圖，每天安排一個小任務，標示目的與完成方式。", "category": "實踐方法與行動"}, {"id": 20, "title": "記憶宮殿圖", "prompt": "請將《【書名】》的核心觀點安排在一間熟悉的房子裡，每個空間對應一個概念，設計鮮明的視覺聯想並標示對應關係。", "category": "概念結構與空間比喻"}, {"id": 21, "title": "地鐵路線圖", "prompt": "請將《【書名】》的主要主題設計成不同地鐵路線，核心概念作為車站，共通概念作為轉乘站，呈現閱讀與理解路徑。", "category": "概念結構與空間比喻"}, {"id": 22, "title": "知識星座圖", "prompt": "請將《【書名】》的重要概念畫成星點，相關概念連成星座，以星點大小區分重要程度，並標示每組星座的主題。", "category": "概念結構與空間比喻"}, {"id": 23, "title": "齒輪運作圖", "prompt": "請將《【書名】》中互相影響的要素畫成齒輪，標示每個要素的作用，以及它如何帶動或限制其他要素。", "category": "系統運作與流程"}, {"id": 24, "title": "河流匯流圖", "prompt": "請將《【書名】》的不同論述畫成支流，呈現它們如何匯入核心主張，並在河岸標示重要案例與適用條件。", "category": "概念結構與空間比喻"}, {"id": 25, "title": "橋梁結構圖", "prompt": "請將《【書名】》整理成一座知識橋梁，兩端代表問題與目標，橋墩代表支持證據，橋面代表達成目標的方法。", "category": "概念結構與空間比喻"}, {"id": 26, "title": "房屋剖面圖", "prompt": "請將《【書名】》整理成房屋剖面圖，以地基代表前提、樓層代表不同層次的觀點、樓梯代表理解所需的連接。", "category": "概念結構與空間比喻"}, {"id": 27, "title": "知識花園圖", "prompt": "請將《【書名】》的觀點畫成一座花園，以不同花圃區分主題，標示每個觀點需要的條件、培養方式與可能成果。", "category": "概念結構與空間比喻"}, {"id": 28, "title": "工具箱圖鑑", "prompt": "請把《【書名】》中的實用方法整理成工具箱圖鑑，每件工具標示用途、使用時機、操作方式與適用限制。", "category": "實踐方法與行動"}, {"id": 29, "title": "烹飪食譜卡", "prompt": "請將《【書名】》的一套實踐方法設計成食譜卡，列出所需資源、份量或投入程度、操作步驟，以及成功判斷方式。", "category": "實踐方法與行動"}, {"id": 30, "title": "知識元素週期表", "prompt": "請將《【書名】》的關鍵概念設計成元素週期表風格，每格放概念名稱、簡短定義與代號，依功能或主題分區排列。", "category": "全書總覽與筆記版式"}, {"id": 31, "title": "概念輪盤圖", "prompt": "請將《【書名】》的核心主題放在圓心，周圍扇區呈現主要面向，每個扇區附上重點與案例，形成可循環回顧的輪盤。", "category": "全書總覽與筆記版式"}, {"id": 32, "title": "同心圓層次圖", "prompt": "請將《【書名】》依影響範圍或概念層次整理成同心圓，清楚說明由內到外的分類原則與各層關係。", "category": "概念結構與空間比喻"}, {"id": 33, "title": "概念交集圖", "prompt": "請找出《【書名】》中兩至三組適合比較的概念，製作交集圖，呈現各自特點、共同部分與容易混淆的邊界。", "category": "比較分析與證據"}, {"id": 34, "title": "循環機制圖", "prompt": "請將《【書名】》中的反覆運作機制整理成循環圖，標示各階段如何連接，以及在哪個位置介入能改變結果。", "category": "系統運作與流程"}, {"id": 35, "title": "回饋迴路圖", "prompt": "請找出《【書名】》中的增強與平衡回饋，畫出變項之間的影響方向，標示迴路如何讓現象擴大或穩定。", "category": "系統運作與流程"}, {"id": 36, "title": "狀態轉換圖", "prompt": "請將《【書名】》中人物、組織或問題的不同狀態畫成轉換圖，標示進入下一種狀態的條件，以及可能返回的情況。", "category": "系統運作與流程"}, {"id": 37, "title": "問題診斷魚骨圖", "prompt": "請選出《【書名】》探討的一個核心問題，用魚骨圖整理不同類別的成因，並區分書中證據與待驗證的原因。", "category": "比較分析與證據"}, {"id": 38, "title": "目標拆解曼陀羅圖", "prompt": "請以《【書名】》的一個核心學習目標為中心，製作九宮格曼陀羅圖，周圍八格整理支持目標的觀念與做法。", "category": "全書總覽與筆記版式"}, {"id": 39, "title": "概念比較矩陣", "prompt": "請將《【書名】》的重要理論或方法整理成矩陣，橫列放比較對象，直欄放相同的比較維度，方便逐項判讀。", "category": "比較分析與證據"}, {"id": 40, "title": "主張與證據熱點圖", "prompt": "請將《【書名】》的主要主張與支持資料製成熱點圖，依明確標準標示支持程度，並說明資料不足的位置。", "category": "比較分析與證據"}, {"id": 41, "title": "人物關係網", "prompt": "請將《【書名】》中的人物畫成關係網，在連線上標示合作、衝突、影響或親屬關係，附上關係成立的事件。", "category": "故事人物與場景"}, {"id": 42, "title": "角色觀點卡", "prompt": "請將《【書名】》中的主要人物或思想立場設計成角色卡，每張包含目標、信念、困境、行動與代表性事件。", "category": "故事人物與場景"}, {"id": 43, "title": "故事弧線圖", "prompt": "請將《【書名】》的敘事整理成故事弧線，標示開端、衝突、高潮與結局，並說明每個轉折帶來的意義。", "category": "故事人物與場景"}, {"id": 44, "title": "情緒曲線圖", "prompt": "請依《【書名】》的敘事順序畫出主角情緒曲線，  "比較分析與證據"}, {"id": 95, "title": "反事實情境三聯圖", "prompt": "請將《【書名】》製作反事實情境三聯圖，呈現原有案例、改變一個條件的情境與可能後果，書中事實與推演分開標記。", "category": "比較分析與證據"}, {"id": 96, "title": "概念尺度階梯", "prompt": "請將《【書名】》製作概念尺度階梯，依個人、家庭、組織與社會等合適尺度整理觀點，說明同一概念在不同尺度的變化。", "category": "概念結構與空間比喻"}, {"id": 97, "title": "行為介入漏斗", "prompt": "請將《【書名】》製作行為介入漏斗，從注意、理解、嘗試到持續實踐整理方法，標示各階段阻力與可採取的行動。", "category": "系統運作與流程"}, {"id": 98, "title": "價值衝突天平圖", "prompt": "請將《【書名】》製作價值衝突天平圖，呈現一個重要選擇涉及的兩種價值、各方收益與代價，附上判斷條件。", "category": "比較分析與證據"}, {"id": 99, "title": "證據溯源鏈", "prompt": "請將《【書名】》製作證據溯源鏈，從核心結論逐層追溯支持論點、案例與原始來源，來源未提供處標示待補資料。", "category": "比較分析與證據"}, {"id": 100, "title": "跨書對話圓桌圖", "prompt": "請將《【書名】》設計成跨書對話圓桌圖，以本書與我另行提供的書籍為不同席位，比較共同問題、不同回答與可互補觀點；僅有一本書時保留其他席位待補。", "category": "比較分析與證據"}];const common="全部使用繁體中文，以我提供的資料為依據，清楚標示資料涵蓋範圍與章節來源。作者觀點與延伸解讀分開呈現。依內容判斷此圖解形式是否適合，說明需要補充的資料。請直接生成一張 16:9 橫式視覺筆記圖片，文字清楚、主次分明，使用道奇藍與淺黃色配色。";const categories=["全書總覽與筆記版式", "概念結構與空間比喻", "系統運作與流程", "比較分析與證據", "故事人物與場景", "教學解說與案例", "實踐方法與行動", "記憶卡片與遊戲", "出版展示與編輯", "手繪藝術與材質"];
let selected='全部';const $=id=>document.getElementById(id);$('common').textContent=common;
function nav(){ $('categories').replaceChildren();['全部',...categories].forEach(c=>{const b=document.createElement('button');const n=c==='全部'?100:items.filter(x=>x.category===c).length;b.textContent=c+' '+n;b.className=c===selected?'active':'';b.setAttribute('aria-pressed',c===selected);b.onclick=()=>{selected=c;nav();render()};$('categories').append(b)})}
function prompt(x,full){const book=$('book').value.trim();return x.prompt.split('【書名】').join(book||'【書名】')+(full?'\n\n'+common:'')}
async function copy(text){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);$('toast').textContent='已複製指令';$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}catch(e){$('copytext').value=text;$('manual').showModal();$('copytext').select()}}
function render(){const q=$('search').value.trim().toLowerCase();const list=items.filter(x=>(selected==='全部'||x.category===selected)&&(!q||(x.title+x.prompt+x.category+String(x.id)).toLowerCase().includes(q)));$('status').textContent=(selected==='全部'?'全部風格':selected)+' · 顯示 '+list.length+' / 100 種';$('cards').replaceChildren();list.forEach(x=>{const a=document.createElement('article');const tag=document.createElement('small');tag.textContent=x.category;const h=document.createElement('h2');const no=document.createElement('span');no.textContent=String(x.id).padStart(2,'0');h.append(no,document.createTextNode(x.title));const p=document.createElement('p');p.textContent=prompt(x,false);const f=document.createElement('footer');[false,true].forEach(full=>{const b=document.createElement('button');b.textContent=full?'複製指令＋產圖要求':'複製指令';if(full)b.className='full';b.onclick=()=>copy(prompt(x,full));f.append(b)});a.append(tag,h,p,f);$('cards').append(a)});if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent='沒有符合的風格，請更換關鍵字或選擇全部。';$('cards').append(p)}}
$('search').addEventListener('input',render);$('book').addEventListener('input',render);$('copyCommon').onclick=()=>copy(common);nav();render();
</script></html>
